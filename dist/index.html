1/-1, Standard -2/-2, Major -3/-3, Capital -4/-4). Restore defence based on planet type: Minor +1, Standard +2, Major +3, Capital +4 (up to planet&#x27;s maximum). The defended planet gains Defended status until your next turn: attackers face +1 difficulty, you face -1 difficulty when defending. AI vs AI: Defender roll +15. <strong>Construction:<\/strong> Minor constructions cost -1/-1 and restore +1 defence. Major constructions cost -3/-3 and restore +3 defence (up to maximum).<\/p>", "text": "\nFortify a Planet or repair a Construction you control. **Planet:** Costs Supply and Manpower based on world type (Minor -1/-1, Standard -2/-2, Major -3/-3, Capital -4/-4). Restore defence based on planet type: Minor +1, Standard +2, Major +3, Capital +4 (up to planet's maximum). The defended planet gains Defended status until your next turn: attackers face +1 difficulty, you face -1 difficulty when defending. AI vs AI: Defender roll +15. **Construction:** Minor constructions cost -1/-1 and restore +1 defence. Major constructions cost -3/-3 and restore +3 defence (up to maximum).\n\n"}, {"title": "Reinforce", "html": "<p>+3 Supply (max 100).<\/p>", "text": "\n+3 Supply (max 100).\n\n"}, {"title": "Muster", "html": "<p>+3 Manpower (max 100).<\/p>", "text": "\n+3 Manpower (max 100).\n\n"}, {"title": "Create Fleet", "html": "<p>Create a new fleet at Fleet Strength 1/5. New fleets are created at the faction&#x27;s Capital location or at any Shipyard. Costs -1 Supply and -1 Manpower.<\/p>", "text": "\nCreate a new fleet at Fleet Strength 1/5. New fleets are created at the faction's Capital location or at any Shipyard. Costs -1 Supply and -1 Manpower.\n\n"}, {"title": "Garrison Transfer", "html": "<p>Transfer defense points between planets in the same system. Donor planets must be at full defense. Recipients cannot exceed maximum defense. When you take this action, you may perform multiple transfers from different donors.<\/p>", "text": "\nTransfer defense points between planets in the same system. Donor planets must be at full defense. Recipients cannot exceed maximum defense. When you take this action, you may perform multiple transfers from different donors.\n\n"}, {"title": "Summon Allies", "html": "<p>Call a new allied Major Faction into the subsector by granting them an entire system. <strong>Costs -10 Supply and -10 Manpower.<\/strong> The new faction starts with 10 Supply and 10 Manpower but no fleet — they rely on their summoner for protection. <strong>Requirements:<\/strong> (1) You must control planets in more than one system. (2) You must control ALL planets in the system being granted. (3) You must have Void Superiority in that system. (4) The new faction must share your alignment and make sense within established 40K lore. <strong>Effect:<\/strong> Immediately cede all planets in that system to the new faction. The new faction is aligned with you — they will not attack your holdings and will coordinate against mutual enemies. Design the new faction (name, background, trait) when summoned. The new faction activates immediately after your turn in the turn order.<\/p>\n<p><strong>Important:<\/strong> You cannot grant away your only fully controlled system. You must fully control at least two systems to use Summon Allies — one to keep and one to grant.<\/p>\n<p><strong>Summon Allies — Alignment Restrictions:<\/strong><\/p>\n<p>The summoned faction must belong to the same broad alignment as the summoning faction. This represents calling in reinforcements, granting territory to allies, or allowing subordinate powers to establish their own domains. The new faction must have a plausible lore reason for arriving in the subsector.<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Alignment<\/th><th>Eligible Faction Types<\/th><th>Examples<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Alignment\">Imperium<\/td><td data-label=\"Eligible Faction Types\">Astra Militarum, Adeptus Mechanicus, Other Space Marine Chapters, Adepta Sororitas, Rogue Traders, Imperial Navy, Inquisitorial Forces<\/td><td data-label=\"Examples\">A cut-off Guard regiment, an Explorator fleet, a Magos establishing a Forge World, a brother Chapter answering a distress call<\/td><\/tr><tr><td data-label=\"Alignment\">Chaos<\/td><td data-label=\"Eligible Faction Types\">Other Chaos Warbands, Daemon Cults, Dark Mechanicum, Traitor Guard, Other Traitor Legions<\/td><td data-label=\"Examples\">A warband sworn to a different god, a cult that rises in the new territory, a splinter fleet of the same Legion<\/td><\/tr><tr><td data-label=\"Alignment\">Drukhari<\/td><td data-label=\"Eligible Faction Types\">Other Kabals, Wych Cults, Haemonculus Covens<\/td><td data-label=\"Examples\">A rival Archon granted hunting grounds, a Coven providing support in exchange for specimens, a Wych Cult seeking new arenas<\/td><\/tr><tr><td data-label=\"Alignment\">Craftworld Aeldari<\/td><td data-label=\"Eligible Faction Types\">Other Craftworlds, Corsairs, Harlequins, Ynnari<\/td><td data-label=\"Examples\">A Corsair fleet, rangers from another Craftworld, a Harlequin masque<\/td><\/tr><tr><td data-label=\"Alignment\">Orks<\/td><td data-label=\"Eligible Faction Types\">Other Warbosses, Freebooterz<\/td><td data-label=\"Examples\">Another Waaagh! drawn by the fighting, Freebooterz smelling loot<\/td><\/tr><tr><td data-label=\"Alignment\">Necrons<\/td><td data-label=\"Eligible Faction Types\">Other Dynasties, Destroyer Cults<\/td><td data-label=\"Examples\">An awakening Tomb World, a vassal Dynasty, a Destroyer Lord claiming territory<\/td><\/tr><tr><td data-label=\"Alignment\">Tyranids<\/td><td data-label=\"Eligible Faction Types\">Other Hive Fleets, Genestealer Cults<\/td><td data-label=\"Examples\">A splinter fleet, a cult uprising on the granted world<\/td><\/tr><tr><td data-label=\"Alignment\">T&#x27;au<\/td><td data-label=\"Eligible Faction Types\">Other Septs, Auxiliaries<\/td><td data-label=\"Examples\">An expansion fleet, Kroot kindreds, Vespid contingents<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Multiple Factions:<\/strong> You may have multiple factions of the same type in play (e.g., two Space Marine Chapters, three Drukhari Archons). Each operates independently but remains aligned with their summoner.<\/p>", "text": "\nCall a new allied Major Faction into the subsector by granting them an entire system. **Costs -10 Supply and -10 Manpower.** The new faction starts with 10 Supply and 10 Manpower but no fleet — they rely on their summoner for protection. **Requirements:** (1) You must control planets in more than one system. (2) You must control ALL planets in the system being granted. (3) You must have Void Superiority in that system. (4) The new faction must share your alignment and make sense within established 40K lore. **Effect:** Immediately cede all planets in that system to the new faction. The new faction is aligned with you — they will not attack your holdings and will coordinate against mutual enemies. Design the new faction (name, background, trait) when summoned. The new faction activates immediately after your turn in the turn order.\n\n\n**Important:** You cannot grant away your only fully controlled system. You must fully control at least two systems to use Summon Allies — one to keep and one to grant.\n\n**Summon Allies — Alignment Restrictions:**\n\nThe summoned faction must belong to the same broad alignment as the summoning faction. This represents calling in reinforcements, granting territory to allies, or allowing subordinate powers to establish their own domains. The new faction must have a plausible lore reason for arriving in the subsector.\n\n| Alignment | Eligible Faction Types | Examples |\n|-----------|----------------------|----------|\n| Imperium | Astra Militarum, Adeptus Mechanicus, Other Space Marine Chapters, Adepta Sororitas, Rogue Traders, Imperial Navy, Inquisitorial Forces | A cut-off Guard regiment, an Explorator fleet, a Magos establishing a Forge World, a brother Chapter answering a distress call |\n| Chaos | Other Chaos Warbands, Daemon Cults, Dark Mechanicum, Traitor Guard, Other Traitor Legions | A warband sworn to a different god, a cult that rises in the new territory, a splinter fleet of the same Legion |\n| Drukhari | Other Kabals, Wych Cults, Haemonculus Covens | A rival Archon granted hunting grounds, a Coven providing support in exchange for specimens, a Wych Cult seeking new arenas |\n| Craftworld Aeldari | Other Craftworlds, Corsairs, Harlequins, Ynnari | A Corsair fleet, rangers from another Craftworld, a Harlequin masque |\n| Orks | Other Warbosses, Freebooterz | Another Waaagh! drawn by the fighting, Freebooterz smelling loot |\n| Necrons | Other Dynasties, Destroyer Cults | An awakening Tomb World, a vassal Dynasty, a Destroyer Lord claiming territory |\n| Tyranids | Other Hive Fleets, Genestealer Cults | A splinter fleet, a cult uprising on the granted world |\n| T'au | Other Septs, Auxiliaries | An expansion fleet, Kroot kindreds, Vespid contingents |\n\n**Multiple Factions:** You may have multiple factions of the same type in play (e.g., two Space Marine Chapters, three Drukhari Archons). Each operates independently but remains aligned with their summoner.\n\n"}, {"title": "Phase 4: Social Action", "html": "<p>A faction may take ONE Social Action per turn. This represents diplomatic bandwidth.<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Action<\/th><th>Effect<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Action\"><strong>Communiqué<\/strong><\/td><td data-label=\"Effect\">Send one message to another Faction. They may respond immediately but only once. Requires both Factions to have a presence in the same system (fleet or planet — any combination). Extended conversations require multiple cycles.<\/td><\/tr><\/tbody><\/table><\/div>", "text": "\nA faction may take ONE Social Action per turn. This represents diplomatic bandwidth.\n\n| Action | Effect |\n|--------|--------|\n| **Communiqué** | Send one message to another Faction. They may respond immediately but only once. Requires both Factions to have a presence in the same system (fleet or planet — any combination). Extended conversations require multiple cycles. |\n\n"}, {"title": "Diplomacy with Non-Aligned Factions", "html": "<p><strong>Diplomacy with Non-Aligned Factions:<\/strong> Temporary cease-fires or non-aggression pacts with factions outside your alignment are possible through the Communiqué action, but these are inherently unstable. Conflicting alignments will inevitably come to blows — such arrangements should be treated as temporary strategic convenience, not true alliance.<\/p>", "text": "\n**Diplomacy with Non-Aligned Factions:** Temporary cease-fires or non-aggression pacts with factions outside your alignment are possible through the Communiqué action, but these are inherently unstable. Conflicting alignments will inevitably come to blows — such arrangements should be treated as temporary strategic convenience, not true alliance.\n\n"}, {"title": "Phase 5: Construction Action", "html": "<p>A faction may take ONE Construction Action per turn. This represents the faction&#x27;s engineering and industrial capacity.<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Action<\/th><th>Effect<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Action\"><strong>Build<\/strong><\/td><td data-label=\"Effect\">Advance one in-progress construction by 1 action, OR begin a new construction. Costs -5 Supply. Only on planets with full defences. Construction time: 3 actions for Minor, 5 actions for Major. If the construction takes damage during the building process it is destroyed and must be restarted. For Planetary/Orbital constructions, damage to the planet destroys the construction. For fleet-attached Void constructions, damage to the fleet destroys the construction. Void Stations function as fleet constructions until completed, then follow Planetary/Orbital rules. Minor constructions can be captured and used by new controllers. Major constructions are destroyed when the planet changes hands (too specialized for enemy use). Shipyards allow fleet creation at that location.<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Construction Limits:<\/strong> A faction may have multiple constructions in progress simultaneously, but can only advance ONE per turn. Constructions on different planets progress independently.<\/p>", "text": "\nA faction may take ONE Construction Action per turn. This represents the faction's engineering and industrial capacity.\n\n| Action | Effect |\n|--------|--------|\n| **Build** | Advance one in-progress construction by 1 action, OR begin a new construction. Costs -5 Supply. Only on planets with full defences. Construction time: 3 actions for Minor, 5 actions for Major. If the construction takes damage during the building process it is destroyed and must be restarted. For Planetary/Orbital constructions, damage to the planet destroys the construction. For fleet-attached Void constructions, damage to the fleet destroys the construction. Void Stations function as fleet constructions until completed, then follow Planetary/Orbital rules. Minor constructions can be captured and used by new controllers. Major constructions are destroyed when the planet changes hands (too specialized for enemy use). Shipyards allow fleet creation at that location. |\n\n**Construction Limits:** A faction may have multiple constructions in progress simultaneously, but can only advance ONE per turn. Constructions on different planets progress independently.\n\n"}, {"title": "Construction Examples", "html": "<p>When building constructions, rename them to describe what the structure actually is within your faction&#x27;s aesthetic and technology.<\/p>", "text": "\nWhen building constructions, rename them to describe what the structure actually is within your faction's aesthetic and technology.\n\n"}, {"title": "Construction Upgrade System", "html": "<p><strong>Core Rules:<\/strong><\/p>\n<p class=\"list-line\">- One of each unique construction per planet/fleet/system (no stacking duplicates)<\/p>\n<p class=\"list-line\">- <strong>Exception:<\/strong> Constructions marked as <strong>Repeatable<\/strong> can be built multiple times on the same planet<\/p>\n<p class=\"list-line\">- Existing constructions can be upgraded by spending additional actions<\/p>\n<p class=\"list-line\">- Upgrades cost the same number of actions as the base construction<\/p>\n<p class=\"list-line\">- Most upgrades are straight 2x the base effect<\/p>\n<p class=\"list-line\">- Some constructions have no upgrade (already complete at base)<\/p>", "text": "\n**Core Rules:**\n- One of each unique construction per planet/fleet/system (no stacking duplicates)\n- **Exception:** Constructions marked as **Repeatable** can be built multiple times on the same planet\n- Existing constructions can be upgraded by spending additional actions\n- Upgrades cost the same number of actions as the base construction\n- Most upgrades are straight 2x the base effect\n- Some constructions have no upgrade (already complete at base)\n\n"}, {"title": "Planetary/Orbital Constructions", "html": "<p><strong>Planetary/Orbital Constructions<\/strong> — Built on a specific planet. Affects that planet or system.<\/p>\n<p><em>Minor (3 actions base, 3 actions upgrade, capturable)<\/em><\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Placeholder<\/th><th>Base Effect<\/th><th>Upgraded Effect<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Placeholder\">[Orbital Shipyard]<\/td><td data-label=\"Base Effect\">Allows fleet creation at this location. Fleets created at 1/5.<\/td><td data-label=\"Upgraded Effect\">No upgrade (prerequisite for Grand Orbital Shipyard)<\/td><\/tr><tr><td data-label=\"Placeholder\">[Supply Depot]<\/td><td data-label=\"Base Effect\">+2 Supply per Logistics Cycle<\/td><td data-label=\"Upgraded Effect\">+4 Supply per Logistics Cycle<\/td><\/tr><tr><td data-label=\"Placeholder\">[Training Grounds]<\/td><td data-label=\"Base Effect\">+2 Manpower per Logistics Cycle<\/td><td data-label=\"Upgraded Effect\">+4 Manpower per Logistics Cycle<\/td><\/tr><tr><td data-label=\"Placeholder\">[Automated Defences]<\/td><td data-label=\"Base Effect\">+1 defence regen/cycle if not attacked<\/td><td data-label=\"Upgraded Effect\">+2 defence regen/cycle if not attacked<\/td><\/tr><tr><td data-label=\"Placeholder\">[Bunker Network]<\/td><td data-label=\"Base Effect\">+5 defender roll (AI) / -1 Difficulty (Player)<\/td><td data-label=\"Upgraded Effect\">+10 defender roll (AI) / -2 Difficulty (Player)<\/td><\/tr><tr><td data-label=\"Placeholder\">[Orbital Cannons]<\/td><td data-label=\"Base Effect\">-1 Fleet Strength to largest hostile fleet when attacked<\/td><td data-label=\"Upgraded Effect\">-2 Fleet Strength to largest hostile fleet when attacked<\/td><\/tr><\/tbody><\/table><\/div>\n<p><em>Major (5 actions base, 5 actions upgrade, destroyed on capture)<\/em><\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Placeholder<\/th><th>Base Effect<\/th><th>Upgraded Effect<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Placeholder\">[Grand Orbital Shipyard]<\/td><td data-label=\"Base Effect\">Fleets created at 3/5. <strong>Requires Orbital Shipyard.<\/strong><\/td><td data-label=\"Upgraded Effect\">Grand Orbital Shipyard Complex — Fleets created at 5/5<\/td><\/tr><tr><td data-label=\"Placeholder\">[Forge Complex]<\/td><td data-label=\"Base Effect\">+5 Supply per Logistics Cycle<\/td><td data-label=\"Upgraded Effect\">+10 Supply per Logistics Cycle<\/td><\/tr><tr><td data-label=\"Placeholder\">[Military Academy]<\/td><td data-label=\"Base Effect\">+5 Manpower per Logistics Cycle<\/td><td data-label=\"Upgraded Effect\">+10 Manpower per Logistics Cycle<\/td><\/tr><tr><td data-label=\"Placeholder\">[Regenerative Fortifications]<\/td><td data-label=\"Base Effect\">+2 defence regen/cycle if not attacked<\/td><td data-label=\"Upgraded Effect\">+4 defence regen/cycle if not attacked<\/td><\/tr><tr><td data-label=\"Placeholder\">[Void Shield Generator]<\/td><td data-label=\"Base Effect\">-1 incoming attack damage (can reduce to 0)<\/td><td data-label=\"Upgraded Effect\">-2 incoming attack damage (can reduce to 0)<\/td><\/tr><tr><td data-label=\"Placeholder\">[Fortification Network]<\/td><td data-label=\"Base Effect\">+2 to planet&#x27;s maximum defence<\/td><td data-label=\"Upgraded Effect\">+4 to planet&#x27;s maximum defence<\/td><\/tr><tr><td data-label=\"Placeholder\">[Militia Barracks]<\/td><td data-label=\"Base Effect\">Defender commits 0 Manpower when defending this planet<\/td><td data-label=\"Upgraded Effect\">No upgrade<\/td><\/tr><tr><td data-label=\"Placeholder\">[Landing Zones]<\/td><td data-label=\"Base Effect\">Garrison Transfers to this planet ignore full defence requirement<\/td><td data-label=\"Upgraded Effect\">No upgrade<\/td><\/tr><tr><td data-label=\"Placeholder\">[Planetary Shield Network]<\/td><td data-label=\"Base Effect\">Invulnerable with Void Superiority / Defended status without<\/td><td data-label=\"Upgraded Effect\">No upgrade<\/td><\/tr><tr><td data-label=\"Placeholder\">[Consolidation Works]<\/td><td data-label=\"Base Effect\">Upgrade planet type by one tier: Minor (2/2) → Standard (4/4) → Major (8/8). Current and maximum defence double. <strong>Repeatable<\/strong> until Major. Cannot upgrade to Capital — only one Capital per faction.<\/td><td data-label=\"Upgraded Effect\">N/A (repeatable construction, not upgradeable)<\/td><\/tr><\/tbody><\/table><\/div>", "text": "\n**Planetary/Orbital Constructions** — Built on a specific planet. Affects that planet or system.\n\n*Minor (3 actions base, 3 actions upgrade, capturable)*\n\n| Placeholder | Base Effect | Upgraded Effect |\n|-------------|-------------|-----------------|\n| [Orbital Shipyard] | Allows fleet creation at this location. Fleets created at 1/5. | No upgrade (prerequisite for Grand Orbital Shipyard) |\n| [Supply Depot] | +2 Supply per Logistics Cycle | +4 Supply per Logistics Cycle |\n| [Training Grounds] | +2 Manpower per Logistics Cycle | +4 Manpower per Logistics Cycle |\n| [Automated Defences] | +1 defence regen/cycle if not attacked | +2 defence regen/cycle if not attacked |\n| [Bunker Network] | +5 defender roll (AI) / -1 Difficulty (Player) | +10 defender roll (AI) / -2 Difficulty (Player) |\n| [Orbital Cannons] | -1 Fleet Strength to largest hostile fleet when attacked | -2 Fleet Strength to largest hostile fleet when attacked |\n\n*Major (5 actions base, 5 actions upgrade, destroyed on capture)*\n\n| Placeholder | Base Effect | Upgraded Effect |\n|-------------|-------------|-----------------|\n| [Grand Orbital Shipyard] | Fleets created at 3/5. **Requires Orbital Shipyard.** | Grand Orbital Shipyard Complex — Fleets created at 5/5 |\n| [Forge Complex] | +5 Supply per Logistics Cycle | +10 Supply per Logistics Cycle |\n| [Military Academy] | +5 Manpower per Logistics Cycle | +10 Manpower per Logistics Cycle |\n| [Regenerative Fortifications] | +2 defence regen/cycle if not attacked | +4 defence regen/cycle if not attacked |\n| [Void Shield Generator] | -1 incoming attack damage (can reduce to 0) | -2 incoming attack damage (can reduce to 0) |\n| [Fortification Network] | +2 to planet's maximum defence | +4 to planet's maximum defence |\n| [Militia Barracks] | Defender commits 0 Manpower when defending this planet | No upgrade |\n| [Landing Zones] | Garrison Transfers to this planet ignore full defence requirement | No upgrade |\n| [Planetary Shield Network] | Invulnerable with Void Superiority / Defended status without | No upgrade |\n| [Consolidation Works] | Upgrade planet type by one tier: Minor (2/2) → Standard (4/4) → Major (8/8). Current and maximum defence double. **Repeatable** until Major. Cannot upgrade to Capital — only one Capital per faction. | N/A (repeatable construction, not upgradeable) |\n\n"}, {"title": "Void Constructions (Fleet-Attached)", "html": "<p><strong>Void Constructions (Fleet-Attached)<\/strong> — Mobile, destroyed if fleet is destroyed.<\/p>\n<p><em>Minor (3 actions base, 3 actions upgrade)<\/em><\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Placeholder<\/th><th>Base Effect<\/th><th>Upgraded Effect<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Placeholder\">[Troop Transport]<\/td><td data-label=\"Base Effect\">70% Manpower return (+10%)<\/td><td data-label=\"Upgraded Effect\">80% Manpower return (+20%)<\/td><\/tr><tr><td data-label=\"Placeholder\">[Repair Tender]<\/td><td data-label=\"Base Effect\">+1 fleet regen/cycle if no combat<\/td><td data-label=\"Upgraded Effect\">+2 fleet regen/cycle if no combat<\/td><\/tr><tr><td data-label=\"Placeholder\">[Escort Squadron]<\/td><td data-label=\"Base Effect\">+3 to Fleet Battle roll<\/td><td data-label=\"Upgraded Effect\">+6 to Fleet Battle roll<\/td><\/tr><tr><td data-label=\"Placeholder\">[Assault Boats]<\/td><td data-label=\"Base Effect\">+2 fleet strength for ground assaults<\/td><td data-label=\"Upgraded Effect\">+4 fleet strength for ground assaults<\/td><\/tr><tr><td data-label=\"Placeholder\">[Bombardment Bay]<\/td><td data-label=\"Base Effect\">+1 ground assault damage<\/td><td data-label=\"Upgraded Effect\">+2 ground assault damage<\/td><\/tr><tr><td data-label=\"Placeholder\">[Assault Cruiser]<\/td><td data-label=\"Base Effect\">+2/2 fleet strength (tracked separately)<\/td><td data-label=\"Upgraded Effect\">+4/4 fleet strength (tracked separately)<\/td><\/tr><\/tbody><\/table><\/div>\n<p><em>Major (5 actions base, 5 actions upgrade)<\/em><\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Placeholder<\/th><th>Base Effect<\/th><th>Upgraded Effect<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Placeholder\">[Flagship]<\/td><td data-label=\"Base Effect\">+5/5 fleet strength, max becomes 10/10<\/td><td data-label=\"Upgraded Effect\">+10/10 fleet strength, max becomes 15/15<\/td><\/tr><tr><td data-label=\"Placeholder\">[Carrier]<\/td><td data-label=\"Base Effect\">+5 fleet strength for ground assaults<\/td><td data-label=\"Upgraded Effect\">+10 fleet strength for ground assaults<\/td><\/tr><tr><td data-label=\"Placeholder\">[Siege Platform]<\/td><td data-label=\"Base Effect\">+2 ground assault damage<\/td><td data-label=\"Upgraded Effect\">+4 ground assault damage<\/td><\/tr><tr><td data-label=\"Placeholder\">[Salvage Wing]<\/td><td data-label=\"Base Effect\">+3 Supply on Fleet Battle win<\/td><td data-label=\"Upgraded Effect\">+6 Supply on Fleet Battle win<\/td><\/tr><tr><td data-label=\"Placeholder\">[Scout Squadron]<\/td><td data-label=\"Base Effect\">This fleet may Move and Attack with the same Fleet Action. The attack occurs after movement is resolved.<\/td><td data-label=\"Upgraded Effect\">No upgrade<\/td><\/tr><\/tbody><\/table><\/div>", "text": "\n**Void Constructions (Fleet-Attached)** — Mobile, destroyed if fleet is destroyed.\n\n*Minor (3 actions base, 3 actions upgrade)*\n\n| Placeholder | Base Effect | Upgraded Effect |\n|-------------|-------------|-----------------|\n| [Troop Transport] | 70% Manpower return (+10%) | 80% Manpower return (+20%) |\n| [Repair Tender] | +1 fleet regen/cycle if no combat | +2 fleet regen/cycle if no combat |\n| [Escort Squadron] | +3 to Fleet Battle roll | +6 to Fleet Battle roll |\n| [Assault Boats] | +2 fleet strength for ground assaults | +4 fleet strength for ground assaults |\n| [Bombardment Bay] | +1 ground assault damage | +2 ground assault damage |\n| [Assault Cruiser] | +2/2 fleet strength (tracked separately) | +4/4 fleet strength (tracked separately) |\n\n*Major (5 actions base, 5 actions upgrade)*\n\n| Placeholder | Base Effect | Upgraded Effect |\n|-------------|-------------|-----------------|\n| [Flagship] | +5/5 fleet strength, max becomes 10/10 | +10/10 fleet strength, max becomes 15/15 |\n| [Carrier] | +5 fleet strength for ground assaults | +10 fleet strength for ground assaults |\n| [Siege Platform] | +2 ground assault damage | +4 ground assault damage |\n| [Salvage Wing] | +3 Supply on Fleet Battle win | +6 Supply on Fleet Battle win |\n| [Scout Squadron] | This fleet may Move and Attack with the same Fleet Action. The attack occurs after movement is resolved. | No upgrade |\n\n"}, {"title": "Void Constructions (System-Based)", "html": "<p><strong>Void Constructions (System-Based)<\/strong> — Stationary. Follow same capture/destroy rules as Planetary constructions.<\/p>\n<p><em>Minor (3 actions base, 3 actions upgrade)<\/em><\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Placeholder<\/th><th>Base Effect<\/th><th>Upgraded Effect<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Placeholder\">[Defence Platform]<\/td><td data-label=\"Base Effect\">+5 to defender roll in Fleet Battles<\/td><td data-label=\"Upgraded Effect\">+10 to defender roll in Fleet Battles<\/td><\/tr><\/tbody><\/table><\/div>\n<p><em>Major (5 actions base, 5 actions upgrade)<\/em><\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Placeholder<\/th><th>Base Effect<\/th><th>Upgraded Effect<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Placeholder\">[System Defence Station]<\/td><td data-label=\"Base Effect\">-1 enemy fleet strength/cycle<\/td><td data-label=\"Upgraded Effect\">-2 enemy fleet strength/cycle<\/td><\/tr><tr><td data-label=\"Placeholder\">[System Repair Station]<\/td><td data-label=\"Base Effect\">+1 allied fleet strength/cycle (to max)<\/td><td data-label=\"Upgraded Effect\">+2 allied fleet strength/cycle (to max)<\/td><\/tr><tr><td data-label=\"Placeholder\">[Logistics Anchorage]<\/td><td data-label=\"Base Effect\">+1 defence regen to unattacked planets/cycle<\/td><td data-label=\"Upgraded Effect\">+2 defence regen to unattacked planets/cycle<\/td><\/tr><tr><td data-label=\"Placeholder\">[Void Station]<\/td><td data-label=\"Base Effect\">2/2 station, functions as Minor planet<\/td><td data-label=\"Upgraded Effect\">Upgrade via Consolidation Works: Minor (2/2) → Standard (4/4) → Major (8/8). Cannot become Capital.<\/td><\/tr><\/tbody><\/table><\/div>", "text": "\n**Void Constructions (System-Based)** — Stationary. Follow same capture/destroy rules as Planetary constructions.\n\n*Minor (3 actions base, 3 actions upgrade)*\n\n| Placeholder | Base Effect | Upgraded Effect |\n|-------------|-------------|-----------------|\n| [Defence Platform] | +5 to defender roll in Fleet Battles | +10 to defender roll in Fleet Battles |\n\n*Major (5 actions base, 5 actions upgrade)*\n\n| Placeholder | Base Effect | Upgraded Effect |\n|-------------|-------------|-----------------|\n| [System Defence Station] | -1 enemy fleet strength/cycle | -2 enemy fleet strength/cycle |\n| [System Repair Station] | +1 allied fleet strength/cycle (to max) | +2 allied fleet strength/cycle (to max) |\n| [Logistics Anchorage] | +1 defence regen to unattacked planets/cycle | +2 defence regen to unattacked planets/cycle |\n| [Void Station] | 2/2 station, functions as Minor planet | Upgrade via Consolidation Works: Minor (2/2) → Standard (4/4) → Major (8/8). Cannot become Capital. |\n\n"}, {"title": "System Construction Capture Rules", "html": "<p><strong>System Construction Capture Rules:<\/strong><\/p>\n<p>To capture system-based constructions (Defence Platforms, System Defence Stations, etc.), you must:<\/p>\n<p class=\"list-line\">1. Control ALL planets in the system<\/p>\n<p class=\"list-line\">2. Have Void Superiority in the system<\/p>\n<p>Once both conditions are met:<\/p>\n<p class=\"list-line\">- <strong>Minor constructions<\/strong> transfer to the new controller<\/p>\n<p class=\"list-line\">- <strong>Major constructions<\/strong> are destroyed (too specialized for enemy use)<\/p>\n<p class=\"list-line\">- <strong>Exception: Void Stations<\/strong> — the only Major construction that transfers on capture (functions as a planet once complete). Constructions built ON the Void Station follow normal rules (Minors capturable, Majors destroyed).<\/p>", "text": "\n**System Construction Capture Rules:**\n\nTo capture system-based constructions (Defence Platforms, System Defence Stations, etc.), you must:\n1. Control ALL planets in the system\n2. Have Void Superiority in the system\n\nOnce both conditions are met:\n- **Minor constructions** transfer to the new controller\n- **Major constructions** are destroyed (too specialized for enemy use)\n- **Exception: Void Stations** — the only Major construction that transfers on capture (functions as a planet once complete). Constructions built ON the Void Station follow normal rules (Minors capturable, Majors destroyed).\n\n"}, {"title": "Void Station Assault", "html": "<p><strong>Void Station Assault:<\/strong> Void Stations are captured by reducing their defence to 0 through Attack actions (assault them like a planet), not through the system construction capture rules. When a Void Station falls, it transfers to the attacker and resets to 1 defence like any other planet.<\/p>", "text": "\n**Void Station Assault:** Void Stations are captured by reducing their defence to 0 through Attack actions (assault them like a planet), not through the system construction capture rules. When a Void Station falls, it transfers to the attacker and resets to 1 defence like any other planet.\n\n"}, {"title": "Pre-Existing Stations", "html": "<p><strong>Pre-Existing Stations:<\/strong> Some holdings in the subsector are void installations rather than planetary bodies. These are marked in the Type column as &quot;(Station)&quot; and are treated as Void Stations of the listed tier in every respect — defence value, Attack and Defend cost scaling, Logistics income, Independent resource values, and the Independent Minor Faction fleet calculation. They are assaulted, captured, and reset to 1 defence exactly as planets are, and constructions may be built on them under normal rules. A Station cannot serve as a Capital.<\/p>", "text": "\n**Pre-Existing Stations:** Some holdings in the subsector are void installations rather than planetary bodies. These are marked in the Type column as \"(Station)\" and are treated as Void Stations of the listed tier in every respect — defence value, Attack and Defend cost scaling, Logistics income, Independent resource values, and the Independent Minor Faction fleet calculation. They are assaulted, captured, and reset to 1 defence exactly as planets are, and constructions may be built on them under normal rules. A Station cannot serve as a Capital.\n\n"}, {"title": "Phase 6: Resolve Battle", "html": "<p>If any faction chose Attack, fight the battle in Soulstorm. See Section 3 for battle setup. Or conduct AI to AI battle. Fleet Battles are handled by dice rolls outlined in Phase 2.<\/p>\n<p><strong>Turn Order:<\/strong> Factions act in order: 41st Expeditionary Korps → Vior&#x27;la Expedition → Splinter Fleet Cerberus. Each faction completes all their actions (Fleet, Faction, Social, Construction) before the next faction&#x27;s turn begins.<\/p>\n<p><strong>AI vs AI Rules:<\/strong> On a defended planet, the defender&#x27;s total roll gains +15.<\/p>\n<p>If all factions skip combat actions: No battle this cycle. All sides gain their chosen benefits.<\/p>", "text": "\nIf any faction chose Attack, fight the battle in Soulstorm. See Section 3 for battle setup. Or conduct AI to AI battle. Fleet Battles are handled by dice rolls outlined in Phase 2.\n\n**Turn Order:** Factions act in order: 41st Expeditionary Korps → Vior'la Expedition → Splinter Fleet Cerberus. Each faction completes all their actions (Fleet, Faction, Social, Construction) before the next faction's turn begins.\n\n**AI vs AI Rules:** On a defended planet, the defender's total roll gains +15.\n\nIf all factions skip combat actions: No battle this cycle. All sides gain their chosen benefits.\n\n"}, {"title": "Planet Fall Penalties", "html": "<p><strong>Planet Fall Penalties:<\/strong> When a planet falls (defence reaches 0), the planet changes hands and resets to 1 defence. The losing faction suffers:<\/p>\n<p class=\"list-line\">- <strong>Supply:<\/strong> -2 (or -4 if Capital) — replaces normal defeat Supply loss<\/p>\n<p class=\"list-line\">- <strong>Manpower:<\/strong> -2 (or -4 if Capital) — additional penalty on top of committed Manpower<\/p>\n<p class=\"list-line\">- <strong>Fleet Damage:<\/strong> Equal to damage dealt in the final assault, distributed as follows:<\/p>\n<p class=\"list-line\">- Apply damage one point at a time to the strongest fleet present<\/p>\n<p class=\"list-line\">- Ties: Attacker chooses which fleet takes the point<\/p>\n<p class=\"list-line\">- No fleet drops below 1/5 until ALL fleets are at 1/5<\/p>\n<p class=\"list-line\">- Once all fleets are at 1/5, each additional point of damage destroys one fleet (attacker chooses which). Destroying a fleet consumes 1 damage.<\/p>\n<p><em>Example: Defender has three fleets (2/5, 5/5, 5/5) and the final assault dealt 8 damage. Damage applies to strongest first: 5/5 → 4/5 → 3/5 → 2/5 → 1/5, then second 5/5 → 4/5 → 3/5 → 2/5, then 2/5 → 1/5. Final state: 1/5, 2/5, 1/5.<\/em><\/p>", "text": "\n**Planet Fall Penalties:** When a planet falls (defence reaches 0), the planet changes hands and resets to 1 defence. The losing faction suffers:\n- **Supply:** -2 (or -4 if Capital) — replaces normal defeat Supply loss\n- **Manpower:** -2 (or -4 if Capital) — additional penalty on top of committed Manpower\n- **Fleet Damage:** Equal to damage dealt in the final assault, distributed as follows:\n  - Apply damage one point at a time to the strongest fleet present\n  - Ties: Attacker chooses which fleet takes the point\n  - No fleet drops below 1/5 until ALL fleets are at 1/5\n  - Once all fleets are at 1/5, each additional point of damage destroys one fleet (attacker chooses which). Destroying a fleet consumes 1 damage.\n\n*Example: Defender has three fleets (2/5, 5/5, 5/5) and the final assault dealt 8 damage. Damage applies to strongest first: 5/5 → 4/5 → 3/5 → 2/5 → 1/5, then second 5/5 → 4/5 → 3/5 → 2/5, then 2/5 → 1/5. Final state: 1/5, 2/5, 1/5.*\n\n"}, {"title": "Fleet Destruction", "html": "<p><strong>Fleet Destroyed:<\/strong> When a fleet is destroyed (reduced to 0 or below), the owning faction loses -1 Manpower in addition to losing the fleet. This applies whether destroyed through Fleet Battle, Planet Fall penalties, or any other means.<\/p>", "text": "\n**Fleet Destroyed:** When a fleet is destroyed (reduced to 0 or below), the owning faction loses -1 Manpower in addition to losing the fleet. This applies whether destroyed through Fleet Battle, Planet Fall penalties, or any other means.\n\n"}, {"title": "Phase 7: End of Cycle", "html": "<p class=\"list-line\">- Record battle result<\/p>\n<p class=\"list-line\">- Update Planet progress. Successful attack lowers defence based on attacker&#x27;s fleet strength (1 per 5 strength, minimum 1 if uncontested).<\/p>\n<p class=\"list-line\">- Check if any Planets changed hands<\/p>\n<p class=\"list-line\">- Advance Cycle Counter<\/p>\n<hr>", "text": "\n- Record battle result\n- Update Planet progress. Successful attack lowers defence based on attacker's fleet strength (1 per 5 strength, minimum 1 if uncontested).\n- Check if any Planets changed hands\n- Advance Cycle Counter\n\n---\n\n"}, {"title": "SECTION 3: BATTLE SETUP", "html": "", "text": "\n"}, {"title": "Difficulty (Based on YOUR Supply)", "html": "<p>Supply represents logistics capacity: materiel, munitions, fuel, food, replacement parts, and everything needed to sustain military operations. <strong>Supply determines difficulty only — how well-equipped your forces are.<\/strong><\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Supply<\/th><th>Base Difficulty<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Supply\">1-20 Critical<\/td><td data-label=\"Base Difficulty\">Insane 5/5<\/td><\/tr><tr><td data-label=\"Supply\">21-40 Rationed<\/td><td data-label=\"Base Difficulty\">Harder 4/5<\/td><\/tr><tr><td data-label=\"Supply\">41-60 Sustainable<\/td><td data-label=\"Base Difficulty\">Hard 3/5<\/td><\/tr><tr><td data-label=\"Supply\">61-80 Surplus<\/td><td data-label=\"Base Difficulty\">Standard 2/5<\/td><\/tr><tr><td data-label=\"Supply\">81-100 Abundant<\/td><td data-label=\"Base Difficulty\">Easy 1/5<\/td><\/tr><\/tbody><\/table><\/div>", "text": "\nSupply represents logistics capacity: materiel, munitions, fuel, food, replacement parts, and everything needed to sustain military operations. **Supply determines difficulty only — how well-equipped your forces are.**\n\n| Supply | Base Difficulty |\n|--------|-----------------|\n| 1-20 Critical | Insane 5/5 |\n| 21-40 Rationed | Harder 4/5 |\n| 41-60 Sustainable | Hard 3/5 |\n| 61-80 Surplus | Standard 2/5 |\n| 81-100 Abundant | Easy 1/5 |\n\n"}, {"title": "Difficulty (Based on ENEMY Supply)", "html": "<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Enemy Supply<\/th><th>Modifier<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Enemy Supply\">1-20 Critical<\/td><td data-label=\"Modifier\">-2 Difficulty<\/td><\/tr><tr><td data-label=\"Enemy Supply\">21-40 Rationed<\/td><td data-label=\"Modifier\">-1 Difficulty<\/td><\/tr><tr><td data-label=\"Enemy Supply\">41-60 Sustainable<\/td><td data-label=\"Modifier\">—<\/td><\/tr><tr><td data-label=\"Enemy Supply\">61-80 Surplus<\/td><td data-label=\"Modifier\">+1 Difficulty<\/td><\/tr><tr><td data-label=\"Enemy Supply\">81-100 Abundant<\/td><td data-label=\"Modifier\">+2 Difficulty<\/td><\/tr><\/tbody><\/table><\/div>", "text": "\n| Enemy Supply | Modifier |\n|--------------|----------|\n| 1-20 Critical | -2 Difficulty |\n| 21-40 Rationed | -1 Difficulty |\n| 41-60 Sustainable | — |\n| 61-80 Surplus | +1 Difficulty |\n| 81-100 Abundant | +2 Difficulty |\n\n"}, {"title": "Allied Factions (Based on YOUR Manpower)", "html": "<p>Manpower represents trained combat personnel, casualty replacement capacity, and strategic depth — your ability to field multiple formations. <strong>Manpower determines faction count only — how many formations you can deploy.<\/strong><\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Manpower<\/th><th>Effect<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Manpower\">1-20 Critical<\/td><td data-label=\"Effect\">-2 Allied Factions (minimum 1)<\/td><\/tr><tr><td data-label=\"Manpower\">21-40 Rationed<\/td><td data-label=\"Effect\">-1 Allied Faction (minimum 1)<\/td><\/tr><tr><td data-label=\"Manpower\">41-60 Sustainable<\/td><td data-label=\"Effect\">No modifier<\/td><\/tr><tr><td data-label=\"Manpower\">61-80 Surplus<\/td><td data-label=\"Effect\">+1 Allied Faction<\/td><\/tr><tr><td data-label=\"Manpower\">81-100 Abundant<\/td><td data-label=\"Effect\">+2 Allied Factions<\/td><\/tr><\/tbody><\/table><\/div>", "text": "\nManpower represents trained combat personnel, casualty replacement capacity, and strategic depth — your ability to field multiple formations. **Manpower determines faction count only — how many formations you can deploy.**\n\n| Manpower | Effect |\n|----------|--------|\n| 1-20 Critical | -2 Allied Factions (minimum 1) |\n| 21-40 Rationed | -1 Allied Faction (minimum 1) |\n| 41-60 Sustainable | No modifier |\n| 61-80 Surplus | +1 Allied Faction |\n| 81-100 Abundant | +2 Allied Factions |\n\n"}, {"title": "Enemy Factions (Based on ENEMY Manpower)", "html": "<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Enemy Manpower<\/th><th>Effect<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Enemy Manpower\">1-20 Critical<\/td><td data-label=\"Effect\">-2 Enemy Factions (minimum 1)<\/td><\/tr><tr><td data-label=\"Enemy Manpower\">21-40 Rationed<\/td><td data-label=\"Effect\">-1 Enemy Faction (minimum 1)<\/td><\/tr><tr><td data-label=\"Enemy Manpower\">41-60 Sustainable<\/td><td data-label=\"Effect\">No modifier<\/td><\/tr><tr><td data-label=\"Enemy Manpower\">61-80 Surplus<\/td><td data-label=\"Effect\">+1 Enemy Faction<\/td><\/tr><tr><td data-label=\"Enemy Manpower\">81-100 Abundant<\/td><td data-label=\"Effect\">+2 Enemy Factions<\/td><\/tr><\/tbody><\/table><\/div>", "text": "\n| Enemy Manpower | Effect |\n|----------------|--------|\n| 1-20 Critical | -2 Enemy Factions (minimum 1) |\n| 21-40 Rationed | -1 Enemy Faction (minimum 1) |\n| 41-60 Sustainable | No modifier |\n| 61-80 Surplus | +1 Enemy Faction |\n| 81-100 Abundant | +2 Enemy Factions |\n\n"}, {"title": "Quick Reference: Modifier Stacking", "html": "<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Source<\/th><th>Effect<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Source\">Your Supply<\/td><td data-label=\"Effect\">Sets base Difficulty (1/5 to 5/5)<\/td><\/tr><tr><td data-label=\"Source\">Enemy Supply<\/td><td data-label=\"Effect\">-2 to +2 Difficulty<\/td><\/tr><tr><td data-label=\"Source\">Your Manpower<\/td><td data-label=\"Effect\">-2 to +2 Allied Factions (minimum 1)<\/td><\/tr><tr><td data-label=\"Source\">Enemy Manpower<\/td><td data-label=\"Effect\">-2 to +2 Enemy Factions (minimum 1)<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Difficulty caps at 1/5 minimum and 5/5 maximum. Faction count minimum is 1 (cannot remove only player or only opponent).<\/p>", "text": "\n| Source | Effect |\n|--------|--------|\n| Your Supply | Sets base Difficulty (1/5 to 5/5) |\n| Enemy Supply | -2 to +2 Difficulty |\n| Your Manpower | -2 to +2 Allied Factions (minimum 1) |\n| Enemy Manpower | -2 to +2 Enemy Factions (minimum 1) |\n\nDifficulty caps at 1/5 minimum and 5/5 maximum. Faction count minimum is 1 (cannot remove only player or only opponent).\n\n"}, {"title": "Faction Count Limits", "html": "<p>The maximum factions per side is 4 (map maximum 8 total). If bonuses would create more factions than the map allows, scale both sides down proportionally while maintaining the difference.<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Calculated<\/th><th>Scaled<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Calculated\">5v4<\/td><td data-label=\"Scaled\">4v3<\/td><\/tr><tr><td data-label=\"Calculated\">5v5<\/td><td data-label=\"Scaled\">4v4<\/td><\/tr><tr><td data-label=\"Calculated\">6v4<\/td><td data-label=\"Scaled\">4v2<\/td><\/tr><tr><td data-label=\"Calculated\">6v5<\/td><td data-label=\"Scaled\">4v3<\/td><\/tr><tr><td data-label=\"Calculated\">6v6<\/td><td data-label=\"Scaled\">4v4<\/td><\/tr><tr><td data-label=\"Calculated\">7v5<\/td><td data-label=\"Scaled\">4v2<\/td><\/tr><tr><td data-label=\"Calculated\">7v6<\/td><td data-label=\"Scaled\">4v3<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Continue pattern: reduce both sides equally until largest side is 4, maintaining the original difference.<\/p>", "text": "\nThe maximum factions per side is 4 (map maximum 8 total). If bonuses would create more factions than the map allows, scale both sides down proportionally while maintaining the difference.\n\n| Calculated | Scaled |\n|------------|--------|\n| 5v4 | 4v3 |\n| 5v5 | 4v4 |\n| 6v4 | 4v2 |\n| 6v5 | 4v3 |\n| 6v6 | 4v4 |\n| 7v5 | 4v2 |\n| 7v6 | 4v3 |\n\nContinue pattern: reduce both sides equally until largest side is 4, maintaining the original difference.\n\n"}, {"title": "Fleet Strength in System (Friendly Fleets)", "html": "<p>Calculate total Fleet Strength of all your fleets and allied fleets (same Alignment) in-system.<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Fleet Strength<\/th><th>Modifier<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Fleet Strength\">1-4<\/td><td data-label=\"Modifier\">No bonus<\/td><\/tr><tr><td data-label=\"Fleet Strength\">5-9<\/td><td data-label=\"Modifier\">+1 Allied Faction<\/td><\/tr><tr><td data-label=\"Fleet Strength\">10-14<\/td><td data-label=\"Modifier\">+2 Allied Factions<\/td><\/tr><tr><td data-label=\"Fleet Strength\">15-19<\/td><td data-label=\"Modifier\">+3 Allied Factions<\/td><\/tr><tr><td data-label=\"Fleet Strength\">20-24<\/td><td data-label=\"Modifier\">+4 Allied Factions<\/td><\/tr><tr><td data-label=\"Fleet Strength\">25+<\/td><td data-label=\"Modifier\">+5 Allied Factions<\/td><\/tr><\/tbody><\/table><\/div>", "text": "\nCalculate total Fleet Strength of all your fleets and allied fleets (same Alignment) in-system.\n\n| Fleet Strength | Modifier |\n|----------------|----------|\n| 1-4 | No bonus |\n| 5-9 | +1 Allied Faction |\n| 10-14 | +2 Allied Factions |\n| 15-19 | +3 Allied Factions |\n| 20-24 | +4 Allied Factions |\n| 25+ | +5 Allied Factions |\n\n"}, {"title": "Fleet Strength in System (Hostile Fleets)", "html": "<p>Calculate total Fleet Strength of all hostile fleets (different Alignment) in-system.<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Fleet Strength<\/th><th>Modifier<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Fleet Strength\">1-4<\/td><td data-label=\"Modifier\">No bonus<\/td><\/tr><tr><td data-label=\"Fleet Strength\">5-9<\/td><td data-label=\"Modifier\">+1 Enemy Faction<\/td><\/tr><tr><td data-label=\"Fleet Strength\">10-14<\/td><td data-label=\"Modifier\">+2 Enemy Factions<\/td><\/tr><tr><td data-label=\"Fleet Strength\">15-19<\/td><td data-label=\"Modifier\">+3 Enemy Factions<\/td><\/tr><tr><td data-label=\"Fleet Strength\">20-24<\/td><td data-label=\"Modifier\">+4 Enemy Factions<\/td><\/tr><tr><td data-label=\"Fleet Strength\">25+<\/td><td data-label=\"Modifier\">+5 Enemy Factions<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Example:<\/strong> You have a 5/5 Fleet and a 2/5 Fleet (total 7) in-system. A hostile faction has two 3/5 Fleets (total 6). You gain +1 Allied Faction, and the enemy gains +1 Enemy Faction. The battle becomes a 2v2 engagement.<\/p>", "text": "\nCalculate total Fleet Strength of all hostile fleets (different Alignment) in-system.\n\n| Fleet Strength | Modifier |\n|----------------|----------|\n| 1-4 | No bonus |\n| 5-9 | +1 Enemy Faction |\n| 10-14 | +2 Enemy Factions |\n| 15-19 | +3 Enemy Factions |\n| 20-24 | +4 Enemy Factions |\n| 25+ | +5 Enemy Factions |\n\n**Example:** You have a 5/5 Fleet and a 2/5 Fleet (total 7) in-system. A hostile faction has two 3/5 Fleets (total 6). You gain +1 Allied Faction, and the enemy gains +1 Enemy Faction. The battle becomes a 2v2 engagement.\n\n"}, {"title": "Planet Conquest", "html": "<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Planet Type<\/th><th>Planet Defences<\/th><th>Examples<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Planet Type\">Minor<\/td><td data-label=\"Planet Defences\">2<\/td><td data-label=\"Examples\">Agri-worlds, Mining colonies, Outposts<\/td><\/tr><tr><td data-label=\"Planet Type\">Standard<\/td><td data-label=\"Planet Defences\">4<\/td><td data-label=\"Examples\">Forge worlds, Civilised worlds<\/td><\/tr><tr><td data-label=\"Planet Type\">Major<\/td><td data-label=\"Planet Defences\">8<\/td><td data-label=\"Examples\">Hive worlds, Fortress worlds<\/td><\/tr><tr><td data-label=\"Planet Type\">Capital<\/td><td data-label=\"Planet Defences\">12<\/td><td data-label=\"Examples\">Sector capitals, Aeldari Craftworlds, Necron Tomb Worlds<\/td><\/tr><\/tbody><\/table><\/div>", "text": "\n| Planet Type | Planet Defences | Examples |\n|-------------|-----------------|----------|\n| Minor | 2 | Agri-worlds, Mining colonies, Outposts |\n| Standard | 4 | Forge worlds, Civilised worlds |\n| Major | 8 | Hive worlds, Fortress worlds |\n| Capital | 12 | Sector capitals, Aeldari Craftworlds, Necron Tomb Worlds |\n\n"}, {"title": "Attack Cost Scaling", "html": "<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Planet Type<\/th><th>Supply Cost<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Planet Type\">Minor<\/td><td data-label=\"Supply Cost\">-1 Supply<\/td><\/tr><tr><td data-label=\"Planet Type\">Standard<\/td><td data-label=\"Supply Cost\">-2 Supply<\/td><\/tr><tr><td data-label=\"Planet Type\">Major<\/td><td data-label=\"Supply Cost\">-3 Supply<\/td><\/tr><tr><td data-label=\"Planet Type\">Capital<\/td><td data-label=\"Supply Cost\">-4 Supply<\/td><\/tr><\/tbody><\/table><\/div>", "text": "\n| Planet Type | Supply Cost |\n|-------------|-------------|\n| Minor | -1 Supply |\n| Standard | -2 Supply |\n| Major | -3 Supply |\n| Capital | -4 Supply |\n\n"}, {"title": "Defend Cost Scaling", "html": "<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Planet Type<\/th><th>Supply Cost<\/th><th>Manpower Cost<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Planet Type\">Minor<\/td><td data-label=\"Supply Cost\">-1 Supply<\/td><td data-label=\"Manpower Cost\">-1 Manpower<\/td><\/tr><tr><td data-label=\"Planet Type\">Standard<\/td><td data-label=\"Supply Cost\">-2 Supply<\/td><td data-label=\"Manpower Cost\">-2 Manpower<\/td><\/tr><tr><td data-label=\"Planet Type\">Major<\/td><td data-label=\"Supply Cost\">-3 Supply<\/td><td data-label=\"Manpower Cost\">-3 Manpower<\/td><\/tr><tr><td data-label=\"Planet Type\">Capital<\/td><td data-label=\"Supply Cost\">-4 Supply<\/td><td data-label=\"Manpower Cost\">-4 Manpower<\/td><\/tr><\/tbody><\/table><\/div>", "text": "\n| Planet Type | Supply Cost | Manpower Cost |\n|-------------|-------------|---------------|\n| Minor | -1 Supply | -1 Manpower |\n| Standard | -2 Supply | -2 Manpower |\n| Major | -3 Supply | -3 Manpower |\n| Capital | -4 Supply | -4 Manpower |\n\n"}, {"title": "Battle Outcome Effects", "html": "<p><strong>Attacker Commitment:<\/strong><\/p>\n<p class=\"list-line\">- Supply: Paid upfront, scaled by world type (see Attack Cost Scaling). Lost regardless of outcome.<\/p>\n<p class=\"list-line\">- Manpower: Commit equal to base damage dealt (1 per 5 Fleet Strength, minimum 1). Lost on defeat, 60% returned on victory.<\/p>\n<p><strong>Defender Commitment:<\/strong><\/p>\n<p class=\"list-line\">- Supply: Commit equal to attacker&#x27;s Supply cost (scaled by world type: Minor 1, Standard 2, Major 3, Capital 4). Lost on defeat, 80% returned on victory.<\/p>\n<p class=\"list-line\">- Manpower: Commit equal to attacker&#x27;s damage dealt (including construction bonuses). Lost on defeat, 80% returned on victory.<\/p>\n<p><strong>Note on Damage Bonuses:<\/strong> Constructions like Bombardment Bay (+1) and Siege Platform (+2) increase total damage but do NOT increase attacker Manpower commitment. The attacker&#x27;s commitment is based purely on fleet strength — the bodies being thrown at the problem. Damage bonuses represent superior firepower, not more troops on the ground. The defender, however, must respond to the full incoming damage.<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Outcome<\/th><th>Effect<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Outcome\"><strong>Victory on Attack<\/strong><\/td><td data-label=\"Effect\">Planet Defence reduced by damage dealt. Attacker returns 60% Manpower. Defender loses 100% committed Supply and Manpower.<\/td><\/tr><tr><td data-label=\"Outcome\"><strong>Defeat on Attack<\/strong><\/td><td data-label=\"Effect\">Attacker loses 100% committed Manpower (Supply already spent). Defender returns 80% committed Supply and Manpower.<\/td><\/tr><tr><td data-label=\"Outcome\"><strong>Victory on Defence<\/strong><\/td><td data-label=\"Effect\">Defender returns 80% committed Supply and Manpower. Attacker loses 100% committed Manpower (Supply already spent).<\/td><\/tr><tr><td data-label=\"Outcome\"><strong>Defeat on Defence<\/strong><\/td><td data-label=\"Effect\">Planet Defence reduced by damage dealt. Defender loses 100% committed Supply and Manpower. Attacker returns 60% Manpower.<\/td><\/tr><tr><td data-label=\"Outcome\"><strong>Planet Falls<\/strong><\/td><td data-label=\"Effect\">See Planet Fall Penalties in Section 2.<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Note:<\/strong> In uncontested systems (no hostile fleets present), attacks resolve via Uncontested Bombardment — see Attack action in Phase 2.<\/p>", "text": "\n**Attacker Commitment:**\n- Supply: Paid upfront, scaled by world type (see Attack Cost Scaling). Lost regardless of outcome.\n- Manpower: Commit equal to base damage dealt (1 per 5 Fleet Strength, minimum 1). Lost on defeat, 60% returned on victory.\n\n**Defender Commitment:**\n- Supply: Commit equal to attacker's Supply cost (scaled by world type: Minor 1, Standard 2, Major 3, Capital 4). Lost on defeat, 80% returned on victory.\n- Manpower: Commit equal to attacker's damage dealt (including construction bonuses). Lost on defeat, 80% returned on victory.\n\n**Note on Damage Bonuses:** Constructions like Bombardment Bay (+1) and Siege Platform (+2) increase total damage but do NOT increase attacker Manpower commitment. The attacker's commitment is based purely on fleet strength — the bodies being thrown at the problem. Damage bonuses represent superior firepower, not more troops on the ground. The defender, however, must respond to the full incoming damage.\n\n| Outcome | Effect |\n|---------|--------|\n| **Victory on Attack** | Planet Defence reduced by damage dealt. Attacker returns 60% Manpower. Defender loses 100% committed Supply and Manpower. |\n| **Defeat on Attack** | Attacker loses 100% committed Manpower (Supply already spent). Defender returns 80% committed Supply and Manpower. |\n| **Victory on Defence** | Defender returns 80% committed Supply and Manpower. Attacker loses 100% committed Manpower (Supply already spent). |\n| **Defeat on Defence** | Planet Defence reduced by damage dealt. Defender loses 100% committed Supply and Manpower. Attacker returns 60% Manpower. |\n| **Planet Falls** | See Planet Fall Penalties in Section 2. |\n\n**Note:** In uncontested systems (no hostile fleets present), attacks resolve via Uncontested Bombardment — see Attack action in Phase 2.\n\n"}, {"title": "Losing a Capital", "html": "<p>When a faction loses their Capital, they must designate a new Capital on an owned planet. The faction is then locked into the <strong>Establish New Capital<\/strong> forced action until the new Capital reaches maximum defense of 12. This forced action has no Supply or Manpower cost.<\/p>\n<p><strong>Establish New Capital:<\/strong> Each use doubles both current and maximum defense of the Provisional Capital until maximum reaches 12.<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Starting World<\/th><th>Cycle 1<\/th><th>Cycle 2<\/th><th>Cycle 3<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Starting World\">Minor (2/2)<\/td><td data-label=\"Cycle 1\">4/4<\/td><td data-label=\"Cycle 2\">8/8<\/td><td data-label=\"Cycle 3\">12/12<\/td><\/tr><tr><td data-label=\"Starting World\">Standard (4/4)<\/td><td data-label=\"Cycle 1\">8/8<\/td><td data-label=\"Cycle 2\">12/12<\/td><td data-label=\"Cycle 3\">—<\/td><\/tr><tr><td data-label=\"Starting World\">Major (8/8)<\/td><td data-label=\"Cycle 1\">12/12<\/td><td data-label=\"Cycle 2\">—<\/td><td data-label=\"Cycle 3\">—<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Once maximum defense reaches 12, the Capital is fully established and immediately gains a built-in Orbital Shipyard. The faction is then unlocked and may take other actions, even if current defense is below 12. If attacked during rebuild, damage is applied after the defense doubling.<\/p>\n<p>If a faction has no remaining planets, they are eliminated from the campaign.<\/p>", "text": "\nWhen a faction loses their Capital, they must designate a new Capital on an owned planet. The faction is then locked into the **Establish New Capital** forced action until the new Capital reaches maximum defense of 12. This forced action has no Supply or Manpower cost.\n\n**Establish New Capital:** Each use doubles both current and maximum defense of the Provisional Capital until maximum reaches 12.\n\n| Starting World | Cycle 1 | Cycle 2 | Cycle 3 |\n|----------------|---------|---------|---------|\n| Minor (2/2) | 4/4 | 8/8 | 12/12 |\n| Standard (4/4) | 8/8 | 12/12 | — |\n| Major (8/8) | 12/12 | — | — |\n\nOnce maximum defense reaches 12, the Capital is fully established and immediately gains a built-in Orbital Shipyard. The faction is then unlocked and may take other actions, even if current defense is below 12. If attacked during rebuild, damage is applied after the defense doubling.\n\nIf a faction has no remaining planets, they are eliminated from the campaign.\n\n"}, {"title": "Independent Factions", "html": "<p><strong>Terminology — Independent Minor Factions vs Independent-Aligned Major Factions:<\/strong><\/p>\n<p>&quot;Independent&quot; serves two distinct roles in this campaign. <strong>Independent Minor Factions<\/strong> are static NPC powers — they do not take turns, do not act strategically, and defend when attacked. They are obstacles and opportunities on the map. <strong>Independent-Aligned Major Factions<\/strong> are full player or AI factions that happen to carry the Independent alignment. They take turns, make strategic decisions, and operate with full agency. The alignment simply means they are not bound to Imperium, Chaos, Necron, or any other bloc — they fight for themselves. No Major Faction in the Dessica Campaign currently carries this alignment.<\/p>\n<p>These two uses of &quot;Independent&quot; should never be confused. The rules below apply only to Independent Minor Factions.<\/p>\n<hr>", "text": "\n**Terminology — Independent Minor Factions vs Independent-Aligned Major Factions:**\n\n\"Independent\" serves two distinct roles in this campaign. **Independent Minor Factions** are static NPC powers — they do not take turns, do not act strategically, and defend when attacked. They are obstacles and opportunities on the map. **Independent-Aligned Major Factions** are full player or AI factions that happen to carry the Independent alignment. They take turns, make strategic decisions, and operate with full agency. The alignment simply means they are not bound to Imperium, Chaos, Necron, or any other bloc — they fight for themselves. No Major Faction in the Dessica Campaign currently carries this alignment.\n\nThese two uses of \"Independent\" should never be confused. The rules below apply only to Independent Minor Factions.\n\n---\n\n"}, {"title": "Independent Minor Factions", "html": "<p>Independent Minor Factions are minor powers that control one or more planets within a system. They do not take turns or actions — they are static obstacles that defend when attacked.<\/p>\n<p><strong>Fleet Calculation:<\/strong><\/p>\n<p class=\"list-line\">- Total Fleet Strength = sum of total planetary defence across all controlled worlds<\/p>\n<p class=\"list-line\">- Fill 5/5 fleets first, remainder becomes additional fleet<\/p>\n<p class=\"list-line\">- Example: Major (8/8) + Minor (2/2) + Minor (2/2) = 12 → two 5/5 fleets and one 2/5 fleet<\/p>\n<p><strong>Fleet Rules:<\/strong><\/p>\n<p class=\"list-line\">- Fleets do not move (system defense only)<\/p>\n<p class=\"list-line\">- Fleets provide orbital support during ground assaults (counts as combat)<\/p>\n<p class=\"list-line\">- +1 Fleet Strength regeneration per cycle if not engaged in Fleet Battle or Ground Assault (allocate to any fleet, up to original starting max)<\/p>\n<p class=\"list-line\">- If a fleet is destroyed, it is gone forever — Independents cannot create new fleets<\/p>\n<p><strong>Resources (Per Planet):<\/strong><\/p>\n<p>When an Independent planet is attacked, only that planet&#x27;s individual resources are used for the defense roll — not the combined resources of all planets controlled by the faction.<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>World Type<\/th><th>Base Supply<\/th><th>Base Manpower<\/th><\/tr><\/thead><tbody><tr><td data-label=\"World Type\">Minor<\/td><td data-label=\"Base Supply\">40<\/td><td data-label=\"Base Manpower\">40<\/td><\/tr><tr><td data-label=\"World Type\">Standard<\/td><td data-label=\"Base Supply\">60<\/td><td data-label=\"Base Manpower\">60<\/td><\/tr><tr><td data-label=\"World Type\">Major<\/td><td data-label=\"Base Supply\">80<\/td><td data-label=\"Base Manpower\">80<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Current Supply/Manpower = Base × (Current Defense / Max Defense)<\/p>\n<p>Example: A Standard world at 2/4 defense has 60 × (2/4) = 30 Supply and 30 Manpower<\/p>\n<p>Fleet Strength in system still counts for all Independent fleets present, but ground resources are planet-specific.<\/p>\n<p><strong>Defense:<\/strong><\/p>\n<p class=\"list-line\">- Regenerates +1 per cycle if not attacked (up to max)<\/p>\n<p><strong>Scope:<\/strong><\/p>\n<p class=\"list-line\">- Independents are typically single-system, often single-planet<\/p>\n<p class=\"list-line\">- Multiple Independent factions can exist in the same system<\/p>\n<p class=\"list-line\">- Each Independent faction has its own fleet, resources, and defense values<\/p>", "text": "\nIndependent Minor Factions are minor powers that control one or more planets within a system. They do not take turns or actions — they are static obstacles that defend when attacked.\n\n**Fleet Calculation:**\n- Total Fleet Strength = sum of total planetary defence across all controlled worlds\n- Fill 5/5 fleets first, remainder becomes additional fleet\n- Example: Major (8/8) + Minor (2/2) + Minor (2/2) = 12 → two 5/5 fleets and one 2/5 fleet\n\n**Fleet Rules:**\n- Fleets do not move (system defense only)\n- Fleets provide orbital support during ground assaults (counts as combat)\n- +1 Fleet Strength regeneration per cycle if not engaged in Fleet Battle or Ground Assault (allocate to any fleet, up to original starting max)\n- If a fleet is destroyed, it is gone forever — Independents cannot create new fleets\n\n**Resources (Per Planet):**\n\nWhen an Independent planet is attacked, only that planet's individual resources are used for the defense roll — not the combined resources of all planets controlled by the faction.\n\n| World Type | Base Supply | Base Manpower |\n|------------|-------------|---------------|\n| Minor | 40 | 40 |\n| Standard | 60 | 60 |\n| Major | 80 | 80 |\n\nCurrent Supply/Manpower = Base × (Current Defense / Max Defense)\n\nExample: A Standard world at 2/4 defense has 60 × (2/4) = 30 Supply and 30 Manpower\n\nFleet Strength in system still counts for all Independent fleets present, but ground resources are planet-specific.\n\n**Defense:**\n- Regenerates +1 per cycle if not attacked (up to max)\n\n**Scope:**\n- Independents are typically single-system, often single-planet\n- Multiple Independent factions can exist in the same system\n- Each Independent faction has its own fleet, resources, and defense values\n\n"}, {"title": "Resource Deficits", "html": "<p><strong>General Rules:<\/strong><\/p>\n<p class=\"list-line\">- Supply and Manpower cannot go below 0<\/p>\n<p class=\"list-line\">- Deficits cannot be triggered by voluntary actions but can occur from involuntary penalties (Logistics maintenance, battle losses, Planet Fall, fleet destruction, etc.)<\/p>\n<p><strong>Supply Deficit:<\/strong><\/p>\n<p>When a Supply Deficit occurs:<\/p>\n<p class=\"list-line\">- All fleets -1 Fleet Strength (fleets at 1/5 are destroyed)<\/p>\n<p class=\"list-line\">- The faction&#x27;s next turn is locked into <strong>Emergency Rationing<\/strong> (no other action may be taken)<\/p>\n<p class=\"list-line\">- Emergency Rationing returns Supply to 25<\/p>\n<p><strong>Manpower Deficit:<\/strong><\/p>\n<p>When a faction reaches 0 Manpower (from any source), Manpower Deficit occurs:<\/p>\n<p class=\"list-line\">- If currently being attacked, the defender must choose Forced Conscription OR Isolated Defense for this battle only (see below)<\/p>\n<p class=\"list-line\">- All fleets suffer -1 Fleet Strength (fleets cannot be destroyed by Manpower Deficit — minimum 1/5)<\/p>\n<p class=\"list-line\">- The faction&#x27;s next turn is locked into <strong>Emergency Muster<\/strong> (no other action may be taken)<\/p>\n<p class=\"list-line\">- Emergency Muster returns Manpower to 25<\/p>\n<p><em>Forced Conscription:<\/em> Strip Defense from fully defended planets elsewhere (1 Defense = 1 Manpower required). Battle proceeds normally with standard 60%/100% Manpower return rules.<\/p>\n<p><em>Isolated Defense:<\/em> The planet defends alone with local garrison. AI vs AI: Defender roll suffers -15 penalty. Player defending in Soulstorm: +2 Difficulty. If attacker wins: Normal damage dealt, defender loses 0 Manpower (none committed). If attacker loses: Attacker returns 60% Manpower (loses only 40% — isolated garrison cannot pursue).<\/p>\n<p><strong>Cascade Deficits:<\/strong> If multiple Deficits occur simultaneously (e.g., Supply Deficit destroys fleets, causing Manpower loss that triggers Manpower Deficit), resolve them in order: Supply Deficit first, then Manpower Deficit. The faction is locked into Emergency Rationing (the first deficit&#x27;s recovery action). The Manpower Deficit&#x27;s fleet damage still occurs, but the faction does not need to take Emergency Muster afterward — Emergency Rationing handles both.<\/p>\n<hr>", "text": "\n**General Rules:**\n- Supply and Manpower cannot go below 0\n- Deficits cannot be triggered by voluntary actions but can occur from involuntary penalties (Logistics maintenance, battle losses, Planet Fall, fleet destruction, etc.)\n\n**Supply Deficit:**\n\nWhen a Supply Deficit occurs:\n- All fleets -1 Fleet Strength (fleets at 1/5 are destroyed)\n- The faction's next turn is locked into **Emergency Rationing** (no other action may be taken)\n- Emergency Rationing returns Supply to 25\n\n**Manpower Deficit:**\n\nWhen a faction reaches 0 Manpower (from any source), Manpower Deficit occurs:\n- If currently being attacked, the defender must choose Forced Conscription OR Isolated Defense for this battle only (see below)\n- All fleets suffer -1 Fleet Strength (fleets cannot be destroyed by Manpower Deficit — minimum 1/5)\n- The faction's next turn is locked into **Emergency Muster** (no other action may be taken)\n- Emergency Muster returns Manpower to 25\n\n*Forced Conscription:* Strip Defense from fully defended planets elsewhere (1 Defense = 1 Manpower required). Battle proceeds normally with standard 60%/100% Manpower return rules.\n\n*Isolated Defense:* The planet defends alone with local garrison. AI vs AI: Defender roll suffers -15 penalty. Player defending in Soulstorm: +2 Difficulty. If attacker wins: Normal damage dealt, defender loses 0 Manpower (none committed). If attacker loses: Attacker returns 60% Manpower (loses only 40% — isolated garrison cannot pursue).\n\n**Cascade Deficits:** If multiple Deficits occur simultaneously (e.g., Supply Deficit destroys fleets, causing Manpower loss that triggers Manpower Deficit), resolve them in order: Supply Deficit first, then Manpower Deficit. The faction is locked into Emergency Rationing (the first deficit's recovery action). The Manpower Deficit's fleet damage still occurs, but the faction does not need to take Emergency Muster afterward — Emergency Rationing handles both.\n\n---\n\n"}, {"title": "SECTION 4: RANDOM EVENTS", "html": "<p>At the start of each Cycle, before any faction takes its turn, roll 1d6. On a 1 or 6, roll 1d6 again on the table below. One roll per Cycle, not one per faction. The resulting event applies for the whole of that Cycle and expires immediately before Major Faction 1 begins the next.<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>d6<\/th><th>Event<\/th><th>Effect<\/th><\/tr><\/thead><tbody><tr><td data-label=\"d6\">1<\/td><td data-label=\"Event\"><strong>Warp Storm<\/strong><\/td><td data-label=\"Effect\">All Factions: All Fleets -1 Fleet Strength. Fleets cannot move for the remainder of this Cycle.<\/td><\/tr><tr><td data-label=\"d6\">2<\/td><td data-label=\"Event\"><strong>Ambush!<\/strong><\/td><td data-label=\"Effect\">Attackers this Cycle get +1 difficulty. Defenders get -1 difficulty. AI vs AI: Defender +10 to roll.<\/td><\/tr><tr><td data-label=\"d6\">3<\/td><td data-label=\"Event\"><strong>Supply Crisis<\/strong><\/td><td data-label=\"Effect\">All Factions: -5 Supply and -5 Manpower.<\/td><\/tr><tr><td data-label=\"d6\">4<\/td><td data-label=\"Event\"><strong>War Fervor<\/strong><\/td><td data-label=\"Effect\">All Factions: +5 Supply and +5 Manpower.<\/td><\/tr><tr><td data-label=\"d6\">5<\/td><td data-label=\"Event\"><strong>Third Party Raid<\/strong><\/td><td data-label=\"Effect\">If a ground battle occurs, add a random hostile faction (player determines faction type based on context). If Third Party wins on Minor/Standard: they claim the planet and establish as a new aligned faction. If Third Party wins on Major/Capital: planet defense halved (rounded down), Third Party disperses.<\/td><\/tr><tr><td data-label=\"d6\">6<\/td><td data-label=\"Event\"><strong>Intel Breakthrough<\/strong><\/td><td data-label=\"Effect\">You choose: -1 difficulty this battle OR +1 damage dealt on a successful attack. AI vs AI: Attacker +10 to roll.<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>", "text": "\nAt the start of each Cycle, before any faction takes its turn, roll 1d6. On a 1 or 6, roll 1d6 again on the table below. One roll per Cycle, not one per faction. The resulting event applies for the whole of that Cycle and expires immediately before Major Faction 1 begins the next.\n\n| d6 | Event | Effect |\n|----|-------|--------|\n| 1 | **Warp Storm** | All Factions: All Fleets -1 Fleet Strength. Fleets cannot move for the remainder of this Cycle. |\n| 2 | **Ambush!** | Attackers this Cycle get +1 difficulty. Defenders get -1 difficulty. AI vs AI: Defender +10 to roll. |\n| 3 | **Supply Crisis** | All Factions: -5 Supply and -5 Manpower. |\n| 4 | **War Fervor** | All Factions: +5 Supply and +5 Manpower. |\n| 5 | **Third Party Raid** | If a ground battle occurs, add a random hostile faction (player determines faction type based on context). If Third Party wins on Minor/Standard: they claim the planet and establish as a new aligned faction. If Third Party wins on Major/Capital: planet defense halved (rounded down), Third Party disperses. |\n| 6 | **Intel Breakthrough** | You choose: -1 difficulty this battle OR +1 damage dealt on a successful attack. AI vs AI: Attacker +10 to roll. |\n\n---\n\n"}], "mobile": "<p>Mobile Assets are fleet-based capitals or moveable planet-equivalents such as Aeldari Craftworlds, Necron World-Engines, or Adeptus Mechanicus Explorator Fleets. These function as both fleet and planet — they can move between systems, engage in Fleet Battles, and serve as faction capitals. Use this section to track their location, strength, and attached constructions.<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Asset<\/th><th>Type<\/th><th>Controller<\/th><th>Strength<\/th><th>Location<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Asset\">The Star-Mother<\/td><td data-label=\"Type\">Hive Ship (Mobile Capital)<\/td><td data-label=\"Controller\">Splinter Fleet Cerberus<\/td><td data-label=\"Strength\">11/12<\/td><td data-label=\"Location\">Threnholt System<\/td><td data-label=\"Notes\">The splinter&#x27;s reproductive core and the Norn Queen&#x27;s vessel. Where it drifts, the swarm follows. Cycle 1 Warp Storm: -1 defence; cannot move this Cycle (agreed ruling).<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>", "log": "<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Cycle<\/th><th>41st Expeditionary Korps<\/th><th>Vior&#x27;la Expedition<\/th><th>Splinter Fleet Cerberus<\/th><th>Result<\/th><th>Narrative Notes<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Cycle\">1<\/td><td data-label=\"41st Expeditionary Korps\">No turn resolved<\/td><td data-label=\"Vior&#x27;la Expedition\">No turn resolved<\/td><td data-label=\"Splinter Fleet Cerberus\">No turn resolved<\/td><td data-label=\"Result\">Opening event: Warp Storm<\/td><td data-label=\"Narrative Notes\">Event check d6=1; event table d6=1. Ordinary fleets -1 strength and movement prohibited for Cycle 1. Kelmar Ore Haulers destroyed. Agreed ruling: Star-Mother counts as a fleet for this event, 12/12 → 11/12 and cannot move this Cycle. Star-Blessed -1 Manpower allocation remains pending ruling.<\/td><\/tr><\/tbody><\/table><\/div>", "document": "<h2>THE DESSICA CAMPAIGN<\/h2>\n<h3>Soulstorm Campaign System — Cycle-Based Strategic Layer<\/h3>\n<hr>\n<p><em>In the eleventh year of the siege of Aschenvald, the 41st Expeditionary Korps mined beneath the eastern curtain wall and brought four hundred metres of it down into the ditch. The citadel fell over the following winter. Lord Marshal Kolbrant filed the compliance assessment and requisitioned garrison regiments for the spring convoy.<\/em><\/p>\n<p><em>Three months later the astropaths started screaming and could not be made to stop.<\/em><\/p>\n<p><em>Kolbrant left the convoy schedules pinned in the command bunker for two more years. Then he struck the arrival dates through, ordered the trench networks extended to the northern ash plains, set his engineers to sinking the deep works, and entered a new designation for the world into the regimental record. Sühne.<\/em><\/p>\n<p><em>The Vior&#x27;la Expedition made planetfall in the outer reaches with eleven thousand colonists and a cargo manifest of atmospheric processors. Shas&#x27;o Mont&#x27;yr established the perimeter and transmitted confirmation to Third Sphere command that the operation was proceeding to schedule. The reply channel has stood open ever since. Aun&#x27;el Shovah&#x27;ka addresses the council at the close of each season and speaks of the work ahead.<\/em><\/p>\n<p><em>On Kelmar the brood sang. They had sung for six generations in the deep shafts, where the air carries sound a long way, and the words had never changed: the Star-Mother would come down out of the dark and make them whole.<\/em><\/p>\n<p><em>Something in the Ghoul Stars heard the sixth generation.<\/em><\/p>\n<p><em>It entered the Threnholt system trailing spore clouds that fouled the orbital lanes for a month. The cult filled the shrine at the bottom of the deepest shaft and wept.<\/em><\/p>\n<hr>\n<p><strong>Cycle and Turn Specification:<\/strong><\/p>\n<p class=\"list-line\">- 1 Cycle = 1 Standard Terran Year<\/p>\n<p class=\"list-line\">- All factions take one turn per Cycle<\/p>\n<p class=\"list-line\">- Turn order determined by faction number (Major Faction 1 → Major Faction 2 → Major Faction 3)<\/p>\n<hr>\n<h3>SECTION 1: CAMPAIGN SETUP<\/h3>\n<h4>Fleet Strength Clarification<\/h4>\n<p><strong>Fleet Strength represents combat effectiveness — NOT vessel count.<\/strong> A single point of Fleet Strength encompasses crew readiness, ammunition stores, morale, hull integrity, fuel reserves, and operational capacity. A fleet cannot be reduced to a single vessel; when Fleet Strength drops to 1/5, the fleet is combat-ineffective but still exists as a formation. At 0, the fleet is destroyed as a coherent fighting force.<\/p>\n<p>This distinction matters for:<\/p>\n<p class=\"list-line\">- <strong>Damage calculations:<\/strong> Fleet Strength lost represents degraded combat capability, not ships exploding<\/p>\n<p class=\"list-line\">- <strong>Regeneration:<\/strong> Recovering Fleet Strength represents repairs, resupply, crew rotation, and morale recovery<\/p>\n<p class=\"list-line\">- <strong>Constructions:<\/strong> Fleet-attached constructions represent specialized capacity, not individual ships<\/p>\n<h4>Faction Alignments<\/h4>\n<p>Factions with the same Alignment are Allied. Factions with different Alignments are Hostile.<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Faction<\/th><th>Alignment<\/th><th>Per Manpower<\/th><th>Ratio to Marine<\/th><th>vs Guard<\/th><th>Force Description<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Faction\">Space Marines<\/td><td data-label=\"Alignment\">Imperium<\/td><td data-label=\"Per Manpower\">40<\/td><td data-label=\"Ratio to Marine\">1:1<\/td><td data-label=\"vs Guard\">1:15<\/td><td data-label=\"Force Description\">Battle-brothers only. Chapter Serfs, Servitors, and non-combat personnel not tracked. Vehicle crews included.<\/td><\/tr><tr><td data-label=\"Faction\">Chaos Space Marines<\/td><td data-label=\"Alignment\">Chaos<\/td><td data-label=\"Per Manpower\">40<\/td><td data-label=\"Ratio to Marine\">1:1<\/td><td data-label=\"vs Guard\">1:15<\/td><td data-label=\"Force Description\">Traitor Astartes only. Cultists, mutants, and daemonic auxiliaries supplement forces but not explicitly tracked.<\/td><\/tr><tr><td data-label=\"Faction\">Grey Knights<\/td><td data-label=\"Alignment\">Imperium<\/td><td data-label=\"Per Manpower\">40<\/td><td data-label=\"Ratio to Marine\">1:1<\/td><td data-label=\"vs Guard\">1:15<\/td><td data-label=\"Force Description\">Battle-brothers only. Inquisitorial retinues and support staff not tracked.<\/td><\/tr><tr><td data-label=\"Faction\">Sisters of Battle<\/td><td data-label=\"Alignment\">Imperium<\/td><td data-label=\"Per Manpower\">100<\/td><td data-label=\"Ratio to Marine\">1:2.5<\/td><td data-label=\"vs Guard\">1:6<\/td><td data-label=\"Force Description\">Battle Sisters and vehicle crews. Ecclesiarchy support, Arco-flagellants, Penitent Engines as auxiliary not tracked.<\/td><\/tr><tr><td data-label=\"Faction\">Imperial Guard<\/td><td data-label=\"Alignment\">Imperium<\/td><td data-label=\"Per Manpower\">600<\/td><td data-label=\"Ratio to Marine\">1:15<\/td><td data-label=\"vs Guard\">Baseline<\/td><td data-label=\"Force Description\">Frontline infantry, officers, heavy weapons teams, tank crews. Logistics and rear echelon not tracked.<\/td><\/tr><tr><td data-label=\"Faction\">Traitor Guard<\/td><td data-label=\"Alignment\">Chaos<\/td><td data-label=\"Per Manpower\">600<\/td><td data-label=\"Ratio to Marine\">1:15<\/td><td data-label=\"vs Guard\">Baseline<\/td><td data-label=\"Force Description\">As Imperial Guard. Mutants and Chaos-touched may supplement but not tracked.<\/td><\/tr><tr><td data-label=\"Faction\">Craftw
