Hulk (4/5), Da Krumpin&#x27; Krooza (4/5), Grotmire Scrap Barges (1/5)<\/p>\n<hr>\n<h4>Gutrekk System (Independent — Waaagh! Gutrekk)<\/h4>\n<p><strong>Void Superiority:<\/strong> Waaagh! Gutrekk: 8 — Waaagh! Gutrekk<\/p>\n<p><em>Gutrekk and Skarjaw fought each other for eleven years before either of them reached Dessica. The Rok came down on Bonegrind hard enough to crack the crust. Gutrekk&#x27;s Boyz have painted the range markers on the surface batteries in Skarjaw&#x27;s colours.<\/em><\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Planet<\/th><th>Type<\/th><th>Controller<\/th><th>Defense<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Planet\">Gutrekk&#x27;s Rok<\/td><td data-label=\"Type\">Major<\/td><td data-label=\"Controller\">Waaagh! Gutrekk<\/td><td data-label=\"Defense\">8/8<\/td><td data-label=\"Notes\">Asteroid fortress driven into a dead world&#x27;s crust. Tunnel networks bored through solid rock house the bulk of the mob. Gun batteries welded across the exposed surface, burning promethium day and night.<\/td><\/tr><tr><td data-label=\"Planet\">Bonegrind<\/td><td data-label=\"Type\">Minor<\/td><td data-label=\"Controller\">Waaagh! Gutrekk<\/td><td data-label=\"Defense\">2/2<\/td><td data-label=\"Notes\">Mining world stripped to bedrock. Extraction gear has been cut down and rebuilt into vehicle frames and gun mounts. The pit heads stand open and empty.<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>In-System Fleets:<\/strong><\/p>\n<p class=\"list-line\">- Waaagh! Gutrekk: Gutrekk&#x27;s Rok Fleet (4/5), Da Bonegrinda (4/5)<\/p>\n<hr>\n<h4>Vashenne System (Independent — Kabal of the Withered Hand)<\/h4>\n<p><strong>Void Superiority:<\/strong> Kabal of the Withered Hand: 6 — Kabal of the Withered Hand<\/p>\n<p><em>The culling schedule on Vashenne runs on a two-hundred-day cycle. Kabalite crews work the northern hemisphere while the southern population is left to breed, then the hemispheres are exchanged. Archon Yssareth&#x27;s court reviews the yield figures at the close of each cycle and revises the quotas. The portal in the polar wastes carries the take back to Commorragh within the hour.<\/em><\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Planet<\/th><th>Type<\/th><th>Controller<\/th><th>Defense<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Planet\">Vashenne<\/td><td data-label=\"Type\">Standard<\/td><td data-label=\"Controller\">Kabal of the Withered Hand<\/td><td data-label=\"Defense\">4/4<\/td><td data-label=\"Notes\">Former Imperial colony. Population held in managed settlements and worked on the culling rotation. A webway portal sits concealed beneath the polar ice, guarded by a permanent Kabalite garrison.<\/td><\/tr><tr><td data-label=\"Planet\">Sallow<\/td><td data-label=\"Type\">Minor (Station)<\/td><td data-label=\"Controller\">Kabal of the Withered Hand<\/td><td data-label=\"Defense\">2/2<\/td><td data-label=\"Notes\">Orbital pens and processing stations. Holding capacity runs to six figures. Transfer barges cycle between the station and the surface on the culling schedule.<\/td><\/tr><tr><td data-label=\"Planet\">Threnn<\/td><td data-label=\"Type\">Minor (Station)<\/td><td data-label=\"Controller\">Kabal of the Withered Hand<\/td><td data-label=\"Defense\">2/2<\/td><td data-label=\"Notes\">Raiding cache. Captured hulls in various states of stripping, cargo holds sorted by origin, and the accumulated take of four decades.<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>In-System Fleets:<\/strong><\/p>\n<p class=\"list-line\">- Kabal of the Withered Hand: The Sculpted Scream (4/5), Sallow Slavers (2/5)<\/p>\n<hr>\n<h4>Havren System (Independent — The Havren Reclamation)<\/h4>\n<p><strong>Void Superiority:<\/strong> Havren Reclamation: 11 — Havren Reclamation<\/p>\n<p><em>The Havren Warrant of Trade hangs in the receiving hall on Havren&#x27;s Claim, nineteen signatures deep, the most recent countersigned by a Lord Militant four centuries dead. Lady Reclaimant Sevrine Havren receives petitioners beneath it. Her escorts run the patrol routes her grandmother set, and the tariff schedules are still enforced at Merrow.<\/em><\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Planet<\/th><th>Type<\/th><th>Controller<\/th><th>Defense<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Planet\">Havren&#x27;s Claim<\/td><td data-label=\"Type\">Major<\/td><td data-label=\"Controller\">Havren Reclamation<\/td><td data-label=\"Defense\">8/8<\/td><td data-label=\"Notes\">Fortified trade world. Void docks and warehouse districts ring the equator, with mercenary barracks quartered alongside. The dynasty&#x27;s seat occupies the head of the primary orbital elevator.<\/td><\/tr><tr><td data-label=\"Planet\">Ashet<\/td><td data-label=\"Type\">Standard<\/td><td data-label=\"Controller\">Havren Reclamation<\/td><td data-label=\"Defense\">4/4<\/td><td data-label=\"Notes\">Agri-world. Estate holdings measured in continents, worked under indenture contracts inherited across three generations. Feeds the Claim and the Reclamation fleet.<\/td><\/tr><tr><td data-label=\"Planet\">Merrow<\/td><td data-label=\"Type\">Minor (Station)<\/td><td data-label=\"Controller\">Havren Reclamation<\/td><td data-label=\"Defense\">2/2<\/td><td data-label=\"Notes\">Refuelling depot and shipyard annex. Drydocks handle hulls up to cruiser tonnage. Tariff office sits at the station&#x27;s primary approach.<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>In-System Fleets:<\/strong><\/p>\n<p class=\"list-line\">- Havren Reclamation: The Nineteenth Warrant (4/5), Sevrine&#x27;s Prerogative (4/5), Merrow Tender Group (3/5)<\/p>\n<hr>\n<h4>Talgrave System (Independent — The Talgrave Dominion)<\/h4>\n<p><strong>Void Superiority:<\/strong> Talgrave Dominion: 11 — Talgrave Dominion<\/p>\n<p><em>Governor Aurelian Vosk continues to file tithe assessments. They accumulate in the Palatine Spire&#x27;s records office, bound and sealed by year, addressed to an Administratum that has not acknowledged receipt in four decades. Corrandine&#x27;s governor declined the Dominion&#x27;s protection in the eleventh year. The occupation garrison has held his capital since.<\/em><\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Planet<\/th><th>Type<\/th><th>Controller<\/th><th>Defense<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Planet\">Talgrave<\/td><td data-label=\"Type\">Major<\/td><td data-label=\"Controller\">Talgrave Dominion<\/td><td data-label=\"Defense\">8/8<\/td><td data-label=\"Notes\">Hive world. Six primary spires ringed by manufactorum belts and muster fields that process forty thousand conscripts a season. Vosk governs from the Palatine Spire. The records office occupies its eleventh tier.<\/td><\/tr><tr><td data-label=\"Planet\">Corrandine<\/td><td data-label=\"Type\">Standard<\/td><td data-label=\"Controller\">Talgrave Dominion<\/td><td data-label=\"Defense\">4/4<\/td><td data-label=\"Notes\">Annexed civilised world. Garrison troops outnumber Dominion administrators by nine to one. Curfew has been in continuous force since the annexation.<\/td><\/tr><tr><td data-label=\"Planet\">Sest<\/td><td data-label=\"Type\">Minor<\/td><td data-label=\"Controller\">Talgrave Dominion<\/td><td data-label=\"Defense\">2/2<\/td><td data-label=\"Notes\">Agricultural world. Serf-worked estates under manor-house administration, feeding Talgrave&#x27;s hives on a fixed shipping quota. The militia is equipped for crowd suppression.<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>In-System Fleets:<\/strong><\/p>\n<p class=\"list-line\">- Talgrave Dominion: The Palatine Guard (4/5), Corrandine Occupation Fleet (4/5), Sest Patrol Wing (3/5)<\/p>\n<hr>\n<h4>Ketterin System (Independent — The Corvus Reduction)<\/h4>\n<p><strong>Void Superiority:<\/strong> Corvus Reduction: 6 — Corvus Reduction<\/p>\n<p><em>Thelk&#x27;s envoys came to Ketterin in the fourteenth year. The Reduction received them in the outer chamber, observed the full ritual courtesies, and escorted them back to their shuttle within the hour. Drask&#x27;s archive has been closed to Anvarrus ciphers by standing order since. The Reduction produces three sanctioned patterns and declines all other commissions.<\/em><\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Planet<\/th><th>Type<\/th><th>Controller<\/th><th>Defense<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Planet\">Ketterin<\/td><td data-label=\"Type\">Standard<\/td><td data-label=\"Controller\">Corvus Reduction<\/td><td data-label=\"Defense\">4/4<\/td><td data-label=\"Notes\">Forge world. Output limited to three sanctioned patterns, each manufactured to tolerances recorded against the original templates. Tithe capacity runs at a fraction of Anvarrus.<\/td><\/tr><tr><td data-label=\"Planet\">Vellun<\/td><td data-label=\"Type\">Minor<\/td><td data-label=\"Controller\">Corvus Reduction<\/td><td data-label=\"Defense\">2/2<\/td><td data-label=\"Notes\">Ore extraction and processing. Servitor-operated throughout, with a Tech-Priest oversight cadre of forty.<\/td><\/tr><tr><td data-label=\"Planet\">Drask<\/td><td data-label=\"Type\">Minor<\/td><td data-label=\"Controller\">Corvus Reduction<\/td><td data-label=\"Defense\">2/2<\/td><td data-label=\"Notes\">Archive vault and cogitator bank. The Reduction&#x27;s pattern records and doctrinal texts, held behind physical seals and a Skitarii watch.<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>In-System Fleets:<\/strong><\/p>\n<p class=\"list-line\">- Corvus Reduction: The Sealed Codex (4/5), Drask Archive Escort (2/5)<\/p>\n<hr>\n<h3>Mobile Assets<\/h3>\n<p>Mobile Assets are fleet-based capitals or moveable planet-equivalents such as Aeldari Craftworlds, Necron World-Engines, or Adeptus Mechanicus Explorator Fleets. These function as both fleet and planet — they can move between systems, engage in Fleet Battles, and serve as faction capitals. Use this section to track their location, strength, and attached constructions.<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Asset<\/th><th>Type<\/th><th>Controller<\/th><th>Strength<\/th><th>Location<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Asset\">The Star-Mother<\/td><td data-label=\"Type\">Hive Ship (Mobile Capital)<\/td><td data-label=\"Controller\">Splinter Fleet Cerberus<\/td><td data-label=\"Strength\">11/12<\/td><td data-label=\"Location\">Threnholt System<\/td><td data-label=\"Notes\">The splinter&#x27;s reproductive core and the Norn Queen&#x27;s vessel. Where it drifts, the swarm follows. Cycle 1 Warp Storm: -1 defence; cannot move this Cycle (agreed ruling).<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h3>Battle Log<\/h3>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Cycle<\/th><th>41st Expeditionary Korps<\/th><th>Vior&#x27;la Expedition<\/th><th>Splinter Fleet Cerberus<\/th><th>Result<\/th><th>Narrative Notes<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Cycle\">1<\/td><td data-label=\"41st Expeditionary Korps\">No turn resolved<\/td><td data-label=\"Vior&#x27;la Expedition\">No turn resolved<\/td><td data-label=\"Splinter Fleet Cerberus\">No turn resolved<\/td><td data-label=\"Result\">Opening event: Warp Storm<\/td><td data-label=\"Narrative Notes\">Event check d6=1; event table d6=1. Ordinary fleets -1 strength and movement prohibited for Cycle 1. Kelmar Ore Haulers destroyed. Agreed ruling: Star-Mother counts as a fleet for this event, 12/12 → 11/12 and cannot move this Cycle. Star-Blessed -1 Manpower allocation remains pending ruling.<\/td><\/tr><\/tbody><\/table><\/div>", "revision": "395e2680c62d"}</script><script>'use strict';
let data=JSON.parse(document.getElementById('campaign-data').textContent);
let view='overview', query='', selectedSystem=null, systemScroll=0;
const tabState={};
const main=document.getElementById('main');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function heading(k,title,sub=''){return `<p class="eyebrow">${k}</p><h1>${title}</h1>${sub?`<p class="subtitle">${sub}</p>`:''}`;}
function render(){
 document.getElementById('header-cycle').textContent=String(data.cycle).padStart(2,'0');
 document.querySelectorAll('[data-view]').forEach(b=>{if(b.dataset.view===view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
 document.getElementById('revision').textContent=`Cycle ${data.cycle} · ${data.status.updated}`;
 if(view==='overview'){
 const nextLog=data.cycle+(3-data.cycle%3);
 main.innerHTML=heading('THE DESSICA CAMPAIGN','Command overview')+`<section class="cycle-banner" aria-label="Current cycle"><div class="cycle-number">${String(data.cycle).padStart(2,'0')}<small>CYCLE</small></div><div><p class="kicker">CAMPAIGN STATUS</p><h2>${esc(data.status.phase)}</h2><p>Next: ${esc(data.status.nextFaction)}</p></div><span class="pill">${data.cycle%3===0?'Logistics Cycle':'Next logistics · Cycle '+nextLog}</span></section><div class="section-head"><h2>Major factions</h2><span>Turn order · I → II → III</span></div><div class="factions">${data.factions.map((f,i)=>{
 const v=f.values,s=Number(v['Supplies (1-100)']),m=Number(v['Manpower (1-100)']);
 return `<article class="faction" style="--accent:var(${['--green','--cyan','--purple'][i]||'--gold'})"><p class="kicker">${['I / IMPERIUM','II / T’AU','III / TYRANID'][i]||'ALLIED FACTION'}</p><h3>${esc(f.name)}</h3><div class="metrics">${[[s,'Supply'],[m,'Manpower']].map(([n,label])=>`<div class="metric"><strong>${esc(n)}</strong><span>${label} / 100</span><div class="meter"><i style="width:${Math.max(0,Math.min(100,n))}%"></i></div></div>`).join('')}</div><details class="faction-details"><summary>Fleets & holdings</summary><dl>${['Fleets','Planets Controlled','Constructions'].map(k=>`<dt>${k==='Planets Controlled'?'Holdings':k}</dt><dd>${esc(v[k])}</dd>`).join('')}${i===2?'<dt>Mobile capital</dt><dd>See Star-Mother status below</dd>':''}</dl></details></article>`;
 }).join('')}</div><div class="section-head"><h2>Cycle dispatch</h2><span>Official campaign record</span></div><div class="brief-grid"><section class="panel"><p class="kicker">EVENT REPORT</p><h2>${esc(data.status.event)}</h2><p class="muted">${esc(data.status.notes)}</p></section><section class="panel"><p class="kicker">LOGISTICS SCHEDULE</p><p>Income and fleet maintenance every third Cycle.</p><div class="timeline">${Array.from({length:6},(_,i)=>{let n=data.cycle+i;return `<span class="${i===0?'current':n%3===0?'logistics':''}" title="Cycle ${n}${n%3===0?' · Logistics':''}">${n}</span>`;}).join('')}</div></section></div><div class="section-head"><h2>Mobile assets</h2></div><div class="article">${data.mobile}</div>`;
 }else if(view==='systems'){
 if(selectedSystem!==null){const s=data.systems[selectedSystem];main.innerHTML=`<button class="back" id="back">← All systems</button>`+heading('SYSTEM DOSSIER',esc(s.title.split(' System')[0]))+`<div class="article">${s.html}</div>`;document.getElementById('back').onclick=()=>{selectedSystem=null;render();window.scrollTo(0,systemScroll);};}
 else{main.innerHTML=heading('SUBSECTOR REGISTER','Systems & holdings',`${data.systems.length} systems · ${data.systems.reduce((n,s)=>n+s.worlds.length,0)} planetary and station holdings`)+`<div class="search-tools"><label for="search" class="sr-only">Search systems, worlds or controllers</label><input class="search" id="search" type="search" placeholder="Search systems, worlds, factions…" value="${esc(query)}" enterkeyhint="search" autocapitalize="none" spellcheck="false"></div><div id="results"></div>`;renderSystems();bindSearch(renderSystems);}
 }else if(view==='rules'){
 main.innerHTML=heading('FIELD MANUAL','Campaign rules','The campaign’s rules, preserved as written.')+`<div class="search-tools"><label for="search" class="sr-only">Search campaign rules</label><input id="search" class="search" type="search" placeholder="Search fleet actions, costs, events…" value="${esc(query)}" enterkeyhint="search" autocapitalize="none" spellcheck="false"></div><div id="results"></div>`;renderRules();bindSearch(renderRules);
 }else{
 main.innerHTML=heading('REGIMENTAL ARCHIVE','Campaign record',`Cycle ${data.cycle} · ${esc(data.status.updated)}`)+`<div class="record-actions"><a href="./Dessica_Campaign.md" download>Download Markdown ↗</a><button id="full">Read complete document</button></div><div class="panel"><p class="kicker">CURRENT POSITION</p><h2>${esc(data.status.phase)}</h2><p>${esc(data.status.notes)}</p></div><div class="section-head"><h2>Battle log</h2></div><div class="article">${data.log}</div>`;
 document.getElementById('full').onclick=()=>{main.innerHTML='<button class="back" id="back">← Campaign record</button><div class="article">'+data.document+'</div>';document.getElementById('back').onclick=render;};
 }
}
function bindSearch(fn){const input=document.getElementById('search');input.oninput=e=>{query=e.target.value;fn();};input.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();input.blur();}};}
function renderSystems(){
 const matches=data.systems.map((s,i)=>({...s,index:i})).filter(s=>(s.title+' '+s.text).toLowerCase().includes(query.toLowerCase()));
 document.getElementById('results').innerHTML=`<p class="count">${matches.length} systems</p><div class="system-grid">${matches.map(s=>`<article class="system-card"><p class="kicker">SYSTEM / ${String(s.index+1).padStart(2,'0')}</p><h2>${esc(s.title.split(' System')[0])}</h2><p class="muted">${esc(s.title.split(' System ')[1]||'').replace(/^\(|\)$/g,'')}</p><div class="worlds">${s.worlds.map(w=>`<div class="world-row"><div><strong>${esc(w.Planet)}</strong><small>${esc(w.Controller)}</small></div><div><strong>${esc(w.Defense)}</strong><small>${esc(w.Type)}</small></div></div>`).join('')}</div><button data-system="${s.index}">Open dossier ↗</button></article>`).join('')}</div>${matches.length?'':'<p class="empty">No matching systems. Try a planet or faction name.</p>'}`;
 document.querySelectorAll('[data-system]').forEach(b=>b.onclick=()=>{systemScroll=window.scrollY;selectedSystem=Number(b.dataset.system);render();window.scrollTo(0,0);});
}
function renderRules(){
 const matches=data.rules.filter(r=>(r.title+' '+r.text).toLowerCase().includes(query.toLowerCase()));
 document.getElementById('results').innerHTML=`<p class="count">${matches.length} rule entries${query?' match your search':''}</p>`+matches.map(r=>`<details class="rule"><summary>${esc(r.title)}</summary><div class="article">${r.html}</div></details>`).join('')+(matches.length?'':'<p class="empty">No matching rules. Try “Manpower”, “Defend” or “Fleet”.</p>');
}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{const target=b.dataset.view;if(target===view){window.scrollTo(0,0);return;}tabState[view]={query,selectedSystem,scroll:window.scrollY};view=target;const state=tabState[view]||{};query=state.query||'';selectedSystem=state.selectedSystem??null;render();window.scrollTo(0,state.scroll||0);});
let checking=false;
async function refresh(){
 if(checking||location.protocol==='file:')return;
 checking=true;const status=document.getElementById('connection');status.textContent='Checking campaign…';
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),8000);
 try{
  const res=await fetch('./campaign.json',{cache:'no-store',signal:controller.signal});if(!res.ok)throw Error('Unavailable');const next=await res.json();
  if(!next.revision||!Array.isArray(next.systems)||!next.status)throw Error('Invalid campaign');
  if(next.revision!==data.revision){data=next;render();}
  status.textContent=res.headers.get('X-Dessica-Cache')==='offline'?'Connection unavailable · saved campaign':'Latest published campaign';
 }catch(e){status.textContent='Offline or unavailable · showing saved campaign';}
 finally{clearTimeout(timer);checking=false;}
}
document.getElementById('refresh').onclick=async()=>{await refresh();if('serviceWorker'in navigator){const reg=await navigator.serviceWorker.getRegistration();if(reg)await reg.update();}};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refresh();});
window.addEventListener('online',refresh);window.addEventListener('offline',()=>{document.getElementById('connection').textContent='Offline · showing saved campaign';});
if('serviceWorker'in navigator&&location.protocol!=='file:'){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
render();refresh();setInterval(()=>{if(document.visibilityState==='visible')refresh();},60000);
</script></body></html>
