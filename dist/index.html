orld Eldar<\/td><td data-label=\"Alignment\">Aeldari<\/td><td data-label=\"Per Manpower\">100<\/td><td data-label=\"Ratio to Marine\">1:2.5<\/td><td data-label=\"vs Guard\">1:6<\/td><td data-label=\"Force Description\">Mix of Aspect Warriors and Guardian militia. Seers, vehicle crews included. Wraithbone constructs as heavy support not explicitly tracked.<\/td><\/tr><tr><td data-label=\"Faction\">Harlequins<\/td><td data-label=\"Alignment\">Aeldari<\/td><td data-label=\"Per Manpower\">15<\/td><td data-label=\"Ratio to Marine\">2.67:1<\/td><td data-label=\"vs Guard\">1:40<\/td><td data-label=\"Force Description\">Players only. Troupes, Shadowseers, Death Jesters, Solitaires. No auxiliaries - they operate alone.<\/td><\/tr><tr><td data-label=\"Faction\">Drukhari<\/td><td data-label=\"Alignment\">Drukhari<\/td><td data-label=\"Per Manpower\">160<\/td><td data-label=\"Ratio to Marine\">1:4<\/td><td data-label=\"vs Guard\">1:3.75<\/td><td data-label=\"Force Description\">Kabalite Warriors, Wyches, vehicle crews. Haemonculus creations and slaves may supplement raids but not tracked.<\/td><\/tr><tr><td data-label=\"Faction\">Necrons<\/td><td data-label=\"Alignment\">Necron<\/td><td data-label=\"Per Manpower\">160<\/td><td data-label=\"Ratio to Marine\">1:4<\/td><td data-label=\"vs Guard\">1:3.75<\/td><td data-label=\"Force Description\">Warriors, Immortals, command elements. Canoptek constructs (Scarabs, Wraiths, Spyders) as auxiliary not explicitly tracked.<\/td><\/tr><tr><td data-label=\"Faction\">Tau<\/td><td data-label=\"Alignment\">T&#x27;au<\/td><td data-label=\"Per Manpower\">320<\/td><td data-label=\"Ratio to Marine\">1:8<\/td><td data-label=\"vs Guard\">1:1.9<\/td><td data-label=\"Force Description\">Fire Caste Warriors, Pathfinders, Battlesuit pilots, vehicle crews. Kroot and Vespid auxiliaries handled as separate formations.<\/td><\/tr><tr><td data-label=\"Faction\">Orks<\/td><td data-label=\"Alignment\">Ork<\/td><td data-label=\"Per Manpower\">400<\/td><td data-label=\"Ratio to Marine\">1:10<\/td><td data-label=\"vs Guard\">1:1.5<\/td><td data-label=\"Force Description\">Boyz, Nobz, specialist mobs, vehicle crews. Gretchin serve as support. Squigs not tracked.<\/td><\/tr><tr><td data-label=\"Faction\">Tyranids<\/td><td data-label=\"Alignment\">Tyranid<\/td><td data-label=\"Per Manpower\">800<\/td><td data-label=\"Ratio to Marine\">1:20<\/td><td data-label=\"vs Guard\">1:1.3<\/td><td data-label=\"Force Description\">Weighted average: primarily Gaunts with Warriors and Genestealers as synapse/elite. Larger bioforms (Carnifexes, etc.) as heavy support.<\/td><\/tr><tr><td data-label=\"Faction\">Chaos Daemons<\/td><td data-label=\"Alignment\">Chaos<\/td><td data-label=\"Per Manpower\">100<\/td><td data-label=\"Ratio to Marine\">1:2.5<\/td><td data-label=\"vs Guard\">1:6<\/td><td data-label=\"Force Description\">Full daemonic incursion: lesser daemons as line troops (Bloodletters, Daemonettes, Plaguebearers, Horrors). Greater Daemons and Daemon Princes as command elements.<\/td><\/tr><tr><td data-label=\"Faction\">Adeptus Mechanicus<\/td><td data-label=\"Alignment\">Imperium<\/td><td data-label=\"Per Manpower\">240<\/td><td data-label=\"Ratio to Marine\">1:6<\/td><td data-label=\"vs Guard\">1:2.5<\/td><td data-label=\"Force Description\">Skitarii Rangers/Vanguard, Tech-Priests, Servitors. Battle Automata and heavier war machines as support not explicitly tracked.<\/td><\/tr><tr><td data-label=\"Faction\">Independent (Rogue Traders, Pirates, minor xenos, unaligned forces)<\/td><td data-label=\"Alignment\">Independent<\/td><td data-label=\"Per Manpower\">Varies<\/td><td data-label=\"Ratio to Marine\">Varies<\/td><td data-label=\"vs Guard\">Varies<\/td><td data-label=\"Force Description\">Independents are all-encompassing. Manpower ratios depend on the specific force composition — use the ratio of whichever faction type best represents the force being fought.<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h4>Major Faction 1: The 41st Expeditionary Korps<\/h4>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Field<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Field\">Faction Type<\/td><td data-label=\"Value\">Death Korps of Krieg — Astra Militarum Army Group<\/td><\/tr><tr><td data-label=\"Field\">Alignment<\/td><td data-label=\"Value\">Imperium<\/td><\/tr><tr><td data-label=\"Field\">Capital<\/td><td data-label=\"Value\">Sühne (Fortress World) — Defence: 12/12<\/td><\/tr><tr><td data-label=\"Field\">Faction Trait<\/td><td data-label=\"Value\"><strong>The Grinding Advance<\/strong> — Ignore Defended status difficulty modifier when attacking. Your attacks deal 1 damage even on defeat.<\/td><\/tr><tr><td data-label=\"Field\">Notable Officers<\/td><td data-label=\"Value\">Lord Marshal Kolbrant, Commissar Ruhn<\/td><\/tr><tr><td data-label=\"Field\">Starting Resources<\/td><td data-label=\"Value\">10 Supply / 10 Manpower<\/td><\/tr><tr><td data-label=\"Field\">Starting Fleet<\/td><td data-label=\"Value\">Transit Command Grunwald (5/5)<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>Major Faction 2: The Vior&#x27;la Expedition<\/h4>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Field<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Field\">Faction Type<\/td><td data-label=\"Value\">T&#x27;au Empire — Third Sphere Expansion Fleet<\/td><\/tr><tr><td data-label=\"Field\">Alignment<\/td><td data-label=\"Value\">T&#x27;au<\/td><\/tr><tr><td data-label=\"Field\">Capital<\/td><td data-label=\"Value\">Mont&#x27;au (Capital World) — Defence: 12/12<\/td><\/tr><tr><td data-label=\"Field\">Faction Trait<\/td><td data-label=\"Value\"><strong>The Provisioned Advance<\/strong> — Reinforce and Muster grant +4 instead of +3<\/td><\/tr><tr><td data-label=\"Field\">Notable Officers<\/td><td data-label=\"Value\">Shas&#x27;o Mont&#x27;yr, Aun&#x27;el Shovah&#x27;ka<\/td><\/tr><tr><td data-label=\"Field\">Starting Resources<\/td><td data-label=\"Value\">10 Supply / 10 Manpower<\/td><\/tr><tr><td data-label=\"Field\">Starting Fleet<\/td><td data-label=\"Value\">The Widening Circle (5/5)<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>Major Faction 3: Splinter Fleet Cerberus<\/h4>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Field<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Field\">Faction Type<\/td><td data-label=\"Value\">Tyranids — Splinter of Hive Fleet Jormungandr<\/td><\/tr><tr><td data-label=\"Field\">Alignment<\/td><td data-label=\"Value\">Tyranid<\/td><\/tr><tr><td data-label=\"Field\">Capital<\/td><td data-label=\"Value\">The Star-Mother (Mobile Capital — Hive Ship) — Defence: 12/12<\/td><\/tr><tr><td data-label=\"Field\">Faction Trait<\/td><td data-label=\"Value\"><strong>Hive Ship<\/strong> — May use a Mobile Capital instead of a Planet-based Capital. See Mobile Capital Rules. <strong>No starting fleet.<\/strong><\/td><\/tr><tr><td data-label=\"Field\">Notable Officers<\/td><td data-label=\"Value\">The Norn Queen (aboard the Star-Mother), Hive Tyrant designates<\/td><\/tr><tr><td data-label=\"Field\">Starting Resources<\/td><td data-label=\"Value\">10 Supply / 10 Manpower<\/td><\/tr><tr><td data-label=\"Field\">Starting Fleet<\/td><td data-label=\"Value\">None — Mobile Capital only<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>Faction Traits<\/h4>\n<p>When selecting a trait for your faction, rename it to something evocative that alludes to the effect without being a direct description. The name should sound like a doctrine, characteristic, or battle cry befitting your faction.<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Placeholder<\/th><th>Effect<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Placeholder\">[Mobile Capital]<\/td><td data-label=\"Effect\">May use a Mobile Capital instead of a Planet-based Capital. See Mobile Capital Rules. <strong>No starting fleet.<\/strong><\/td><\/tr><tr><td data-label=\"Placeholder\">[War Economy]<\/td><td data-label=\"Effect\">+3 Supply per Logistics Cycle<\/td><\/tr><tr><td data-label=\"Placeholder\">[Martial Culture]<\/td><td data-label=\"Effect\">+5 Manpower per Logistics Cycle<\/td><\/tr><tr><td data-label=\"Placeholder\">[Efficient Logistics]<\/td><td data-label=\"Effect\">Reinforce and Muster grant +4 instead of +3<\/td><\/tr><tr><td data-label=\"Placeholder\">[Salvagers]<\/td><td data-label=\"Effect\">+1 Supply per battle (planetary assault or Fleet Battle, as attacker or defender). +2 Supply when you capture a planet.<\/td><\/tr><tr><td data-label=\"Placeholder\">[Void Supremacy]<\/td><td data-label=\"Effect\">Expand Fleet costs no Supply<\/td><\/tr><tr><td data-label=\"Placeholder\">[Swift Mobilization]<\/td><td data-label=\"Effect\">Create Fleet starts at 3/5 instead of 1/5<\/td><\/tr><tr><td data-label=\"Placeholder\">[Fleet Endurance]<\/td><td data-label=\"Effect\">Your fleets regenerate +1 strength per Logistics Cycle if below maximum.<\/td><\/tr><tr><td data-label=\"Placeholder\">[Siege Doctrine]<\/td><td data-label=\"Effect\">Ignore Defended status difficulty modifier when attacking. Your attacks deal 1 damage even on defeat.<\/td><\/tr><tr><td data-label=\"Placeholder\">[Dread Reputation]<\/td><td data-label=\"Effect\">Enemies return only 60% resources on successful defence against you (instead of 80%)<\/td><\/tr><tr><td data-label=\"Placeholder\">[Fortification Experts]<\/td><td data-label=\"Effect\">Defend restores +2 additional defence<\/td><\/tr><tr><td data-label=\"Placeholder\">[Industrial Efficiency]<\/td><td data-label=\"Effect\">Construction costs 4 Supply instead of 5<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>Capital Infrastructure<\/h4>\n<p>All established Capitals include a built-in Orbital Shipyard. This Shipyard is destroyed if the Capital falls and does not transfer to the new controller.<\/p>\n<p>When establishing a new Capital via the Establish New Capital forced action, the built-in Orbital Shipyard is gained only after the Capital reaches maximum defense of 12 and is fully established.<\/p>\n<h4>Mobile Capital Rules<\/h4>\n<p>A faction with the [Mobile Capital] trait uses a mobile fortress — a Craftworld, World-Engine, Hive Ship, Ark Mechanicus, or equivalent — as their Capital instead of a planet.<\/p>\n<p><strong>Core Properties:<\/strong><\/p>\n<p class=\"list-line\">- 12/12 defence (Capital-class)<\/p>\n<p class=\"list-line\">- Generates +4 Supply / +4 Manpower per Logistics Cycle, as any Capital<\/p>\n<p class=\"list-line\">- Built-in Orbital Shipyard, as any Capital<\/p>\n<p class=\"list-line\">- Constructions may be built on it following normal Planetary/Orbital construction rules<\/p>\n<p class=\"list-line\">- <strong>No starting fleet<\/strong> — the faction must build its first fleet from the Capital&#x27;s Shipyard<\/p>\n<p><strong>Movement:<\/strong> The Mobile Capital may move to any system within the Subsector. This consumes a Fleet Action for the turn. The Mobile Capital is not a fleet and does not pay fleet maintenance during Logistics Cycles.<\/p>\n<p><strong>Fleet Battle:<\/strong> The Mobile Capital may participate in Fleet Battles, using its <strong>current defence value<\/strong> as its Fleet Strength for the roll. Initiating a Fleet Battle costs -1 defence (mirroring the -1 Fleet Strength initiation cost). Fleet Battle damage is applied to the Mobile Capital&#x27;s defence value. The Mobile Capital contributes its current defence value toward Void Superiority calculations.<\/p>\n<p><strong>Ground Assault:<\/strong> The Mobile Capital may launch Ground Assaults, using its current defence value as Fleet Strength for damage calculation. It may be attacked by enemies via Ground Assault, as a planet.<\/p>\n<p><strong>Uncontested Bombardment:<\/strong> A Mobile Capital cannot be reduced below 1 defence by Uncontested Bombardment, as any planet.<\/p>\n<p><strong>Destruction:<\/strong> If the Mobile Capital&#x27;s defence reaches 0, it is <strong>destroyed<\/strong> — it does not transfer to the attacker. The owning faction suffers Capital-tier Planet Fall penalties (-4 Supply, -4 Manpower) and must designate a new Capital on an owned planet, entering the Establish New Capital forced action. <strong>The [Mobile Capital] trait is permanently lost<\/strong> — the faction operates without a Faction Trait for the remainder of the campaign.<\/p>\n<p><strong>Elimination:<\/strong> A faction whose Mobile Capital is destroyed while holding no planets is eliminated from the campaign.<\/p>\n<hr>\n<h3>SECTION 2: TURN STRUCTURE<\/h3>\n<p><strong>Resource Requirements:<\/strong> A faction cannot voluntarily take any action that would reduce their Supply or Manpower below 0. If an action requires more resources than the faction possesses, that action cannot be taken. Deficits only occur from involuntary losses (Logistics maintenance, battle outcomes, Planet Fall, fleet destruction, etc.).<\/p>\n<p>Each turn represents one battle. Follow these phases in order:<\/p>\n<h4>Phase 0: Logistics (Every 3rd Cycle Only)<\/h4>\n<p>On Logistics Cycles (Cycles 3, 6, 9, 12, etc.), before any faction acts:<\/p>\n<p><strong>Income (Variable by World Type):<\/strong><\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>World Type<\/th><th>Supply<\/th><th>Manpower<\/th><\/tr><\/thead><tbody><tr><td data-label=\"World Type\">Minor<\/td><td data-label=\"Supply\">+1<\/td><td data-label=\"Manpower\">+1<\/td><\/tr><tr><td data-label=\"World Type\">Standard<\/td><td data-label=\"Supply\">+2<\/td><td data-label=\"Manpower\">+2<\/td><\/tr><tr><td data-label=\"World Type\">Major<\/td><td data-label=\"Supply\">+3<\/td><td data-label=\"Manpower\">+3<\/td><\/tr><tr><td data-label=\"World Type\">Capital<\/td><td data-label=\"Supply\">+4<\/td><td data-label=\"Manpower\">+4<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"list-line\">- All factions gain resources based on planets controlled (sum of world types)<\/p>\n<p class=\"list-line\">- All factions pay -1 Supply and -1 Manpower per Fleet owned (maintenance)<\/p>\n<p class=\"list-line\">- If Supply maintenance cannot be paid, Supply Deficit occurs (see Resource Deficits)<\/p>\n<p class=\"list-line\">- If Manpower maintenance cannot be paid, Manpower Deficit occurs (see Resource Deficits)<\/p>\n<h4>Phase 1: Event Roll (Optional — Once Per Cycle)<\/h4>\n<p>Rolled ONCE per Cycle, before any faction takes its turn. On Logistics Cycles, this follows immediately after Phase 0.<\/p>\n<p>Roll 1d6. On a 1 or 6, roll on the Event Table (Section 4). Otherwise, no event this Cycle.<\/p>\n<p><strong>Duration:<\/strong> A triggered event applies for the whole of the Cycle in which it is rolled. It affects every faction&#x27;s turn in that Cycle, in turn order, and expires at the start of the following Cycle — immediately before Major Faction 1 begins its turn. Events do not carry over. There is one Event Roll per Cycle, not one per faction.<\/p>\n<h4>Phase 2: Fleet Actions<\/h4>\n<p>Each fleet may take ONE Fleet Action per turn. Different fleets can take different actions. A fleet that takes a Fleet Action cannot take another Fleet Action this turn.<\/p>\n<h5>Fleet Movement<\/h5>\n<p>Move this fleet to any system within the Subsector.<\/p>\n<h5>Fleet Transfer<\/h5>\n<p>Transfer strength points between this fleet and another fleet in the same system. No fleet can drop below 1/5 or exceed 5/5. Requires Void Superiority.<\/p>\n<h5>Fleet Merge<\/h5>\n<p>Merge this fleet with another fleet in the same system. Combined strength caps at 5/5 (excess is lost). The absorbed fleet ceases to exist.<\/p>\n<h5>Scuttle Fleet<\/h5>\n<p>Decommission this fleet and recover half its Fleet Strength as Supply (rounded down). Requires Void Superiority.<\/p>\n<h5>Attack<\/h5>\n<p>Assault an enemy or neutral planet. Costs Supply based on world type (Minor -1, Standard -2, Major -3, Capital -4). Commit Manpower equal to base damage dealt. Damage dealt = 1 per 5 friendly Fleet Strength in system (minimum 1 if uncontested). <strong>Uncontested Bombardment:<\/strong> When no hostile fleets are present in-system, the attack automatically succeeds — no battle is fought. The attacker pays double Supply costs (Minor -2, Standard -4, Major -6, Capital -8) and commits no Manpower. Damage is applied directly. A planet cannot be reduced below 1 defence by Uncontested Bombardment — the final point of defence must be broken by a Ground Assault. <strong>Ground Assault:<\/strong> A full planetary assault engaging the planet&#x27;s garrison directly. This can be launched whether or not hostile fleets are present in-system — you do not need to clear enemy fleets first. If hostile fleets ARE present, they contribute to the defender&#x27;s strength in the battle. Difficulty and AI rolls are calculated after costs are paid and Manpower is committed.<\/p>\n<p><strong>Attack Participation:<\/strong> All friendly fleets in-system that wish to contribute their strength to an Attack must use their Fleet Action for that battle. Fleets that do not participate keep their Fleet Action for other purposes but do not add their strength to the damage calculation. Multiple fleets combining for a single Attack pool their Fleet Strength for calculating damage dealt.<\/p>\n<p><strong>Multi-Front Warfare:<\/strong> A faction with multiple fleets can launch multiple Attacks in the same turn — each fleet can attack independently. This represents the strategic advantage of maintaining multiple operational formations.<\/p>\n<h5>Fleet Battle<\/h5>\n<p>Initiating faction (aggressor) pays -1 Fleet Strength to initiate. Both Factions roll a d20 plus their in-system Fleet Strength (calculated after the -1 initiation cost is paid). Highest roll wins. 1-5 higher = Loser -1 Fleet Strength per Fleet in Battle. 6-10 higher = Loser -2 Fleet Strength per Fleet in Battle. 11-15 higher = Loser -3 Fleet Strength per Fleet in Battle. 16-20+ higher = Loser Fleet(s) destroyed. Multiple fleets in a system combine their strength for the roll. <strong>All calculations use values after initiation costs are paid.<\/strong><\/p>\n<p><strong>Fleet Battle Participation:<\/strong> All friendly fleets in-system that wish to contribute their strength to a Fleet Battle must use their Fleet Action for that battle. Fleets that do not participate keep their Fleet Action for other purposes but do not add their strength to the roll. Only one Fleet Battle may occur per system per turn, regardless of how many fleets participate.<\/p>\n<h5>Structure Assault<\/h5>\n<p>Target a construction. Initiating faction pays -1 Fleet Strength. <strong>In-Progress Constructions:<\/strong> Any successful assault destroys the construction immediately. <strong>Completed Constructions:<\/strong> Minor constructions have 3/3 defence, Major constructions have 5/5 defence. Roll as per Fleet Battle — if attacker wins, deal 1 damage to structure per margin bracket (1-5 = 1 damage, 6-10 = 2 damage, 11-15 = 3 damage, 16+ = structure destroyed). If defender wins, normal Fleet Battle damage applied to attacker only. Structures destroyed via Structure Assault cannot be captured, only destroyed.<\/p>\n<h5>Expand Fleet<\/h5>\n<p>+2 Fleet Strength to this Fleet (max 5). Costs -1 Supply. This fleet must be at a location with an Orbital Shipyard or established Capital to take this action.<\/p>\n<h5>Void Superiority<\/h5>\n<p><strong>Void Superiority:<\/strong> Your total fleet strength in-system exceeds total enemy fleet strength.<\/p>\n<h4>Phase 3: Faction Action<\/h4>\n<p>A faction may take ONE Faction Action per turn. This represents the faction&#x27;s central command capacity.<\/p>\n<h5>Defend<\/h5>\n<p>Fortify a Planet or repair a Construction you control. <strong>Planet:<\/strong> Costs Supply and Manpower based on world type (Minor -1/-1, Standard -2/-2, Major -3/-3, Capital -4/-4). Restore defence based on planet type: Minor +1, Standard +2, Major +3, Capital +4 (up to planet&#x27;s maximum). The defended planet gains Defended status until your next turn: attackers face +1 difficulty, you face -1 difficulty when defending. AI vs AI: Defender roll +15. <strong>Construction:<\/strong> Minor constructions cost -1/-1 and restore +1 defence. Major constructions cost -3/-3 and restore +3 defence (up to maximum).<\/p>\n<h5>Reinforce<\/h5>\n<p>+3 Supply (max 100).<\/p>\n<h5>Muster<\/h5>\n<p>+3 Manpower (max 100).<\/p>\n<h5>Create Fleet<\/h5>\n<p>Create a new fleet at Fleet Strength 1/5. New fleets are created at the faction&#x27;s Capital location or at any Shipyard. Costs -1 Supply and -1 Manpower.<\/p>\n<h5>Garrison Transfer<\/h5>\n<p>Transfer defense points between planets in the same system. Donor planets must be at full defense. Recipients cannot exceed maximum defense. When you take this action, you may perform multiple transfers from different donors.<\/p>\n<h5>Summon Allies<\/h5>\n<p>Call a new allied Major Faction into the subsector by granting them an entire system. <strong>Costs -10 Supply and -10 Manpower.<\/strong> The new faction starts with 10 Supply and 10 Manpower but no fleet — they rely on their summoner for protection. <strong>Requirements:<\/strong> (1) You must control planets in more than one system. (2) You must control ALL planets in the system being granted. (3) You must have Void Superiority in that system. (4) The new faction must share your alignment and make sense within established 40K lore. <strong>Effect:<\/strong> Immediately cede all planets in that system to the new faction. The new faction is aligned with you — they will not attack your holdings and will coordinate against mutual enemies. Design the new faction (name, background, trait) when summoned. The new faction activates immediately after your turn in the turn order.<\/p>\n<p><strong>Important:<\/strong> You cannot grant away your only fully controlled system. You must fully control at least two systems to use Summon Allies — one to keep and one to grant.<\/p>\n<p><strong>Summon Allies — Alignment Restrictions:<\/strong><\/p>\n<p>The summoned faction must belong to the same broad alignment as the summoning faction. This represents calling in reinforcements, granting territory to allies, or allowing subordinate powers to establish their own domains. The new faction must have a plausible lore reason for arriving in the subsector.<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Alignment<\/th><th>Eligible Faction Types<\/th><th>Examples<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Alignment\">Imperium<\/td><td data-label=\"Eligible Faction Types\">Astra Militarum, Adeptus Mechanicus, Other Space Marine Chapters, Adepta Sororitas, Rogue Traders, Imperial Navy, Inquisitorial Forces<\/td><td data-label=\"Examples\">A cut-off Guard regiment, an Explorator fleet, a Magos establishing a Forge World, a brother Chapter answering a distress call<\/td><\/tr><tr><td data-label=\"Alignment\">Chaos<\/td><td data-label=\"Eligible Faction Types\">Other Chaos Warbands, Daemon Cults, Dark Mechanicum, Traitor Guard, Other Traitor Legions<\/td><td data-label=\"Examples\">A warband sworn to a different god, a cult that rises in the new territory, a splinter fleet of the same Legion<\/td><\/tr><tr><td data-label=\"Alignment\">Drukhari<\/td><td data-label=\"Eligible Faction Types\">Other Kabals, Wych Cults, Haemonculus Covens<\/td><td data-label=\"Examples\">A rival Archon granted hunting grounds, a Coven providing support in exchange for specimens, a Wych Cult seeking new arenas<\/td><\/tr><tr><td data-label=\"Alignment\">Craftworld Aeldari<\/td><td data-label=\"Eligible Faction Types\">Other Craftworlds, Corsairs, Harlequins, Ynnari<\/td><td data-label=\"Examples\">A Corsair fleet, rangers from another Craftworld, a Harlequin masque<\/td><\/tr><tr><td data-label=\"Alignment\">Orks<\/td><td data-label=\"Eligible Faction Types\">Other Warbosses, Freebooterz<\/td><td data-label=\"Examples\">Another Waaagh! drawn by the fighting, Freebooterz smelling loot<\/td><\/tr><tr><td data-label=\"Alignment\">Necrons<\/td><td data-label=\"Eligible Faction Types\">Other Dynasties, Destroyer Cults<\/td><td data-label=\"Examples\">An awakening Tomb World, a vassal Dynasty, a Destroyer Lord claiming territory<\/td><\/tr><tr><td data-label=\"Alignment\">Tyranids<\/td><td data-label=\"Eligible Faction Types\">Other Hive Fleets, Genestealer Cults<\/td><td data-label=\"Examples\">A splinter fleet, a cult uprising on the granted world<\/td><\/tr><tr><td data-label=\"Alignment\">T&#x27;au<\/td><td data-label=\"Eligible Faction Types\">Other Septs, Auxiliaries<\/td><td data-label=\"Examples\">An expansion fleet, Kroot kindreds, Vespid contingents<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Multiple Factions:<\/strong> You may have multiple factions of the same type in play (e.g., two Space Marine Chapters, three Drukhari Archons). Each operates independently but remains aligned with their summoner.<\/p>\n<h4>Phase 4: Social Action<\/h4>\n<p>A faction may take ONE Social Action per turn. This represents diplomatic bandwidth.<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Action<\/th><th>Effect<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Action\"><strong>Communiqué<\/strong><\/td><td data-label=\"Effect\">Send one message to another Faction. They may respond immediately but only once. Requires both Factions to have a presence in the same system (fleet or planet — any combination). Extended conversations require multiple cycles.<\/td><\/tr><\/tbody><\/table><\/div>\n<h5>Diplomacy with Non-Aligned Factions<\/h5>\n<p><strong>Diplomacy with Non-Aligned Factions:<\/strong> Temporary cease-fires or non-aggression pacts with factions outside your alignment are possible through the Communiqué action, but these are inherently unstable. Conflicting alignments will inevitably come to blows — such arrangements should be treated as temporary strategic convenience, not true alliance.<\/p>\n<h4>Phase 5: Construction Action<\/h4>\n<p>A faction may take ONE Construction Action per turn. This represents the faction&#x27;s engineering and industrial capacity.<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Action<\/th><th>Effect<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Action\"><strong>Build<\/strong><\/td><td data-label=\"Effect\">Advance one in-progress construction by 1 action, OR begin a new construction. Costs -5 Supply. Only on planets with full defences. Construction time: 3 actions for Minor, 5 actions for Major. If the construction takes damage during the building process it is destroyed and must be restarted. For Planetary/Orbital constructions, damage to the planet destroys the construction. For fleet-attached Void constructions, damage to the fleet destroys the construction. Void Stations function as fleet constructions until completed, then follow Planetary/Orbital rules. Minor constructions can be captured and used by new controllers. Major constructions are destroyed when the planet changes hands (too specialized for enemy use). Shipyards allow fleet creation at that location.<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Construction Limits:<\/strong> A faction may have multiple constructions in progress simultaneously, but can only advance ONE per turn. Constructions on different planets progress independently.<\/p>\n<h4>Construction Examples<\/h4>\n<p>When building constructions, rename them to describe what the structure actually is within your faction&#x27;s aesthetic and technology.<\/p>\n<h4>Construction Upgrade System<\/h4>\n<p><strong>Core Rules:<\/strong><\/p>\n<p class=\"list-line\">- One of each unique construction per planet/fleet/system (no stacking duplicates)<\/p>\n<p class=\"list-line\">- <strong>Exception:<\/strong> Constructions marked as <strong>Repeatable<\/strong> can be built multiple times on the same planet<\/p>\n<p class=\"list-line\">- Existing constructions can be upgraded by spending additional actions<\/p>\n<p class=\"list-line\">- Upgrades cost the same number of actions as the base construction<\/p>\n<p class=\"list-line\">- Most upgrades are straight 2x the base effect<\/p>\n<p class=\"list-line\">- Some constructions have no upgrade (already complete at base)<\/p>\n<h5>Planetary/Orbital Constructions<\/h5>\n<p><strong>Planetary/Orbital Constructions<\/strong> — Built on a specific planet. Affects that planet or system.<\/p>\n<p><em>Minor (3 actions base, 3 actions upgrade, capturable)<\/em><\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Placeholder<\/th><th>Base Effect<\/th><th>Upgraded Effect<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Placeholder\">[Orbital Shipyard]<\/td><td data-label=\"Base Effect\">Allows fleet creation at this location. Fleets created at 1/5.<\/td><td data-label=\"Upgraded Effect\">No upgrade (prerequisite for Grand Orbital Shipyard)<\/td><\/tr><tr><td data-label=\"Placeholder\">[Supply Depot]<\/td><td data-label=\"Base Effect\">+2 Supply per Logistics Cycle<\/td><td data-label=\"Upgraded Effect\">+4 Supply per Logistics Cycle<\/td><\/tr><tr><td data-label=\"Placeholder\">[Training Grounds]<\/td><td data-label=\"Base Effect\">+2 Manpower per Logistics Cycle<\/td><td data-label=\"Upgraded Effect\">+4 Manpower per Logistics Cycle<\/td><\/tr><tr><td data-label=\"Placeholder\">[Automated Defences]<\/td><td data-label=\"Base Effect\">+1 defence regen/cycle if not attacked<\/td><td data-label=\"Upgraded Effect\">+2 defence regen/cycle if not attacked<\/td><\/tr><tr><td data-label=\"Placeholder\">[Bunker Network]<\/td><td data-label=\"Base Effect\">+5 defender roll (AI) / -1 Difficulty (Player)<\/td><td data-label=\"Upgraded Effect\">+10 defender roll (AI) / -2 Difficulty (Player)<\/td><\/tr><tr><td data-label=\"Placeholder\">[Orbital Cannons]<\/td><td data-label=\"Base Effect\">-1 Fleet Strength to largest hostile fleet when attacked<\/td><td data-label=\"Upgraded Effect\">-2 Fleet Strength to largest hostile fleet when attacked<\/td><\/tr><\/tbody><\/table><\/div>\n<p><em>Major (5 actions base, 5 actions upgrade, destroyed on capture)<\/em><\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Placeholder<\/th><th>Base Effect<\/th><th>Upgraded Effect<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Placeholder\">[Grand Orbital Shipyard]<\/td><td data-label=\"Base Effect\">Fleets created at 3/5. <strong>Requires Orbital Shipyard.<\/strong><\/td><td data-label=\"Upgraded Effect\">Grand Orbital Shipyard Complex — Fleets created at 5/5<\/td><\/tr><tr><td data-label=\"Placeholder\">[Forge Complex]<\/td><td data-label=\"Base Effect\">+5 Supply per Logistics Cycle<\/td><td data-label=\"Upgraded Effect\">+10 Supply per Logistics Cycle<\/td><\/tr><tr><td data-label=\"Placeholder\">[Military Academy]<\/td><td data-label=\"Base Effect\">+5 Manpower per Logistics Cycle<\/td><td data-label=\"Upgraded Effect\">+10 Manpower per Logistics Cycle<\/td><\/tr><tr><td data-label=\"Placeholder\">[Regenerative Fortifications]<\/td><td data-label=\"Base Effect\">+2 defence regen/cycle if not attacked<\/td><td data-label=\"Upgraded Effect\">+4 defence regen/cycle if not attacked<\/td><\/tr><tr><td data-label=\"Placeholder\">[Void Shield Generator]<\/td><td data-label=\"Base Effect\">-1 incoming attack damage (can reduce to 0)<\/td><td data-label=\"Upgraded Effect\">-2 incoming attack damage (can reduce to 0)<\/td><\/tr><tr><td data-label=\"Placeholder\">[Fortification Network]<\/td><td data-label=\"Base Effect\">+2 to planet&#x27;s maximum defence<\/td><td data-label=\"Upgraded Effect\">+4 to planet&#x27;s maximum defence<\/td><\/tr><tr><td data-label=\"Placeholder\">[Militia Barracks]<\/td><td data-label=\"Base Effect\">Defender commits 0 Manpower when defending this planet<\/td><td data-label=\"Upgraded Effect\">No upgrade<\/td><\/tr><tr><td data-label=\"Placeholder\">[Landing Zones]<\/td><td data-label=\"Base Effect\">Garrison Transfers to this planet ignore full defence requirement<\/td><td data-label=\"Upgraded Effect\">No upgrade<\/td><\/tr><tr><td data-label=\"Placeholder\">[Planetary Shield Network]<\/td><td data-label=\"Base Effect\">Invulnerable with Void Superiority / Defended status without<\/td><td data-label=\"Upgraded Effect\">No upgrade<\/td><\/tr><tr><td data-label=\"Placeholder\">[Consolidation Works]<\/td><td data-label=\"Base Effect\">Upgrade planet type by one tier: Minor (2/2) → Standard (4/4) → Major (8/8). Current and maximum defence double. <strong>Repeatable<\/strong> until Major. Cannot upgrade to Capital — only one Capital per faction.<\/td><td data-label=\"Upgraded Effect\">N/A (repeatable construction, not upgradeable)<\/td><\/tr><\/tbody><\/table><\/div>\n<h5>Void Constructions (Fleet-Attached)<\/h5>\n<p><strong>Void Constructions (Fleet-Attached)<\/strong> — Mobile, destroyed if fleet is destroyed.<\/p>\n<p><em>Minor (3 actions base, 3 actions upgrade)<\/em><\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Placeholder<\/th><th>Base Effect<\/th><th>Upgraded Effect<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Placeholder\">[Troop Transport]<\/td><td data-label=\"Base Effect\">70% Manpower return (+10%)<\/td><td data-label=\"Upgraded Effect\">80% Manpower return (+20%)<\/td><\/tr><tr><td data-label=\"Placeholder\">[Repair Tender]<\/td><td data-label=\"Base Effect\">+1 fleet regen/cycle if no combat<\/td><td data-label=\"Upgraded Effect\">+2 fleet regen/cycle if no combat<\/td><\/tr><tr><td data-label=\"Placeholder\">[Escort Squadron]<\/td><td data-label=\"Base Effect\">+3 to Fleet Battle roll<\/td><td data-label=\"Upgraded Effect\">+6 to Fleet Battle roll<\/td><\/tr><tr><td data-label=\"Placeholder\">[Assault Boats]<\/td><td data-label=\"Base Effect\">+2 fleet strength for ground assaults<\/td><td data-label=\"Upgraded Effect\">+4 fleet strength for ground assaults<\/td><\/tr><tr><td data-label=\"Placeholder\">[Bombardment Bay]<\/td><td data-label=\"Base Effect\">+1 ground assault damage<\/td><td data-label=\"Upgraded Effect\">+2 ground assault damage<\/td><\/tr><tr><td data-label=\"Placeholder\">[Assault Cruiser]<\/td><td data-label=\"Base Effect\">+2/2 fleet strength (tracked separately)<\/td><td data-label=\"Upgraded Effect\">+4/4 fleet strength (tracked separately)<\/td><\/tr><\/tbody><\/table><\/div>\n<p><em>Major (5 actions base, 5 actions upgrade)<\/em><\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Placeholder<\/th><th>Base Effect<\/th><th>Upgraded Effect<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Placeholder\">[Flagship]<\/td><td data-label=\"Base Effect\">+5/5 fleet strength, max becomes 10/10<\/td><td data-label=\"Upgraded Effect\">+10/10 fleet strength, max becomes 15/15<\/td><\/tr><tr><td data-label=\"Placeholder\">[Carrier]<\/td><td data-label=\"Base Effect\">+5 fleet strength for ground assaults<\/td><td data-label=\"Upgraded Effect\">+10 fleet strength for ground assaults<\/td><\/tr><tr><td data-label=\"Placeholder\">[Siege Platform]<\/td><td data-label=\"Base Effect\">+2 ground assault damage<\/td><td data-label=\"Upgraded Effect\">+4 ground assault damage<\/td><\/tr><tr><td data-label=\"Placeholder\">[Salvage Wing]<\/td><td data-label=\"Base Effect\">+3 Supply on Fleet Battle win<\/td><td data-label=\"Upgraded Effect\">+6 Supply on Fleet Battle win<\/td><\/tr><tr><td data-label=\"Placeholder\">[Scout Squadron]<\/td><td data-label=\"Base Effect\">This fleet may Move and Attack with the same Fleet Action. The attack occurs after movement is resolved.<\/td><td data-label=\"Upgraded Effect\">No upgrade<\/td><\/tr><\/tbody><\/table><\/div>\n<h5>Void Constructions (System-Based)<\/h5>\n<p><strong>Void Constructions (System-Based)<\/strong> — Stationary. Follow same capture/destroy rules as Planetary constructions.<\/p>\n<p><em>Minor (3 actions base, 3 actions upgrade)<\/em><\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Placeholder<\/th><th>Base Effect<\/th><th>Upgraded Effect<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Placeholder\">[Defence Platform]<\/td><td data-label=\"Base Effect\">+5 to defender roll in Fleet Battles<\/td><td data-label=\"Upgraded Effect\">+10 to defender roll in Fleet Battles<\/td><\/tr><\/tbody><\/table><\/div>\n<p><em>Major (5 actions base, 5 actions upgrade)<\/em><\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Placeholder<\/th><th>Base Effect<\/th><th>Upgraded Effect<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Placeholder\">[System Defence Station]<\/td><td data-label=\"Base Effect\">-1 enemy fleet strength/cycle<\/td><td data-label=\"Upgraded Effect\">-2 enemy fleet strength/cycle<\/td><\/tr><tr><td data-label=\"Placeholder\">[System Repair Station]<\/td><td data-label=\"Base Effect\">+1 allied fleet strength/cycle (to max)<\/td><td data-label=\"Upgraded Effect\">+2 allied fleet strength/cycle (to max)<\/td><\/tr><tr><td data-label=\"Placeholder\">[Logistics Anchorage]<\/td><td data-label=\"Base Effect\">+1 defence regen to unattacked planets/cycle<\/td><td data-label=\"Upgraded Effect\">+2 defence regen to unattacked planets/cycle<\/td><\/tr><tr><td data-label=\"Placeholder\">[Void Station]<\/td><td data-label=\"Base Effect\">2/2 station, functions as Minor planet<\/td><td data-label=\"Upgraded Effect\">Upgrade via Consolidation Works: Minor (2/2) → Standard (4/4) → Major (8/8). Cannot become Capital.<\/td><\/tr><\/tbody><\/table><\/div>\n<h5>System Construction Capture Rules<\/h5>\n<p><strong>System Construction Capture Rules:<\/strong><\/p>\n<p>To capture system-based constructions (Defence Platforms, System Defence Stations, etc.), you must:<\/p>\n<p class=\"list-line\">1. Control ALL planets in the system<\/p>\n<p class=\"list-line\">2. Have Void Superiority in the system<\/p>\n<p>Once both conditions are met:<\/p>\n<p class=\"list-line\">- <strong>Minor constructions<\/strong> transfer to the new controller<\/p>\n<p class=\"list-line\">- <strong>Major constructions<\/strong> are destroyed (too specialized for enemy use)<\/p>\n<p class=\"list-line\">- <strong>Exception: Void Stations<\/strong> — the only Major construction that transfers on capture (functions as a planet once complete). Constructions built ON the Void Station follow normal rules (Minors capturable, Majors destroyed).<\/p>\n<h5>Void Station Assault<\/h5>\n<p><strong>Void Station Assault:<\/strong> Void Stations are captured by reducing their defence to 0 through Attack actions (assault them like a planet), not through the system construction capture rules. When a Void Station falls, it transfers to the attacker and resets to 1 defence like any other planet.<\/p>\n<h5>Pre-Existing Stations<\/h5>\n<p><strong>Pre-Existing Stations:<\/strong> Some holdings in the subsector are void installations rather than planetary bodies. These are marked in the Type column as &quot;(Station)&quot; and are treated as Void Stations of the listed tier in every respect — defence value, Attack and Defend cost scaling, Logistics income, Independent resource values, and the Independent Minor Faction fleet calculation. They are assaulted, captured, and reset to 1 defence exactly as planets are, and constructions may be built on them under normal rules. A Station cannot serve as a Capital.<\/p>\n<h4>Phase 6: Resolve Battle<\/h4>\n<p>If any faction chose Attack, fight the battle in Soulstorm. See Section 3 for battle setup. Or conduct AI to AI battle. Fleet Battles are handled by dice rolls outlined in Phase 2.<\/p>\n<p><strong>Turn Order:<\/strong> Factions act in order: 41st Expeditionary Korps → Vior&#x27;la Expedition → Splinter Fleet Cerberus. Each faction completes all their actions (Fleet, Faction, Social, Construction) before the next faction&#x27;s turn begins.<\/p>\n<p><strong>AI vs AI Rules:<\/strong> On a defended planet, the defender&#x27;s total roll gains +15.<\/p>\n<p>If all factions skip combat actions: No battle this cycle. All sides gain their chosen benefits.<\/p>\n<h5>Planet Fall Penalties<\/h5>\n<p><strong>Planet Fall Penalties:<\/strong> When a planet falls (defence reaches 0), the planet changes hands and resets to 1 defence. The losing faction suffers:<\/p>\n<p class=\"list-line\">- <strong>Supply:<\/strong> -2 (or -4 if Capital) — replaces normal defeat Supply loss<\/p>\n<p class=\"list-line\">- <strong>Manpower:<\/strong> -2 (or -4 if Capital) — additional penalty on top of committed Manpower<\/p>\n<p class=\"list-line\">- <strong>Fleet Damage:<\/strong> Equal to damage dealt in the final assault, distributed as follows:<\/p>\n<p class=\"list-line\">- Apply damage one point at a time to the strongest fleet present<\/p>\n<p class=\"list-line\">- Ties: Attacker chooses which fleet takes the point<\/p>\n<p class=\"list-line\">- No fleet drops below 1/5 until ALL fleets are at 1/5<\/p>\n<p class=\"list-line\">- Once all fleets are at 1/5, each additional point of damage destroys one fleet (attacker chooses which). Destroying a fleet consumes 1 damage.<\/p>\n<p><em>Example: Defender has three fleets (2/5, 5/5, 5/5) and the final assault dealt 8 damage. Damage applies to strongest first: 5/5 → 4/5 → 3/5 → 2/5 → 1/5, then second 5/5 → 4/5 → 3/5 → 2/5, then 2/5 → 1/5. Final state: 1/5, 2/5, 1/5.<\/em><\/p>\n<h5>Fleet Destruction<\/h5>\n<p><strong>Fleet Destroyed:<\/strong> When a fleet is destroyed (reduced to 0 or below), the owning faction loses -1 Manpower in addition to losing the fleet. This applies whether destroyed through Fleet Battle, Planet Fall penalties, or any other means.<\/p>\n<h4>Phase 7: End of Cycle<\/h4>\n<p class=\"list-line\">- Record battle result<\/p>\n<p class=\"list-line\">- Update Planet progress. Successful attack lowers defence based on attacker&#x27;s fleet strength (1 per 5 strength, minimum 1 if uncontested).<\/p>\n<p class=\"list-line\">- Check if any Planets changed hands<\/p>\n<p class=\"list-line\">- Advance Cycle Counter<\/p>\n<hr>\n<h3>SECTION 3: BATTLE SETUP<\/h3>\n<h4>Difficulty (Based on YOUR Supply)<\/h4>\n<p>Supply represents logistics capacity: materiel, munitions, fuel, food, replacement parts, and everything needed to sustain military operations. <strong>Supply determines difficulty only — how well-equipped your forces are.<\/strong><\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Supply<\/th><th>Base Difficulty<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Supply\">1-20 Critical<\/td><td data-label=\"Base Difficulty\">Insane 5/5<\/td><\/tr><tr><td data-label=\"Supply\">21-40 Rationed<\/td><td data-label=\"Base Difficulty\">Harder 4/5<\/td><\/tr><tr><td data-label=\"Supply\">41-60 Sustainable<\/td><td data-label=\"Base Difficulty\">Hard 3/5<\/td><\/tr><tr><td data-label=\"Supply\">61-80 Surplus<\/td><td data-label=\"Base Difficulty\">Standard 2/5<\/td><\/tr><tr><td data-label=\"Supply\">81-100 Abundant<\/td><td data-label=\"Base Difficulty\">Easy 1/5<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>Difficulty (Based on ENEMY Supply)<\/h4>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Enemy Supply<\/th><th>Modifier<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Enemy Supply\">1-20 Critical<\/td><td data-label=\"Modifier\">-2 Difficulty<\/td><\/tr><tr><td data-label=\"Enemy Supply\">21-40 Rationed<\/td><td data-label=\"Modifier\">-1 Difficulty<\/td><\/tr><tr><td data-label=\"Enemy Supply\">41-60 Sustainable<\/td><td data-label=\"Modifier\">—<\/td><\/tr><tr><td data-label=\"Enemy Supply\">61-80 Surplus<\/td><td data-label=\"Modifier\">+1 Difficulty<\/td><\/tr><tr><td data-label=\"Enemy Supply\">81-100 Abundant<\/td><td data-label=\"Modifier\">+2 Difficulty<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>Allied Factions (Based on YOUR Manpower)<\/h4>\n<p>Manpower represents trained combat personnel, casualty replacement capacity, and strategic depth — your ability to field multiple formations. <strong>Manpower determines faction count only — how many formations you can deploy.<\/strong><\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Manpower<\/th><th>Effect<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Manpower\">1-20 Critical<\/td><td data-label=\"Effect\">-2 Allied Factions (minimum 1)<\/td><\/tr><tr><td data-label=\"Manpower\">21-40 Rationed<\/td><td data-label=\"Effect\">-1 Allied Faction (minimum 1)<\/td><\/tr><tr><td data-label=\"Manpower\">41-60 Sustainable<\/td><td data-label=\"Effect\">No modifier<\/td><\/tr><tr><td data-label=\"Manpower\">61-80 Surplus<\/td><td data-label=\"Effect\">+1 Allied Faction<\/td><\/tr><tr><td data-label=\"Manpower\">81-100 Abundant<\/td><td data-label=\"Effect\">+2 Allied Factions<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>Enemy Factions (Based on ENEMY Manpower)<\/h4>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Enemy Manpower<\/th><th>Effect<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Enemy Manpower\">1-20 Critical<\/td><td data-label=\"Effect\">-2 Enemy Factions (minimum 1)<\/td><\/tr><tr><td data-label=\"Enemy Manpower\">21-40 Rationed<\/td><td data-label=\"Effect\">-1 Enemy Faction (minimum 1)<\/td><\/tr><tr><td data-label=\"Enemy Manpower\">41-60 Sustainable<\/td><td data-label=\"Effect\">No modifier<\/td><\/tr><tr><td data-label=\"Enemy Manpower\">61-80 Surplus<\/td><td data-label=\"Effect\">+1 Enemy Faction<\/td><\/tr><tr><td data-label=\"Enemy Manpower\">81-100 Abundant<\/td><td data-label=\"Effect\">+2 Enemy Factions<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>Quick Reference: Modifier Stacking<\/h4>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Source<\/th><th>Effect<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Source\">Your Supply<\/td><td data-label=\"Effect\">Sets base Difficulty (1/5 to 5/5)<\/td><\/tr><tr><td data-label=\"Source\">Enemy Supply<\/td><td data-label=\"Effect\">-2 to +2 Difficulty<\/td><\/tr><tr><td data-label=\"Source\">Your Manpower<\/td><td data-label=\"Effect\">-2 to +2 Allied Factions (minimum 1)<\/td><\/tr><tr><td data-label=\"Source\">Enemy Manpower<\/td><td data-label=\"Effect\">-2 to +2 Enemy Factions (minimum 1)<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Difficulty caps at 1/5 minimum and 5/5 maximum. Faction count minimum is 1 (cannot remove only player or only opponent).<\/p>\n<h4>Faction Count Limits<\/h4>\n<p>The maximum factions per side is 4 (map maximum 8 total). If bonuses would create more factions than the map allows, scale both sides down proportionally while maintaining the difference.<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Calculated<\/th><th>Scaled<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Calculated\">5v4<\/td><td data-label=\"Scaled\">4v3<\/td><\/tr><tr><td data-label=\"Calculated\">5v5<\/td><td data-label=\"Scaled\">4v4<\/td><\/tr><tr><td data-label=\"Calculated\">6v4<\/td><td data-label=\"Scaled\">4v2<\/td><\/tr><tr><td data-label=\"Calculated\">6v5<\/td><td data-label=\"Scaled\">4v3<\/td><\/tr><tr><td data-label=\"Calculated\">6v6<\/td><td data-label=\"Scaled\">4v4<\/td><\/tr><tr><td data-label=\"Calculated\">7v5<\/td><td data-label=\"Scaled\">4v2<\/td><\/tr><tr><td data-label=\"Calculated\">7v6<\/td><td data-label=\"Scaled\">4v3<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Continue pattern: reduce both sides equally until largest side is 4, maintaining the original difference.<\/p>\n<h4>Fleet Strength in System (Friendly Fleets)<\/h4>\n<p>Calculate total Fleet Strength of all your fleets and allied fleets (same Alignment) in-system.<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Fleet Strength<\/th><th>Modifier<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Fleet Strength\">1-4<\/td><td data-label=\"Modifier\">No bonus<\/td><\/tr><tr><td data-label=\"Fleet Strength\">5-9<\/td><td data-label=\"Modifier\">+1 Allied Faction<\/td><\/tr><tr><td data-label=\"Fleet Strength\">10-14<\/td><td data-label=\"Modifier\">+2 Allied Factions<\/td><\/tr><tr><td data-label=\"Fleet Strength\">15-19<\/td><td data-label=\"Modifier\">+3 Allied Factions<\/td><\/tr><tr><td data-label=\"Fleet Strength\">20-24<\/td><td data-label=\"Modifier\">+4 Allied Factions<\/td><\/tr><tr><td data-label=\"Fleet Strength\">25+<\/td><td data-label=\"Modifier\">+5 Allied Factions<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>Fleet Strength in System (Hostile Fleets)<\/h4>\n<p>Calculate total Fleet Strength of all hostile fleets (different Alignment) in-system.<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Fleet Strength<\/th><th>Modifier<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Fleet Strength\">1-4<\/td><td data-label=\"Modifier\">No bonus<\/td><\/tr><tr><td data-label=\"Fleet Strength\">5-9<\/td><td data-label=\"Modifier\">+1 Enemy Faction<\/td><\/tr><tr><td data-label=\"Fleet Strength\">10-14<\/td><td data-label=\"Modifier\">+2 Enemy Factions<\/td><\/tr><tr><td data-label=\"Fleet Strength\">15-19<\/td><td data-label=\"Modifier\">+3 Enemy Factions<\/td><\/tr><tr><td data-label=\"Fleet Strength\">20-24<\/td><td data-label=\"Modifier\">+4 Enemy Factions<\/td><\/tr><tr><td data-label=\"Fleet Strength\">25+<\/td><td data-label=\"Modifier\">+5 Enemy Factions<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Example:<\/strong> You have a 5/5 Fleet and a 2/5 Fleet (total 7) in-system. A hostile faction has two 3/5 Fleets (total 6). You gain +1 Allied Faction, and the enemy gains +1 Enemy Faction. The battle becomes a 2v2 engagement.<\/p>\n<h4>Planet Conquest<\/h4>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Planet Type<\/th><th>Planet Defences<\/th><th>Examples<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Planet Type\">Minor<\/td><td data-label=\"Planet Defences\">2<\/td><td data-label=\"Examples\">Agri-worlds, Mining colonies, Outposts<\/td><\/tr><tr><td data-label=\"Planet Type\">Standard<\/td><td data-label=\"Planet Defences\">4<\/td><td data-label=\"Examples\">Forge worlds, Civilised worlds<\/td><\/tr><tr><td data-label=\"Planet Type\">Major<\/td><td data-label=\"Planet Defences\">8<\/td><td data-label=\"Examples\">Hive worlds, Fortress worlds<\/td><\/tr><tr><td data-label=\"Planet Type\">Capital<\/td><td data-label=\"Planet Defences\">12<\/td><td data-label=\"Examples\">Sector capitals, Aeldari Craftworlds, Necron Tomb Worlds<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>Attack Cost Scaling<\/h4>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Planet Type<\/th><th>Supply Cost<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Planet Type\">Minor<\/td><td data-label=\"Supply Cost\">-1 Supply<\/td><\/tr><tr><td data-label=\"Planet Type\">Standard<\/td><td data-label=\"Supply Cost\">-2 Supply<\/td><\/tr><tr><td data-label=\"Planet Type\">Major<\/td><td data-label=\"Supply Cost\">-3 Supply<\/td><\/tr><tr><td data-label=\"Planet Type\">Capital<\/td><td data-label=\"Supply Cost\">-4 Supply<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>Defend Cost Scaling<\/h4>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Planet Type<\/th><th>Supply Cost<\/th><th>Manpower Cost<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Planet Type\">Minor<\/td><td data-label=\"Supply Cost\">-1 Supply<\/td><td data-label=\"Manpower Cost\">-1 Manpower<\/td><\/tr><tr><td data-label=\"Planet Type\">Standard<\/td><td data-label=\"Supply Cost\">-2 Supply<\/td><td data-label=\"Manpower Cost\">-2 Manpower<\/td><\/tr><tr><td data-label=\"Planet Type\">Major<\/td><td data-label=\"Supply Cost\">-3 Supply<\/td><td data-label=\"Manpower Cost\">-3 Manpower<\/td><\/tr><tr><td data-label=\"Planet Type\">Capital<\/td><td data-label=\"Supply Cost\">-4 Supply<\/td><td data-label=\"Manpower Cost\">-4 Manpower<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>Battle Outcome Effects<\/h4>\n<p><strong>Attacker Commitment:<\/strong><\/p>\n<p class=\"list-line\">- Supply: Paid upfront, scaled by world type (see Attack Cost Scaling). Lost regardless of outcome.<\/p>\n<p class=\"list-line\">- Manpower: Commit equal to base damage dealt (1 per 5 Fleet Strength, minimum 1). Lost on defeat, 60% returned on victory.<\/p>\n<p><strong>Defender Commitment:<\/strong><\/p>\n<p class=\"list-line\">- Supply: Commit equal to attacker&#x27;s Supply cost (scaled by world type: Minor 1, Standard 2, Major 3, Capital 4). Lost on defeat, 80% returned on victory.<\/p>\n<p class=\"list-line\">- Manpower: Commit equal to attacker&#x27;s damage dealt (including construction bonuses). Lost on defeat, 80% returned on victory.<\/p>\n<p><strong>Note on Damage Bonuses:<\/strong> Constructions like Bombardment Bay (+1) and Siege Platform (+2) increase total damage but do NOT increase attacker Manpower commitment. The attacker&#x27;s commitment is based purely on fleet strength — the bodies being thrown at the problem. Damage bonuses represent superior firepower, not more troops on the ground. The defender, however, must respond to the full incoming damage.<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Outcome<\/th><th>Effect<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Outcome\"><strong>Victory on Attack<\/strong><\/td><td data-label=\"Effect\">Planet Defence reduced by damage dealt. Attacker returns 60% Manpower. Defender loses 100% committed Supply and Manpower.<\/td><\/tr><tr><td data-label=\"Outcome\"><strong>Defeat on Attack<\/strong><\/td><td data-label=\"Effect\">Attacker loses 100% committed Manpower (Supply already spent). Defender returns 80% committed Supply and Manpower.<\/td><\/tr><tr><td data-label=\"Outcome\"><strong>Victory on Defence<\/strong><\/td><td data-label=\"Effect\">Defender returns 80% committed Supply and Manpower. Attacker loses 100% committed Manpower (Supply already spent).<\/td><\/tr><tr><td data-label=\"Outcome\"><strong>Defeat on Defence<\/strong><\/td><td data-label=\"Effect\">Planet Defence reduced by damage dealt. Defender loses 100% committed Supply and Manpower. Attacker returns 60% Manpower.<\/td><\/tr><tr><td data-label=\"Outcome\"><strong>Planet Falls<\/strong><\/td><td data-label=\"Effect\">See Planet Fall Penalties in Section 2.<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Note:<\/strong> In uncontested systems (no hostile fleets present), attacks resolve via Uncontested Bombardment — see Attack action in Phase 2.<\/p>\n<h4>Losing a Capital<\/h4>\n<p>When a faction loses their Capital, they must designate a new Capital on an owned planet. The faction is then locked into the <strong>Establish New Capital<\/strong> forced action until the new Capital reaches maximum defense of 12. This forced action has no Supply or Manpower cost.<\/p>\n<p><strong>Establish New Capital:<\/strong> Each use doubles both current and maximum defense of the Provisional Capital until maximum reaches 12.<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Starting World<\/th><th>Cycle 1<\/th><th>Cycle 2<\/th><th>Cycle 3<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Starting World\">Minor (2/2)<\/td><td data-label=\"Cycle 1\">4/4<\/td><td data-label=\"Cycle 2\">8/8<\/td><td data-label=\"Cycle 3\">12/12<\/td><\/tr><tr><td data-label=\"Starting World\">Standard (4/4)<\/td><td data-label=\"Cycle 1\">8/8<\/td><td data-label=\"Cycle 2\">12/12<\/td><td data-label=\"Cycle 3\">—<\/td><\/tr><tr><td data-label=\"Starting World\">Major (8/8)<\/td><td data-label=\"Cycle 1\">12/12<\/td><td data-label=\"Cycle 2\">—<\/td><td data-label=\"Cycle 3\">—<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Once maximum defense reaches 12, the Capital is fully established and immediately gains a built-in Orbital Shipyard. The faction is then unlocked and may take other actions, even if current defense is below 12. If attacked during rebuild, damage is applied after the defense doubling.<\/p>\n<p>If a faction has no remaining planets, they are eliminated from the campaign.<\/p>\n<h4>Independent Factions<\/h4>\n<p><strong>Terminology — Independent Minor Factions vs Independent-Aligned Major Factions:<\/strong><\/p>\n<p>&quot;Independent&quot; serves two distinct roles in this campaign. <strong>Independent Minor Factions<\/strong> are static NPC powers — they do not take turns, do not act strategically, and defend when attacked. They are obstacles and opportunities on the map. <strong>Independent-Aligned Major Factions<\/strong> are full player or AI factions that happen to carry the Independent alignment. They take turns, make strategic decisions, and operate with full agency. The alignment simply means they are not bound to Imperium, Chaos, Necron, or any other bloc — they fight for themselves. No Major Faction in the Dessica Campaign currently carries this alignment.<\/p>\n<p>These two uses of &quot;Independent&quot; should never be confused. The rules below apply only to Independent Minor Factions.<\/p>\n<hr>\n<h4>Independent Minor Factions<\/h4>\n<p>Independent Minor Factions are minor powers that control one or more planets within a system. They do not take turns or actions — they are static obstacles that defend when attacked.<\/p>\n<p><strong>Fleet Calculation:<\/strong><\/p>\n<p class=\"list-line\">- Total Fleet Strength = sum of total planetary defence across all controlled worlds<\/p>\n<p class=\"list-line\">- Fill 5/5 fleets first, remainder becomes additional fleet<\/p>\n<p class=\"list-line\">- Example: Major (8/8) + Minor (2/2) + Minor (2/2) = 12 → two 5/5 fleets and one 2/5 fleet<\/p>\n<p><strong>Fleet Rules:<\/strong><\/p>\n<p class=\"list-line\">- Fleets do not move (system defense only)<\/p>\n<p class=\"list-line\">- Fleets provide orbital support during ground assaults (counts as combat)<\/p>\n<p class=\"list-line\">- +1 Fleet Strength regeneration per cycle if not engaged in Fleet Battle or Ground Assault (allocate to any fleet, up to original starting max)<\/p>\n<p class=\"list-line\">- If a fleet is destroyed, it is gone forever — Independents cannot create new fleets<\/p>\n<p><strong>Resources (Per Planet):<\/strong><\/p>\n<p>When an Independent planet is attacked, only that planet&#x27;s individual resources are used for the defense roll — not the combined resources of all planets controlled by the faction.<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>World Type<\/th><th>Base Supply<\/th><th>Base Manpower<\/th><\/tr><\/thead><tbody><tr><td data-label=\"World Type\">Minor<\/td><td data-label=\"Base Supply\">40<\/td><td data-label=\"Base Manpower\">40<\/td><\/tr><tr><td data-label=\"World Type\">Standard<\/td><td data-label=\"Base Supply\">60<\/td><td data-label=\"Base Manpower\">60<\/td><\/tr><tr><td data-label=\"World Type\">Major<\/td><td data-label=\"Base Supply\">80<\/td><td data-label=\"Base Manpower\">80<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Current Supply/Manpower = Base × (Current Defense / Max Defense)<\/p>\n<p>Example: A Standard world at 2/4 defense has 60 × (2/4) = 30 Supply and 30 Manpower<\/p>\n<p>Fleet Strength in system still counts for all Independent fleets present, but ground resources are planet-specific.<\/p>\n<p><strong>Defense:<\/strong><\/p>\n<p class=\"list-line\">- Regenerates +1 per cycle if not attacked (up to max)<\/p>\n<p><strong>Scope:<\/strong><\/p>\n<p class=\"list-line\">- Independents are typically single-system, often single-planet<\/p>\n<p class=\"list-line\">- Multiple Independent factions can exist in the same system<\/p>\n<p class=\"list-line\">- Each Independent faction has its own fleet, resources, and defense values<\/p>\n<h4>Resource Deficits<\/h4>\n<p><strong>General Rules:<\/strong><\/p>\n<p class=\"list-line\">- Supply and Manpower cannot go below 0<\/p>\n<p class=\"list-line\">- Deficits cannot be triggered by voluntary actions but can occur from involuntary penalties (Logistics maintenance, battle losses, Planet Fall, fleet destruction, etc.)<\/p>\n<p><strong>Supply Deficit:<\/strong><\/p>\n<p>When a Supply Deficit occurs:<\/p>\n<p class=\"list-line\">- All fleets -1 Fleet Strength (fleets at 1/5 are destroyed)<\/p>\n<p class=\"list-line\">- The faction&#x27;s next turn is locked into <strong>Emergency Rationing<\/strong> (no other action may be taken)<\/p>\n<p class=\"list-line\">- Emergency Rationing returns Supply to 25<\/p>\n<p><strong>Manpower Deficit:<\/strong><\/p>\n<p>When a faction reaches 0 Manpower (from any source), Manpower Deficit occurs:<\/p>\n<p class=\"list-line\">- If currently being attacked, the defender must choose Forced Conscription OR Isolated Defense for this battle only (see below)<\/p>\n<p class=\"list-line\">- All fleets suffer -1 Fleet Strength (fleets cannot be destroyed by Manpower Deficit — minimum 1/5)<\/p>\n<p class=\"list-line\">- The faction&#x27;s next turn is locked into <strong>Emergency Muster<\/strong> (no other action may be taken)<\/p>\n<p class=\"list-line\">- Emergency Muster returns Manpower to 25<\/p>\n<p><em>Forced Conscription:<\/em> Strip Defense from fully defended planets elsewhere (1 Defense = 1 Manpower required). Battle proceeds normally with standard 60%/100% Manpower return rules.<\/p>\n<p><em>Isolated Defense:<\/em> The planet defends alone with local garrison. AI vs AI: Defender roll suffers -15 penalty. Player defending in Soulstorm: +2 Difficulty. If attacker wins: Normal damage dealt, defender loses 0 Manpower (none committed). If attacker loses: Attacker returns 60% Manpower (loses only 40% — isolated garrison cannot pursue).<\/p>\n<p><strong>Cascade Deficits:<\/strong> If multiple Deficits occur simultaneously (e.g., Supply Deficit destroys fleets, causing Manpower loss that triggers Manpower Deficit), resolve them in order: Supply Deficit first, then Manpower Deficit. The faction is locked into Emergency Rationing (the first deficit&#x27;s recovery action). The Manpower Deficit&#x27;s fleet damage still occurs, but the faction does not need to take Emergency Muster afterward — Emergency Rationing handles both.<\/p>\n<hr>\n<h3>SECTION 4: RANDOM EVENTS<\/h3>\n<p>At the start of each Cycle, before any faction takes its turn, roll 1d6. On a 1 or 6, roll 1d6 again on the table below. One roll per Cycle, not one per faction. The resulting event applies for the whole of that Cycle and expires immediately before Major Faction 1 begins the next.<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>d6<\/th><th>Event<\/th><th>Effect<\/th><\/tr><\/thead><tbody><tr><td data-label=\"d6\">1<\/td><td data-label=\"Event\"><strong>Warp Storm<\/strong><\/td><td data-label=\"Effect\">All Factions: All Fleets -1 Fleet Strength. Fleets cannot move for the remainder of this Cycle.<\/td><\/tr><tr><td data-label=\"d6\">2<\/td><td data-label=\"Event\"><strong>Ambush!<\/strong><\/td><td data-label=\"Effect\">Attackers this Cycle get +1 difficulty. Defenders get -1 difficulty. AI vs AI: Defender +10 to roll.<\/td><\/tr><tr><td data-label=\"d6\">3<\/td><td data-label=\"Event\"><strong>Supply Crisis<\/strong><\/td><td data-label=\"Effect\">All Factions: -5 Supply and -5 Manpower.<\/td><\/tr><tr><td data-label=\"d6\">4<\/td><td data-label=\"Event\"><strong>War Fervor<\/strong><\/td><td data-label=\"Effect\">All Factions: +5 Supply and +5 Manpower.<\/td><\/tr><tr><td data-label=\"d6\">5<\/td><td data-label=\"Event\"><strong>Third Party Raid<\/strong><\/td><td data-label=\"Effect\">If a ground battle occurs, add a random hostile faction (player determines faction type based on context). If Third Party wins on Minor/Standard: they claim the planet and establish as a new aligned faction. If Third Party wins on Major/Capital: planet defense halved (rounded down), Third Party disperses.<\/td><\/tr><tr><td data-label=\"d6\">6<\/td><td data-label=\"Event\"><strong>Intel Breakthrough<\/strong><\/td><td data-label=\"Effect\">You choose: -1 difficulty this battle OR +1 damage dealt on a successful attack. AI vs AI: Attacker +10 to roll.<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h3>SECTION 5: CAMPAIGN TRACKER<\/h3>\n<h4>Cycle Counter<\/h4>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><th>6<\/th><th>7<\/th><th>8<\/th><th>9<\/th><th>10<\/th><\/tr><\/thead><tbody><tr><td data-label=\"1\">Ω<\/td><td data-label=\"2\"><\/td><td data-label=\"3\"><\/td><td data-label=\"4\"><\/td><td data-label=\"5\"><\/td><td data-label=\"6\"><\/td><td data-label=\"7\"><\/td><td data-label=\"8\"><\/td><td data-label=\"9\"><\/td><td data-label=\"10\"><\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>11<\/th><th>12<\/th><th>13<\/th><th>14<\/th><th>15<\/th><th>16<\/th><th>17<\/th><th>18<\/th><th>19<\/th><th>20<\/th><\/tr><\/thead><tbody><\/tbody><\/table><\/div>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>21<\/th><th>22<\/th><th>23<\/th><th>24<\/th><th>25<\/th><th>26<\/th><th>27<\/th><th>28<\/th><th>29<\/th><th>30<\/th><\/tr><\/thead><tbody><\/tbody><\/table><\/div>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>31<\/th><th>32<\/th><th>33<\/th><th>34<\/th><th>35<\/th><th>36<\/th><th>37<\/th><th>38<\/th><th>39<\/th><th>40<\/th><\/tr><\/thead><tbody><\/tbody><\/table><\/div>\n<p><strong>Legend:<\/strong><\/p>\n<p class=\"list-line\">- <strong>Ω<\/strong> = Current Cycle<\/p>\n<p class=\"list-line\">- <strong>O<\/strong> = Past Logistics Cycle (every 3rd cycle)<\/p>\n<p class=\"list-line\">- <strong>X<\/strong> = Past Cycle<\/p>\n<p><strong>Current Cycle:<\/strong> 1<\/p>\n<h4>Cycle 1 opening event: Warp Storm<\/h4>\n<p class=\"list-line\">- Event check: <strong>1d6 = 1<\/strong> — event triggered.<\/p>\n<p class=\"list-line\">- Event table: <strong>1d6 = 1<\/strong> — <strong>Warp Storm<\/strong>.<\/p>\n<p class=\"list-line\">- Every ordinary fleet, including Independent fleets, immediately loses 1 Fleet Strength. All surviving ordinary fleets cannot move for the remainder of Cycle 1. The movement restriction expires before Major Faction 1 begins Cycle 2; lost strength does not automatically return when the event expires.<\/p>\n<p class=\"list-line\">- All in-system fleet entries, fleet trackers, and void-superiority totals below reflect this loss. Starting-fleet descriptions in Campaign Setup remain historical starting values.<\/p>\n<p class=\"list-line\">- Kelmar Ore Haulers are destroyed (1/5 → 0). The Star-Blessed incur the mandatory -1 Manpower fleet-destruction penalty. Its allocation is pending because Independent resources are defined per planet, but fleet destruction charges the owning faction without specifying a planet or allocation method. Do not omit or charge this penalty twice when adjudicated.<\/p>\n<p class=\"list-line\">- <strong>Agreed ruling — Mobile Capital:<\/strong> The user confirmed that the Star-Mother counts as a fleet for this Warp Storm event. It loses 1 defence (12/12 → 11/12) and cannot move for the remainder of Cycle 1. This event-specific ruling does not change its exemption from fleet maintenance.<\/p>\n<p class=\"list-line\">- No major-faction Supply or Manpower changes. No Logistics this Cycle. No faction turns, attacks, or battle outcomes resolved; no attack costs spent.<\/p>\n<p class=\"list-line\">- Next faction: <strong>41st Expeditionary Korps<\/strong>. Vantry assault remains provisional until orders and any material rules questions are resolved.<\/p>\n<h4>Resource Tracker<\/h4>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Resource<\/th><th>41st Expeditionary Korps<\/th><th>Vior&#x27;la Expedition<\/th><th>Splinter Fleet Cerberus<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Resource\">Fleets<\/td><td data-label=\"41st Expeditionary Korps\">Transit Command Grunwald (4/5) — Aschenvald<\/td><td data-label=\"Vior&#x27;la Expedition\">The Widening Circle (4/5) — Mont&#x27;au<\/td><td data-label=\"Splinter Fleet Cerberus\">None<\/td><\/tr><tr><td data-label=\"Resource\">Supplies (1-100)<\/td><td data-label=\"41st Expeditionary Korps\">10<\/td><td data-label=\"Vior&#x27;la Expedition\">10<\/td><td data-label=\"Splinter Fleet Cerberus\">10<\/td><\/tr><tr><td data-label=\"Resource\">Manpower (1-100)<\/td><td data-label=\"41st Expeditionary Korps\">10<\/td><td data-label=\"Vior&#x27;la Expedition\">10<\/td><td data-label=\"Splinter Fleet Cerberus\">10<\/td><\/tr><tr><td data-label=\"Resource\">Planets Controlled<\/td><td data-label=\"41st Expeditionary Korps\">Sühne<\/td><td data-label=\"Vior&#x27;la Expedition\">Mont&#x27;au<\/td><td data-label=\"Splinter Fleet Cerberus\">None (Mobile Capital)<\/td><\/tr><tr><td data-label=\"Resource\">Constructions<\/td><td data-label=\"41st Expeditionary Korps\">—<\/td><td data-label=\"Vior&#x27;la Expedition\">—<\/td><td data-label=\"Splinter Fleet Cerberus\">—<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>AI vs AI Ground Battle Resolution:<\/strong> Both factions roll d20 + Fleet Strength in System + Supply + Manpower. Attacker commits Manpower equal to base damage (fleet strength only); Defender commits half of total damage to planet (including bonuses, rounded down). Highest total wins. If the defender used the Defend action, their roll gains +15. Winner returns 60% committed Manpower (rounded down), loser loses 100%. <strong>All calculations use resource values after attack costs (scaled by world type) and Manpower commitments are deducted.<\/strong><\/p>\n<hr>\n<h3>The Dessica Subsector<\/h3>\n<h4>Aschenvald System (41st Expeditionary Korps)<\/h4>\n<p><strong>Void Superiority:<\/strong> 41st Expeditionary Korps: 4 vs Hesperine Guard: 3 — 41st Expeditionary Korps<\/p>\n<p><em>Vantry broadcasts the same challenge to every vessel that enters the system — regimental cipher, verification codes, a standing order issued by Segmentum Command four decades ago. The 41st logs each transmission and answers with its own. Neither set of codes resolves against anything the other can check. Kolbrant has the guns to end the exchange and keeps them cold.<\/em><\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Planet<\/th><th>Type<\/th><th>Controller<\/th><th>Defense<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Planet\">Sühne<\/td><td data-label=\"Type\">Capital<\/td><td data-label=\"Controller\">41st Expeditionary Korps<\/td><td data-label=\"Defense\">12/12<\/td><td data-label=\"Notes\">Fortress world taken after eleven years of siege. Trench networks radiate from the old citadel across the ash plains, ringed by artillery in concentric emplacements. Tunnel systems run beneath the surface works, their extent known only to the Korps. The rebel curtain walls remain where they fell.<\/td><\/tr><tr><td data-label=\"Planet\">Vantry<\/td><td data-label=\"Type\">Standard (Station)<\/td><td data-label=\"Controller\">Hesperine Guard<\/td><td data-label=\"Defense\">4/4<\/td><td data-label=\"Notes\">Orbital defence platform and garrison station. Rotation schedules, munitions inventories, and watch rosters have been maintained without interruption for four decades. Approach lanes are covered by macrocannon batteries that track every hull entering the system.<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>In-System Fleets:<\/strong><\/p>\n<p class=\"list-line\">- 41st Expeditionary Korps: Transit Command Grunwald (4/5)<\/p>\n<p class=\"list-line\">- Hesperine Guard: Hesperine Watch Flotilla (3/5)<\/p>\n<hr>\n<h4>Mont&#x27;au System (Vior&#x27;la Expedition)<\/h4>\n<p><strong>Void Superiority:<\/strong> Vior&#x27;la Expedition: 4 vs Vennick Accord: 3 — Vior&#x27;la Expedition<\/p>\n<p><em>The primary dome went up in the second year; the processors began cycling atmosphere in the fourth. Halstrave returns every envoy the Expedition sends — alive, gifts intact, each carrying a written statement of the terms under which the six houses will discuss the future of the system. The terms have not been revised in thirty years. Shas&#x27;o Mont&#x27;yr keeps every copy.<\/em><\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Planet<\/th><th>Type<\/th><th>Controller<\/th><th>Defense<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Planet\">Mont&#x27;au<\/td><td data-label=\"Type\">Capital<\/td><td data-label=\"Controller\">Vior&#x27;la Expedition<\/td><td data-label=\"Defense\">12/12<\/td><td data-label=\"Notes\">Colony world under active terraforming. Habitation domes and atmospheric processors extend across former tundra, the settlement grid pushing outward each year. Fire caste cadres run live exercises on ground the Earth caste reclaimed a decade ago. Aun&#x27;el Shovah&#x27;ka&#x27;s council chamber sits at the centre of the primary dome.<\/td><\/tr><tr><td data-label=\"Planet\">Halstrave<\/td><td data-label=\"Type\">Standard<\/td><td data-label=\"Controller\">Vennick Accord<\/td><td data-label=\"Defense\">4/4<\/td><td data-label=\"Notes\">Hive world. Six noble houses occupy a single fortified spire-cluster, their household levies quartered in shared barracks along the lower tiers. Muster rolls run to eight figures. The approach lanes are ranged by house artillery.<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>In-System Fleets:<\/strong><\/p>\n<p class=\"list-line\">- Vior&#x27;la Expedition: The Widening Circle (4/5)<\/p>\n<p class=\"list-line\">- Vennick Accord: Accord Levy Squadron (3/5)<\/p>\n<hr>\n<h4>Threnholt System (Contested — Splinter Fleet Cerberus)<\/h4>\n<p><strong>Void Superiority:<\/strong> Splinter Fleet Cerberus: 11 vs Independents: 5 — Splinter Fleet Cerberus<\/p>\n<p><em>The vox-towers in Threnholt&#x27;s northern arcologies cycle a distress pattern on Imperial military frequencies that carries no further than the system boundary. The Shadow in the Warp arrived ahead of the Star-Mother and closed the astropathic channels behind it. The brood has spent two decades working the tunnel approaches beneath the arcologies. On Ossvarn the Last Rite sealed the outer catacombs the week the Hive Ship crossed the boundary and has held its services underground since. Spore clouds reached the upper atmosphere of both worlds in the third month.<\/em><\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Planet<\/th><th>Type<\/th><th>Controller<\/th><th>Defense<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Planet\">Threnholt<\/td><td data-label=\"Type\">Standard<\/td><td data-label=\"Controller\">The Star-Blessed<\/td><td data-label=\"Defense\">4/4<\/td><td data-label=\"Notes\">Civilised world. The cult holds the southern continent and the planetary government; the northern arcologies remain in loyalist hands and are supplied by a rail line the brood has cut four times. Brood-temples run through the undercity beneath the southern hive districts.<\/td><\/tr><tr><td data-label=\"Planet\">Ossvarn<\/td><td data-label=\"Type\">Minor<\/td><td data-label=\"Controller\">The Last Rite<\/td><td data-label=\"Defense\">2/2<\/td><td data-label=\"Notes\">Shrine world. The priesthood reorganised its liturgy around funerary rites in the year the Astronomican failed. Catacomb-cities extend three kilometres below the surface, walled with reliquary bone. Surface cathedrals stand empty and unlocked.<\/td><\/tr><tr><td data-label=\"Planet\">Kelmar<\/td><td data-label=\"Type\">Minor<\/td><td data-label=\"Controller\">The Star-Blessed<\/td><td data-label=\"Defense\">2/2<\/td><td data-label=\"Notes\">Mining colony. Deep-shaft extraction operated entirely by cult labour. The shrine at the base of the primary shaft has held continuous service for six generations.<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>In-System Fleets:<\/strong><\/p>\n<p class=\"list-line\">- Splinter Fleet Cerberus: The Star-Mother (11/12 — Mobile Capital; movement prohibited for Cycle 1)<\/p>\n<p class=\"list-line\">- The Star-Blessed: Star-Blessed Brood Vessels (4/5)<\/p>\n<p class=\"list-line\">- The Last Rite: Ossvarn Funerary Fleet (1/5)<\/p>\n<p><strong>Cycle 1 loss:<\/strong> Kelmar Ore Haulers (1/5 → 0) destroyed by Warp Storm. The Star-Blessed incur -1 Manpower for fleet destruction; allocation under the per-planet Independent resource rules is pending adjudication.<\/p>\n<p><strong>Agreed event ruling:<\/strong> The Star-Mother counts as a fleet for Warp Storm: defence reduced to 11/12 and movement prohibited for the rest of Cycle 1.<\/p>\n<hr>\n<h4>Anvarrus System (Independent — Forge Anvarrus)<\/h4>\n<p><strong>Void Superiority:<\/strong> Forge Anvarrus: 11 — Forge Anvarrus<\/p>\n<p><em>Magos-Dominus Thelk received four recall orders from Mars across six years. All four are archived on Thelk&#x27;s Rest, sealed in the same vault as the research they were issued to halt. Three manufactorum districts on Anvarrus have been under quarantine since the reclamation yard incident. Skitarii cohorts hold the cordon and log every entry.<\/em><\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Planet<\/th><th>Type<\/th><th>Controller<\/th><th>Defense<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Planet\">Anvarrus<\/td><td data-label=\"Type\">Major<\/td><td data-label=\"Controller\">Forge Anvarrus<\/td><td data-label=\"Defense\">8/8<\/td><td data-label=\"Notes\">Forge world. Manufactorum districts run to the horizon beneath a permanent smog ceiling. Three eastern districts sit behind a Skitarii cordon, power still running to them. Output continues at full tithe capacity across the remainder.<\/td><\/tr><tr><td data-label=\"Planet\">Corvid<\/td><td data-label=\"Type\">Standard<\/td><td data-label=\"Controller\">Forge Anvarrus<\/td><td data-label=\"Defense\">4/4<\/td><td data-label=\"Notes\">Mining and refining world. Open-cast extraction sites feed raw ore to Anvarrus on a continuous rail cycle. Servitor labour throughout. Replacement requisitions run to four figures a year.<\/td><\/tr><tr><td data-label=\"Planet\">Thelk&#x27;s Rest<\/td><td data-label=\"Type\">Minor (Station)<\/td><td data-label=\"Controller\">Forge Anvarrus<\/td><td data-label=\"Defense\">2/2<\/td><td data-label=\"Notes\">Research station and biologis facility. Vat-farms, specimen storage, and the sealed archive vault. Access requires Thelk&#x27;s personal cipher.<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>In-System Fleets:<\/strong><\/p>\n<p class=\"list-line\">- Forge Anvarrus: Omnissian Vigil (4/5), The Sanctioned Pattern (4/5), Corvid Ore Escort (3/5)<\/p>\n<hr>\n<h4>Skarjaw System (Independent — Waaagh! Skarjaw)<\/h4>\n<p><strong>Void Superiority:<\/strong> Waaagh! Skarjaw: 9 — Waaagh! Skarjaw<\/p>\n<p><em>Skarjaw&#x27;s throne is the prow of an Imperial escort, cut free and stood upright in the middle of the Yard. He took the ship six years ago. The Meks are still arguing over the rest of the hull, and the argument has cost eleven of them so far.<\/em><\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Planet<\/th><th>Type<\/th><th>Controller<\/th><th>Defense<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Planet\">Skarjaw&#x27;s Yard<\/td><td data-label=\"Type\">Major<\/td><td data-label=\"Controller\">Waaagh! Skarjaw<\/td><td data-label=\"Defense\">8/8<\/td><td data-label=\"Notes\">Ork scrapworld. Salvaged hulls stacked into ridgelines, walls welded from plate cut off captured vessels. Vehicle graveyards ring the approaches, sighted for crossfire. The escort prow stands at the centre.<\/td><\/tr><tr><td data-label=\"Planet\">Grotmire<\/td><td data-label=\"Type\">Minor<\/td><td data-label=\"Controller\">Waaagh! Skarjaw<\/td><td data-label=\"Defense\">2/2<\/td><td data-label=\"Notes\">Swamp world. Grot labour camps worked around fungal farms and squig pens. Supplies the Yard by barge on a continuous run.<\/td><\/tr><tr><td data-label=\"Planet\">Dakkatoof<\/td><td data-label=\"Type\">Minor<\/td><td data-label=\"Controller\">Waaagh! Skarjaw<\/td><td data-label=\"Defense\">2/2<\/td><td data-label=\"Notes\">Raider staging ground. Launch pads cut into bedrock, hangar frames raised from scaffold and sheet plate. The Mek population runs to the thousands and the weapon shops never go dark.<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>In-System Fleets:<\/strong><\/p>\n<p class=\"list-line\">- Waaagh! Skarjaw: Skarjaw&#x27;s Big
