a-label=\"Type\">Capital<\/td><td data-label=\"Controller\">41st Expeditionary Korps<\/td><td data-label=\"Defense\">12/12<\/td><td data-label=\"Notes\">Fortress world taken after eleven years of siege. Trench networks radiate from the old citadel across the ash plains, ringed by artillery in concentric emplacements. Tunnel systems run beneath the surface works, their extent known only to the Korps. The rebel curtain walls remain where they fell.<\/td><\/tr><tr><td data-label=\"Planet\">Vantry<\/td><td data-label=\"Type\">Standard (Station)<\/td><td data-label=\"Controller\">Hesperine Guard<\/td><td data-label=\"Defense\">4/4<\/td><td data-label=\"Notes\">Orbital defence platform and garrison station. Rotation schedules, munitions inventories, and watch rosters have been maintained without interruption for four decades. Approach lanes are covered by macrocannon batteries that track every hull entering the system.<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>In-System Fleets:<\/strong><\/p>\n<p class=\"list-line\">- 41st Expeditionary Korps: Transit Command Grunwald (4/5)<\/p>\n<p class=\"list-line\">- Hesperine Guard: Hesperine Watch Flotilla (3/5)<\/p>\n<hr>", "text": "\n**Void Superiority:** 41st Expeditionary Korps: 4 vs Hesperine Guard: 3 — 41st Expeditionary Korps\n\n*Vantry broadcasts the same challenge to every vessel that enters the system — regimental cipher, verification codes, a standing order issued by Segmentum Command four decades ago. The 41st logs each transmission and answers with its own. Neither set of codes resolves against anything the other can check. Kolbrant has the guns to end the exchange and keeps them cold.*\n\n| Planet | Type | Controller | Defense | Notes |\n|--------|------|------------|---------|-------|\n| Sühne | Capital | 41st Expeditionary Korps | 12/12 | Fortress world taken after eleven years of siege. Trench networks radiate from the old citadel across the ash plains, ringed by artillery in concentric emplacements. Tunnel systems run beneath the surface works, their extent known only to the Korps. The rebel curtain walls remain where they fell. |\n| Vantry | Standard (Station) | Hesperine Guard | 4/4 | Orbital defence platform and garrison station. Rotation schedules, munitions inventories, and watch rosters have been maintained without interruption for four decades. Approach lanes are covered by macrocannon batteries that track every hull entering the system. |\n\n**In-System Fleets:**\n- 41st Expeditionary Korps: Transit Command Grunwald (4/5)\n- Hesperine Guard: Hesperine Watch Flotilla (3/5)\n\n---\n\n"}, {"title": "Mont'au System (Vior'la Expedition)", "worlds": [{"Planet": "Mont'au", "Type": "Capital", "Controller": "Vior'la Expedition", "Defense": "12/12", "Notes": "Colony world under active terraforming. Habitation domes and atmospheric processors extend across former tundra, the settlement grid pushing outward each year. Fire caste cadres run live exercises on ground the Earth caste reclaimed a decade ago. Aun'el Shovah'ka's council chamber sits at the centre of the primary dome."}, {"Planet": "Halstrave", "Type": "Standard", "Controller": "Vennick Accord", "Defense": "4/4", "Notes": "Hive world. Six noble houses occupy a single fortified spire-cluster, their household levies quartered in shared barracks along the lower tiers. Muster rolls run to eight figures. The approach lanes are ranged by house artillery."}], "html": "<p><strong>Void Superiority:<\/strong> Vior&#x27;la Expedition: 4 vs Vennick Accord: 3 — Vior&#x27;la Expedition<\/p>\n<p><em>The primary dome went up in the second year; the processors began cycling atmosphere in the fourth. Halstrave returns every envoy the Expedition sends — alive, gifts intact, each carrying a written statement of the terms under which the six houses will discuss the future of the system. The terms have not been revised in thirty years. Shas&#x27;o Mont&#x27;yr keeps every copy.<\/em><\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Planet<\/th><th>Type<\/th><th>Controller<\/th><th>Defense<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Planet\">Mont&#x27;au<\/td><td data-label=\"Type\">Capital<\/td><td data-label=\"Controller\">Vior&#x27;la Expedition<\/td><td data-label=\"Defense\">12/12<\/td><td data-label=\"Notes\">Colony world under active terraforming. Habitation domes and atmospheric processors extend across former tundra, the settlement grid pushing outward each year. Fire caste cadres run live exercises on ground the Earth caste reclaimed a decade ago. Aun&#x27;el Shovah&#x27;ka&#x27;s council chamber sits at the centre of the primary dome.<\/td><\/tr><tr><td data-label=\"Planet\">Halstrave<\/td><td data-label=\"Type\">Standard<\/td><td data-label=\"Controller\">Vennick Accord<\/td><td data-label=\"Defense\">4/4<\/td><td data-label=\"Notes\">Hive world. Six noble houses occupy a single fortified spire-cluster, their household levies quartered in shared barracks along the lower tiers. Muster rolls run to eight figures. The approach lanes are ranged by house artillery.<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>In-System Fleets:<\/strong><\/p>\n<p class=\"list-line\">- Vior&#x27;la Expedition: The Widening Circle (4/5)<\/p>\n<p class=\"list-line\">- Vennick Accord: Accord Levy Squadron (3/5)<\/p>\n<hr>", "text": "\n**Void Superiority:** Vior'la Expedition: 4 vs Vennick Accord: 3 — Vior'la Expedition\n\n*The primary dome went up in the second year; the processors began cycling atmosphere in the fourth. Halstrave returns every envoy the Expedition sends — alive, gifts intact, each carrying a written statement of the terms under which the six houses will discuss the future of the system. The terms have not been revised in thirty years. Shas'o Mont'yr keeps every copy.*\n\n| Planet | Type | Controller | Defense | Notes |\n|--------|------|------------|---------|-------|\n| Mont'au | Capital | Vior'la Expedition | 12/12 | Colony world under active terraforming. Habitation domes and atmospheric processors extend across former tundra, the settlement grid pushing outward each year. Fire caste cadres run live exercises on ground the Earth caste reclaimed a decade ago. Aun'el Shovah'ka's council chamber sits at the centre of the primary dome. |\n| Halstrave | Standard | Vennick Accord | 4/4 | Hive world. Six noble houses occupy a single fortified spire-cluster, their household levies quartered in shared barracks along the lower tiers. Muster rolls run to eight figures. The approach lanes are ranged by house artillery. |\n\n**In-System Fleets:**\n- Vior'la Expedition: The Widening Circle (4/5)\n- Vennick Accord: Accord Levy Squadron (3/5)\n\n---\n\n"}, {"title": "Threnholt System (Contested — Splinter Fleet Cerberus)", "worlds": [{"Planet": "Threnholt", "Type": "Standard", "Controller": "The Star-Blessed", "Defense": "4/4", "Notes": "Civilised world. The cult holds the southern continent and the planetary government; the northern arcologies remain in loyalist hands and are supplied by a rail line the brood has cut four times. Brood-temples run through the undercity beneath the southern hive districts."}, {"Planet": "Ossvarn", "Type": "Minor", "Controller": "The Last Rite", "Defense": "2/2", "Notes": "Shrine world. The priesthood reorganised its liturgy around funerary rites in the year the Astronomican failed. Catacomb-cities extend three kilometres below the surface, walled with reliquary bone. Surface cathedrals stand empty and unlocked."}, {"Planet": "Kelmar", "Type": "Minor", "Controller": "The Star-Blessed", "Defense": "2/2", "Notes": "Mining colony. Deep-shaft extraction operated entirely by cult labour. The shrine at the base of the primary shaft has held continuous service for six generations."}], "html": "<p><strong>Void Superiority:<\/strong> Splinter Fleet Cerberus: 11 vs Independents: 5 — Splinter Fleet Cerberus<\/p>\n<p><em>The vox-towers in Threnholt&#x27;s northern arcologies cycle a distress pattern on Imperial military frequencies that carries no further than the system boundary. The Shadow in the Warp arrived ahead of the Star-Mother and closed the astropathic channels behind it. The brood has spent two decades working the tunnel approaches beneath the arcologies. On Ossvarn the Last Rite sealed the outer catacombs the week the Hive Ship crossed the boundary and has held its services underground since. Spore clouds reached the upper atmosphere of both worlds in the third month.<\/em><\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Planet<\/th><th>Type<\/th><th>Controller<\/th><th>Defense<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Planet\">Threnholt<\/td><td data-label=\"Type\">Standard<\/td><td data-label=\"Controller\">The Star-Blessed<\/td><td data-label=\"Defense\">4/4<\/td><td data-label=\"Notes\">Civilised world. The cult holds the southern continent and the planetary government; the northern arcologies remain in loyalist hands and are supplied by a rail line the brood has cut four times. Brood-temples run through the undercity beneath the southern hive districts.<\/td><\/tr><tr><td data-label=\"Planet\">Ossvarn<\/td><td data-label=\"Type\">Minor<\/td><td data-label=\"Controller\">The Last Rite<\/td><td data-label=\"Defense\">2/2<\/td><td data-label=\"Notes\">Shrine world. The priesthood reorganised its liturgy around funerary rites in the year the Astronomican failed. Catacomb-cities extend three kilometres below the surface, walled with reliquary bone. Surface cathedrals stand empty and unlocked.<\/td><\/tr><tr><td data-label=\"Planet\">Kelmar<\/td><td data-label=\"Type\">Minor<\/td><td data-label=\"Controller\">The Star-Blessed<\/td><td data-label=\"Defense\">2/2<\/td><td data-label=\"Notes\">Mining colony. Deep-shaft extraction operated entirely by cult labour. The shrine at the base of the primary shaft has held continuous service for six generations.<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>In-System Fleets:<\/strong><\/p>\n<p class=\"list-line\">- Splinter Fleet Cerberus: The Star-Mother (11/12 — Mobile Capital; movement prohibited for Cycle 1)<\/p>\n<p class=\"list-line\">- The Star-Blessed: Star-Blessed Brood Vessels (4/5)<\/p>\n<p class=\"list-line\">- The Last Rite: Ossvarn Funerary Fleet (1/5)<\/p>\n<p><strong>Cycle 1 loss:<\/strong> Kelmar Ore Haulers (1/5 → 0) destroyed by Warp Storm. The Star-Blessed incur -1 Manpower for fleet destruction; allocation under the per-planet Independent resource rules is pending adjudication.<\/p>\n<p><strong>Agreed event ruling:<\/strong> The Star-Mother counts as a fleet for Warp Storm: defence reduced to 11/12 and movement prohibited for the rest of Cycle 1.<\/p>\n<hr>", "text": "\n**Void Superiority:** Splinter Fleet Cerberus: 11 vs Independents: 5 — Splinter Fleet Cerberus\n\n*The vox-towers in Threnholt's northern arcologies cycle a distress pattern on Imperial military frequencies that carries no further than the system boundary. The Shadow in the Warp arrived ahead of the Star-Mother and closed the astropathic channels behind it. The brood has spent two decades working the tunnel approaches beneath the arcologies. On Ossvarn the Last Rite sealed the outer catacombs the week the Hive Ship crossed the boundary and has held its services underground since. Spore clouds reached the upper atmosphere of both worlds in the third month.*\n\n| Planet | Type | Controller | Defense | Notes |\n|--------|------|------------|---------|-------|\n| Threnholt | Standard | The Star-Blessed | 4/4 | Civilised world. The cult holds the southern continent and the planetary government; the northern arcologies remain in loyalist hands and are supplied by a rail line the brood has cut four times. Brood-temples run through the undercity beneath the southern hive districts. |\n| Ossvarn | Minor | The Last Rite | 2/2 | Shrine world. The priesthood reorganised its liturgy around funerary rites in the year the Astronomican failed. Catacomb-cities extend three kilometres below the surface, walled with reliquary bone. Surface cathedrals stand empty and unlocked. |\n| Kelmar | Minor | The Star-Blessed | 2/2 | Mining colony. Deep-shaft extraction operated entirely by cult labour. The shrine at the base of the primary shaft has held continuous service for six generations. |\n\n**In-System Fleets:**\n- Splinter Fleet Cerberus: The Star-Mother (11/12 — Mobile Capital; movement prohibited for Cycle 1)\n- The Star-Blessed: Star-Blessed Brood Vessels (4/5)\n- The Last Rite: Ossvarn Funerary Fleet (1/5)\n\n**Cycle 1 loss:** Kelmar Ore Haulers (1/5 → 0) destroyed by Warp Storm. The Star-Blessed incur -1 Manpower for fleet destruction; allocation under the per-planet Independent resource rules is pending adjudication.\n\n**Agreed event ruling:** The Star-Mother counts as a fleet for Warp Storm: defence reduced to 11/12 and movement prohibited for the rest of Cycle 1.\n\n---\n\n"}, {"title": "Anvarrus System (Independent — Forge Anvarrus)", "worlds": [{"Planet": "Anvarrus", "Type": "Major", "Controller": "Forge Anvarrus", "Defense": "8/8", "Notes": "Forge world. Manufactorum districts run to the horizon beneath a permanent smog ceiling. Three eastern districts sit behind a Skitarii cordon, power still running to them. Output continues at full tithe capacity across the remainder."}, {"Planet": "Corvid", "Type": "Standard", "Controller": "Forge Anvarrus", "Defense": "4/4", "Notes": "Mining and refining world. Open-cast extraction sites feed raw ore to Anvarrus on a continuous rail cycle. Servitor labour throughout. Replacement requisitions run to four figures a year."}, {"Planet": "Thelk's Rest", "Type": "Minor (Station)", "Controller": "Forge Anvarrus", "Defense": "2/2", "Notes": "Research station and biologis facility. Vat-farms, specimen storage, and the sealed archive vault. Access requires Thelk's personal cipher."}], "html": "<p><strong>Void Superiority:<\/strong> Forge Anvarrus: 11 — Forge Anvarrus<\/p>\n<p><em>Magos-Dominus Thelk received four recall orders from Mars across six years. All four are archived on Thelk&#x27;s Rest, sealed in the same vault as the research they were issued to halt. Three manufactorum districts on Anvarrus have been under quarantine since the reclamation yard incident. Skitarii cohorts hold the cordon and log every entry.<\/em><\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Planet<\/th><th>Type<\/th><th>Controller<\/th><th>Defense<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Planet\">Anvarrus<\/td><td data-label=\"Type\">Major<\/td><td data-label=\"Controller\">Forge Anvarrus<\/td><td data-label=\"Defense\">8/8<\/td><td data-label=\"Notes\">Forge world. Manufactorum districts run to the horizon beneath a permanent smog ceiling. Three eastern districts sit behind a Skitarii cordon, power still running to them. Output continues at full tithe capacity across the remainder.<\/td><\/tr><tr><td data-label=\"Planet\">Corvid<\/td><td data-label=\"Type\">Standard<\/td><td data-label=\"Controller\">Forge Anvarrus<\/td><td data-label=\"Defense\">4/4<\/td><td data-label=\"Notes\">Mining and refining world. Open-cast extraction sites feed raw ore to Anvarrus on a continuous rail cycle. Servitor labour throughout. Replacement requisitions run to four figures a year.<\/td><\/tr><tr><td data-label=\"Planet\">Thelk&#x27;s Rest<\/td><td data-label=\"Type\">Minor (Station)<\/td><td data-label=\"Controller\">Forge Anvarrus<\/td><td data-label=\"Defense\">2/2<\/td><td data-label=\"Notes\">Research station and biologis facility. Vat-farms, specimen storage, and the sealed archive vault. Access requires Thelk&#x27;s personal cipher.<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>In-System Fleets:<\/strong><\/p>\n<p class=\"list-line\">- Forge Anvarrus: Omnissian Vigil (4/5), The Sanctioned Pattern (4/5), Corvid Ore Escort (3/5)<\/p>\n<hr>", "text": "\n**Void Superiority:** Forge Anvarrus: 11 — Forge Anvarrus\n\n*Magos-Dominus Thelk received four recall orders from Mars across six years. All four are archived on Thelk's Rest, sealed in the same vault as the research they were issued to halt. Three manufactorum districts on Anvarrus have been under quarantine since the reclamation yard incident. Skitarii cohorts hold the cordon and log every entry.*\n\n| Planet | Type | Controller | Defense | Notes |\n|--------|------|------------|---------|-------|\n| Anvarrus | Major | Forge Anvarrus | 8/8 | Forge world. Manufactorum districts run to the horizon beneath a permanent smog ceiling. Three eastern districts sit behind a Skitarii cordon, power still running to them. Output continues at full tithe capacity across the remainder. |\n| Corvid | Standard | Forge Anvarrus | 4/4 | Mining and refining world. Open-cast extraction sites feed raw ore to Anvarrus on a continuous rail cycle. Servitor labour throughout. Replacement requisitions run to four figures a year. |\n| Thelk's Rest | Minor (Station) | Forge Anvarrus | 2/2 | Research station and biologis facility. Vat-farms, specimen storage, and the sealed archive vault. Access requires Thelk's personal cipher. |\n\n**In-System Fleets:**\n- Forge Anvarrus: Omnissian Vigil (4/5), The Sanctioned Pattern (4/5), Corvid Ore Escort (3/5)\n\n---\n\n"}, {"title": "Skarjaw System (Independent — Waaagh! Skarjaw)", "worlds": [{"Planet": "Skarjaw's Yard", "Type": "Major", "Controller": "Waaagh! Skarjaw", "Defense": "8/8", "Notes": "Ork scrapworld. Salvaged hulls stacked into ridgelines, walls welded from plate cut off captured vessels. Vehicle graveyards ring the approaches, sighted for crossfire. The escort prow stands at the centre."}, {"Planet": "Grotmire", "Type": "Minor", "Controller": "Waaagh! Skarjaw", "Defense": "2/2", "Notes": "Swamp world. Grot labour camps worked around fungal farms and squig pens. Supplies the Yard by barge on a continuous run."}, {"Planet": "Dakkatoof", "Type": "Minor", "Controller": "Waaagh! Skarjaw", "Defense": "2/2", "Notes": "Raider staging ground. Launch pads cut into bedrock, hangar frames raised from scaffold and sheet plate. The Mek population runs to the thousands and the weapon shops never go dark."}], "html": "<p><strong>Void Superiority:<\/strong> Waaagh! Skarjaw: 9 — Waaagh! Skarjaw<\/p>\n<p><em>Skarjaw&#x27;s throne is the prow of an Imperial escort, cut free and stood upright in the middle of the Yard. He took the ship six years ago. The Meks are still arguing over the rest of the hull, and the argument has cost eleven of them so far.<\/em><\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Planet<\/th><th>Type<\/th><th>Controller<\/th><th>Defense<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Planet\">Skarjaw&#x27;s Yard<\/td><td data-label=\"Type\">Major<\/td><td data-label=\"Controller\">Waaagh! Skarjaw<\/td><td data-label=\"Defense\">8/8<\/td><td data-label=\"Notes\">Ork scrapworld. Salvaged hulls stacked into ridgelines, walls welded from plate cut off captured vessels. Vehicle graveyards ring the approaches, sighted for crossfire. The escort prow stands at the centre.<\/td><\/tr><tr><td data-label=\"Planet\">Grotmire<\/td><td data-label=\"Type\">Minor<\/td><td data-label=\"Controller\">Waaagh! Skarjaw<\/td><td data-label=\"Defense\">2/2<\/td><td data-label=\"Notes\">Swamp world. Grot labour camps worked around fungal farms and squig pens. Supplies the Yard by barge on a continuous run.<\/td><\/tr><tr><td data-label=\"Planet\">Dakkatoof<\/td><td data-label=\"Type\">Minor<\/td><td data-label=\"Controller\">Waaagh! Skarjaw<\/td><td data-label=\"Defense\">2/2<\/td><td data-label=\"Notes\">Raider staging ground. Launch pads cut into bedrock, hangar frames raised from scaffold and sheet plate. The Mek population runs to the thousands and the weapon shops never go dark.<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>In-System Fleets:<\/strong><\/p>\n<p class=\"list-line\">- Waaagh! Skarjaw: Skarjaw&#x27;s Big Hulk (4/5), Da Krumpin&#x27; Krooza (4/5), Grotmire Scrap Barges (1/5)<\/p>\n<hr>", "text": "\n**Void Superiority:** Waaagh! Skarjaw: 9 — Waaagh! Skarjaw\n\n*Skarjaw's throne is the prow of an Imperial escort, cut free and stood upright in the middle of the Yard. He took the ship six years ago. The Meks are still arguing over the rest of the hull, and the argument has cost eleven of them so far.*\n\n| Planet | Type | Controller | Defense | Notes |\n|--------|------|------------|---------|-------|\n| Skarjaw's Yard | Major | Waaagh! Skarjaw | 8/8 | Ork scrapworld. Salvaged hulls stacked into ridgelines, walls welded from plate cut off captured vessels. Vehicle graveyards ring the approaches, sighted for crossfire. The escort prow stands at the centre. |\n| Grotmire | Minor | Waaagh! Skarjaw | 2/2 | Swamp world. Grot labour camps worked around fungal farms and squig pens. Supplies the Yard by barge on a continuous run. |\n| Dakkatoof | Minor | Waaagh! Skarjaw | 2/2 | Raider staging ground. Launch pads cut into bedrock, hangar frames raised from scaffold and sheet plate. The Mek population runs to the thousands and the weapon shops never go dark. |\n\n**In-System Fleets:**\n- Waaagh! Skarjaw: Skarjaw's Big Hulk (4/5), Da Krumpin' Krooza (4/5), Grotmire Scrap Barges (1/5)\n\n---\n\n"}, {"title": "Gutrekk System (Independent — Waaagh! Gutrekk)", "worlds": [{"Planet": "Gutrekk's Rok", "Type": "Major", "Controller": "Waaagh! Gutrekk", "Defense": "8/8", "Notes": "Asteroid fortress driven into a dead world's crust. Tunnel networks bored through solid rock house the bulk of the mob. Gun batteries welded across the exposed surface, burning promethium day and night."}, {"Planet": "Bonegrind", "Type": "Minor", "Controller": "Waaagh! Gutrekk", "Defense": "2/2", "Notes": "Mining world stripped to bedrock. Extraction gear has been cut down and rebuilt into vehicle frames and gun mounts. The pit heads stand open and empty."}], "html": "<p><strong>Void Superiority:<\/strong> Waaagh! Gutrekk: 8 — Waaagh! Gutrekk<\/p>\n<p><em>Gutrekk and Skarjaw fought each other for eleven years before either of them reached Dessica. The Rok came down on Bonegrind hard enough to crack the crust. Gutrekk&#x27;s Boyz have painted the range markers on the surface batteries in Skarjaw&#x27;s colours.<\/em><\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Planet<\/th><th>Type<\/th><th>Controller<\/th><th>Defense<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Planet\">Gutrekk&#x27;s Rok<\/td><td data-label=\"Type\">Major<\/td><td data-label=\"Controller\">Waaagh! Gutrekk<\/td><td data-label=\"Defense\">8/8<\/td><td data-label=\"Notes\">Asteroid fortress driven into a dead world&#x27;s crust. Tunnel networks bored through solid rock house the bulk of the mob. Gun batteries welded across the exposed surface, burning promethium day and night.<\/td><\/tr><tr><td data-label=\"Planet\">Bonegrind<\/td><td data-label=\"Type\">Minor<\/td><td data-label=\"Controller\">Waaagh! Gutrekk<\/td><td data-label=\"Defense\">2/2<\/td><td data-label=\"Notes\">Mining world stripped to bedrock. Extraction gear has been cut down and rebuilt into vehicle frames and gun mounts. The pit heads stand open and empty.<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>In-System Fleets:<\/strong><\/p>\n<p class=\"list-line\">- Waaagh! Gutrekk: Gutrekk&#x27;s Rok Fleet (4/5), Da Bonegrinda (4/5)<\/p>\n<hr>", "text": "\n**Void Superiority:** Waaagh! Gutrekk: 8 — Waaagh! Gutrekk\n\n*Gutrekk and Skarjaw fought each other for eleven years before either of them reached Dessica. The Rok came down on Bonegrind hard enough to crack the crust. Gutrekk's Boyz have painted the range markers on the surface batteries in Skarjaw's colours.*\n\n| Planet | Type | Controller | Defense | Notes |\n|--------|------|------------|---------|-------|\n| Gutrekk's Rok | Major | Waaagh! Gutrekk | 8/8 | Asteroid fortress driven into a dead world's crust. Tunnel networks bored through solid rock house the bulk of the mob. Gun batteries welded across the exposed surface, burning promethium day and night. |\n| Bonegrind | Minor | Waaagh! Gutrekk | 2/2 | Mining world stripped to bedrock. Extraction gear has been cut down and rebuilt into vehicle frames and gun mounts. The pit heads stand open and empty. |\n\n**In-System Fleets:**\n- Waaagh! Gutrekk: Gutrekk's Rok Fleet (4/5), Da Bonegrinda (4/5)\n\n---\n\n"}, {"title": "Vashenne System (Independent — Kabal of the Withered Hand)", "worlds": [{"Planet": "Vashenne", "Type": "Standard", "Controller": "Kabal of the Withered Hand", "Defense": "4/4", "Notes": "Former Imperial colony. Population held in managed settlements and worked on the culling rotation. A webway portal sits concealed beneath the polar ice, guarded by a permanent Kabalite garrison."}, {"Planet": "Sallow", "Type": "Minor (Station)", "Controller": "Kabal of the Withered Hand", "Defense": "2/2", "Notes": "Orbital pens and processing stations. Holding capacity runs to six figures. Transfer barges cycle between the station and the surface on the culling schedule."}, {"Planet": "Threnn", "Type": "Minor (Station)", "Controller": "Kabal of the Withered Hand", "Defense": "2/2", "Notes": "Raiding cache. Captured hulls in various states of stripping, cargo holds sorted by origin, and the accumulated take of four decades."}], "html": "<p><strong>Void Superiority:<\/strong> Kabal of the Withered Hand: 6 — Kabal of the Withered Hand<\/p>\n<p><em>The culling schedule on Vashenne runs on a two-hundred-day cycle. Kabalite crews work the northern hemisphere while the southern population is left to breed, then the hemispheres are exchanged. Archon Yssareth&#x27;s court reviews the yield figures at the close of each cycle and revises the quotas. The portal in the polar wastes carries the take back to Commorragh within the hour.<\/em><\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Planet<\/th><th>Type<\/th><th>Controller<\/th><th>Defense<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Planet\">Vashenne<\/td><td data-label=\"Type\">Standard<\/td><td data-label=\"Controller\">Kabal of the Withered Hand<\/td><td data-label=\"Defense\">4/4<\/td><td data-label=\"Notes\">Former Imperial colony. Population held in managed settlements and worked on the culling rotation. A webway portal sits concealed beneath the polar ice, guarded by a permanent Kabalite garrison.<\/td><\/tr><tr><td data-label=\"Planet\">Sallow<\/td><td data-label=\"Type\">Minor (Station)<\/td><td data-label=\"Controller\">Kabal of the Withered Hand<\/td><td data-label=\"Defense\">2/2<\/td><td data-label=\"Notes\">Orbital pens and processing stations. Holding capacity runs to six figures. Transfer barges cycle between the station and the surface on the culling schedule.<\/td><\/tr><tr><td data-label=\"Planet\">Threnn<\/td><td data-label=\"Type\">Minor (Station)<\/td><td data-label=\"Controller\">Kabal of the Withered Hand<\/td><td data-label=\"Defense\">2/2<\/td><td data-label=\"Notes\">Raiding cache. Captured hulls in various states of stripping, cargo holds sorted by origin, and the accumulated take of four decades.<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>In-System Fleets:<\/strong><\/p>\n<p class=\"list-line\">- Kabal of the Withered Hand: The Sculpted Scream (4/5), Sallow Slavers (2/5)<\/p>\n<hr>", "text": "\n**Void Superiority:** Kabal of the Withered Hand: 6 — Kabal of the Withered Hand\n\n*The culling schedule on Vashenne runs on a two-hundred-day cycle. Kabalite crews work the northern hemisphere while the southern population is left to breed, then the hemispheres are exchanged. Archon Yssareth's court reviews the yield figures at the close of each cycle and revises the quotas. The portal in the polar wastes carries the take back to Commorragh within the hour.*\n\n| Planet | Type | Controller | Defense | Notes |\n|--------|------|------------|---------|-------|\n| Vashenne | Standard | Kabal of the Withered Hand | 4/4 | Former Imperial colony. Population held in managed settlements and worked on the culling rotation. A webway portal sits concealed beneath the polar ice, guarded by a permanent Kabalite garrison. |\n| Sallow | Minor (Station) | Kabal of the Withered Hand | 2/2 | Orbital pens and processing stations. Holding capacity runs to six figures. Transfer barges cycle between the station and the surface on the culling schedule. |\n| Threnn | Minor (Station) | Kabal of the Withered Hand | 2/2 | Raiding cache. Captured hulls in various states of stripping, cargo holds sorted by origin, and the accumulated take of four decades. |\n\n**In-System Fleets:**\n- Kabal of the Withered Hand: The Sculpted Scream (4/5), Sallow Slavers (2/5)\n\n---\n\n"}, {"title": "Havren System (Independent — The Havren Reclamation)", "worlds": [{"Planet": "Havren's Claim", "Type": "Major", "Controller": "Havren Reclamation", "Defense": "8/8", "Notes": "Fortified trade world. Void docks and warehouse districts ring the equator, with mercenary barracks quartered alongside. The dynasty's seat occupies the head of the primary orbital elevator."}, {"Planet": "Ashet", "Type": "Standard", "Controller": "Havren Reclamation", "Defense": "4/4", "Notes": "Agri-world. Estate holdings measured in continents, worked under indenture contracts inherited across three generations. Feeds the Claim and the Reclamation fleet."}, {"Planet": "Merrow", "Type": "Minor (Station)", "Controller": "Havren Reclamation", "Defense": "2/2", "Notes": "Refuelling depot and shipyard annex. Drydocks handle hulls up to cruiser tonnage. Tariff office sits at the station's primary approach."}], "html": "<p><strong>Void Superiority:<\/strong> Havren Reclamation: 11 — Havren Reclamation<\/p>\n<p><em>The Havren Warrant of Trade hangs in the receiving hall on Havren&#x27;s Claim, nineteen signatures deep, the most recent countersigned by a Lord Militant four centuries dead. Lady Reclaimant Sevrine Havren receives petitioners beneath it. Her escorts run the patrol routes her grandmother set, and the tariff schedules are still enforced at Merrow.<\/em><\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Planet<\/th><th>Type<\/th><th>Controller<\/th><th>Defense<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Planet\">Havren&#x27;s Claim<\/td><td data-label=\"Type\">Major<\/td><td data-label=\"Controller\">Havren Reclamation<\/td><td data-label=\"Defense\">8/8<\/td><td data-label=\"Notes\">Fortified trade world. Void docks and warehouse districts ring the equator, with mercenary barracks quartered alongside. The dynasty&#x27;s seat occupies the head of the primary orbital elevator.<\/td><\/tr><tr><td data-label=\"Planet\">Ashet<\/td><td data-label=\"Type\">Standard<\/td><td data-label=\"Controller\">Havren Reclamation<\/td><td data-label=\"Defense\">4/4<\/td><td data-label=\"Notes\">Agri-world. Estate holdings measured in continents, worked under indenture contracts inherited across three generations. Feeds the Claim and the Reclamation fleet.<\/td><\/tr><tr><td data-label=\"Planet\">Merrow<\/td><td data-label=\"Type\">Minor (Station)<\/td><td data-label=\"Controller\">Havren Reclamation<\/td><td data-label=\"Defense\">2/2<\/td><td data-label=\"Notes\">Refuelling depot and shipyard annex. Drydocks handle hulls up to cruiser tonnage. Tariff office sits at the station&#x27;s primary approach.<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>In-System Fleets:<\/strong><\/p>\n<p class=\"list-line\">- Havren Reclamation: The Nineteenth Warrant (4/5), Sevrine&#x27;s Prerogative (4/5), Merrow Tender Group (3/5)<\/p>\n<hr>", "text": "\n**Void Superiority:** Havren Reclamation: 11 — Havren Reclamation\n\n*The Havren Warrant of Trade hangs in the receiving hall on Havren's Claim, nineteen signatures deep, the most recent countersigned by a Lord Militant four centuries dead. Lady Reclaimant Sevrine Havren receives petitioners beneath it. Her escorts run the patrol routes her grandmother set, and the tariff schedules are still enforced at Merrow.*\n\n| Planet | Type | Controller | Defense | Notes |\n|--------|------|------------|---------|-------|\n| Havren's Claim | Major | Havren Reclamation | 8/8 | Fortified trade world. Void docks and warehouse districts ring the equator, with mercenary barracks quartered alongside. The dynasty's seat occupies the head of the primary orbital elevator. |\n| Ashet | Standard | Havren Reclamation | 4/4 | Agri-world. Estate holdings measured in continents, worked under indenture contracts inherited across three generations. Feeds the Claim and the Reclamation fleet. |\n| Merrow | Minor (Station) | Havren Reclamation | 2/2 | Refuelling depot and shipyard annex. Drydocks handle hulls up to cruiser tonnage. Tariff office sits at the station's primary approach. |\n\n**In-System Fleets:**\n- Havren Reclamation: The Nineteenth Warrant (4/5), Sevrine's Prerogative (4/5), Merrow Tender Group (3/5)\n\n---\n\n"}, {"title": "Talgrave System (Independent — The Talgrave Dominion)", "worlds": [{"Planet": "Talgrave", "Type": "Major", "Controller": "Talgrave Dominion", "Defense": "8/8", "Notes": "Hive world. Six primary spires ringed by manufactorum belts and muster fields that process forty thousand conscripts a season. Vosk governs from the Palatine Spire. The records office occupies its eleventh tier."}, {"Planet": "Corrandine", "Type": "Standard", "Controller": "Talgrave Dominion", "Defense": "4/4", "Notes": "Annexed civilised world. Garrison troops outnumber Dominion administrators by nine to one. Curfew has been in continuous force since the annexation."}, {"Planet": "Sest", "Type": "Minor", "Controller": "Talgrave Dominion", "Defense": "2/2", "Notes": "Agricultural world. Serf-worked estates under manor-house administration, feeding Talgrave's hives on a fixed shipping quota. The militia is equipped for crowd suppression."}], "html": "<p><strong>Void Superiority:<\/strong> Talgrave Dominion: 11 — Talgrave Dominion<\/p>\n<p><em>Governor Aurelian Vosk continues to file tithe assessments. They accumulate in the Palatine Spire&#x27;s records office, bound and sealed by year, addressed to an Administratum that has not acknowledged receipt in four decades. Corrandine&#x27;s governor declined the Dominion&#x27;s protection in the eleventh year. The occupation garrison has held his capital since.<\/em><\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Planet<\/th><th>Type<\/th><th>Controller<\/th><th>Defense<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Planet\">Talgrave<\/td><td data-label=\"Type\">Major<\/td><td data-label=\"Controller\">Talgrave Dominion<\/td><td data-label=\"Defense\">8/8<\/td><td data-label=\"Notes\">Hive world. Six primary spires ringed by manufactorum belts and muster fields that process forty thousand conscripts a season. Vosk governs from the Palatine Spire. The records office occupies its eleventh tier.<\/td><\/tr><tr><td data-label=\"Planet\">Corrandine<\/td><td data-label=\"Type\">Standard<\/td><td data-label=\"Controller\">Talgrave Dominion<\/td><td data-label=\"Defense\">4/4<\/td><td data-label=\"Notes\">Annexed civilised world. Garrison troops outnumber Dominion administrators by nine to one. Curfew has been in continuous force since the annexation.<\/td><\/tr><tr><td data-label=\"Planet\">Sest<\/td><td data-label=\"Type\">Minor<\/td><td data-label=\"Controller\">Talgrave Dominion<\/td><td data-label=\"Defense\">2/2<\/td><td data-label=\"Notes\">Agricultural world. Serf-worked estates under manor-house administration, feeding Talgrave&#x27;s hives on a fixed shipping quota. The militia is equipped for crowd suppression.<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>In-System Fleets:<\/strong><\/p>\n<p class=\"list-line\">- Talgrave Dominion: The Palatine Guard (4/5), Corrandine Occupation Fleet (4/5), Sest Patrol Wing (3/5)<\/p>\n<hr>", "text": "\n**Void Superiority:** Talgrave Dominion: 11 — Talgrave Dominion\n\n*Governor Aurelian Vosk continues to file tithe assessments. They accumulate in the Palatine Spire's records office, bound and sealed by year, addressed to an Administratum that has not acknowledged receipt in four decades. Corrandine's governor declined the Dominion's protection in the eleventh year. The occupation garrison has held his capital since.*\n\n| Planet | Type | Controller | Defense | Notes |\n|--------|------|------------|---------|-------|\n| Talgrave | Major | Talgrave Dominion | 8/8 | Hive world. Six primary spires ringed by manufactorum belts and muster fields that process forty thousand conscripts a season. Vosk governs from the Palatine Spire. The records office occupies its eleventh tier. |\n| Corrandine | Standard | Talgrave Dominion | 4/4 | Annexed civilised world. Garrison troops outnumber Dominion administrators by nine to one. Curfew has been in continuous force since the annexation. |\n| Sest | Minor | Talgrave Dominion | 2/2 | Agricultural world. Serf-worked estates under manor-house administration, feeding Talgrave's hives on a fixed shipping quota. The militia is equipped for crowd suppression. |\n\n**In-System Fleets:**\n- Talgrave Dominion: The Palatine Guard (4/5), Corrandine Occupation Fleet (4/5), Sest Patrol Wing (3/5)\n\n---\n\n"}, {"title": "Ketterin System (Independent — The Corvus Reduction)", "worlds": [{"Planet": "Ketterin", "Type": "Standard", "Controller": "Corvus Reduction", "Defense": "4/4", "Notes": "Forge world. Output limited to three sanctioned patterns, each manufactured to tolerances recorded against the original templates. Tithe capacity runs at a fraction of Anvarrus."}, {"Planet": "Vellun", "Type": "Minor", "Controller": "Corvus Reduction", "Defense": "2/2", "Notes": "Ore extraction and processing. Servitor-operated throughout, with a Tech-Priest oversight cadre of forty."}, {"Planet": "Drask", "Type": "Minor", "Controller": "Corvus Reduction", "Defense": "2/2", "Notes": "Archive vault and cogitator bank. The Reduction's pattern records and doctrinal texts, held behind physical seals and a Skitarii watch."}], "html": "<p><strong>Void Superiority:<\/strong> Corvus Reduction: 6 — Corvus Reduction<\/p>\n<p><em>Thelk&#x27;s envoys came to Ketterin in the fourteenth year. The Reduction received them in the outer chamber, observed the full ritual courtesies, and escorted them back to their shuttle within the hour. Drask&#x27;s archive has been closed to Anvarrus ciphers by standing order since. The Reduction produces three sanctioned patterns and declines all other commissions.<\/em><\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Planet<\/th><th>Type<\/th><th>Controller<\/th><th>Defense<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Planet\">Ketterin<\/td><td data-label=\"Type\">Standard<\/td><td data-label=\"Controller\">Corvus Reduction<\/td><td data-label=\"Defense\">4/4<\/td><td data-label=\"Notes\">Forge world. Output limited to three sanctioned patterns, each manufactured to tolerances recorded against the original templates. Tithe capacity runs at a fraction of Anvarrus.<\/td><\/tr><tr><td data-label=\"Planet\">Vellun<\/td><td data-label=\"Type\">Minor<\/td><td data-label=\"Controller\">Corvus Reduction<\/td><td data-label=\"Defense\">2/2<\/td><td data-label=\"Notes\">Ore extraction and processing. Servitor-operated throughout, with a Tech-Priest oversight cadre of forty.<\/td><\/tr><tr><td data-label=\"Planet\">Drask<\/td><td data-label=\"Type\">Minor<\/td><td data-label=\"Controller\">Corvus Reduction<\/td><td data-label=\"Defense\">2/2<\/td><td data-label=\"Notes\">Archive vault and cogitator bank. The Reduction&#x27;s pattern records and doctrinal texts, held behind physical seals and a Skitarii watch.<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>In-System Fleets:<\/strong><\/p>\n<p class=\"list-line\">- Corvus Reduction: The Sealed Codex (4/5), Drask Archive Escort (2/5)<\/p>\n<hr>", "text": "\n**Void Superiority:** Corvus Reduction: 6 — Corvus Reduction\n\n*Thelk's envoys came to Ketterin in the fourteenth year. The Reduction received them in the outer chamber, observed the full ritual courtesies, and escorted them back to their shuttle within the hour. Drask's archive has been closed to Anvarrus ciphers by standing order since. The Reduction produces three sanctioned patterns and declines all other commissions.*\n\n| Planet | Type | Controller | Defense | Notes |\n|--------|------|------------|---------|-------|\n| Ketterin | Standard | Corvus Reduction | 4/4 | Forge world. Output limited to three sanctioned patterns, each manufactured to tolerances recorded against the original templates. Tithe capacity runs at a fraction of Anvarrus. |\n| Vellun | Minor | Corvus Reduction | 2/2 | Ore extraction and processing. Servitor-operated throughout, with a Tech-Priest oversight cadre of forty. |\n| Drask | Minor | Corvus Reduction | 2/2 | Archive vault and cogitator bank. The Reduction's pattern records and doctrinal texts, held behind physical seals and a Skitarii watch. |\n\n**In-System Fleets:**\n- Corvus Reduction: The Sealed Codex (4/5), Drask Archive Escort (2/5)\n\n---\n\n\n"}], "rules": [{"title": "Campaign setup", "html": "<p>CAMPAIGN SETUP<\/p>", "text": " CAMPAIGN SETUP\n\n"}, {"title": "Fleet Strength Clarification", "html": "<p><strong>Fleet Strength represents combat effectiveness — NOT vessel count.<\/strong> A single point of Fleet Strength encompasses crew readiness, ammunition stores, morale, hull integrity, fuel reserves, and operational capacity. A fleet cannot be reduced to a single vessel; when Fleet Strength drops to 1/5, the fleet is combat-ineffective but still exists as a formation. At 0, the fleet is destroyed as a coherent fighting force.<\/p>\n<p>This distinction matters for:<\/p>\n<p class=\"list-line\">- <strong>Damage calculations:<\/strong> Fleet Strength lost represents degraded combat capability, not ships exploding<\/p>\n<p class=\"list-line\">- <strong>Regeneration:<\/strong> Recovering Fleet Strength represents repairs, resupply, crew rotation, and morale recovery<\/p>\n<p class=\"list-line\">- <strong>Constructions:<\/strong> Fleet-attached constructions represent specialized capacity, not individual ships<\/p>", "text": "\n**Fleet Strength represents combat effectiveness — NOT vessel count.** A single point of Fleet Strength encompasses crew readiness, ammunition stores, morale, hull integrity, fuel reserves, and operational capacity. A fleet cannot be reduced to a single vessel; when Fleet Strength drops to 1/5, the fleet is combat-ineffective but still exists as a formation. At 0, the fleet is destroyed as a coherent fighting force.\n\nThis distinction matters for:\n- **Damage calculations:** Fleet Strength lost represents degraded combat capability, not ships exploding\n- **Regeneration:** Recovering Fleet Strength represents repairs, resupply, crew rotation, and morale recovery\n- **Constructions:** Fleet-attached constructions represent specialized capacity, not individual ships\n\n"}, {"title": "Faction Alignments", "html": "<p>Factions with the same Alignment are Allied. Factions with different Alignments are Hostile.<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Faction<\/th><th>Alignment<\/th><th>Per Manpower<\/th><th>Ratio to Marine<\/th><th>vs Guard<\/th><th>Force Description<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Faction\">Space Marines<\/td><td data-label=\"Alignment\">Imperium<\/td><td data-label=\"Per Manpower\">40<\/td><td data-label=\"Ratio to Marine\">1:1<\/td><td data-label=\"vs Guard\">1:15<\/td><td data-label=\"Force Description\">Battle-brothers only. Chapter Serfs, Servitors, and non-combat personnel not tracked. Vehicle crews included.<\/td><\/tr><tr><td data-label=\"Faction\">Chaos Space Marines<\/td><td data-label=\"Alignment\">Chaos<\/td><td data-label=\"Per Manpower\">40<\/td><td data-label=\"Ratio to Marine\">1:1<\/td><td data-label=\"vs Guard\">1:15<\/td><td data-label=\"Force Description\">Traitor Astartes only. Cultists, mutants, and daemonic auxiliaries supplement forces but not explicitly tracked.<\/td><\/tr><tr><td data-label=\"Faction\">Grey Knights<\/td><td data-label=\"Alignment\">Imperium<\/td><td data-label=\"Per Manpower\">40<\/td><td data-label=\"Ratio to Marine\">1:1<\/td><td data-label=\"vs Guard\">1:15<\/td><td data-label=\"Force Description\">Battle-brothers only. Inquisitorial retinues and support staff not tracked.<\/td><\/tr><tr><td data-label=\"Faction\">Sisters of Battle<\/td><td data-label=\"Alignment\">Imperium<\/td><td data-label=\"Per Manpower\">100<\/td><td data-label=\"Ratio to Marine\">1:2.5<\/td><td data-label=\"vs Guard\">1:6<\/td><td data-label=\"Force Description\">Battle Sisters and vehicle crews. Ecclesiarchy support, Arco-flagellants, Penitent Engines as auxiliary not tracked.<\/td><\/tr><tr><td data-label=\"Faction\">Imperial Guard<\/td><td data-label=\"Alignment\">Imperium<\/td><td data-label=\"Per Manpower\">600<\/td><td data-label=\"Ratio to Marine\">1:15<\/td><td data-label=\"vs Guard\">Baseline<\/td><td data-label=\"Force Description\">Frontline infantry, officers, heavy weapons teams, tank crews. Logistics and rear echelon not tracked.<\/td><\/tr><tr><td data-label=\"Faction\">Traitor Guard<\/td><td data-label=\"Alignment\">Chaos<\/td><td data-label=\"Per Manpower\">600<\/td><td data-label=\"Ratio to Marine\">1:15<\/td><td data-label=\"vs Guard\">Baseline<\/td><td data-label=\"Force Description\">As Imperial Guard. Mutants and Chaos-touched may supplement but not tracked.<\/td><\/tr><tr><td data-label=\"Faction\">Craftworld Eldar<\/td><td data-label=\"Alignment\">Aeldari<\/td><td data-label=\"Per Manpower\">100<\/td><td data-label=\"Ratio to Marine\">1:2.5<\/td><td data-label=\"vs Guard\">1:6<\/td><td data-label=\"Force Description\">Mix of Aspect Warriors and Guardian militia. Seers, vehicle crews included. Wraithbone constructs as heavy support not explicitly tracked.<\/td><\/tr><tr><td data-label=\"Faction\">Harlequins<\/td><td data-label=\"Alignment\">Aeldari<\/td><td data-label=\"Per Manpower\">15<\/td><td data-label=\"Ratio to Marine\">2.67:1<\/td><td data-label=\"vs Guard\">1:40<\/td><td data-label=\"Force Description\">Players only. Troupes, Shadowseers, Death Jesters, Solitaires. No auxiliaries - they operate alone.<\/td><\/tr><tr><td data-label=\"Faction\">Drukhari<\/td><td data-label=\"Alignment\">Drukhari<\/td><td data-label=\"Per Manpower\">160<\/td><td data-label=\"Ratio to Marine\">1:4<\/td><td data-label=\"vs Guard\">1:3.75<\/td><td data-label=\"Force Description\">Kabalite Warriors, Wyches, vehicle crews. Haemonculus creations and slaves may supplement raids but not tracked.<\/td><\/tr><tr><td data-label=\"Faction\">Necrons<\/td><td data-label=\"Alignment\">Necron<\/td><td data-label=\"Per Manpower\">160<\/td><td data-label=\"Ratio to Marine\">1:4<\/td><td data-label=\"vs Guard\">1:3.75<\/td><td data-label=\"Force Description\">Warriors, Immortals, command elements. Canoptek constructs (Scarabs, Wraiths, Spyders) as auxiliary not explicitly tracked.<\/td><\/tr><tr><td data-label=\"Faction\">Tau<\/td><td data-label=\"Alignment\">T&#x27;au<\/td><td data-label=\"Per Manpower\">320<\/td><td data-label=\"Ratio to Marine\">1:8<\/td><td data-label=\"vs Guard\">1:1.9<\/td><td data-label=\"Force Description\">Fire Caste Warriors, Pathfinders, Battlesuit pilots, vehicle crews. Kroot and Vespid auxiliaries handled as separate formations.<\/td><\/tr><tr><td data-label=\"Faction\">Orks<\/td><td data-label=\"Alignment\">Ork<\/td><td data-label=\"Per Manpower\">400<\/td><td data-label=\"Ratio to Marine\">1:10<\/td><td data-label=\"vs Guard\">1:1.5<\/td><td data-label=\"Force Description\">Boyz, Nobz, specialist mobs, vehicle crews. Gretchin serve as support. Squigs not tracked.<\/td><\/tr><tr><td data-label=\"Faction\">Tyranids<\/td><td data-label=\"Alignment\">Tyranid<\/td><td data-label=\"Per Manpower\">800<\/td><td data-label=\"Ratio to Marine\">1:20<\/td><td data-label=\"vs Guard\">1:1.3<\/td><td data-label=\"Force Description\">Weighted average: primarily Gaunts with Warriors and Genestealers as synapse/elite. Larger bioforms (Carnifexes, etc.) as heavy support.<\/td><\/tr><tr><td data-label=\"Faction\">Chaos Daemons<\/td><td data-label=\"Alignment\">Chaos<\/td><td data-label=\"Per Manpower\">100<\/td><td data-label=\"Ratio to Marine\">1:2.5<\/td><td data-label=\"vs Guard\">1:6<\/td><td data-label=\"Force Description\">Full daemonic incursion: lesser daemons as line troops (Bloodletters, Daemonettes, Plaguebearers, Horrors). Greater Daemons and Daemon Princes as command elements.<\/td><\/tr><tr><td data-label=\"Faction\">Adeptus Mechanicus<\/td><td data-label=\"Alignment\">Imperium<\/td><td data-label=\"Per Manpower\">240<\/td><td data-label=\"Ratio to Marine\">1:6<\/td><td data-label=\"vs Guard\">1:2.5<\/td><td data-label=\"Force Description\">Skitarii Rangers/Vanguard, Tech-Priests, Servitors. Battle Automata and heavier war machines as support not explicitly tracked.<\/td><\/tr><tr><td data-label=\"Faction\">Independent (Rogue Traders, Pirates, minor xenos, unaligned forces)<\/td><td data-label=\"Alignment\">Independent<\/td><td data-label=\"Per Manpower\">Varies<\/td><td data-label=\"Ratio to Marine\">Varies<\/td><td data-label=\"vs Guard\">Varies<\/td><td data-label=\"Force Description\">Independents are all-encompassing. Manpower ratios depend on the specific force composition — use the ratio of whichever faction type best represents the force being fought.<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>", "text": "\nFactions with the same Alignment are Allied. Factions with different Alignments are Hostile.\n\n| Faction | Alignment | Per Manpower | Ratio to Marine | vs Guard | Force Description |\n|---------|-----------|--------------|-----------------|----------|-------------------|\n| Space Marines | Imperium | 40 | 1:1 | 1:15 | Battle-brothers only. Chapter Serfs, Servitors, and non-combat personnel not tracked. Vehicle crews included. |\n| Chaos Space Marines | Chaos | 40 | 1:1 | 1:15 | Traitor Astartes only. Cultists, mutants, and daemonic auxiliaries supplement forces but not explicitly tracked. |\n| Grey Knights | Imperium | 40 | 1:1 | 1:15 | Battle-brothers only. Inquisitorial retinues and support staff not tracked. |\n| Sisters of Battle | Imperium | 100 | 1:2.5 | 1:6 | Battle Sisters and vehicle crews. Ecclesiarchy support, Arco-flagellants, Penitent Engines as auxiliary not tracked. |\n| Imperial Guard | Imperium | 600 | 1:15 | Baseline | Frontline infantry, officers, heavy weapons teams, tank crews. Logistics and rear echelon not tracked. |\n| Traitor Guard | Chaos | 600 | 1:15 | Baseline | As Imperial Guard. Mutants and Chaos-touched may supplement but not tracked. |\n| Craftworld Eldar | Aeldari | 100 | 1:2.5 | 1:6 | Mix of Aspect Warriors and Guardian militia. Seers, vehicle crews included. Wraithbone constructs as heavy support not explicitly tracked. |\n| Harlequins | Aeldari | 15 | 2.67:1 | 1:40 | Players only. Troupes, Shadowseers, Death Jesters, Solitaires. No auxiliaries - they operate alone. |\n| Drukhari | Drukhari | 160 | 1:4 | 1:3.75 | Kabalite Warriors, Wyches, vehicle crews. Haemonculus creations and slaves may supplement raids but not tracked. |\n| Necrons | Necron | 160 | 1:4 | 1:3.75 | Warriors, Immortals, command elements. Canoptek constructs (Scarabs, Wraiths, Spyders) as auxiliary not explicitly tracked. |\n| Tau | T'au | 320 | 1:8 | 1:1.9 | Fire Caste Warriors, Pathfinders, Battlesuit pilots, vehicle crews. Kroot and Vespid auxiliaries handled as separate formations. |\n| Orks | Ork | 400 | 1:10 | 1:1.5 | Boyz, Nobz, specialist mobs, vehicle crews. Gretchin serve as support. Squigs not tracked. |\n| Tyranids | Tyranid | 800 | 1:20 | 1:1.3 | Weighted average: primarily Gaunts with Warriors and Genestealers as synapse/elite. Larger bioforms (Carnifexes, etc.) as heavy support. |\n| Chaos Daemons | Chaos | 100 | 1:2.5 | 1:6 | Full daemonic incursion: lesser daemons as line troops (Bloodletters, Daemonettes, Plaguebearers, Horrors). Greater Daemons and Daemon Princes as command elements. |\n| Adeptus Mechanicus | Imperium | 240 | 1:6 | 1:2.5 | Skitarii Rangers/Vanguard, Tech-Priests, Servitors. Battle Automata and heavier war machines as support not explicitly tracked. |\n| Independent (Rogue Traders, Pirates, minor xenos, unaligned forces) | Independent | Varies | Varies | Varies | Independents are all-encompassing. Manpower ratios depend on the specific force composition — use the ratio of whichever faction type best represents the force being fought. |\n\n---\n\n"}, {"title": "Major Faction 1: The 41st Expeditionary Korps", "html": "<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Field<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Field\">Faction Type<\/td><td data-label=\"Value\">Death Korps of Krieg — Astra Militarum Army Group<\/td><\/tr><tr><td data-label=\"Field\">Alignment<\/td><td data-label=\"Value\">Imperium<\/td><\/tr><tr><td data-label=\"Field\">Capital<\/td><td data-label=\"Value\">Sühne (Fortress World) — Defence: 12/12<\/td><\/tr><tr><td data-label=\"Field\">Faction Trait<\/td><td data-label=\"Value\"><strong>The Grinding Advance<\/strong> — Ignore Defended status difficulty modifier when attacking. Your attacks deal 1 damage even on defeat.<\/td><\/tr><tr><td data-label=\"Field\">Notable Officers<\/td><td data-label=\"Value\">Lord Marshal Kolbrant, Commissar Ruhn<\/td><\/tr><tr><td data-label=\"Field\">Starting Resources<\/td><td data-label=\"Value\">10 Supply / 10 Manpower<\/td><\/tr><tr><td data-label=\"Field\">Starting Fleet<\/td><td data-label=\"Value\">Transit Command Grunwald (5/5)<\/td><\/tr><\/tbody><\/table><\/div>", "text": "\n| Field | Value |\n|-------|-------|\n| Faction Type | Death Korps of Krieg — Astra Militarum Army Group |\n| Alignment | Imperium |\n| Capital | Sühne (Fortress World) — Defence: 12/12 |\n| Faction Trait | **The Grinding Advance** — Ignore Defended status difficulty modifier when attacking. Your attacks deal 1 damage even on defeat. |\n| Notable Officers | Lord Marshal Kolbrant, Commissar Ruhn |\n| Starting Resources | 10 Supply / 10 Manpower |\n| Starting Fleet | Transit Command Grunwald (5/5) |\n\n"}, {"title": "Major Faction 2: The Vior'la Expedition", "html": "<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Field<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Field\">Faction Type<\/td><td data-label=\"Value\">T&#x27;au Empire — Third Sphere Expansion Fleet<\/td><\/tr><tr><td data-label=\"Field\">Alignment<\/td><td data-label=\"Value\">T&#x27;au<\/td><\/tr><tr><td data-label=\"Field\">Capital<\/td><td data-label=\"Value\">Mont&#x27;au (Capital World) — Defence: 12/12<\/td><\/tr><tr><td data-label=\"Field\">Faction Trait<\/td><td data-label=\"Value\"><strong>The Provisioned Advance<\/strong> — Reinforce and Muster grant +4 instead of +3<\/td><\/tr><tr><td data-label=\"Field\">Notable Officers<\/td><td data-label=\"Value\">Shas&#x27;o Mont&#x27;yr, Aun&#x27;el Shovah&#x27;ka<\/td><\/tr><tr><td data-label=\"Field\">Starting Resources<\/td><td data-label=\"Value\">10 Supply / 10 Manpower<\/td><\/tr><tr><td data-label=\"Field\">Starting Fleet<\/td><td data-label=\"Value\">The Widening Circle (5/5)<\/td><\/tr><\/tbody><\/table><\/div>", "text": "\n| Field | Value |\n|-------|-------|\n| Faction Type | T'au Empire — Third Sphere Expansion Fleet |\n| Alignment | T'au |\n| Capital | Mont'au (Capital World) — Defence: 12/12 |\n| Faction Trait | **The Provisioned Advance** — Reinforce and Muster grant +4 instead of +3 |\n| Notable Officers | Shas'o Mont'yr, Aun'el Shovah'ka |\n| Starting Resources | 10 Supply / 10 Manpower |\n| Starting Fleet | The Widening Circle (5/5) |\n\n"}, {"title": "Major Faction 3: Splinter Fleet Cerberus", "html": "<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Field<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Field\">Faction Type<\/td><td data-label=\"Value\">Tyranids — Splinter of Hive Fleet Jormungandr<\/td><\/tr><tr><td data-label=\"Field\">Alignment<\/td><td data-label=\"Value\">Tyranid<\/td><\/tr><tr><td data-label=\"Field\">Capital<\/td><td data-label=\"Value\">The Star-Mother (Mobile Capital — Hive Ship) — Defence: 12/12<\/td><\/tr><tr><td data-label=\"Field\">Faction Trait<\/td><td data-label=\"Value\"><strong>Hive Ship<\/strong> — May use a Mobile Capital instead of a Planet-based Capital. See Mobile Capital Rules. <strong>No starting fleet.<\/strong><\/td><\/tr><tr><td data-label=\"Field\">Notable Officers<\/td><td data-label=\"Value\">The Norn Queen (aboard the Star-Mother), Hive Tyrant designates<\/td><\/tr><tr><td data-label=\"Field\">Starting Resources<\/td><td data-label=\"Value\">10 Supply / 10 Manpower<\/td><\/tr><tr><td data-label=\"Field\">Starting Fleet<\/td><td data-label=\"Value\">None — Mobile Capital only<\/td><\/tr><\/tbody><\/table><\/div>", "text": "\n| Field | Value |\n|-------|-------|\n| Faction Type | Tyranids — Splinter of Hive Fleet Jormungandr |\n| Alignment | Tyranid |\n| Capital | The Star-Mother (Mobile Capital — Hive Ship) — Defence: 12/12 |\n| Faction Trait | **Hive Ship** — May use a Mobile Capital instead of a Planet-based Capital. See Mobile Capital Rules. **No starting fleet.** |\n| Notable Officers | The Norn Queen (aboard the Star-Mother), Hive Tyrant designates |\n| Starting Resources | 10 Supply / 10 Manpower |\n| Starting Fleet | None — Mobile Capital only |\n\n"}, {"title": "Faction Traits", "html": "<p>When selecting a trait for your faction, rename it to something evocative that alludes to the effect without being a direct description. The name should sound like a doctrine, characteristic, or battle cry befitting your faction.<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Placeholder<\/th><th>Effect<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Placeholder\">[Mobile Capital]<\/td><td data-label=\"Effect\">May use a Mobile Capital instead of a Planet-based Capital. See Mobile Capital Rules. <strong>No starting fleet.<\/strong><\/td><\/tr><tr><td data-label=\"Placeholder\">[War Economy]<\/td><td data-label=\"Effect\">+3 Supply per Logistics Cycle<\/td><\/tr><tr><td data-label=\"Placeholder\">[Martial Culture]<\/td><td data-label=\"Effect\">+5 Manpower per Logistics Cycle<\/td><\/tr><tr><td data-label=\"Placeholder\">[Efficient Logistics]<\/td><td data-label=\"Effect\">Reinforce and Muster grant +4 instead of +3<\/td><\/tr><tr><td data-label=\"Placeholder\">[Salvagers]<\/td><td data-label=\"Effect\">+1 Supply per battle (planetary assault or Fleet Battle, as attacker or defender). +2 Supply when you capture a planet.<\/td><\/tr><tr><td data-label=\"Placeholder\">[Void Supremacy]<\/td><td data-label=\"Effect\">Expand Fleet costs no Supply<\/td><\/tr><tr><td data-label=\"Placeholder\">[Swift Mobilization]<\/td><td data-label=\"Effect\">Create Fleet starts at 3/5 instead of 1/5<\/td><\/tr><tr><td data-label=\"Placeholder\">[Fleet Endurance]<\/td><td data-label=\"Effect\">Your fleets regenerate +1 strength per Logistics Cycle if below maximum.<\/td><\/tr><tr><td data-label=\"Placeholder\">[Siege Doctrine]<\/td><td data-label=\"Effect\">Ignore Defended status difficulty modifier when attacking. Your attacks deal 1 damage even on defeat.<\/td><\/tr><tr><td data-label=\"Placeholder\">[Dread Reputation]<\/td><td data-label=\"Effect\">Enemies return only 60% resources on successful defence against you (instead of 80%)<\/td><\/tr><tr><td data-label=\"Placeholder\">[Fortification Experts]<\/td><td data-label=\"Effect\">Defend restores +2 additional defence<\/td><\/tr><tr><td data-label=\"Placeholder\">[Industrial Efficiency]<\/td><td data-label=\"Effect\">Construction costs 4 Supply instead of 5<\/td><\/tr><\/tbody><\/table><\/div>", "text": "\nWhen selecting a trait for your faction, rename it to something evocative that alludes to the effect without being a direct description. The name should sound like a doctrine, characteristic, or battle cry befitting your faction.\n\n| Placeholder | Effect |\n|-------------|--------|\n| [Mobile Capital] | May use a Mobile Capital instead of a Planet-based Capital. See Mobile Capital Rules. **No starting fleet.** |\n| [War Economy] | +3 Supply per Logistics Cycle |\n| [Martial Culture] | +5 Manpower per Logistics Cycle |\n| [Efficient Logistics] | Reinforce and Muster grant +4 instead of +3 |\n| [Salvagers] | +1 Supply per battle (planetary assault or Fleet Battle, as attacker or defender). +2 Supply when you capture a planet. |\n| [Void Supremacy] | Expand Fleet costs no Supply |\n| [Swift Mobilization] | Create Fleet starts at 3/5 instead of 1/5 |\n| [Fleet Endurance] | Your fleets regenerate +1 strength per Logistics Cycle if below maximum. |\n| [Siege Doctrine] | Ignore Defended status difficulty modifier when attacking. Your attacks deal 1 damage even on defeat. |\n| [Dread Reputation] | Enemies return only 60% resources on successful defence against you (instead of 80%) |\n| [Fortification Experts] | Defend restores +2 additional defence |\n| [Industrial Efficiency] | Construction costs 4 Supply instead of 5 |\n\n"}, {"title": "Capital Infrastructure", "html": "<p>All established Capitals include a built-in Orbital Shipyard. This Shipyard is destroyed if the Capital falls and does not transfer to the new controller.<\/p>\n<p>When establishing a new Capital via the Establish New Capital forced action, the built-in Orbital Shipyard is gained only after the Capital reaches maximum defense of 12 and is fully established.<\/p>", "text": "\nAll established Capitals include a built-in Orbital Shipyard. This Shipyard is destroyed if the Capital falls and does not transfer to the new controller.\n\nWhen establishing a new Capital via the Establish New Capital forced action, the built-in Orbital Shipyard is gained only after the Capital reaches maximum defense of 12 and is fully established.\n\n"}, {"title": "Mobile Capital Rules", "html": "<p>A faction with the [Mobile Capital] trait uses a mobile fortress — a Craftworld, World-Engine, Hive Ship, Ark Mechanicus, or equivalent — as their Capital instead of a planet.<\/p>\n<p><strong>Core Properties:<\/strong><\/p>\n<p class=\"list-line\">- 12/12 defence (Capital-class)<\/p>\n<p class=\"list-line\">- Generates +4 Supply / +4 Manpower per Logistics Cycle, as any Capital<\/p>\n<p class=\"list-line\">- Built-in Orbital Shipyard, as any Capital<\/p>\n<p class=\"list-line\">- Constructions may be built on it following normal Planetary/Orbital construction rules<\/p>\n<p class=\"list-line\">- <strong>No starting fleet<\/strong> — the faction must build its first fleet from the Capital&#x27;s Shipyard<\/p>\n<p><strong>Movement:<\/strong> The Mobile Capital may move to any system within the Subsector. This consumes a Fleet Action for the turn. The Mobile Capital is not a fleet and does not pay fleet maintenance during Logistics Cycles.<\/p>\n<p><strong>Fleet Battle:<\/strong> The Mobile Capital may participate in Fleet Battles, using its <strong>current defence value<\/strong> as its Fleet Strength for the roll. Initiating a Fleet Battle costs -1 defence (mirroring the -1 Fleet Strength initiation cost). Fleet Battle damage is applied to the Mobile Capital&#x27;s defence value. The Mobile Capital contributes its current defence value toward Void Superiority calculations.<\/p>\n<p><strong>Ground Assault:<\/strong> The Mobile Capital may launch Ground Assaults, using its current defence value as Fleet Strength for damage calculation. It may be attacked by enemies via Ground Assault, as a planet.<\/p>\n<p><strong>Uncontested Bombardment:<\/strong> A Mobile Capital cannot be reduced below 1 defence by Uncontested Bombardment, as any planet.<\/p>\n<p><strong>Destruction:<\/strong> If the Mobile Capital&#x27;s defence reaches 0, it is <strong>destroyed<\/strong> — it does not transfer to the attacker. The owning faction suffers Capital-tier Planet Fall penalties (-4 Supply, -4 Manpower) and must designate a new Capital on an owned planet, entering the Establish New Capital forced action. <strong>The [Mobile Capital] trait is permanently lost<\/strong> — the faction operates without a Faction Trait for the remainder of the campaign.<\/p>\n<p><strong>Elimination:<\/strong> A faction whose Mobile Capital is destroyed while holding no planets is eliminated from the campaign.<\/p>\n<hr>", "text": "\nA faction with the [Mobile Capital] trait uses a mobile fortress — a Craftworld, World-Engine, Hive Ship, Ark Mechanicus, or equivalent — as their Capital instead of a planet.\n\n**Core Properties:**\n- 12/12 defence (Capital-class)\n- Generates +4 Supply / +4 Manpower per Logistics Cycle, as any Capital\n- Built-in Orbital Shipyard, as any Capital\n- Constructions may be built on it following normal Planetary/Orbital construction rules\n- **No starting fleet** — the faction must build its first fleet from the Capital's Shipyard\n\n**Movement:** The Mobile Capital may move to any system within the Subsector. This consumes a Fleet Action for the turn. The Mobile Capital is not a fleet and does not pay fleet maintenance during Logistics Cycles.\n\n**Fleet Battle:** The Mobile Capital may participate in Fleet Battles, using its **current defence value** as its Fleet Strength for the roll. Initiating a Fleet Battle costs -1 defence (mirroring the -1 Fleet Strength initiation cost). Fleet Battle damage is applied to the Mobile Capital's defence value. The Mobile Capital contributes its current defence value toward Void Superiority calculations.\n\n**Ground Assault:** The Mobile Capital may launch Ground Assaults, using its current defence value as Fleet Strength for damage calculation. It may be attacked by enemies via Ground Assault, as a planet.\n\n**Uncontested Bombardment:** A Mobile Capital cannot be reduced below 1 defence by Uncontested Bombardment, as any planet.\n\n**Destruction:** If the Mobile Capital's defence reaches 0, it is **destroyed** — it does not transfer to the attacker. The owning faction suffers Capital-tier Planet Fall penalties (-4 Supply, -4 Manpower) and must designate a new Capital on an owned planet, entering the Establish New Capital forced action. **The [Mobile Capital] trait is permanently lost** — the faction operates without a Faction Trait for the remainder of the campaign.\n\n**Elimination:** A faction whose Mobile Capital is destroyed while holding no planets is eliminated from the campaign.\n\n\n---\n\n"}, {"title": "SECTION 2: TURN STRUCTURE", "html": "<p><strong>Resource Requirements:<\/strong> A faction cannot voluntarily take any action that would reduce their Supply or Manpower below 0. If an action requires more resources than the faction possesses, that action cannot be taken. Deficits only occur from involuntary losses (Logistics maintenance, battle outcomes, Planet Fall, fleet destruction, etc.).<\/p>\n<p>Each turn represents one battle. Follow these phases in order:<\/p>", "text": "\n**Resource Requirements:** A faction cannot voluntarily take any action that would reduce their Supply or Manpower below 0. If an action requires more resources than the faction possesses, that action cannot be taken. Deficits only occur from involuntary losses (Logistics maintenance, battle outcomes, Planet Fall, fleet destruction, etc.).\n\nEach turn represents one battle. Follow these phases in order:\n\n"}, {"title": "Phase 0: Logistics (Every 3rd Cycle Only)", "html": "<p>On Logistics Cycles (Cycles 3, 6, 9, 12, etc.), before any faction acts:<\/p>\n<p><strong>Income (Variable by World Type):<\/strong><\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>World Type<\/th><th>Supply<\/th><th>Manpower<\/th><\/tr><\/thead><tbody><tr><td data-label=\"World Type\">Minor<\/td><td data-label=\"Supply\">+1<\/td><td data-label=\"Manpower\">+1<\/td><\/tr><tr><td data-label=\"World Type\">Standard<\/td><td data-label=\"Supply\">+2<\/td><td data-label=\"Manpower\">+2<\/td><\/tr><tr><td data-label=\"World Type\">Major<\/td><td data-label=\"Supply\">+3<\/td><td data-label=\"Manpower\">+3<\/td><\/tr><tr><td data-label=\"World Type\">Capital<\/td><td data-label=\"Supply\">+4<\/td><td data-label=\"Manpower\">+4<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"list-line\">- All factions gain resources based on planets controlled (sum of world types)<\/p>\n<p class=\"list-line\">- All factions pay -1 Supply and -1 Manpower per Fleet owned (maintenance)<\/p>\n<p class=\"list-line\">- If Supply maintenance cannot be paid, Supply Deficit occurs (see Resource Deficits)<\/p>\n<p class=\"list-line\">- If Manpower maintenance cannot be paid, Manpower Deficit occurs (see Resource Deficits)<\/p>", "text": "\nOn Logistics Cycles (Cycles 3, 6, 9, 12, etc.), before any faction acts:\n\n**Income (Variable by World Type):**\n| World Type | Supply | Manpower |\n|------------|--------|----------|\n| Minor | +1 | +1 |\n| Standard | +2 | +2 |\n| Major | +3 | +3 |\n| Capital | +4 | +4 |\n\n- All factions gain resources based on planets controlled (sum of world types)\n- All factions pay -1 Supply and -1 Manpower per Fleet owned (maintenance)\n- If Supply maintenance cannot be paid, Supply Deficit occurs (see Resource Deficits)\n- If Manpower maintenance cannot be paid, Manpower Deficit occurs (see Resource Deficits)\n\n"}, {"title": "Phase 1: Event Roll (Optional — Once Per Cycle)", "html": "<p>Rolled ONCE per Cycle, before any faction takes its turn. On Logistics Cycles, this follows immediately after Phase 0.<\/p>\n<p>Roll 1d6. On a 1 or 6, roll on the Event Table (Section 4). Otherwise, no event this Cycle.<\/p>\n<p><strong>Duration:<\/strong> A triggered event applies for the whole of the Cycle in which it is rolled. It affects every faction&#x27;s turn in that Cycle, in turn order, and expires at the start of the following Cycle — immediately before Major Faction 1 begins its turn. Events do not carry over. There is one Event Roll per Cycle, not one per faction.<\/p>", "text": "\nRolled ONCE per Cycle, before any faction takes its turn. On Logistics Cycles, this follows immediately after Phase 0.\n\nRoll 1d6. On a 1 or 6, roll on the Event Table (Section 4). Otherwise, no event this Cycle.\n\n**Duration:** A triggered event applies for the whole of the Cycle in which it is rolled. It affects every faction's turn in that Cycle, in turn order, and expires at the start of the following Cycle — immediately before Major Faction 1 begins its turn. Events do not carry over. There is one Event Roll per Cycle, not one per faction.\n\n"}, {"title": "Phase 2: Fleet Actions", "html": "<p>Each fleet may take ONE Fleet Action per turn. Different fleets can take different actions. A fleet that takes a Fleet Action cannot take another Fleet Action this turn.<\/p>", "text": "\nEach fleet may take ONE Fleet Action per turn. Different fleets can take different actions. A fleet that takes a Fleet Action cannot take another Fleet Action this turn.\n\n"}, {"title": "Fleet Movement", "html": "<p>Move this fleet to any system within the Subsector.<\/p>", "text": "\nMove this fleet to any system within the Subsector.\n\n"}, {"title": "Fleet Transfer", "html": "<p>Transfer strength points between this fleet and another fleet in the same system. No fleet can drop below 1/5 or exceed 5/5. Requires Void Superiority.<\/p>", "text": "\nTransfer strength points between this fleet and another fleet in the same system. No fleet can drop below 1/5 or exceed 5/5. Requires Void Superiority.\n\n"}, {"title": "Fleet Merge", "html": "<p>Merge this fleet with another fleet in the same system. Combined strength caps at 5/5 (excess is lost). The absorbed fleet ceases to exist.<\/p>", "text": "\nMerge this fleet with another fleet in the same system. Combined strength caps at 5/5 (excess is lost). The absorbed fleet ceases to exist.\n\n"}, {"title": "Scuttle Fleet", "html": "<p>Decommission this fleet and recover half its Fleet Strength as Supply (rounded down). Requires Void Superiority.<\/p>", "text": "\nDecommission this fleet and recover half its Fleet Strength as Supply (rounded down). Requires Void Superiority.\n\n"}, {"title": "Attack", "html": "<p>Assault an enemy or neutral planet. Costs Supply based on world type (Minor -1, Standard -2, Major -3, Capital -4). Commit Manpower equal to base damage dealt. Damage dealt = 1 per 5 friendly Fleet Strength in system (minimum 1 if uncontested). <strong>Uncontested Bombardment:<\/strong> When no hostile fleets are present in-system, the attack automatically succeeds — no battle is fought. The attacker pays double Supply costs (Minor -2, Standard -4, Major -6, Capital -8) and commits no Manpower. Damage is applied directly. A planet cannot be reduced below 1 defence by Uncontested Bombardment — the final point of defence must be broken by a Ground Assault. <strong>Ground Assault:<\/strong> A full planetary assault engaging the planet&#x27;s garrison directly. This can be launched whether or not hostile fleets are present in-system — you do not need to clear enemy fleets first. If hostile fleets ARE present, they contribute to the defender&#x27;s strength in the battle. Difficulty and AI rolls are calculated after costs are paid and Manpower is committed.<\/p>\n<p><strong>Attack Participation:<\/strong> All friendly fleets in-system that wish to contribute their strength to an Attack must use their Fleet Action for that battle. Fleets that do not participate keep their Fleet Action for other purposes but do not add their strength to the damage calculation. Multiple fleets combining for a single Attack pool their Fleet Strength for calculating damage dealt.<\/p>\n<p><strong>Multi-Front Warfare:<\/strong> A faction with multiple fleets can launch multiple Attacks in the same turn — each fleet can attack independently. This represents the strategic advantage of maintaining multiple operational formations.<\/p>", "text": "\nAssault an enemy or neutral planet. Costs Supply based on world type (Minor -1, Standard -2, Major -3, Capital -4). Commit Manpower equal to base damage dealt. Damage dealt = 1 per 5 friendly Fleet Strength in system (minimum 1 if uncontested). **Uncontested Bombardment:** When no hostile fleets are present in-system, the attack automatically succeeds — no battle is fought. The attacker pays double Supply costs (Minor -2, Standard -4, Major -6, Capital -8) and commits no Manpower. Damage is applied directly. A planet cannot be reduced below 1 defence by Uncontested Bombardment — the final point of defence must be broken by a Ground Assault. **Ground Assault:** A full planetary assault engaging the planet's garrison directly. This can be launched whether or not hostile fleets are present in-system — you do not need to clear enemy fleets first. If hostile fleets ARE present, they contribute to the defender's strength in the battle. Difficulty and AI rolls are calculated after costs are paid and Manpower is committed.\n\n**Attack Participation:** All friendly fleets in-system that wish to contribute their strength to an Attack must use their Fleet Action for that battle. Fleets that do not participate keep their Fleet Action for other purposes but do not add their strength to the damage calculation. Multiple fleets combining for a single Attack pool their Fleet Strength for calculating damage dealt.\n\n**Multi-Front Warfare:** A faction with multiple fleets can launch multiple Attacks in the same turn — each fleet can attack independently. This represents the strategic advantage of maintaining multiple operational formations.\n\n"}, {"title": "Fleet Battle", "html": "<p>Initiating faction (aggressor) pays -1 Fleet Strength to initiate. Both Factions roll a d20 plus their in-system Fleet Strength (calculated after the -1 initiation cost is paid). Highest roll wins. 1-5 higher = Loser -1 Fleet Strength per Fleet in Battle. 6-10 higher = Loser -2 Fleet Strength per Fleet in Battle. 11-15 higher = Loser -3 Fleet Strength per Fleet in Battle. 16-20+ higher = Loser Fleet(s) destroyed. Multiple fleets in a system combine their strength for the roll. <strong>All calculations use values after initiation costs are paid.<\/strong><\/p>\n<p><strong>Fleet Battle Participation:<\/strong> All friendly fleets in-system that wish to contribute their strength to a Fleet Battle must use their Fleet Action for that battle. Fleets that do not participate keep their Fleet Action for other purposes but do not add their strength to the roll. Only one Fleet Battle may occur per system per turn, regardless of how many fleets participate.<\/p>", "text": "\nInitiating faction (aggressor) pays -1 Fleet Strength to initiate. Both Factions roll a d20 plus their in-system Fleet Strength (calculated after the -1 initiation cost is paid). Highest roll wins. 1-5 higher = Loser -1 Fleet Strength per Fleet in Battle. 6-10 higher = Loser -2 Fleet Strength per Fleet in Battle. 11-15 higher = Loser -3 Fleet Strength per Fleet in Battle. 16-20+ higher = Loser Fleet(s) destroyed. Multiple fleets in a system combine their strength for the roll. **All calculations use values after initiation costs are paid.**\n\n**Fleet Battle Participation:** All friendly fleets in-system that wish to contribute their strength to a Fleet Battle must use their Fleet Action for that battle. Fleets that do not participate keep their Fleet Action for other purposes but do not add their strength to the roll. Only one Fleet Battle may occur per system per turn, regardless of how many fleets participate.\n\n"}, {"title": "Structure Assault", "html": "<p>Target a construction. Initiating faction pays -1 Fleet Strength. <strong>In-Progress Constructions:<\/strong> Any successful assault destroys the construction immediately. <strong>Completed Constructions:<\/strong> Minor constructions have 3/3 defence, Major constructions have 5/5 defence. Roll as per Fleet Battle — if attacker wins, deal 1 damage to structure per margin bracket (1-5 = 1 damage, 6-10 = 2 damage, 11-15 = 3 damage, 16+ = structure destroyed). If defender wins, normal Fleet Battle damage applied to attacker only. Structures destroyed via Structure Assault cannot be captured, only destroyed.<\/p>", "text": "\nTarget a construction. Initiating faction pays -1 Fleet Strength. **In-Progress Constructions:** Any successful assault destroys the construction immediately. **Completed Constructions:** Minor constructions have 3/3 defence, Major constructions have 5/5 defence. Roll as per Fleet Battle — if attacker wins, deal 1 damage to structure per margin bracket (1-5 = 1 damage, 6-10 = 2 damage, 11-15 = 3 damage, 16+ = structure destroyed). If defender wins, normal Fleet Battle damage applied to attacker only. Structures destroyed via Structure Assault cannot be captured, only destroyed.\n\n"}, {"title": "Expand Fleet", "html": "<p>+2 Fleet Strength to this Fleet (max 5). Costs -1 Supply. This fleet must be at a location with an Orbital Shipyard or established Capital to take this action.<\/p>", "text": "\n+2 Fleet Strength to this Fleet (max 5). Costs -1 Supply. This fleet must be at a location with an Orbital Shipyard or established Capital to take this action.\n\n\n"}, {"title": "Void Superiority", "html": "<p><strong>Void Superiority:<\/strong> Your total fleet strength in-system exceeds total enemy fleet strength.<\/p>", "text": "\n**Void Superiority:** Your total fleet strength in-system exceeds total enemy fleet strength.\n\n"}, {"title": "Phase 3: Faction Action", "html": "<p>A faction may take ONE Faction Action per turn. This represents the faction&#x27;s central command capacity.<\/p>", "text": "\nA faction may take ONE Faction Action per turn. This represents the faction's central command capacity.\n\n"}, {"title": "Defend", "html": "<p>Fortify a Planet or repair a Construction you control. <strong>Planet:<\/strong> Costs Supply and Manpower based on world type (Minor -
