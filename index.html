d Build/Upgrade work.\n\nEvery point of actual host damage removes 1 Integrity from every attached project. Initiation/resource expenditure is not damage. At 0, construction is destroyed regardless of source. Minor 3/Major 5, upgraded 6/10 maximum Integrity. Ordinary planetary/system constructions operate at full applicable Integrity; an upgrade retains its completed base effect while Integrity remains at least the base maximum. Newly unfinished projects give no effect.\n\n**Persistent planetary exceptions:** once completed, Automated Defences, Regenerative Fortifications, Landing Zones, Militia Barracks, Void Shield Generator and Fortification Network retain their base effect at positive Integrity. Full upgraded Integrity is required for improved effects, except already granted Fortification Network capacity persists until destruction. Its completion adds 2 current and maximum defence, or 4 total after upgrade; repair never grants that capacity again. At destruction remove the granted maximum and cap current defence accordingly.\n\nCompleted **Fleet-category** constructions retain base effects at any positive Integrity; upgraded effects require full upgraded Integrity. Their base remains during upgrading. This category exception does not turn a planetary Forge aboard a Mobile Capital into a Fleet construction, or protect an unfinished Void Station as one. Completed Assault Cruiser/Flagship capacity remains until the fleet is destroyed. Repair never grants unrelated lost Fleet Strength.\n\nOne ordinary construction slot per holding, with its established Capital's built-in yard free and outside the slot. Consolidation is a holding development, not a permanent occupied building slot. Apply the existing shipyard/Grand Yard prerequisite chain. No new fleet/system construction cap; normal unique-profile rules and transferred fleet constructions remain. Multiple projects may exist but only one Construction action is available.\n\nCapture applies host/construction damage first. Surviving planetary constructions transfer with remaining Integrity/progress. System constructions transfer only when one faction controls all planets and has Void Superiority: Minor transfers, Major destroyed. Completed Void Stations are holdings and use ordinary capture; an unfinished station remains attached to its construction fleet.\n\n", "html": "<p>One Construction action begins/advances one project or repairs a completed construction. Minor stages normally cost 3 Supply, Major stages 5, with the catalogue exceptions below. Grand Orbital Shipyard is now Minor (3 stages). Troop Transport, Repair Tender, Militia Barracks and Void Shield Generator cost 2 Supply per stage. System Defence Station, System Repair Station, Salvage Wing, Storm Transit, Consolidation Works and Void Station cost 3 per stage. Minor base/upgrade each require 3 stages; Major each 5. Industrial costs and starting Integrity apply as listed. Full host defence/strength is required to Build, Upgrade or Repair; system-based constructions require an owned holding or living fleet providing presence in their system, but have no host defence prerequisite.<\/p>\n<p>Repair restores up to 3 Integrity at 1 Supply each, no Manpower. It cannot finish unfinished construction/upgrades. A separate Faction-action Defend may repair a completed damaged construction at a full host: Minor costs 1 Supply / 1 Manpower and restores 1 Integrity; Major costs 3 of each and restores 3. Fortification Experts does not alter this construction action. Repair never completes unfinished Build/Upgrade work.<\/p>\n<p>Every point of actual host damage removes 1 Integrity from every attached project. Initiation/resource expenditure is not damage. At 0, construction is destroyed regardless of source. Minor 3/Major 5, upgraded 6/10 maximum Integrity. Ordinary planetary/system constructions operate at full applicable Integrity; an upgrade retains its completed base effect while Integrity remains at least the base maximum. Newly unfinished projects give no effect.<\/p>\n<p><strong>Persistent planetary exceptions:<\/strong> once completed, Automated Defences, Regenerative Fortifications, Landing Zones, Militia Barracks, Void Shield Generator and Fortification Network retain their base effect at positive Integrity. Full upgraded Integrity is required for improved effects, except already granted Fortification Network capacity persists until destruction. Its completion adds 2 current and maximum defence, or 4 total after upgrade; repair never grants that capacity again. At destruction remove the granted maximum and cap current defence accordingly.<\/p>\n<p>Completed <strong>Fleet-category<\/strong> constructions retain base effects at any positive Integrity; upgraded effects require full upgraded Integrity. Their base remains during upgrading. This category exception does not turn a planetary Forge aboard a Mobile Capital into a Fleet construction, or protect an unfinished Void Station as one. Completed Assault Cruiser/Flagship capacity remains until the fleet is destroyed. Repair never grants unrelated lost Fleet Strength.<\/p>\n<p>One ordinary construction slot per holding, with its established Capital&#x27;s built-in yard free and outside the slot. Consolidation is a holding development, not a permanent occupied building slot. Apply the existing shipyard/Grand Yard prerequisite chain. No new fleet/system construction cap; normal unique-profile rules and transferred fleet constructions remain. Multiple projects may exist but only one Construction action is available.<\/p>\n<p>Capture applies host/construction damage first. Surviving planetary constructions transfer with remaining Integrity/progress. System constructions transfer only when one faction controls all planets and has Void Superiority: Minor transfers, Major destroyed. Completed Void Stations are holdings and use ordinary capture; an unfinished station remains attached to its construction fleet.<\/p>"}, {"title": "Construction catalogue", "text": "\nCosts below are per action, not total project prices. Action counts assume undamaged progress and normal starting Integrity; Industrial starts new projects at 2. An upgrade adds another base-sized block to maximum Integrity and normally takes the same number of Build actions as the base. “No upgrade” means no separate upgraded profile. A destroyed project must be rebuilt.\n\n\n**Planetary/Orbital Constructions** — Built on a specific planet, station or eligible Mobile Capital. Affects that planet or system.\n\n*Minor (3 actions base, 3 actions upgrade, capturable)*\n\n| Construction | Supply per Build/Upgrade action: normal / Industrial | Base Effect | Upgraded Effect |\n|---|---:|---|---|\n| [Orbital Shipyard] | 3 / 1 | Allows fleet creation and ordinary expansion here; Create normally starts 1/5 | No upgrade; prerequisite for Grand Orbital Shipyard |\n| [Grand Orbital Shipyard] | 3 / 1 | Minor, 3 stages: Create at 3/5; requires a shipyard, including a built-in Capital yard | Create at 5/5; best starting-Strength effect applies, not an additive stack |\n| [Supply Depot] | 3 / 1 | +3 Supply per Logistics Cycle | +6 Supply per Logistics Cycle |\n| [Training Grounds] | 3 / 1 | +3 Manpower per Logistics Cycle | +6 Manpower per Logistics Cycle |\n| [Automated Defences] | 3 / 1 | +1 defence regen/cycle if not attacked | +2 defence regen/cycle if not attacked |\n| [Bunker Network] | 3 / 1 | +4 defender roll (AI) / -1 Difficulty (Player) | +8 defender roll (AI) / -2 Difficulty (Player) |\n| [Landing Zones] | 3 / 1 | Minor: Garrison Transfers to this holding may use damaged donors; donors retain 1. | No upgrade |\n| [Orbital Cannons] | 3 / 1 | -1 Fleet Strength to largest hostile fleet when attacked | -2 Fleet Strength to largest hostile fleet when attacked |\n\n*Major (5 actions base, 5 actions upgrade; surviving planetary constructions transfer on capture)*\n\n| Construction | Supply per Build/Upgrade action: normal / Industrial | Base Effect | Upgraded Effect |\n|---|---:|---|---|\n| [Forge Complex] | 5 / 2 | +7 Supply per Logistics Cycle | +14 Supply per Logistics Cycle |\n| [Military Academy] | 5 / 2 | +7 Manpower per Logistics Cycle | +14 Manpower per Logistics Cycle |\n| [Regenerative Fortifications] | 5 / 2 | +3 defence regen/cycle if not attacked | +6 defence regen/cycle if not attacked |\n| [Void Shield Generator] | 2 / 1 | -1 incoming attack damage (can reduce to 0) | -2 incoming attack damage (can reduce to 0) |\n| [Fortification Network] | 5 / 2 | +2 to planet's maximum defence | +4 to planet's maximum defence |\n| [Militia Barracks] | 2 / 1 | No defensive Manpower commitment or isolation; holding Defend costs no Manpower | No upgrade |\n| [Planetary Shield Network] | 5 / 2 | Invulnerable with Void Superiority / Defended status without | No upgrade |\n| [Consolidation Works] | 3 / 1 | Upgrade planet type by one tier: Minor (2/2) → Standard (4/4) → Major (8/8). Current and maximum defence double. **Repeatable** until Major. Cannot upgrade to Capital — only one Capital per faction. | N/A (repeatable construction, not upgradeable) |\n\n#### Void Constructions (Fleet-Attached)\n\n**Void Constructions (Fleet-Attached)** — Mobile, destroyed if fleet is destroyed.\n\n*Minor (3 actions base, 3 actions upgrade)*\n\n| Construction | Supply per Build/Upgrade action: normal / Industrial | Base Effect | Upgraded Effect |\n|---|---:|---|---|\n| [Troop Transport] | 2 / 1 | Victory return +2 committed Manpower | Victory return +4 committed Manpower; best transport only, cap at commitment |\n| [Repair Tender] | 2 / 1 | +1 to its surviving host fleet each Cycle, even after combat | +2 to its surviving host fleet each Cycle |\n| [Escort Squadron] | 3 / 1 | +3 to Fleet Battle roll | +6 to Fleet Battle roll |\n| [Assault Boats] | 3 / 1 | +2 fleet strength for ground assaults | +4 fleet strength for ground assaults |\n| [Bombardment Bay] | 3 / 1 | +1 ground assault damage | +2 ground assault damage |\n| [Assault Cruiser] | 3 / 1 | +2/2 fleet strength (tracked separately) | +4/4 fleet strength (tracked separately) |\n\n*Major (5 actions base, 5 actions upgrade)*\n\n| Construction | Supply per Build/Upgrade action: normal / Industrial | Base Effect | Upgraded Effect |\n|---|---:|---|---|\n| [Flagship] | 5 / 2 | +5 permanent strength/capacity | +10 total permanent strength/capacity; add to existing capacity |\n| [Carrier] | 5 / 2 | +10 strength for ground assaults | +20 strength for ground assaults |\n| [Siege Platform] | 5 / 2 | +3 ground assault damage | +6 ground assault damage |\n| [Salvage Wing] | 3 / 1 | +3 Supply per equipped victorious fleet in a Fleet Battle or attacking Ground Assault | +6; not a bombardment or Structure Assault reward |\n| [Scout Squadron] | 5 / 2 | This fleet may Move and Ground Assault or Uncontested Bombardment with the same Fleet Action. Resolve movement first; eligible allies already at the destination may join, spending their own actions. | No upgrade |\n\n#### Void Constructions (System-Based)\n\n**Void Constructions (System-Based)** — Stationary. Use the distinct system-control capture rule above.\n\n*Minor (3 actions base, 3 actions upgrade)*\n\n| Construction | Supply per Build/Upgrade action: normal / Industrial | Base Effect | Upgraded Effect |\n|---|---:|---|---|\n| [Defence Platform] | 3 / 1 | +5 to defender roll in Fleet Battles | +10 to defender roll in Fleet Battles |\n\n*Major (5 actions base, 5 actions upgrade)*\n\n| Construction | Supply per Build/Upgrade action: normal / Industrial | Base Effect | Upgraded Effect |\n|---|---:|---|---|\n| [System Defence Station] | 3 / 1 | -1 strength to every hostile fleet in system each Cycle | -2 to every hostile fleet |\n| [System Repair Station] | 3 / 1 | +1 strength to every eligible allied fleet in system each Cycle | +2 to every eligible allied fleet |\n| [Logistics Anchorage] | 5 / 2 | +1 defence regen to unattacked planets/cycle | +2 defence regen to unattacked planets/cycle |\n| [Void Station] | 3 / 1 | 2/2 station, functions as Minor planet | Upgrade via Consolidation Works: Minor (2/2) → Standard (4/4) → Major (8/8). Eligible for Establish New Capital when the faction has no functioning Capital. |\n| [Storm Transit] | 3 / 1 | Major, 5 stages, no upgrade: protect eligible allied fleets in this system from storm damage and permit their departure during a Warp Storm. | No upgrade |\n\n\n", "html": "<p>Costs below are per action, not total project prices. Action counts assume undamaged progress and normal starting Integrity; Industrial starts new projects at 2. An upgrade adds another base-sized block to maximum Integrity and normally takes the same number of Build actions as the base. “No upgrade” means no separate upgraded profile. A destroyed project must be rebuilt.<\/p>\n<p><strong>Planetary/Orbital Constructions<\/strong> — Built on a specific planet, station or eligible Mobile Capital. Affects that planet or system.<\/p>\n<p>*Minor (3 actions base, 3 actions upgrade, capturable)*<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Construction<\/th><th>Supply per Build/Upgrade action: normal / Industrial<\/th><th>Base Effect<\/th><th>Upgraded Effect<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Construction\">[Orbital Shipyard]<\/td><td data-label=\"Supply per Build/Upgrade action: normal / Industrial\">3 / 1<\/td><td data-label=\"Base Effect\">Allows fleet creation and ordinary expansion here; Create normally starts 1/5<\/td><td data-label=\"Upgraded Effect\">No upgrade; prerequisite for Grand Orbital Shipyard<\/td><\/tr><tr><td data-label=\"Construction\">[Grand Orbital Shipyard]<\/td><td data-label=\"Supply per Build/Upgrade action: normal / Industrial\">3 / 1<\/td><td data-label=\"Base Effect\">Minor, 3 stages: Create at 3/5; requires a shipyard, including a built-in Capital yard<\/td><td data-label=\"Upgraded Effect\">Create at 5/5; best starting-Strength effect applies, not an additive stack<\/td><\/tr><tr><td data-label=\"Construction\">[Supply Depot]<\/td><td data-label=\"Supply per Build/Upgrade action: normal / Industrial\">3 / 1<\/td><td data-label=\"Base Effect\">+3 Supply per Logistics Cycle<\/td><td data-label=\"Upgraded Effect\">+6 Supply per Logistics Cycle<\/td><\/tr><tr><td data-label=\"Construction\">[Training Grounds]<\/td><td data-label=\"Supply per Build/Upgrade action: normal / Industrial\">3 / 1<\/td><td data-label=\"Base Effect\">+3 Manpower per Logistics Cycle<\/td><td data-label=\"Upgraded Effect\">+6 Manpower per Logistics Cycle<\/td><\/tr><tr><td data-label=\"Construction\">[Automated Defences]<\/td><td data-label=\"Supply per Build/Upgrade action: normal / Industrial\">3 / 1<\/td><td data-label=\"Base Effect\">+1 defence regen/cycle if not attacked<\/td><td data-label=\"Upgraded Effect\">+2 defence regen/cycle if not attacked<\/td><\/tr><tr><td data-label=\"Construction\">[Bunker Network]<\/td><td data-label=\"Supply per Build/Upgrade action: normal / Industrial\">3 / 1<\/td><td data-label=\"Base Effect\">+4 defender roll (AI) / -1 Difficulty (Player)<\/td><td data-label=\"Upgraded Effect\">+8 defender roll (AI) / -2 Difficulty (Player)<\/td><\/tr><tr><td data-label=\"Construction\">[Landing Zones]<\/td><td data-label=\"Supply per Build/Upgrade action: normal / Industrial\">3 / 1<\/td><td data-label=\"Base Effect\">Minor: Garrison Transfers to this holding may use damaged donors; donors retain 1.<\/td><td data-label=\"Upgraded Effect\">No upgrade<\/td><\/tr><tr><td data-label=\"Construction\">[Orbital Cannons]<\/td><td data-label=\"Supply per Build/Upgrade action: normal / Industrial\">3 / 1<\/td><td data-label=\"Base Effect\">-1 Fleet Strength to largest hostile fleet when attacked<\/td><td data-label=\"Upgraded Effect\">-2 Fleet Strength to largest hostile fleet when attacked<\/td><\/tr><\/tbody><\/table><\/div>\n<p>*Major (5 actions base, 5 actions upgrade; surviving planetary constructions transfer on capture)*<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Construction<\/th><th>Supply per Build/Upgrade action: normal / Industrial<\/th><th>Base Effect<\/th><th>Upgraded Effect<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Construction\">[Forge Complex]<\/td><td data-label=\"Supply per Build/Upgrade action: normal / Industrial\">5 / 2<\/td><td data-label=\"Base Effect\">+7 Supply per Logistics Cycle<\/td><td data-label=\"Upgraded Effect\">+14 Supply per Logistics Cycle<\/td><\/tr><tr><td data-label=\"Construction\">[Military Academy]<\/td><td data-label=\"Supply per Build/Upgrade action: normal / Industrial\">5 / 2<\/td><td data-label=\"Base Effect\">+7 Manpower per Logistics Cycle<\/td><td data-label=\"Upgraded Effect\">+14 Manpower per Logistics Cycle<\/td><\/tr><tr><td data-label=\"Construction\">[Regenerative Fortifications]<\/td><td data-label=\"Supply per Build/Upgrade action: normal / Industrial\">5 / 2<\/td><td data-label=\"Base Effect\">+3 defence regen/cycle if not attacked<\/td><td data-label=\"Upgraded Effect\">+6 defence regen/cycle if not attacked<\/td><\/tr><tr><td data-label=\"Construction\">[Void Shield Generator]<\/td><td data-label=\"Supply per Build/Upgrade action: normal / Industrial\">2 / 1<\/td><td data-label=\"Base Effect\">-1 incoming attack damage (can reduce to 0)<\/td><td data-label=\"Upgraded Effect\">-2 incoming attack damage (can reduce to 0)<\/td><\/tr><tr><td data-label=\"Construction\">[Fortification Network]<\/td><td data-label=\"Supply per Build/Upgrade action: normal / Industrial\">5 / 2<\/td><td data-label=\"Base Effect\">+2 to planet&#x27;s maximum defence<\/td><td data-label=\"Upgraded Effect\">+4 to planet&#x27;s maximum defence<\/td><\/tr><tr><td data-label=\"Construction\">[Militia Barracks]<\/td><td data-label=\"Supply per Build/Upgrade action: normal / Industrial\">2 / 1<\/td><td data-label=\"Base Effect\">No defensive Manpower commitment or isolation; holding Defend costs no Manpower<\/td><td data-label=\"Upgraded Effect\">No upgrade<\/td><\/tr><tr><td data-label=\"Construction\">[Planetary Shield Network]<\/td><td data-label=\"Supply per Build/Upgrade action: normal / Industrial\">5 / 2<\/td><td data-label=\"Base Effect\">Invulnerable with Void Superiority / Defended status without<\/td><td data-label=\"Upgraded Effect\">No upgrade<\/td><\/tr><tr><td data-label=\"Construction\">[Consolidation Works]<\/td><td data-label=\"Supply per Build/Upgrade action: normal / Industrial\">3 / 1<\/td><td data-label=\"Base Effect\">Upgrade planet type by one tier: Minor (2/2) → Standard (4/4) → Major (8/8). Current and maximum defence double. <strong>Repeatable<\/strong> until Major. Cannot upgrade to Capital — only one Capital per faction.<\/td><td data-label=\"Upgraded Effect\">N/A (repeatable construction, not upgradeable)<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>Void Constructions (Fleet-Attached)<\/h4>\n<p><strong>Void Constructions (Fleet-Attached)<\/strong> — Mobile, destroyed if fleet is destroyed.<\/p>\n<p>*Minor (3 actions base, 3 actions upgrade)*<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Construction<\/th><th>Supply per Build/Upgrade action: normal / Industrial<\/th><th>Base Effect<\/th><th>Upgraded Effect<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Construction\">[Troop Transport]<\/td><td data-label=\"Supply per Build/Upgrade action: normal / Industrial\">2 / 1<\/td><td data-label=\"Base Effect\">Victory return +2 committed Manpower<\/td><td data-label=\"Upgraded Effect\">Victory return +4 committed Manpower; best transport only, cap at commitment<\/td><\/tr><tr><td data-label=\"Construction\">[Repair Tender]<\/td><td data-label=\"Supply per Build/Upgrade action: normal / Industrial\">2 / 1<\/td><td data-label=\"Base Effect\">+1 to its surviving host fleet each Cycle, even after combat<\/td><td data-label=\"Upgraded Effect\">+2 to its surviving host fleet each Cycle<\/td><\/tr><tr><td data-label=\"Construction\">[Escort Squadron]<\/td><td data-label=\"Supply per Build/Upgrade action: normal / Industrial\">3 / 1<\/td><td data-label=\"Base Effect\">+3 to Fleet Battle roll<\/td><td data-label=\"Upgraded Effect\">+6 to Fleet Battle roll<\/td><\/tr><tr><td data-label=\"Construction\">[Assault Boats]<\/td><td data-label=\"Supply per Build/Upgrade action: normal / Industrial\">3 / 1<\/td><td data-label=\"Base Effect\">+2 fleet strength for ground assaults<\/td><td data-label=\"Upgraded Effect\">+4 fleet strength for ground assaults<\/td><\/tr><tr><td data-label=\"Construction\">[Bombardment Bay]<\/td><td data-label=\"Supply per Build/Upgrade action: normal / Industrial\">3 / 1<\/td><td data-label=\"Base Effect\">+1 ground assault damage<\/td><td data-label=\"Upgraded Effect\">+2 ground assault damage<\/td><\/tr><tr><td data-label=\"Construction\">[Assault Cruiser]<\/td><td data-label=\"Supply per Build/Upgrade action: normal / Industrial\">3 / 1<\/td><td data-label=\"Base Effect\">+2/2 fleet strength (tracked separately)<\/td><td data-label=\"Upgraded Effect\">+4/4 fleet strength (tracked separately)<\/td><\/tr><\/tbody><\/table><\/div>\n<p>*Major (5 actions base, 5 actions upgrade)*<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Construction<\/th><th>Supply per Build/Upgrade action: normal / Industrial<\/th><th>Base Effect<\/th><th>Upgraded Effect<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Construction\">[Flagship]<\/td><td data-label=\"Supply per Build/Upgrade action: normal / Industrial\">5 / 2<\/td><td data-label=\"Base Effect\">+5 permanent strength/capacity<\/td><td data-label=\"Upgraded Effect\">+10 total permanent strength/capacity; add to existing capacity<\/td><\/tr><tr><td data-label=\"Construction\">[Carrier]<\/td><td data-label=\"Supply per Build/Upgrade action: normal / Industrial\">5 / 2<\/td><td data-label=\"Base Effect\">+10 strength for ground assaults<\/td><td data-label=\"Upgraded Effect\">+20 strength for ground assaults<\/td><\/tr><tr><td data-label=\"Construction\">[Siege Platform]<\/td><td data-label=\"Supply per Build/Upgrade action: normal / Industrial\">5 / 2<\/td><td data-label=\"Base Effect\">+3 ground assault damage<\/td><td data-label=\"Upgraded Effect\">+6 ground assault damage<\/td><\/tr><tr><td data-label=\"Construction\">[Salvage Wing]<\/td><td data-label=\"Supply per Build/Upgrade action: normal / Industrial\">3 / 1<\/td><td data-label=\"Base Effect\">+3 Supply per equipped victorious fleet in a Fleet Battle or attacking Ground Assault<\/td><td data-label=\"Upgraded Effect\">+6; not a bombardment or Structure Assault reward<\/td><\/tr><tr><td data-label=\"Construction\">[Scout Squadron]<\/td><td data-label=\"Supply per Build/Upgrade action: normal / Industrial\">5 / 2<\/td><td data-label=\"Base Effect\">This fleet may Move and Ground Assault or Uncontested Bombardment with the same Fleet Action. Resolve movement first; eligible allies already at the destination may join, spending their own actions.<\/td><td data-label=\"Upgraded Effect\">No upgrade<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>Void Constructions (System-Based)<\/h4>\n<p><strong>Void Constructions (System-Based)<\/strong> — Stationary. Use the distinct system-control capture rule above.<\/p>\n<p>*Minor (3 actions base, 3 actions upgrade)*<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Construction<\/th><th>Supply per Build/Upgrade action: normal / Industrial<\/th><th>Base Effect<\/th><th>Upgraded Effect<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Construction\">[Defence Platform]<\/td><td data-label=\"Supply per Build/Upgrade action: normal / Industrial\">3 / 1<\/td><td data-label=\"Base Effect\">+5 to defender roll in Fleet Battles<\/td><td data-label=\"Upgraded Effect\">+10 to defender roll in Fleet Battles<\/td><\/tr><\/tbody><\/table><\/div>\n<p>*Major (5 actions base, 5 actions upgrade)*<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Construction<\/th><th>Supply per Build/Upgrade action: normal / Industrial<\/th><th>Base Effect<\/th><th>Upgraded Effect<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Construction\">[System Defence Station]<\/td><td data-label=\"Supply per Build/Upgrade action: normal / Industrial\">3 / 1<\/td><td data-label=\"Base Effect\">-1 strength to every hostile fleet in system each Cycle<\/td><td data-label=\"Upgraded Effect\">-2 to every hostile fleet<\/td><\/tr><tr><td data-label=\"Construction\">[System Repair Station]<\/td><td data-label=\"Supply per Build/Upgrade action: normal / Industrial\">3 / 1<\/td><td data-label=\"Base Effect\">+1 strength to every eligible allied fleet in system each Cycle<\/td><td data-label=\"Upgraded Effect\">+2 to every eligible allied fleet<\/td><\/tr><tr><td data-label=\"Construction\">[Logistics Anchorage]<\/td><td data-label=\"Supply per Build/Upgrade action: normal / Industrial\">5 / 2<\/td><td data-label=\"Base Effect\">+1 defence regen to unattacked planets/cycle<\/td><td data-label=\"Upgraded Effect\">+2 defence regen to unattacked planets/cycle<\/td><\/tr><tr><td data-label=\"Construction\">[Void Station]<\/td><td data-label=\"Supply per Build/Upgrade action: normal / Industrial\">3 / 1<\/td><td data-label=\"Base Effect\">2/2 station, functions as Minor planet<\/td><td data-label=\"Upgraded Effect\">Upgrade via Consolidation Works: Minor (2/2) → Standard (4/4) → Major (8/8). Eligible for Establish New Capital when the faction has no functioning Capital.<\/td><\/tr><tr><td data-label=\"Construction\">[Storm Transit]<\/td><td data-label=\"Supply per Build/Upgrade action: normal / Industrial\">3 / 1<\/td><td data-label=\"Base Effect\">Major, 5 stages, no upgrade: protect eligible allied fleets in this system from storm damage and permit their departure during a Warp Storm.<\/td><td data-label=\"Upgraded Effect\">No upgrade<\/td><\/tr><\/tbody><\/table><\/div>"}, {"title": "Player battle setup and overflow", "text": "\nUse the existing Supply difficulty brackets below; the global difficulty effect on allied AI is explicitly deferred. Formation pools use the current Manpower bands and participating ground strength. Do not compress a large battle by deleting formations.\n\n", "html": "<p>Use the existing Supply difficulty brackets below; the global difficulty effect on allied AI is explicitly deferred. Formation pools use the current Manpower bands and participating ground strength. Do not compress a large battle by deleting formations.<\/p>"}, {"title": "Difficulty (Based on YOUR Supply)", "text": "\nSupply represents logistics capacity: materiel, munitions, fuel, food, replacement parts, and everything needed to sustain military operations. **In human Soulstorm setup, Supply determines difficulty — how well-equipped your forces are.**\n\n| Supply | Base Difficulty |\n|--------|-----------------|\n| 0-20 Critical | Insane 5/5 |\n| 21-40 Rationed | Harder 4/5 |\n| 41-60 Sustainable | Hard 3/5 |\n| 61-80 Surplus | Standard 2/5 |\n| 81-100 Abundant | Easy 1/5 |\n\n", "html": "<p>Supply represents logistics capacity: materiel, munitions, fuel, food, replacement parts, and everything needed to sustain military operations. <strong>In human Soulstorm setup, Supply determines difficulty — how well-equipped your forces are.<\/strong><\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Supply<\/th><th>Base Difficulty<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Supply\">0-20 Critical<\/td><td data-label=\"Base Difficulty\">Insane 5/5<\/td><\/tr><tr><td data-label=\"Supply\">21-40 Rationed<\/td><td data-label=\"Base Difficulty\">Harder 4/5<\/td><\/tr><tr><td data-label=\"Supply\">41-60 Sustainable<\/td><td data-label=\"Base Difficulty\">Hard 3/5<\/td><\/tr><tr><td data-label=\"Supply\">61-80 Surplus<\/td><td data-label=\"Base Difficulty\">Standard 2/5<\/td><\/tr><tr><td data-label=\"Supply\">81-100 Abundant<\/td><td data-label=\"Base Difficulty\">Easy 1/5<\/td><\/tr><\/tbody><\/table><\/div>"}, {"title": "Difficulty (Based on ENEMY Supply)", "text": "\n| Enemy Supply | Modifier |\n|--------------|----------|\n| 0-20 Critical | -2 Difficulty |\n| 21-40 Rationed | -1 Difficulty |\n| 41-60 Sustainable | — |\n| 61-80 Surplus | +1 Difficulty |\n| 81-100 Abundant | +2 Difficulty |\n\nFor either side: formations = max(1, 1+floor(participating ground strength/5)+Manpower-band index−2), where band indices 0–4 correspond to 0–20, 21–40, 41–60, 61–80, 81+. Use attacking ground Strength, but ordinary defending combat Strength on the defending side; use post-commitment Manpower. Use committed assets only; distinct allies need actual participating fleets and consent. Otherwise duplicate the controlling faction.\n\nDeploy up to 4 per side. With a live raider, deploy at most 3 per main side plus the single raider. Keep overflow in reserve. After each reported round, remove defeated formations and destroyed winning formations; surviving winners may fight again and refill from reserves. There is no free replacement principal team. Once defeated the raider never returns; limits revert to 4 per side. Campaign costs/actions and outcome resolve once for the engagement, not per round.\n\nManpower bands are Critical, Rationed, Sustainable, Surplus and Abundant in the same 0–20 / 21–40 / 41–60 / 61–80 / 81–100 intervals.\n\nMap capacity is at least twice the largest deployed side and at least total deployed participants, up to 8. Choose a larger available thematic map where needed; leave spare slots closed, not filled with unearned formations. Report winning survivors, not just a win. AI campaign rolls do not simulate these human outcomes.\n\n", "html": "<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Enemy Supply<\/th><th>Modifier<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Enemy Supply\">0-20 Critical<\/td><td data-label=\"Modifier\">-2 Difficulty<\/td><\/tr><tr><td data-label=\"Enemy Supply\">21-40 Rationed<\/td><td data-label=\"Modifier\">-1 Difficulty<\/td><\/tr><tr><td data-label=\"Enemy Supply\">41-60 Sustainable<\/td><td data-label=\"Modifier\">—<\/td><\/tr><tr><td data-label=\"Enemy Supply\">61-80 Surplus<\/td><td data-label=\"Modifier\">+1 Difficulty<\/td><\/tr><tr><td data-label=\"Enemy Supply\">81-100 Abundant<\/td><td data-label=\"Modifier\">+2 Difficulty<\/td><\/tr><\/tbody><\/table><\/div>\n<p>For either side: formations = max(1, 1+floor(participating ground strength/5)+Manpower-band index−2), where band indices 0–4 correspond to 0–20, 21–40, 41–60, 61–80, 81+. Use attacking ground Strength, but ordinary defending combat Strength on the defending side; use post-commitment Manpower. Use committed assets only; distinct allies need actual participating fleets and consent. Otherwise duplicate the controlling faction.<\/p>\n<p>Deploy up to 4 per side. With a live raider, deploy at most 3 per main side plus the single raider. Keep overflow in reserve. After each reported round, remove defeated formations and destroyed winning formations; surviving winners may fight again and refill from reserves. There is no free replacement principal team. Once defeated the raider never returns; limits revert to 4 per side. Campaign costs/actions and outcome resolve once for the engagement, not per round.<\/p>\n<p>Manpower bands are Critical, Rationed, Sustainable, Surplus and Abundant in the same 0–20 / 21–40 / 41–60 / 61–80 / 81–100 intervals.<\/p>\n<p>Map capacity is at least twice the largest deployed side and at least total deployed participants, up to 8. Choose a larger available thematic map where needed; leave spare slots closed, not filled with unearned formations. Report winning survivors, not just a win. AI campaign rolls do not simulate these human outcomes.<\/p>"}, {"title": "Events and alignment transit", "text": "\nAt the event step of Phase 0, roll d6; on 1 or 6 roll once on the event table. Other opening checks mean no event. Effects last the current Cycle. Keep the established single raider identity.\n\n| d6 | Event | Effect |\n|----|-------|--------|\n| 1 | **Warp Storm** | All living fleets, including Mobile Capitals, lose 1 Strength and ordinary movement is blocked this Cycle. Active Storm Transit protects eligible allied fleets in its system and permits departure. Storm damage also damages attached Integrity. |\n| 2 | **Ambush!** | Attackers this Cycle get +1 difficulty. Defenders get -1 difficulty. AI vs AI: Defender +4 to roll. |\n| 3 | **Supply Crisis** | All Factions: -5 Supply and -5 Manpower. |\n| 4 | **War Fervor** | All Factions: +5 Supply and +5 Manpower. |\n| 5 | **Third Party Raid** | If a ground battle occurs, add the fixed campaign raiding faction. Raiders are an additional hostile team and cannot capture territory or establish holdings, regardless of world tier or battle result. Survivors withdraw after the raid. If raiders win on a Major/Capital, retain the existing defence-halving effect (rounded down), but no territorial transfer to raiders. On Minor/Standard worlds, remove the former capture effect; normal applicable battle effects and traits still resolve. Do not invent additional loot or resource penalties. |\n| 6 | **Intel Breakthrough** | You choose: -1 difficulty this battle OR +1 damage dealt on a successful attack. AI vs AI: Attacker +4 to roll. |\n\n---\n\nThe provisional AI raider total is d20 + 13 (the fixed reference of 5 Strength, 20 Supply and 20 Manpower); these are resolution constants, not a spendable faction economy. The highest unique total wins; a tie favours the defender. Raiders cannot capture. On their Major/Capital victory, provisional damage is the larger of applicable Siege defeat damage and current defence minus floor(current defence / 2). Cap this at current defence minus 1, then apply shields and other mitigation. Thus an unshielded holding at 7 defence falls to 3, not to 4; shields can reduce that loss. Minor/Standard holdings receive only applicable defeat damage, also unable to fall below 1 when raiders win. Player raiders follow the reported formation-series result.\n\nHuman difficulty modifiers: apply enemy Supply band index minus 2; Defended shifts one step in favour of the defender unless Siege ignores it; Bunker shifts 1/2 steps; Ambush shifts one in favour of the defender; Intel gives the attacker a choice of one easier step or +1 successful damage. An Isolated human defender suffers +2 difficulty. Clamp the final result to 1–5. Changing global difficulty also affects allied AI; that unresolved Soulstorm limitation has not been removed by these campaign rules.\n\nTransit names are faction-themed implementations of equal mechanics; speculative engineering is campaign lore, not a claim of canon.\n\n| Alignment | Implementation | Rationale |\n|---|---|---|\n| Imperium | **Noctilith Transit Array:** a Mechanicus-supported installation suppresses the local disruption and maintains a narrow departure corridor. | Based on Cawl's work modulating Warp energies with blackstone. The corridor application is our campaign extrapolation, not an ordinary Geller field upgrade or a claim every Imperial fleet already has it. |\n| Chaos | **Bound Passage Gate:** a ritual complex and bound guides force a prepared channel through the local storm. | Sorcerer-guided travel provides the precedent. Chaos affiliation alone grants no immunity. Khorne-aligned forces can use a daemon-engine/forged portal maintained by allied Dark Mechanicum rather than requiring their own sorcerer commander. |\n| Aeldari | **Webway Anchorage:** a fleet-capable webway entrance with shelter and charted exits serving this Subsector. | Spacecraft require a sufficiently large arterial route; an infantry webway portal is not enough. This does not declare the entire damaged webway universally safe. |\n| Drukhari | **Webway Breach Anchorage:** a maintained fleet-scale passage and secured staging pocket. | The same transit medium, with Drukhari engineering and control; not a personal portal magically transporting a fleet. |\n| Necron | **Dolmen Transit Complex:** a maintained fleet-access gate and local noctilith shielding. | Dolmen Gates provide fleet transit access; blackstone supplies a plausible local protection mechanism. |\n| Ork | **Mega-Tellyporta Array:** a Mek-built staging array flings the flotilla through a prepared passage. | Official fleet-scale mega-tellyshokka precedent exists. Reliable operation against this campaign event is the house-rule abstraction, not a claim all tellyportas are safe. |\n| T'au | **Earth Caste Nexus Anchorage:** containment, survey drones and fleet staging around a recovered dimensional conduit. | Use an existing local anomaly/relic route, as T'au exploitation of the Startide Nexus demonstrates. Do not claim the T'au can mass-produce new Startide Nexuses. Discovering/reactivating this local asset is part of the paid project, not an extra random prerequisite unavailable to them. |\n| Tyranid | **Narvhal Brood Anchorage:** dedicated gravitic guide organisms with a concentrated synaptic shelter maintain a compressed-space departure route. | Narvhals already supply non-Warp interstellar travel. The enhanced shelter and reliable local-storm operation are the constructed benefit; do not describe Tyranids as lacking Narvhals until they build this. |\n| Independent | **Recovered Transit Anchorage:** select a mechanism appropriate to that faction's species and technology at setup; human pirates can use recovered noctilith/relic machinery. | Independent is not a species. It grants one mechanically identical installation, not access to cumulative benefits from every alignment. |\n\n", "html": "<p>At the event step of Phase 0, roll d6; on 1 or 6 roll once on the event table. Other opening checks mean no event. Effects last the current Cycle. Keep the established single raider identity.<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>d6<\/th><th>Event<\/th><th>Effect<\/th><\/tr><\/thead><tbody><tr><td data-label=\"d6\">1<\/td><td data-label=\"Event\"><strong>Warp Storm<\/strong><\/td><td data-label=\"Effect\">All living fleets, including Mobile Capitals, lose 1 Strength and ordinary movement is blocked this Cycle. Active Storm Transit protects eligible allied fleets in its system and permits departure. Storm damage also damages attached Integrity.<\/td><\/tr><tr><td data-label=\"d6\">2<\/td><td data-label=\"Event\"><strong>Ambush!<\/strong><\/td><td data-label=\"Effect\">Attackers this Cycle get +1 difficulty. Defenders get -1 difficulty. AI vs AI: Defender +4 to roll.<\/td><\/tr><tr><td data-label=\"d6\">3<\/td><td data-label=\"Event\"><strong>Supply Crisis<\/strong><\/td><td data-label=\"Effect\">All Factions: -5 Supply and -5 Manpower.<\/td><\/tr><tr><td data-label=\"d6\">4<\/td><td data-label=\"Event\"><strong>War Fervor<\/strong><\/td><td data-label=\"Effect\">All Factions: +5 Supply and +5 Manpower.<\/td><\/tr><tr><td data-label=\"d6\">5<\/td><td data-label=\"Event\"><strong>Third Party Raid<\/strong><\/td><td data-label=\"Effect\">If a ground battle occurs, add the fixed campaign raiding faction. Raiders are an additional hostile team and cannot capture territory or establish holdings, regardless of world tier or battle result. Survivors withdraw after the raid. If raiders win on a Major/Capital, retain the existing defence-halving effect (rounded down), but no territorial transfer to raiders. On Minor/Standard worlds, remove the former capture effect; normal applicable battle effects and traits still resolve. Do not invent additional loot or resource penalties.<\/td><\/tr><tr><td data-label=\"d6\">6<\/td><td data-label=\"Event\"><strong>Intel Breakthrough<\/strong><\/td><td data-label=\"Effect\">You choose: -1 difficulty this battle OR +1 damage dealt on a successful attack. AI vs AI: Attacker +4 to roll.<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<p>The provisional AI raider total is d20 + 13 (the fixed reference of 5 Strength, 20 Supply and 20 Manpower); these are resolution constants, not a spendable faction economy. The highest unique total wins; a tie favours the defender. Raiders cannot capture. On their Major/Capital victory, provisional damage is the larger of applicable Siege defeat damage and current defence minus floor(current defence / 2). Cap this at current defence minus 1, then apply shields and other mitigation. Thus an unshielded holding at 7 defence falls to 3, not to 4; shields can reduce that loss. Minor/Standard holdings receive only applicable defeat damage, also unable to fall below 1 when raiders win. Player raiders follow the reported formation-series result.<\/p>\n<p>Human difficulty modifiers: apply enemy Supply band index minus 2; Defended shifts one step in favour of the defender unless Siege ignores it; Bunker shifts 1/2 steps; Ambush shifts one in favour of the defender; Intel gives the attacker a choice of one easier step or +1 successful damage. An Isolated human defender suffers +2 difficulty. Clamp the final result to 1–5. Changing global difficulty also affects allied AI; that unresolved Soulstorm limitation has not been removed by these campaign rules.<\/p>\n<p>Transit names are faction-themed implementations of equal mechanics; speculative engineering is campaign lore, not a claim of canon.<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Alignment<\/th><th>Implementation<\/th><th>Rationale<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Alignment\">Imperium<\/td><td data-label=\"Implementation\"><strong>Noctilith Transit Array:<\/strong> a Mechanicus-supported installation suppresses the local disruption and maintains a narrow departure corridor.<\/td><td data-label=\"Rationale\">Based on Cawl&#x27;s work modulating Warp energies with blackstone. The corridor application is our campaign extrapolation, not an ordinary Geller field upgrade or a claim every Imperial fleet already has it.<\/td><\/tr><tr><td data-label=\"Alignment\">Chaos<\/td><td data-label=\"Implementation\"><strong>Bound Passage Gate:<\/strong> a ritual complex and bound guides force a prepared channel through the local storm.<\/td><td data-label=\"Rationale\">Sorcerer-guided travel provides the precedent. Chaos affiliation alone grants no immunity. Khorne-aligned forces can use a daemon-engine/forged portal maintained by allied Dark Mechanicum rather than requiring their own sorcerer commander.<\/td><\/tr><tr><td data-label=\"Alignment\">Aeldari<\/td><td data-label=\"Implementation\"><strong>Webway Anchorage:<\/strong> a fleet-capable webway entrance with shelter and charted exits serving this Subsector.<\/td><td data-label=\"Rationale\">Spacecraft require a sufficiently large arterial route; an infantry webway portal is not enough. This does not declare the entire damaged webway universally safe.<\/td><\/tr><tr><td data-label=\"Alignment\">Drukhari<\/td><td data-label=\"Implementation\"><strong>Webway Breach Anchorage:<\/strong> a maintained fleet-scale passage and secured staging pocket.<\/td><td data-label=\"Rationale\">The same transit medium, with Drukhari engineering and control; not a personal portal magically transporting a fleet.<\/td><\/tr><tr><td data-label=\"Alignment\">Necron<\/td><td data-label=\"Implementation\"><strong>Dolmen Transit Complex:<\/strong> a maintained fleet-access gate and local noctilith shielding.<\/td><td data-label=\"Rationale\">Dolmen Gates provide fleet transit access; blackstone supplies a plausible local protection mechanism.<\/td><\/tr><tr><td data-label=\"Alignment\">Ork<\/td><td data-label=\"Implementation\"><strong>Mega-Tellyporta Array:<\/strong> a Mek-built staging array flings the flotilla through a prepared passage.<\/td><td data-label=\"Rationale\">Official fleet-scale mega-tellyshokka precedent exists. Reliable operation against this campaign event is the house-rule abstraction, not a claim all tellyportas are safe.<\/td><\/tr><tr><td data-label=\"Alignment\">T&#x27;au<\/td><td data-label=\"Implementation\"><strong>Earth Caste Nexus Anchorage:<\/strong> containment, survey drones and fleet staging around a recovered dimensional conduit.<\/td><td data-label=\"Rationale\">Use an existing local anomaly/relic route, as T&#x27;au exploitation of the Startide Nexus demonstrates. Do not claim the T&#x27;au can mass-produce new Startide Nexuses. Discovering/reactivating this local asset is part of the paid project, not an extra random prerequisite unavailable to them.<\/td><\/tr><tr><td data-label=\"Alignment\">Tyranid<\/td><td data-label=\"Implementation\"><strong>Narvhal Brood Anchorage:<\/strong> dedicated gravitic guide organisms with a concentrated synaptic shelter maintain a compressed-space departure route.<\/td><td data-label=\"Rationale\">Narvhals already supply non-Warp interstellar travel. The enhanced shelter and reliable local-storm operation are the constructed benefit; do not describe Tyranids as lacking Narvhals until they build this.<\/td><\/tr><tr><td data-label=\"Alignment\">Independent<\/td><td data-label=\"Implementation\"><strong>Recovered Transit Anchorage:<\/strong> select a mechanism appropriate to that faction&#x27;s species and technology at setup; human pirates can use recovered noctilith/relic machinery.<\/td><td data-label=\"Rationale\">Independent is not a species. It grants one mechanically identical installation, not access to cumulative benefits from every alignment.<\/td><\/tr><\/tbody><\/table><\/div>"}, {"title": "d20 system profiles", "text": "\n| d20 | Minor planets | Standard planets | Major planets | Station tiers |\n|---|---:|---:|---:|---|\n|1|2|0|0|None|\n|2|1|0|0|1|\n|3|1|1|0|None|\n|4|0|1|0|1|\n|5|1|0|1|None|\n|6|3|0|0|None|\n|7|2|0|0|1|\n|8|2|1|0|None|\n|9|1|1|0|1|\n|10|0|1|0|1, 1|\n|11|1|2|0|None|\n|12|0|2|0|1|\n|13|2|0|1|None|\n|14|1|0|1|1|\n|15|1|1|1|None|\n|16|3|1|0|None|\n|17|2|1|0|1|\n|18|2|2|0|None|\n|19|1|1|1|1|\n|20|1|1|1|2|\n\nPrize designation is a separate setup choice, not an extra ordinary-system holding.\n", "html": "<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>d20<\/th><th>Minor planets<\/th><th>Standard planet /td><\/tr><tr><td data-label=\"Cycle / phase\">2 / Phase 0<\/td><td data-label=\"Orders\">Construction effects, Logistics check, event check; Fleet Actions reset<\/td><td data-label=\"Costs\">Warp Storm: 1 Strength per fleet<\/td><td data-label=\"Outcome\">Three unfinished projects remain inactive at 1/5; no automatic progress. Logistics not due until Cycle 3. Event check 1; event-table roll 1: Warp Storm. All Major fleets 5/5 to 4/5. The Locked Reliquary, The Last Shift, The Convenient Pardon and The Winter Measure destroyed at 0. All other fleets lose 1; no attached fleet projects or Major fleet destruction penalties. No resource changes. Ordinary movement blocked for Cycle 2. <a href=\"Atreus_Cycle_02_Phase_0_Rolls.json\">Saved rolls and fleet audit<\/a>.<\/td><td data-label=\"Pending\">Iron Paladins orders<\/td><\/tr><tr><td data-label=\"Cycle / phase\">2 / Iron Paladins / Fleet<\/td><td data-label=\"Orders\">Expand Crusade Fleet Anabasis at Tiryns built-in shipyard<\/td><td data-label=\"Costs\">1 Supply: 23 to 22; 1 Manpower: 20 to 19<\/td><td data-label=\"Outcome\">Restored 4/5 to 5/5, capped at maximum. Fleet Action spent; no assault. Warp Storm blocks movement, not yard expansion.<\/td><td data-label=\"Pending\">None<\/td><\/tr><tr><td data-label=\"Cycle / phase\">2 / Iron Paladins / Faction<\/td><td data-label=\"Orders\">Reinforce through The Iron Tithe<\/td><td data-label=\"Costs\">None<\/td><td data-label=\"Outcome\">+8 Supply: 22 to 30.<\/td><td data-label=\"Pending\">None<\/td><\/tr><tr><td data-label=\"Cycle / phase\">2 / Iron Paladins / Social<\/td><td data-label=\"Orders\">No action<\/td><td data-label=\"Costs\">None<\/td><td data-label=\"Outcome\">No Communique.<\/td><td data-label=\"Pending\">None<\/td><\/tr><tr><td data-label=\"Cycle / phase\">2 / Iron Paladins / Construction<\/td><td data-label=\"Orders\">Continue The Forge of Iron on Tiryns<\/td><td data-label=\"Costs\">5 Supply: 30 to 25<\/td><td data-label=\"Outcome\">Progress and Integrity 1/5 to 2/5; unfinished and inactive. Tiryns remains 12/12. Final resources 25 Supply / 19 Manpower. Submitted heading said Cycle 1; resolved as Cycle 2 because orders match the current state.<\/td><td data-label=\"Pending\">WAAAGH! Bell-Ringa orders<\/td><\/tr><tr><td data-label=\"Cycle / phase\">2 / WAAAGH! Bell-Ringa / Fleet<\/td><td data-label=\"Orders\">Expand Da Gate-Krasha at Da Bellworks built-in shipyard<\/td><td data-label=\"Costs\">1 Supply: 17 to 16; 1 Manpower: 19 to 18<\/td><td data-label=\"Outcome\">Restored 4/5 to 5/5, capped at maximum. Fleet Action spent; no assault.<\/td><td data-label=\"Pending\">None<\/td><\/tr><tr><td data-label=\"Cycle / phase\">2 / WAAAGH! Bell-Ringa / Faction<\/td><td data-label=\"Orders\">Reinforce<\/td><td data-label=\"Costs\">None<\/td><td data-label=\"Outcome\">+3 Supply: 16 to 19.<\/td><td data-label=\"Pending\">None<\/td><\/tr><tr><td data-label=\"Cycle / phase\">2 / WAAAGH! Bell-Ringa / Social<\/td><td data-label=\"Orders\">No action<\/td><td data-label=\"Costs\">None<\/td><td data-label=\"Outcome\">No Communique.<\/td><td data-label=\"Pending\">None<\/td><\/tr><tr><td data-label=\"Cycle / phase\">2 / WAAAGH! Bell-Ringa / Construction<\/td><td data-label=\"Orders\">Continue Major Forge Complex on Da Bellworks<\/td><td data-label=\"Costs\">5 Supply: 19 to 14<\/td><td data-label=\"Outcome\">Progress and Integrity 1/5 to 2/5; unfinished and inactive. Da Bellworks remains 12/12. Final resources 14 Supply / 18 Manpower.<\/td><td data-label=\"Pending\">Order of Saint Erigone orders<\/td><\/tr><tr><td data-label=\"Cycle / phase\">2 / Order of Saint Erigone / Fleet<\/td><td data-label=\"Orders\">Expand The Third Refusal at Erigone built-in shipyard<\/td><td data-label=\"Costs\">1 Supply: 14 to 13; 1 Manpower: 22 to 21<\/td><td data-label=\"Outcome\">Restored 4/5 to 5/5; Fleet Action spent. No assault.<\/td><td data-label=\"Pending\">None<\/td><\/tr><tr><td data-label=\"Cycle / phase\">2 / Order of Saint Erigone / Faction<\/td><t -1/1 = 28/22. Bell-Ringa: 14/18 +5/9 -1/1 = 18/26. Order: 11/21 +11/5 -1/1 = 21/25. No construction income. Next Logistics Cycle 6.<\/td><td data-label=\"Pending\">Event check<\/td><\/tr><tr><td data-label=\"Cycle / phase\">3 / Phase 0 / Events<\/td><td data-label=\"Orders\">Event check d6<\/td><td data-label=\"Costs\">None<\/td><td data-label=\"Outcome\">Check 3: no event; no event-table roll. <a href=\"Atreus_Cycle_03_Phase_0_Rolls.json\">Opening roll, Logistics and recovery audit<\/a>.<\/td><td data-label=\"Pending\">Iron Paladins orders<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>3 / Iron Paladins / Fleet<\/th><th>Anabasis 5/5 assaults Prosymna 2/2.<\/th><th>Previously paid 1 Supply and committed 1 Manpower: 28/22 to 27/21. No duplicate charge. Victory return floor(60% of 1) = 0.<\/th><th>Jake reported overwhelming victory, 8 October 2026. Human result; no AI roll. 2 damage (1 base + 1 breakthrough) captures Prosymna at 1/2. Planet Fall reduces The Unspent Levy 3/3 to 1/3. Council retains Heraion; derived resources now 10/10. Anabasis remains 5/5.<\/th><th>None<\/th><\/tr><\/thead><tbody><tr><td data-label=\"3 / Iron Paladins / Fleet\">3 / Iron Paladins / Faction<\/td><td data-label=\"Anabasis 5/5 assaults Prosymna 2/2.\">Reinforce through The Iron Tithe.<\/td><td data-label=\"Previously paid 1 Supply and committed 1 Manpower: 28/22 to 27/21. No duplicate charge. Victory return floor(60% of 1) = 0.\">+8 Supply: 27 to 35.<\/td><td data-label=\"Jake reported overwhelming victory, 8 October 2026. Human result; no AI roll. 2 damage (1 base + 1 breakthrough) captures Prosymna at 1/2. Planet Fall reduces The Unspent Levy 3/3 to 1/3. Council retains Heraion; derived resources now 10/10. Anabasis remains 5/5.\">Resolved after battle.<\/td><td data-label=\"None\">None<\/td><\/tr><tr><td data-label=\"3 / Iron Paladins / Fleet\">3 / Iron Paladins / Social<\/td><td data-label=\"Anabasis 5/5 assaults Prosymna 2/2.\"> ><tbody><tr><td data-label=\"3 / WAAAGH! Bell-Ringa / Fleet\">3 / WAAAGH! Bell-Ringa / Faction<\/td><td data-label=\"Da Gate-Krasha assaults Pleuron with 5 Strength.\">Reinforce.<\/td><td data-label=\"2 Supply: 18 to 16; commit 1 Manpower: 26 to 25. Victory recovery rounds down to 0.\">+3 Supply: 16 to 19.<\/td><td data-label=\"AI victory 33 to 20: attacker d20 20 + 5 Strength + 3 Supply + 5 Manpower; defender d20 18 + 0 Strength + 1 Supply + 1 Manpower. Defender setup 8 Supply / 9 Manpower. Pleuron 4/4 to 2/4, still Calydonian Labour Defence-controlled; no capture or Planet Fall. Da Gate-Krasha remains 5/5, action spent. [Saved roll](Atreus_Cycle_03_Pleuron_Battle.json).\">Resolved after assault.<\/td><td data-label=\"None\">None<\/td><\/tr><tr><td data-label=\"3 / WAAAGH! Bell-Ringa / Fleet\">3 / WAAAGH! Bell-Ringa / Social<\/td><td data-label=\"Da Gate-Krasha assaults Pleuron with 5 Strength.\">No action.<\/td><td data-label=\"2 Supply: 18 to 16; commit 1 Manpower: 26 to 25. Victory recovery rounds down to 0.\">None.<\/td><td data-label=\"AI victory 33 to 20: attacker d20 20 + 5 Strength + 3 Supply + 5 Manpower; defender d20 18 + 0 Strength + 1 Supply + 1 Manpower. Defender setup 8 Supply / 9 Manpower. Pleuron 4/4 to 2/4, still Calydonian Labour Defence-controlled; no capture or Planet Fall. Da Gate-Krasha remains 5/5, action spent. [Saved roll](Atreus_Cycle_03_Pleuron_Battle.json).\">No change.<\/td><td data-label=\"None\">None<\/td><\/tr><tr><td data-label=\"3 / WAAAGH! Bell-Ringa / Fleet\">3 / WAAAGH! Bell-Ringa / Construction<\/td><td data-label=\"Da Gate-Krasha assaults Pleuron with 5 Strength.\">Continue Major Forge Complex on Da Bellworks.<\/td><td data-label=\"2 Supply: 18 to 16; commit 1 Manpower: 26 to 25. Victory recovery rounds down to 0.\">5 Supply: 19 to 14.<\/td><td data-label=\"AI victory 33 to 20: attacker d20 20 + 5 Strength + 3 Supply + 5 Manpower; defender d20 18 + 0 Strength + 1 Supply + 1 Manpower. Defender setup 8 Supply / 9 Manpower. Pleuron 4/4 to 2/4, still Calydonian Labour Defence-controlled; no capture or Planet Fall. Da Gate-Krasha remains 5/5, action spent. [Saved roll](Atreus_Cycle_03_Pleuron_Battle.json).\">Progress and Integrity 2/5 to 3/5; unfinished and inactive. Host remains 12/12. Final resources 14 Supply / 25 Manpower.<\/td><td data-label=\"None\">Order of Saint Erigone orders<\/td><\/tr><\/tbody><\/table><\/div>", "narratives": "<h3>Cycle 1 - Foundries and burial gates<\/h3>\n<p>On Tiryns, the Iron Paladins turned their attention to the means of sustaining the war ahead. Anabasis remained in Argos while military stores were replenished and work began on The Forge of Iron beneath the fortress-monastery&#x27;s industrial skyline. Its workshops were still a promise of future production; the Chapter&#x27;s existing stores carried the undertaking.<\/p>\n<p>In Calydon, Bell-Ringa&#x27;s first assault broke the Calydonian Labour Defence&#x27;s hold on Olenos. The mining settlements and burial-grey slag ridges passed into Ork hands, while The Last Shift emerged from the loss badly diminished. Pleuron remained beyond the Warboss&#x27;s control. At Da Bellworks, replenishment and the beginnings of another forge accompanied the conquest, giving the expanding war host work to return to between battles.<\/p>\n<p>The Order advanced upon Daeira&#x27;s funerary settlements and overcame the Synod&#x27;s defenders. The Locked Reliquary survived the fall of the world with its fighting strength severely reduced, and the Synod retained Triptolemos. Back on Erigone, new musters gathered as work began on The Vigil of the Three Refusals. The Order had gained ground, but the academy&#x27;s promised flow of trained replacements still lay ahead.<\/p>\n<p>No communiques passed between the Major powers. Each had committed to a new construction; two had taken their first hostile holdings. The next Cycle had yet to open.<\/p>\n<h3>Cycle 2 - Repairs beneath closed skies<\/h3>\n<p>The storm battered the fleets of Atreus and closed their passages between systems. Ships already crippled by the fall of Olenos and Daeira were lost, along with two smaller Minor formations. Surviving local squadrons attended to what damage their remaining crews could repair.<\/p>\n<p>At Tiryns, the Iron Paladins restored Anabasis, replenished their military stores and continued work on The Forge of Iron. Bell-Ringa&#x27;s Meks brought Da Gate-Krasha back to fighting condition while the foundries of Da Bellworks supplied the next stage of his forge. At Erigone, The Third Refusal returned to readiness and work continued on The Vigil of the Three Refusals.<\/p>\n<p>No new assault was launched. Olenos and Daeira remained damaged conquests, and the three new construction projects remained unfinished. When the storm passed, the Major fleets were ready again. The next scheduled deliveries reached their holdings, with provisions set aside to sustain the ships before another round of orders.<\/p>\n<h3>Cycle 3 - Iron Paladins: Prosymna taken<\/h3>\n<p>The Iron Paladins carried Prosymna in an overwhelming victory. The Council&#x27;s levy positions fell, and the recruiting estates and grain stores passed into the Warsmith&#x27;s keeping. Damas retains Heraion, but the loss has weakened his remaining fleet. Anabasis holds its strength above the newly claimed world.<\/p>\n<p>On Tiryns, replenishment continued and work advanced on the Forge of Iron. Its halls remain unfinished. The Chapter now has another world to defend.<\/p>\n<p>Battle record: Jake reported an overwhelming victory on 8 October 2026. The engagement was Standard difficulty, one player against one Death Korps of Krieg AI representing the Argive Muster Council. This descriptive result confers no additional damage bonus. Assault costs were already recorded; the remaining approved actions are now complete.<\/p>\n<p>Standing player-battle workflow: provide the Soulstorm setup in chat, await Jake&#x27;s result, then settle the battle and remaining approved actions and publish the completed turn once. Do not publish a pending setup or require a separate result source for faction instances; they read the published ledger at the start of their turn.<\/p>\n<h3>Cycle 3 - Bell-Ringa: the assault on Pleuron<\/h3>\n<p>Bell-Ringa&#x27;s mobs broke into Pleuron&#x27;s industrial districts, forcing the labour defence back through workshops and barricaded crossings. The victory opened ground for the Orks, but Marshal Oineus still held enough of the world to continue the resistance. Pleuron had been battered, not conquered.<\/p>\n<p>Da Gate-Krasha remained ready above Calydon. At Da Bellworks, fresh military stores reached the war host while the Meks pushed the unfinished forge onward.<\/p>", "document": "<h1>The Atreus Campaign<\/h1>\n<p>Created 7 October 2026 · Subsector playtest · <strong>Cycle 3 - Bell-Ringa turn complete<\/strong><\/p>\n<p>Authoritative ledger: <a href=\"https://noxanimusvicta.github.io/Soulstorm-Meta-Campaigns/Atreus_Campaign.md\">Atreus_Campaign.md<\/a> · <a href=\"https://noxanimusvicta.github.io/Soulstorm-Meta-Campaigns/atreus.html\">Live campaign<\/a> · <a href=\"https://noxanimusvicta.github.io/Soulstorm-Meta-Campaigns/atreus-status.json\">Status<\/a><\/p>\n<p>Rules: <strong>6 October 2026 playtest edition with the approved 7 October Minor Alignment correction<\/strong>. The base edition was pinned to GitHub commit <code>113ec69a6163d36fb2164b9b624d14d8889986e5<\/code>. The complete rules, including that correction, follow the campaign registers below. Later source changes do not automatically migrate this campaign. The observed balance spread remains 28 percentage points; human playtesting is now the purpose. Dessica remains a separate suspended campaign.<\/p>\n<h2>Opening situation<\/h2>\n<p>For generations, Atreus sent armies outward and received their survivors through its shrines. Foundries cast engines beside cathedral bells; pilgrims crowded the same anchorages that loaded troop transports. Isolation has left the machinery of that old obligation intact in places, but no authority accepted everywhere.<\/p>\n<p>From Tiryns, Warsmith Acastor Orontes offers the service of the Iron Paladins to worlds the wider Imperium can no longer reach. Canoness Althaia sees another danger in their arrival. To her, their ancestry and long passage through the Eye make their professions of loyalty impossible to trust. She intends to destroy the Chapter. In Calydon, Bell-Ringa has taken a foundry Capital and gathers mobs to the sound of stolen bells. The surviving rulers of Atreus must decide whose protection they can afford—and whose demands they can survive.<\/p>\n<p>The Paladins’ loyalty is an established fact of the setting. Their supposed corruption is the Order’s conviction, not a revelation about the Chapter. No distant Imperial authority has issued a new decree in this campaign.<\/p>\n<h2>Campaign conventions and opening status<\/h2>\n<p>- Standing rollover procedure (Jake, 7 October 2026): after the third Major turn, finish Cycle-end checks, increment the Cycle, reset Fleet Actions and resolve Phase 0 in order: construction effects, scheduled Logistics including income/upkeep, then events. Publish the resulting state before handing back to the Iron Paladins. Do not wait for a separate opening request.<\/p>\n<p>- Three Major Factions, in fixed order: <strong>Iron Paladins → WAAAGH! Bell-Ringa → Order of Saint Erigone<\/strong>. Minor factions take no turns.<\/p>\n<p>- Every Major starts with 20 Supply, 20 Manpower, one 5/5 fleet and its 12/12 Capital only. This equal 5/5 opening is the explicit Atreus setup convention; Create Fleet during play remains 1/5 unless a rule changes it.<\/p>\n<p>- Each Major home system also contains one hostile ordinary Minor with a Standard and Minor planet. This is the approved home profile, not extra territory for the Major.<\/p>\n<p>- Ten systems; Fleet Movement reaches any system with the normal action. <strong>No directional, adjacency, distance or travel-lane mechanics.<\/strong> The system directory is a roster, not a route network.<\/p>\n<p>- Mycenae is the authored prize system: House Atreides owns a Capital planet, Standard planet and Minor station. This fixed profile implements the approved prize placement; it is not represented as a rolled ordinary profile.<\/p>\n<p>- The remaining six systems use the saved d20 rolls. Ownership, names and faction identities are authored independently of those rolls. No rerolls were made.<\/p>\n<p>- Campaign victory convention: the last surviving Major wins after rival Majors lose their final fallback. An agreed concession can end play earlier. Minor holdings do not become owned territory and need not be conquered to meet this condition. No forced 100-Cycle ending.<\/p>\n<p>- Cycle 1 Phase 0 is resolved once: no periodic construction effects or Endurance recovery; Logistics is not due; event check d6 = 3, so no event. Opening effects left starting resources, holdings and fleets unchanged. First Logistics is Cycle 3. All three Major turns are resolved below. Olenos has fallen to the Orks and Daeira to the Order. Cycle 1 is complete. Cycle 2 is complete; its Warp Storm has expired. Cycle 3 construction effects, Logistics and event check are resolved below; no event is active.<\/p>\n<p>- Calendar date within Imperium Nihilus is intentionally unspecified. Track elapsed Cycles; there is no invented conversion to years. Exact officer ages and any finite lifespan windows remain unassigned, so no automatic ageing deaths are scheduled.<\/p>\n<p>- Artwork establishes visual identity. Army Painter channel mapping remains unassigned until the actual faction interfaces are checked; this gives no mechanical benefit and does not delay campaign setup.<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Cycle<\/th><th>Phase<\/th><th>Event<\/th><th>Next faction<\/th><th>Pending battle<\/th><th>Next Logistics<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Cycle\">3<\/td><td data-label=\"Phase\">Bell-Ringa turn complete<\/td><td data-label=\"Event\">No event (check: 3)<\/td><td data-label=\"Next faction\">Order of Saint Erigone<\/td><td data-label=\"Pending battle\">None<\/td><td data-label=\"Next Logistics\">6<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Major faction registers<\/h2>\n<h3>1. Iron Paladins<\/h3>\n<p>The Iron Paladins descend from loyal Iron Warriors who rejected Perturabo. Their penitence crusade in the Eye produced a distinct Chapter, its own offices and a religious obligation to the wounded Emperor. They serve the Imperium and would obey Guilliman; their independent operational oversight pending orders is not separatism. Orontes commands. Menandros advises, leads the Ironbound and is the designated successor; Jake retains the Warsmith’s decisions. The Chapter favours prepared assaults and durable protection, with each protected world adding obligations.<\/p>\n<p><img loading=\"lazy\" alt=\"Warsmith Acastor Orontes — supplied concept art\" src=\"atreus_orontes.png\"><\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Field<\/th><th>Current value<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Field\">Controller<\/td><td data-label=\"Current value\">Jake<\/td><\/tr><tr><td data-label=\"Field\">Alignment<\/td><td data-label=\"Current value\">Imperium<\/td><\/tr><tr><td data-label=\"Field\">Commander / deputy<\/td><td data-label=\"Current value\">Warsmith Acastor Orontes / First Paladin Menandros<\/td><\/tr><tr><td data-label=\"Field\">Trait<\/td><td data-label=\"Current value\">The Iron Tithe — Efficient Logistics<\/td><\/tr><tr><td data-label=\"Field\">Exact effect<\/td><td data-label=\"Current value\">Reinforce grants 8 Supply; Muster grants 8 Manpower.<\/td><\/tr><tr><td data-label=\"Field\">Capital<\/td><td data-label=\"Current value\">Tiryns — Argos — 12/12<\/td><\/tr><tr><td data-label=\"Field\">Resources<\/td><td data-label=\"Current value\">30 Supply / 21 Manpower; neither deficit active<\/td><\/tr><tr><td data-label=\"Field\">Fleet<\/td><td data-label=\"Current value\">Crusade Fleet Anabasis - Argos - 5/5; action spent on victorious Prosymna Ground Assault<\/td><\/tr><tr><td data-label=\"Field\">Constructions<\/td><td data-label=\"Current value\">Built-in Capital Orbital Shipyard; The Forge of Iron (Major Forge Complex), Tiryns, progress 3/5 and Integrity 3/5; inactive<\/td><\/tr><tr><td data-label=\"Field\">Next Logistics if unchanged<\/td><td data-label=\"Current value\">5 Supply / 5 Manpower gross; 1/1 fleet upkeep; net +4 / +4<\/td><\/tr><tr><td data-label=\"Field\">Briefing<\/td><td data-label=\"Current value\"><a href=\"briefing_first_paladin_menandros.md\">briefing_first_paladin_menandros.md<\/a><\/td><\/tr><\/tbody><\/table><\/div>\n<h3>2. WAAAGH! Bell-Ringa<\/h3>\n<p>Bell-Ringa won his command by crushing his predecessor with a cathedral bell. The captured foundries of Da Bellworks support a Goff host that values hard fighting, working engines and trophies earned by conquest. Boss Nob Klanga coordinates mobs and detached forces. Growth depends on bringing fighters, ships and ammunition to the same battle; pride can draw the Warboss into an expensive unfinished fight. Da Gate-Krasha commemorates the fleet’s breaches of the foundry anchorage, without assigning a special ship or bonus.<\/p>\n<p><img loading=\"lazy\" alt=\"Warboss Bell-Ringa — supplied concept art\" src=\"atreus_bell_ringa.png\"><\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Field<\/th><th>Current value<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Field\">Controller<\/td><td data-label=\"Current value\">AI faction instance<\/td><\/tr><tr><td data-label=\"Field\">Alignment<\/td><td data-label=\"Current value\">Ork<\/td><\/tr><tr><td data-label=\"Field\">Commander / deputy<\/td><td data-label=\"Current value\">Warboss Bell-Ringa / Boss Nob Klanga<\/td><\/tr><tr><td data-label=\"Field\">Trait<\/td><td data-label=\"Current value\">More Boyz Fer Da Fight — Martial Culture<\/td><\/tr><tr><td data-label=\"Field\">Exact effect<\/td><td data-label=\"Current value\">+4 Manpower each Logistics Cycle.<\/td><\/tr><tr><td data-label=\"Field\">Capital<\/td><td data-label=\"Current value\">Da Bellworks — Calydon — 12/12<\/td><\/tr><tr><td data-label=\"Field\">Resources<\/td><td data-label=\"Current value\">14 Supply / 25 Manpower; neither deficit active<\/td><\/tr><tr><td data-label=\"Field\">Fleet<\/td><td data-label=\"Current value\">Da Gate-Krasha - Calydon - 5/5; action spent on Pleuron Ground Assault<\/td><\/tr><tr><td data-label=\"Field\">Constructions<\/td><td data-label=\"Current value\">Built-in Capital Orbital Shipyard; unnamed Major Forge Complex on Da Bellworks, progress 3/5 and Integrity 3/5; inactive<\/td><\/tr><tr><td data-label=\"Field\">Next Logistics if unchanged<\/td><td data-label=\"Current value\">5 Supply / 9 Manpower gross; 1/1 fleet upkeep; net +4 / +8<\/td><\/tr><tr><td data-label=\"Field\">Briefing<\/td><td data-label=\"Current value\"><a href=\"briefing_warboss_bell_ringa.md\">briefing_warboss_bell_ringa.md<\/a><\/td><\/tr><\/tbody><\/table><\/div>\n<h3>3. Order of Saint Erigone<\/h3>\n<p>The Order’s convents and shrine network preserve hospitals, military stores and authority across isolated communities. Its fictional campaign saint, Erigone, is remembered for three refusals of sanctuary to a rebel household. Althaia’s immediate case against the Paladins is their time in the Eye, reinforced by their Legion ancestry. She seeks their destruction and refuses joint operations regardless of their loyal conduct. Palatine Ianthe shares that judgement but can dispute methods and timing. Material support does not remove the need to conserve trained Sisters.<\/p>\n<p><img loading=\"lazy\" alt=\"Canoness Althaia — supplied concept art\" src=\"atreus_althaia.png\"><\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Field<\/th><th>Current value<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Field\">Controller<\/td><td data-label=\"Current value\">AI faction instance<\/td><\/tr><tr><td data-label=\"Field\">Alignment<\/td><td data-label=\"Current value\">Imperium<\/td><\/tr><tr><td data-label=\"Field\">Commander / deputy<\/td><td data-label=\"Current value\">Canoness Althaia / Palatine Ianthe<\/td><\/tr><tr><td data-label=\"Field\">Trait<\/td><td data-label=\"Current value\">Offerings of the Faithful — War Economy<\/td><\/tr><tr><td data-label=\"Field\">Exact effect<\/td><td data-label=\"Current value\">+6 Supply each Logistics Cycle.<\/td><\/tr><tr><td data-label=\"Field\">Capital<\/td><td data-label=\"Current value\">Erigone — Eleusis — 12/12<\/td><\/tr><tr><td data-label=\"Field\">Resources<\/td><td data-label=\"Current value\">21 Supply / 25 Manpower; neither deficit active<\/td><\/tr><tr><td data-label=\"Field\">Fleet<\/td><td data-label=\"Current value\">The Third Refusal - Eleusis - 5/5; action unused in Cycle 3<\/td><\/tr><tr><td data-label=\"Field\">Constructions<\/td><td data-label=\"Current value\">Built-in Capital Orbital Shipyard; The Vigil of the Three Refusals, Major Military Academy on Erigone, progress 2/5 and Integrity 2/5; inactive<\/td><\/tr><tr><td data-label=\"Field\">Next Logistics if unchanged<\/td><td data-label=\"Current value\">11 Supply / 5 Manpower gross; 1/1 fleet upkeep; net +10 / +4<\/td><\/tr><tr><td data-label=\"Field\">Briefing<\/td><td data-label=\"Current value\"><a href=\"briefing_canoness_althaia.md\">briefing_canoness_althaia.md<\/a><\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Personnel and succession<\/h2>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Faction<\/th><th>Commander<\/th><th>Deputy<\/th><th>Age / lifespan record<\/th><th>Succession<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Faction\">Iron Paladins<\/td><td data-label=\"Commander\">Acastor Orontes<\/td><td data-label=\"Deputy\">Menandros<\/td><td data-label=\"Age / lifespan record\">Astartes; biological ages unassigned. Orontes is a Heresy veteran; Warp time is not biological age.<\/td><td data-label=\"Succession\">Menandros designated; no event scheduled<\/td><\/tr><tr><td data-label=\"Faction\">WAAAGH! Bell-Ringa<\/td><td data-label=\"Commander\">Bell-Ringa<\/td><td data-label=\"Deputy\">Klanga<\/td><td data-label=\"Age / lifespan record\">Orks; exact ages unknown, no natural expiry imposed.<\/td><td data-label=\"Succession\">Klanga is deputy, not guaranteed a peaceful succession<\/td><\/tr><tr><td data-label=\"Faction\">Order of Saint Erigone<\/td><td data-label=\"Commander\">Althaia<\/td><td data-label=\"Deputy\">Ianthe<\/td><td data-label=\"Age / lifespan record\">Humans; exact ages and rejuvenation access unassigned. Source human range is guidance, not a death roll.<\/td><td data-label=\"Succession\">Ianthe operational deputy; formal succession requires recorded resolution<\/td><\/tr><\/tbody><\/table><\/div>\n<p>One Manpower represents approximately 40 Astartes, 400 Orks or 100 Sisters in the relevant Major military pool. These are abstractions, not exact ship complements or fixed Chapter establishments. Succession does not reset resources or traits. Jake may temporarily voice Klanga or Ianthe as in-character counsel; neither receives an extra action.<\/p>\n<h2>Diplomacy and explicit hostility exceptions<\/h2>\n<p><strong>7 October ruling: only Major Factions have Alignments.<\/strong> Minor Factions have no Alignment. They are independent hostile powers and cannot enter diplomatic agreements or alliances. Species, Emperor worship, human origin and Soulstorm army selection do not confer alliance. A Minor incorporated into a Major ceases to be a separate aligned Minor.<\/p>\n<p>All three Majors are mutually hostile. Iron Paladins and Order of Saint Erigone retain Imperium Alignment but have the agreed explicit hostility exception. WAAAGH! Bell-Ringa has Ork Alignment.<\/p>\n<p>All 13 Minors are independent hostile powers; none can negotiate an agreement with a Major or another Minor. Their ships count as hostile to other factions, including other Minors. Rustjaw is not allied to Bell-Ringa; the Thessalian commands are not allied to each other. No territorial absorption, truce or communiqué has occurred.<\/p>\n<h3>Death is the only absolution<\/h3>\n<p>The Order of Saint Erigone and the Iron Paladins begin the campaign with this exchange defining their hostility.<\/p>\n<p><strong>The Sisters:<\/strong><\/p>\n<p>&gt; The traitor legions are damned. The sin is in the geneseed. You carry Perturabo&#x27;s legacy in your blood. Death is the only absolution.<\/p>\n<p><strong>The Paladins:<\/strong><\/p>\n<p>&gt; We agree. We ARE damned. We owe a debt that can never be repaid. But a corpse digs no trenches. A corpse holds no wall. We will serve until our bodies fail, and THEN you can have our deaths - but not one moment sooner, because wasted potential is its own sin against the Great Work.<\/p>\n<p>For Althaia, their answer confirms the sentence: continued service cannot cleanse what she believes is corruption carried in their blood. She seeks their destruction, not their departure from Atreus. Their years in the Eye of Terror deepen her conviction, even in the absence of outward taint.<\/p>\n<p>For the Paladins, damnation expresses the debt they accept and the penance they owe. They remain loyal servants of the Emperor. Every trench dug, wall held and Imperial life defended is work still owed; surrendering their lives while they can perform that work would itself betray their duty. Their acknowledgement gives the Order no right to decide when that service ends.<\/p>\n<p>The same language of guilt and absolution therefore sustains both sides of the conflict. The Order demands death now; the Paladins insist upon service for as long as they can give it.<\/p>\n<h2>Fixed Third Party Raid<\/h2>\n<p><strong>The Nail-Takers<\/strong>, an Iron Warriors raiding detachment led by <strong>Warsmith Kordax<\/strong>, are the fixed raiders for Atreus. Their name refers to the metal spikes driven through armour plates stripped from captured engines and displayed as trophies. They seek war matériel and captives while local defenders are committed elsewhere. They are separate from House Atreides and every other holding faction.<\/p>\n<p>Use <strong>Chaos Marines<\/strong> to represent the Iron Warriors; switch to a dedicated Iron Warriors entry only if confirmed in the installed mod. The verified Unification roster does not list a standalone Iron Warriors race. The detachment has no campaign holdings, resource pool, fleet register, turns or territory-capture rights. The raid event is not active at setup. When it occurs, the raider fields one team in the first round, with each main side limited to three deployed teams while the raider remains; overflow waits in reserve. Once beaten, the raider is removed for that engagement. Subsequent main-side rounds use the agreed maximum four each and the survivor/reserve procedure. No extra trait or bespoke difficulty effect is granted.<\/p>\n<h2>Systems and holdings<\/h2>\n<p>All holdings start at full defence; none is Defended. All fleets are unengaged with unused actions. A Capital’s built-in shipyard exists without a construction slot; other industrial or religious descriptions grant no completed construction.<\/p>\n<h3>Argos<\/h3>\n<p><strong>Void Superiority:<\/strong> Iron Paladins 5 vs Argive Muster Council 1 - Iron Paladins superior; hostile fleet present.<\/p>\n<p>Former assembly and administration centre; the Chapter controls Tiryns, not the entire system.<\/p>\n<p>Setup: fixed home/prize profile recorded above.<\/p>\n<p><strong>Argive Muster Council — Death Korps of Krieg:<\/strong> Strategos Damas commands hereditary PDF officers whose authority rests on muster warrants issued before the isolation. Their families kept Heraion’s depots intact while promised reinforcements failed to arrive; they regard the Paladins’ requisitions as another attempt to spend Argive lives elsewhere. Loyal to the Emperor, they oppose both Imperial Majors’ claims to local command. Damas fights from prepared barrack lines, with artillery and reserve armour drawn from mothballed stores.<\/p>\n<p><strong>Soulstorm selection:<\/strong> Death Korps of Krieg. Local siege infantry, artillery crews and depot armour represented by Krieg; muted khaki with dark red unit markings. These are Argive troops, not a regiment imported from Dessica.<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Holding<\/th><th>Tier / type<\/th><th>Controller<\/th><th>Defence<\/th><th>Logistics / infrastructure<\/th><th>Description<\/th><th>Map theme<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Holding\">Tiryns<\/td><td data-label=\"Tier / type\">Capital Planet<\/td><td data-label=\"Controller\">Iron Paladins<\/td><td data-label=\"Defence\">12/12<\/td><td data-label=\"Logistics / infrastructure\">4 Supply + 4 Manpower; built-in shipyard<\/td><td data-label=\"Description\">A fortress-monastery crowns a basalt escarpment above ironworks and densely inhabited workers’ terraces. Siege roads climb through successive gate courts; outside them, ore conveyors cross ash fields scarred by old artillery pits. The Paladins have restored the battered gatehouses and reopened the ironworks below the monastery.<\/td><td data-label=\"Map theme\">Fortress or industrial city; steep approaches, broad breach lanes and enclosed courtyards.<\/td><\/tr><tr><td data-label=\"Holding\">Heraion<\/td><td data-label=\"Tier / type\">Standard Planet<\/td><td data-label=\"Controller\">Argive Muster Council<\/td><td data-label=\"Defence\">4/4<\/td><td data-label=\"Logistics / infrastructure\">2 Supply + 2 Manpower<\/td><td data-label=\"Description\">A military-administrative world built around immense muster squares and munition warehouses. The Council occupies the former tithe citadel; barrack districts and rail sidings form successive defensive belts around it. Civilian streets remain crow
