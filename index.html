rength / original maximum|\n|---|---|---|\n|Crusade Fleet Anabasis|Iron Paladins|5/5|\n|The Unspent Levy|Argive Muster Council|1/3|\n\n\n\nMap themes describe terrain, not verified map-pack titles. Choose a thematically suitable installed map with the required team capacity; use the existing overflow/raid procedure. Terrain descriptions grant no extra defence, construction or faction bonus.\n\n", "html": "<p><strong>Void Superiority:<\/strong> Iron Paladins 5 vs Argive Muster Council 1 - Iron Paladins superior; hostile fleet present.<\/p>\n<p>Former assembly and administration centre; the Chapter controls Tiryns, not the entire system.<\/p>\n<p>Setup: fixed home/prize profile recorded above.<\/p>\n<p><strong>Argive Muster Council — Death Korps of Krieg:<\/strong> Strategos Damas commands hereditary PDF officers whose authority rests on muster warrants issued before the isolation. Their families kept Heraion’s depots intact while promised reinforcements failed to arrive; they regard the Paladins’ requisitions as another attempt to spend Argive lives elsewhere. Loyal to the Emperor, they oppose both Imperial Majors’ claims to local command. Damas fights from prepared barrack lines, with artillery and reserve armour drawn from mothballed stores.<\/p>\n<p><strong>Soulstorm selection:<\/strong> Death Korps of Krieg. Local siege infantry, artillery crews and depot armour represented by Krieg; muted khaki with dark red unit markings. These are Argive troops, not a regiment imported from Dessica.<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Holding<\/th><th>Tier / type<\/th><th>Controller<\/th><th>Defence<\/th><th>Logistics / infrastructure<\/th><th>Description<\/th><th>Map theme<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Holding\">Tiryns<\/td><td data-label=\"Tier / type\">Capital Planet<\/td><td data-label=\"Controller\">Iron Paladins<\/td><td data-label=\"Defence\">12/12<\/td><td data-label=\"Logistics / infrastructure\">4 Supply + 4 Manpow  Manpower", "Notes": "Funerary settlements cling to a cold limestone plateau. Reliquary chapels mark entrances to ossuary galleries, while militia posts overlook the narrow roads between tomb fields. Most inhabitants live in austere service towns around the great burial gates.", "Map": "Graveyard or ruined shrine; narrow passages, stone cover and bleak open ground."}], "fleets": [["The Third Refusal", "Order of Saint Erigone", "5/5"]], "text": "\n**Void Superiority:** Order of Saint Erigone 5 vs hostile fleets 0 - Order of Saint Erigone superior; no hostile fleet present.\n\nThe Order holds Erigone and has captured Daeira. Triptolemos remains under the independent Eleusinian Synod.\n\nSetup: fixed home/prize profile recorded above.\n\n**Eleusinian Synod — Witch Hunters:** Prelate Lysandra governs through competing shrine chapters, granary trusts and hospital superiors. These institutions sheltered pilgrims during isolation and refuse to surrender their levies to Althaia’s convent. Their hostility to the Paladins and the Order is a jurisdictional dispute; they remain Emperor-worshipping humans, not a Chaos cult or a second Sisters army. Militia companies defend sacred precincts while household guards provide a more reliable reserve.\n\n**Soulstorm selection:** Witch Hunters. Shrine guards and religious enforcement troops represented by the Witch Hunters roster; cream cloth, red insignia and worn military equipment. They belong to the independent Synod, not Althaia’s Order.\n\n|Holding|Tier / type|Controller|Defence|Logistics / infrastructure|Description|Map theme|\n|---|---|---|---|---|---|\n|Erigone|Capital Planet|Order of Saint Erigone|12/12|4 Supply + 4 Manpower; built-in shipyard|A shrine Capital of pale stone basilicas, processional avenues and fortified convent precincts. Hospitals and pilgrims’ dormitories fill the lower city beneath the Order’s blackened bell towers. Broad ceremonial approaches become exposed killing grounds between substantial masonry walls. s army. Militia companies defend sacred precincts while household guards provide a more reliable reserve.<\/p>\n<p><strong>Soulstorm selection:<\/strong> Witch Hunters. Shrine guards and religious enforcement troops represented by the Witch Hunters roster; cream cloth, red insignia and worn military equipment. They belong to the independent Synod, not Althaia’s Order.<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Holding<\/th><th>Tier / type<\/th><th>Controller<\/th><th>Defence<\/th><th>Logistics / infrastructure<\/th><th>Description<\/th><th>Map theme<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Holding\">Erigone<\/td><td data-label=\"Tier / type\">Capital Planet<\/td><td data-label=\"Controller\">Order of Saint Erigone<\/td><td data-label=\"Defence\">12/12<\/td><td data-label=\"Logistics / infrastructure\">4 Supply + 4 Manpower; built-in shipyard<\/td><td data-label=\"Description\">A shrine Capital of pale stone basilicas, processional avenues and fortified convent precincts. Hospitals and pilgrims’ dormitories fill the lower city beneath the Order’s blackened bell towers. Broad ceremonial approaches become exposed killing grounds between substantial masonry walls.<\/td><td data-label=\"Map theme\">Cathedral city or shrine fortress; plazas, cloisters and defended avenues.<\/td><\/tr><tr><td data-label=\"Holding\">Triptolemos<\/td><td data-label=\"Tier / type\">Standard Planet<\/td><td data-label=\"Controller\">Eleusinian Synod<\/td><td data-label=\"Defence\">4/4<\/td><td data-label=\"Logistics / infrastructure\">2 Supply + 2 Manpower<\/td><td data-label=\"Description\">Hospitaller estates and cathedral granaries feed a crowded pilgrim population. The Synod’s militia occupies gatehouses between terraced farms and a walled ecclesiastical town. Canal bridges carry both grain carts and penitential processions.<\/td><td data-label=\"Map theme\">Temperate shrine settlement; farmland, waterways and stone bridges.<\/td><\/tr><tr><td data-label= avy infantry; deep green uniforms, charcoal armour and copper heraldry. Vostroyan models represent local troops rather than a visiting Vostroyan regiment.<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Holding<\/th><th>Tier / type<\/th><th>Controller<\/th><th>Defence<\/th><th>Logistics / infrastructure<\/th><th>Description<\/th><th>Map theme<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Holding\">Perseia<\/td><td data-label=\"Tier / type\">Capital Planet<\/td><td data-label=\"Controller\">House Atreides<\/td><td data-label=\"Defence\">12/12<\/td><td data-label=\"Logistics / infrastructure\">4 Supply + 4 Manpower; built-in shipyard<\/td><td data-label=\"Description\">The dynasty’s Capital is a storm-lashed ocean world with inhabited mountain islands. Black coastal bastions guard terraced cities and reservoir tunnels; the ruling household keeps its court above a harbour cut into volcanic rock. Sea approaches, cliff roads and sheltered dock basins determine where an invader can land.<\/td><td data-label=\"Map theme\">Coastal fortress or wet mountain city; cliffs, bridges, stone bastions and harbour approaches.<\/td><\/tr><tr><td data-label=\"Holding\">Dendra<\/td><td data-label=\"Tier / type\">Standard Planet<\/td><td data-label=\"Controller\">House Atreides<\/td><td data-label=\"Defence\">4/4<\/td><td data-label=\"Logistics / infrastructure\">2 Supply + 2 Manpower<\/td><td data-label=\"Description\">A temperate estate world supplying the household regiments with food and recruits. Old orchards surround fortified manor towns, while oath-halls and vehicle barns stand along the military roads. The orderly estates conceal hard distinctions between protected tenants and hereditary labour obligations.<\/td><td data-label=\"Map theme\">Wooded agricultural settlement; hedges, orchards, estate walls and open fields for armour.<\/td><\/tr><tr><td data-label=\"Holding\">Lion Gate<\/td><td data-label=\"Tier / type\">Minor Station<\/td><td data-label=\"Co  describe terrain, not verified map-pack titles. Choose a thematically suitable installed map with the required team capacity; use the existing overflow/raid procedure. Terrain descriptions grant no extra defence, construction or faction bonus.<\/p>", "void": "Thessalian First Command 3 vs Thessalian Remount Command 2 - Thessalian First Command superior; hostile fleet present."}], "rules": [{"title": "Soulstorm campaign rules — current playtest edition", "text": "\n6 October 2026. This is the consolidated source for the selected decision/recovery package of 6 October, including its inherited rules and approved campaign conventions. It supersedes conflicting numerical rules in the 15 September baseline, 27 September draft and intermediate proposals. Do not combine their trait values with this edition.\n\nThis is a playtest release, not a claim of final balance. The latest 200-game comparison reduced the observed highest-to-lowest trait win-rate spread from 32 to 28 percentage points; it remains above the requested 25-point target. AI campaign results do not predict human Soulstorm win rates. Sector design, the global Soulstorm difficulty problem and the mod project remain deferred. Historical source, frozen studies and suspended Dessica Cycle 21 are unchanged.\n\nFor a new campaign, copy the templates, pin this edition and record local exceptions before play. The source is reusable; the campaign ledger alone records current resources, outcomes and characters. The reconciliation record is Source_Reconciliation_2026-10-06.txt.\n\n", "html": "<p>6 October 2026. This is the consolidated source for the selected decision/recovery package of 6 October, including its inherited rules and approved campaign conventions. It supersedes conflicting numerical rules in the 15 September baseline, 27 September draft and intermediate proposals. Do not combine their trait values with this edition.<\/p>\n<p>This is a playtest release, not a claim of final balance. The latest 200-game comparison reduced the observed highest-to-lowest trait win-rate spread from 32 to 28 percentage points; it remains above the requested 25-point target. AI campaign results do not predict human Soulstorm win rates. Sector design, the global Soulstorm difficulty problem and the mod project remain deferred. Historical source, frozen studies and suspended Dessica Cycle 21 are unchanged.<\/p>\n<p>For a new campaign, copy the templates, pin this edition and record local exceptions before play. The source is reusable; the campaign ledger alone records current resources, outcomes and characters. The reconciliation record is Source_Reconciliation_2026-10-06.txt.<\/p>"}, {"title": "Setup, resources and personnel", "text": "\nNew roster-building Subsector Major factions begin with 20 Supply and 20 Manpower, capped at 100 each. Both represent military resources, not the civilian economy. Use one agreed rules version and record exceptions before play. Only Major Factions have Alignments. Minor Factions have none; force species does not confer alliance. Independent remains a Major Alignment, never an automatic alliance. Fleets measure combat effectiveness, not a literal ship count.\n\nEstablish the Subsector's fixed raiding faction at setup; raiders cannot hold territory. Dessica's raiders remain Iron Warriors. Generate ordinary systems from the d20 table below: 2–4 combined planets/stations, averaging 3. Exceptional prize factions can hold Capitals.\n\n", "html": "<p>New roster-building Subsector Major factions begin with 20 Supply and 20 Manpower, capped at 100 each. Both represent military resources, not the civilian economy. Use one agreed rules version and record exceptions before play. Only Major Factions have Alignments. Minor Factions have none; force species does not confer alliance. Independent remains a Major Alignment, never an automatic alliance. Fleets measure combat effectiveness, not a literal ship count.<\/p>\n<p>Establish the Subsector&#x27;s fixed raiding faction at setup; raiders cannot hold territory. Dessica&#x27;s raiders remain Iron Warriors. Generate ordinary systems from the d20 table below: 2–4 combined planets/stations, averaging 3. Exceptional prize factions can hold Capitals.<\/p>"}, {"title": "Faction Alignments", "text": "\n**7 October 2026 creator correction:** Alignments apply only to Major Factions. Majors sharing a non-Independent Alignment are allied by default unless an explicit hostility exception is recorded, such as the Atreus Sisters and Iron Paladins. Different Major Alignments are hostile without an applicable agreement; two Independent Majors are not automatically allied.\n\nMinor Factions have no Alignment and cannot enter diplomatic agreements or alliances. They are hostile to other factions; species, force representation and narrative worship do not make them allied. A Minor absorbed into a Major is no longer a separate aligned Minor. The Alignment column below applies only when the force is a Major; the manpower and representation guidance applies to both roles.\n\n| Faction | Alignment | Per Manpower | Ratio to Marine | vs Guard | Force Description |\n|---------|-----------|--------------|-----------------|----------|-------------------|\n| Space Marines | Imperium | 40 | 1:1 | 1:15 | Battle-brothers only. Chapter Serfs, Servitors, and non-combat personnel not tracked. Vehicle crews included. |\n| Chaos Space Marines | Chaos | 40 | 1:1 | 1:15 | Traitor Astartes only. Cultists, mutants, and daemonic auxiliaries supplement forces but not explicitly tracked. |\n| Grey Knights | Imperium | 40 | 1:1 | 1:15 | Battle-brothers only. Inquisitorial retinues and support staff not tracked. |\n| Sisters of Battle | Imperium | 100 | 1:2.5 | 1:6 | Battle Sisters and vehicle crews. Ecclesiarchy support, Arco-flagellants, Penitent Engines as auxiliary not tracked. |\n| Imperial Guard | Imperium | 600 | 1:15 | Baseline | Frontline infantry, officers, heavy weapons teams, tank crews. Logistics and rear echelon not tracked. |\n| Traitor Guard | Chaos | 600 | 1:15 | Baseline | As Imperial Guard. Mutants and Chaos-touched may supplement but not tracked. |\n| Craftworld Eldar | Aeldari | 100 | 1:2.5 | 1:6 | Mix of Aspect Warriors and Guardian militia. Seers, vehicle crews included. Wraithbone constructs as heavy support not explicitly tracked. |\n| Harlequins | Aeldari | 15 | 2.67:1 | 1:40 | Players only. Troupes, Shadowseers, Death Jesters, Solitaires. No auxiliaries - they operate alone. |\n| Drukhari | Drukhari | 160 | 1:4 | 1:3.75 | Kabalite Warriors, Wyches, vehicle crews. Haemonculus creations and slaves may supplement raids but not tracked. |\n| Necrons | Necron | 160 | 1:4 | 1:3.75 | Warriors, Immortals, command elements. Canoptek constructs (Scarabs, Wraiths, Spyders) as auxiliary not explicitly tracked. |\n| Tau | T'au | 320 | 1:8 | 1:1.9 | Fire Caste Warriors, Pathfinders, Battlesuit pilots, vehicle crews. Kroot and Vespid auxiliaries handled as separate formations. |\n| Orks | Ork | 400 | 1:10 | 1:1.5 | Boyz, Nobz, specialist mobs, vehicle crews. Gretchin serve as support. Squigs not tracked. |\n| Tyranids | Tyranid | 800 | 1:20 | 1:1.3 | Weighted average: primarily Gaunts with Warriors and Genestealers as synapse/elite. Larger bioforms (Carnifexes, etc.) as heavy support. |\n| Chaos Daemons | Chaos | 100 | 1:2.5 | 1:6 | Full daemonic incursion: lesser daemons as line troops (Bloodletters, Daemonettes, Plaguebearers, Horrors). Greater Daemons and Daemon Princes as command elements. |\n| Adeptus Mechanicus | Imperium | 240 | 1:6 | 1:2.5 | Skitarii Rangers/Vanguard, Tech-Priests, Servitors. Battle Automata and heavier war machines as support not explicitly tracked. |\n| Independent (Rogue Traders, Pirates, minor xenos, unaligned forces) | Independent | Varies | Varies | Varies | Independents are all-encompassing. Manpower ratios depend on the specific force composition — use the ratio of whichever faction type best represents the force being fought. |\n\n---\n\n", "html": "<p><strong>7 October 2026 creator correction:<\/strong> Alignments apply only to Major Factions. Majors sharing a non-Independent Alignment are allied by default unless an explicit hostility exception is recorded, such as the Atreus Sisters and Iron Paladins. Different Major Alignments are hostile without an applicable agreement; two Independent Majors are not automatically allied.<\/p>\n<p>Minor Factions have no Alignment and cannot enter diplomatic agreements or alliances. They are hostile to other factions; species, force representation and narrative worship do not make them allied. A Minor absorbed into a Major is no longer a separate aligned Minor. The Alignment column below applies only when the force is a Major; the manpower and representation guidance applies to both roles.<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Faction<\/th><th>Alignment<\/th><th>Per Manpower<\/th><th>Ratio to Marine<\/th><th>vs Guard<\/th><th>Force Description<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Faction\">Space Marines<\/td><td data-label=\"Alignment\">Imperium<\/td><td data-label=\"Per Manpower\">40<\/td><td data-label=\"Ratio to Marine\">1:1<\/td><td data-label=\"vs Guard\">1:15<\/td><td data-label=\"Force Description\">Battle-brothers only. Chapter Serfs, Servitors, and non-combat personnel not tracked. Vehicle crews included.<\/td><\/tr><tr><td data-label=\"Faction\">Chaos Space Marines<\/td><td data-label=\"Alignment\">Chaos<\/td><td data-label=\"Per Manpower\">40<\/td><td data-label=\"Ratio to Marine\">1:1<\/td><td data-label=\"vs Guard\">1:15<\/td><td data-label=\"Force Description\">Traitor Astartes only. Cultists, mutants, and daemonic auxiliaries supplement forces but not explicitly tracked.<\/td><\/tr><tr><td data-label=\"Faction\">Grey Knights<\/td><td data-label=\"Alignment\">Imperium<\/td><td data-label=\"Per Manpower\">40<\/td><td data-label=\"Ratio to Marine\">1:1<\/td><td data-label=\"vs Guard\">1:15<\/td><td data-label=\" ction\">Drukhari<\/td><td data-label=\"Alignment\">Drukhari<\/td><td data-label=\"Per Manpower\">160<\/td><td data-label=\"Ratio to Marine\">1:4<\/td><td data-label=\"vs Guard\">1:3.75<\/td><td data-label=\"Force Description\">Kabalite Warriors, Wyches, vehicle crews. Haemonculus creations and slaves may supplement raids but not tracked.<\/td><\/tr><tr><td data-label=\"Faction\">Necrons<\/td><td data-label=\"Alignment\">Necron<\/td><td data-label=\"Per Manpower\">160<\/td><td data-label=\"Ratio to Marine\">1:4<\/td><td data-label=\"vs Guard\">1:3.75<\/td><td data-label=\"Force Description\">Warriors, Immortals, command elements. Canoptek constructs (Scarabs, Wraiths, Spyders) as auxiliary not explicitly tracked.<\/td><\/tr><tr><td data-label=\"Faction\">Tau<\/td><td data-label=\"Alignment\">T&#x27;au<\/td><td data-label=\"Per Manpower\">320<\/td><td data-label=\"Ratio to Marine\">1:8<\/td><td data-label=\"vs Guard\">1:1.9<\/td><td data-label=\"Force Description\">Fire Caste Warriors, Pathfinders, Battlesuit pilots, vehicle crews. Kroot and Vespid auxiliaries handled as separate formations.<\/td><\/tr><tr><td data-label=\"Faction\">Orks<\/td><td data-label=\"Alignment\">Ork<\/td><td data-label=\"Per Manpower\">400<\/td><td data-label=\"Ratio to Marine\">1:10<\/td><td data-label=\"vs Guard\">1:1.5<\/td><td data-label=\"Force Description\">Boyz, Nobz, specialist mobs, vehicle crews. Gretchin serve as support. Squigs not tracked.<\/td><\/tr><tr><td data-label=\"Faction\">Tyranids<\/td><td data-label=\"Alignment\">Tyranid<\/td><td data-label=\"Per Manpower\">800<\/td><td data-label=\"Ratio to Marine\">1:20<\/td><td data-label=\"vs Guard\">1:1.3<\/td><td data-label=\"Force Description\">Weighted average: primarily Gaunts with Warriors and Genestealers as synapse/elite. Larger bioforms (Carnifexes, etc.) as heavy support.<\/td><\/tr><tr><td data-label=\"Faction\">Chaos Daemons<\/td><td data-label=\"Alignment\">Chaos<\/td><td data-label=\"Per Manpower\">100<\/td><td data-label=\"Ratio to Marine\">1:2.5<\/td><td data-label=\"vs Guard\">1:6<\/td><td data-label=\"Force Description\">Full daemonic incursion: lesser daemons as line troops (Bloodletters, Daemonettes, Plaguebearers, Horrors). Greater Daemons and Daemon Princes as command elements.<\/td><\/tr><tr><td data-label=\"Faction\">Adeptus Mechanicus<\/td><td data-label=\"Alignment\">Imperium<\/td><td data-label=\"Per Manpower\">240<\/td><td data-label=\"Ratio to Marine\">1:6<\/td><td data-label=\"vs Guard\">1:2.5<\/td><td data-label=\"Force Description\">Skitarii Rangers/Vanguard, Tech-Priests, Servitors. Battle Automata and heavier war machines as support not explicitly tracked.<\/td><\/tr><tr><td data-label=\"Faction\">Independent (Rogue Traders, Pirates, minor xenos, unaligned forces)<\/td><td data-label=\"Alignment\">Independent<\/td><td data-label=\"Per Manpower\">Varies<\/td><td data-label=\"Ratio to Marine\">Varies<\/td><td data-label=\"vs Guard\">Varies<\/td><td data-label=\"Force Description\">Independents are all-encompassing. Manpower ratios depend on the specific force composition — use the ratio of whichever faction type best represents the force being fought.<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>"}, {"title": "Personnel lifespan reference — 20 September 2026", "text": "\nPlace this reference alongside the Manpower conversion table. These describe personnel, not the age of a faction or its entire Manpower pool. Numeric campaign defaults below are provisional house assumptions, not universal canonical death ages. Track biological age separately from time spent in stasis or distorted Warp time. No Cycle-to-years conversion is introduced here.\n\n| Personnel profile | Lifespan guidance for campaign records |\n|---|---|\n| Unaugmented humans: Guard, Sisters, mortal Traitor Guard, human Independents | Proposed natural-age reference: 60–100 Terran years where living conditions and medical care permit. This is a house range, not average Imperial life expectancy or a mandatory retirement age. |\n| Humans with sustained rejuvenation | Centuries are possible; proposed record range 200–400 years, adjusted for the specific treatment and character. Not automatically available to all human personnel. |\n| Space Marines and Grey Knights | Centuries; exceptional individuals exceed a millennium. No established universal natural death age: record individual history rather than imposing a fabricated species expiry. |\n| Chaos Space Marines | Astartes baseline, modified by recorded Warp exposure and supernatural effects. Calendar age is not automatically biological age. |\n| Craftworld Aeldari and Harlequins | Millennial lifespans; approximately 1,000–2,000+ years as broad reference, not a hard maximum. Individual and psychic exceptions apply. |\n| Drukhari | Record Aeldari ancestry plus rejuvenation/reconstruction arrangements; no automatic old-age deadline while sustained by those arrangements. |\n| T'au | Approximately 40 Terran years ordinarily. Record stasis, exceptional medicine or other established life extension separately. |\n| Orks | No dependable natural maximum specified here; do not invent an automatic old-age death. |\n| Necrons | No ordinary biological ageing; destruction, degradation and personality loss are distinct narrative events. |\n| Tyranids | Bioform-specific lifespan and recycling; persistent command identity is not necessarily the same biological body. No species-wide age band. |\n| Chaos Daemons | No ordinary biological lifespan; banishment and destruction follow their narrative circumstances. |\n| Adeptus Mechanicus | Human baseline modified individually by augmentation and rejuvenation; heavily augmented personnel may endure for centuries or longer. |\n| Independent or mixed-species personnel | Use the actual individual's species and recorded life extension; Independent is not a species. |\n\nReference sources for numerical anchors: [human rejuvenation](https://wh40k.lexicanum.com/mediawiki/index.php?title=Rejuvenat), [T'au physiology](https://wh40k.lexicanum.com/mediawiki/index.php?title=T%27au), and [Aeldari](https://wh40k.lexicanum.com/wiki/Aeldari). These are lore reference summaries; proposed human ranges are campaign conventions. Major factions select narrative succession; the referee manages Minor personnel. Succession retains the faction trait. Agree any finite character death window when establishing that character, rather than retroactively assigning one.\n\n", "html": "<p>Place this reference alongside the Manpower conversion table. These describe personnel, not the age of a faction or its entire Manpower pool. Numeric campaign defaults below are provisional house assumptions, not universal canonical death ages. Track biological age separately from time spent in stasis or distorted Warp time. No Cycle-to-years conversion is introduced here.<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Personnel profile<\/th><th>Lifespan guidance for campaign records<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Personnel profile\">Unaugmented humans: Guard, Sisters, mortal Traitor Guard, human Independents<\/td><td data-label=\"Lifespan guidance for campaign records\">Proposed natural-age reference: 60–100 Terran years where living conditions and medical care permit. This is a house range, not average Imperial life expectancy or a mandatory retirement age.<\/td><\/tr><tr><td data-label=\"Personnel profile\">Humans with sustained rejuvenation<\/td><td data-label=\"Lifespan guidance for campaign records\">Centuries are possible; proposed record range 200–400 years, adjusted for the specific treatment and character. Not automatically available to all human personnel.<\/td><\/tr><tr><td data-label=\"Personnel profile\">Space Marines and Grey Knights<\/td><td data-label=\"Lifespan guidance for campaign records\">Centuries; exceptional individuals exceed a millennium. No established universal natural death age: record individual history rather than imposing a fabricated species expiry.<\/td><\/tr><tr><td data-label=\"Personnel profile\">Chaos Space Marines<\/td><td data-label=\"Lifespan guidance for campaign records\">Astartes baseline, modified by recorded Warp exposure and supernatural effects. Calendar age is not automatically biological age.<\/td><\/tr><tr><td data-label=\"Personnel profile\">Craftworld Aeldari and Harlequins<\/td><td data-label=\"Lifespan guidance for campaign records\">Millennial lifespans; approximately 1,000–2,000+ years as broad reference, not a hard maximum. Individual and psychic exceptions apply.<\/td><\/tr><tr><td data-label=\"Personnel profile\">Drukhari<\/td><td data-label=\"Lifespan guidance for campaign records\">Record Aeldari ancestry plus rejuvenation/reconstruction arrangements; no automatic old-age deadline while sustained by those arrangements.<\/td><\/tr><tr><td data-label=\"Personnel profile\">T&#x27;au<\/td><td data-label=\"Lifespan guidance for campaign records\">Approximately 40 Terran years ordinarily. Record stasis, exceptional medicine or other established life extension separately.<\/td><\/tr><tr><td data-label=\"Personnel profile\">Orks<\/td><td data-label=\"Lifespan guidance for campaign records\">No dependable natural maximum specified here; do not invent an automatic old-age death.<\/td><\/tr><tr><td data-label=\"Personnel profile\">Necrons<\/td><td data-label=\"Lifespan guidance for campaign records\">No ordinary biological ageing; destruction, degradation and personality loss are distinct narrative events.<\/td><\/tr><tr><td data-label=\"Personnel profile\">Tyranids<\/td><td data-label=\"Lifespan guidance for campaign records\">Bioform-specific lifespan and recycling; persistent command identity is not necessarily the same biological body. No species-wide age band.<\/td><\/tr><tr><td data-label=\"Personnel profile\">Chaos Daemons<\/td><td data-label=\"Lifespan guidance for campaign records\">No ordinary biological lifespan; banishment and destruction follow their narrative circumstances.<\/td><\/tr><tr><td data-label=\"Personnel profile\">Adeptus Mechanicus<\/td><td data-label=\"Lifespan guidance for campaign records\">Human baseline modified individually by augmentation and rejuvenation; heavily augmented personnel may endure for centuries or longer.<\/td><\/tr><tr><td data-label=\"Personnel profile\">Independent or mixed-species personnel<\/td><td data-label=\"Lifespan guidance for campaign records\">Use the actual individual&#x27;s species and recorded life extension; Independent is not a species.<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Reference sources for numerical anchors: <a href=\"https://wh40k.lexicanum.com/mediawiki/index.php?title=Rejuvenat\">human rejuvenation<\/a>, <a href=\"https://wh40k.lexicanum.com/mediawiki/index.php?title=T%27au\">T&#x27;au physiology<\/a>, and <a href=\"https://wh40k.lexicanum.com/wiki/Aeldari\">Aeldari<\/a>. These are lore reference summaries; proposed human ranges are campaign conventions. Major factions select narrative succession; the referee manages Minor personnel. Succession retains the faction trait. Agree any finite character death window when establishing that character, rather than retroactively assigning one.<\/p>"}, {"title": "Faction traits", "text": "\nNarrative names do not change the following mechanics. Each faction uses one profile. Income and refunds respect the resource cap and deficit locks.\n\n| Trait | Current effect |\n|---|---|\n| Mobile Capital | Starts with a 12/12 Mobile Capital instead of an ordinary starting fleet. Grants 4 Supply and 4 Manpower each Logistics Cycle, a built-in shipyard and support for planetary constructions. No Mobile Capital upkeep. Its intrinsic hull contributes floor((6 × current hull + 5) / 10) combat Strength: 7 at 12 hull. Added permanent Fleet-construction Strength contributes in full and takes damage before intrinsic hull. Losing the Mobile Capital permanently removes the trait. |\n| War Economy | +6 Supply each Logistics Cycle. |\n| Martial Culture | +4 Manpower each Logistics Cycle. |\n| Efficient Logistics | Reinforce grants 8 Supply; Muster grants 8 Manpower, instead of the normal 3. These are total action yields. |\n| Salvagers | +3 Supply on a qualifying victory; +1 on defeat or draw; +1 additional Supply on capture. Ground battles, Fleet Battles and guarded Structure Assaults qualify, once per participating faction per engagement. Uncontested bombardment and unguarded Structure Assaults do not. If raiders win, both main factions receive the defeat reward. |\n| Void Supremacy | Ordinary Expand Fleet restores up to 4 Strength for 1 Supply and 1 Manpower, without a shipyard. Ordinary fleet upkeep is 0 Supply and ceil(number of living ordinary fleets / 2) Manpower. Creation still needs a yard; this does not improve Mobile Capital self-repair. |\n| Swift Mobilization | Create Fleet produces 6/6 for 1 Supply and 1 Manpower. Its base capacity remains 6; existing starting fleets are not enlarged retroactively. The new fleet cannot act that Cycle. Ordinary fleet upkeep is ceil(number of living ordinary fleets / 2) of each resource. Expand remains the normal +2. |\n| Fleet Endurance | Each Cycle, before events, restore up to 2 Strength to every surviving fleet, capped at its actual maximum. Ordinary fleet upkeep is ceil(number of living ordinary fleets / 2) of each resource. No resurrection or Integrity repair. |\n| Siege Doctrine | Ground Assault base Supply cost is ceil(holding tier / 2); enemy surcharges are not halved. Ignore Defended. Victory adds 1 damage above the ordinary +1 breakthrough; defeat deals 1 before mitigation. On victory, recover 2 additional committed Manpower, capped at commitment, and refund 1 paid base Supply. No refund funds the attack in advance; no surcharge refund or non-victory refund. |\n| Dread Reputation | Each attack against this faction costs the initiator an additional 2 + max(1, ceil(declared participating combat Strength / 5)) of BOTH Supply and Manpower. Calculate before initiation losses or cannons, including ground-only Strength for a Ground Assault. Charge once for the combined group, including allied assets. Applies to ground, naval, bombardment and targeted construction attacks. This Manpower is expenditure, not recoverable commitment. No Soulstorm difficulty modifier. |\n| Fortification Experts | The holding/Mobile Capital Defend action costs no resources, restores up to 4 defence, grants Defended and grants 2 Supply. It still uses the Faction Action, including when defending a full holding. No Manpower grant, Integrity repair or construction discount. |\n| Industrial Efficiency | Each Build or Upgrade action costs 3 less Supply, minimum 1. A new project begins at 2 Integrity; subsequent Build and Upgrade actions add the normal 1. Repair is unchanged. |\n\n", "html": "<p>Narrative names do not change the following mechanics. Each faction uses one profile. Income and refunds respect the resource cap and deficit locks.<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Trait<\/th><th>Current effect<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Trait\">Mobile Capital<\/td><td data-label=\"Current effect\">Starts with a 12/12 Mobile Capital instead of an ordinary starting fleet. Grants 4 Supply and 4 Manpower each Logistics Cycle, a built-in shipyard and support for planetary constructions. No Mobile Capital upkeep. Its intrinsic hull contributes floor((6 × current hull + 5) / 10) combat Strength: 7 at 12 hull. Added permanent Fleet-construction Strength contributes in full and takes damage before intrinsic hull. Losing the Mobile Capital permanently removes the trait.<\/td><\/tr><tr><td data-label=\"Trait\">War Economy<\/td><td data-label=\"Current effect\">+6 Supply each Logistics Cycle.<\/td><\/tr><tr><td data-label=\"Trait\">Martial Culture<\/td><td data-label=\"Current effect\">+4 Manpower each Logistics Cycle.<\/td><\/tr><tr><td data-label=\"Trait\">Efficient Logistics<\/td><td data-label=\"Current effect\">Reinforce grants 8 Supply; Muster grants 8 Manpower, instead of the normal 3. These are total action yields.<\/td><\/tr><tr><td data-label=\"Trait\">Salvagers<\/td><td data-label=\"Current effect\">+3 Supply on a qualifying victory; +1 on defeat or draw; +1 additional Supply on capture. Ground battles, Fleet Battles and guarded Structure Assaults qualify, once per participating faction per engagement. Uncontested bombardment and unguarded Structure Assaults do not. If raiders win, both main factions receive the defeat reward.<\/td><\/tr><tr><td data-label=\"Trait\">Void Supremacy<\/td><td data-label=\"Current effect\">Ordinary Expand Fleet restores up to 4 Strength for 1 Supply and 1 Manpower, without a shipyard. Ordinary fleet upkeep is 0 Supply and ceil(number of living ordinary fleets / 2) Manpower. Creation still needs a yard; this does not improve Mobile Capital self-repair.<\/td><\/tr><tr><td data-label=\"Trait\">Swift Mobilization<\/td><td data-label=\"Current effect\">Create Fleet produces 6/6 for 1 Supply and 1 Manpower. Its base capacity remains 6; existing starting fleets are not enlarged retroactively. The new fleet cannot act that Cycle. Ordinary fleet upkeep is ceil(number of living ordinary fleets / 2) of each resource. Expand remains the normal +2.<\/td><\/tr><tr><td data-label=\"Trait\">Fleet Endurance<\/td><td data-label=\"Current effect\">Each Cycle, before events, restore up to 2 Strength to every surviving fleet, capped at its actual maximum. Ordinary fleet upkeep is ceil(number of living ordinary fleets / 2) of each resource. No resurrection or Integrity repair.<\/td><\/tr><tr><td data-label=\"Trait\">Siege Doctrine<\/td><td data-label=\"Current effect\">Ground Assault base Supply cost is ceil(holding tier / 2); enemy surcharges are not halved. Ignore Defended. Victory adds 1 damage above the ordinary +1 breakthrough; defeat deals 1 before mitigation. On victory, recover 2 additional committed Manpower, capped at commitment, and refund 1 paid base Supply. No refund funds the attack in advance; no surcharge refund or non-victory refund.<\/td><\/tr><tr><td data-label=\"Trait\">Dread Reputation<\/td><td data-label=\"Current effect\">Each attack against this faction costs the initiator an additional 2 + max(1, ceil(declared participating combat Strength / 5)) of BOTH Supply and Manpower. Calculate before initiation losses or cannons, including ground-only Strength for a Ground Assault. Charge once for the combined group, including allied assets. Applies to ground, naval, bombardment and targeted construction attacks. This Manpower is expenditure, not recoverable commitment. No Soulstorm difficulty modifier.<\/td><\/tr><tr><td data-label=\"Trait\">Fortification Experts<\/td><td data-label=\"Current effect\">The holding/Mobile Capital Defend action costs no resources, restores up to 4 defence, grants Defended and grants 2 Supply. It still uses the Faction Action, including when defending a full holding. No Manpower grant, Integrity repair or construction discount.<\/td><\/tr><tr><td data-label=\"Trait\">Industrial Efficiency<\/td><td data-label=\"Current effect\">Each Build or Upgrade action costs 3 less Supply, minimum 1. A new project begins at 2 Integrity; subsequent Build and Upgrade actions add the normal 1. Repair is unchanged.<\/td><\/tr><\/tbody><\/table><\/div>"}, {"title": "Cycle sequence and resources", "text": "\n**Phase 0 happens once globally (there is no separate second event phase):** snapshot and resolve periodic construction damage; apply surviving eligible repair/regeneration effects; resolve Logistics on Cycles 3, 6, 9…; then make the single event check. Endurance recovery precedes events. No faction gets a second copy on its own turn. Destruction precedes repair, and destroyed assets cannot regenerate.\n\nLogistics grants Supply and Manpower equal to owned holding tiers: Minor 1, Standard 2, Major 3, Capital 4, plus active constructions and traits. Ordinary living fleets normally cost 1 of each resource per Logistics Cycle; apply the trait upkeep exceptions above. Credit income up to the 100 cap first, then deduct upkeep; income above the cap is not banked against upkeep. Mobile Capitals do not pay ordinary fleet upkeep. Existing deficit locks suppress their affected resource's income and penalties.\n\nEach Major then completes Phase 2 Fleet actions, one Phase 3 Faction action, one Phase 4 Social action and one Phase 5 Construction action in that order. Resolve each attack before dependent later actions. A player battle pauses the turn for the reported result; do not update GitHub with unresolved projected outcomes. At Cycle end resolve eligible Minor recovery and record the narrative, then advance the Cycle and begin the next Phase 0. Defended expires at the start of the owning faction's next turn. Attacked/engaged flags govern the relevant recovery interval and are cleared only after that recovery has been assessed. Narration uses in-world language; mechanical records remain separate.\n\n**Voluntary expenditure must leave each resource spent above 0.** Involuntary losses may trigger deficits. Automatic defensive commitment is calculated for the battle but the final actual loss is settled once, after the attack on the attacker's turn. Planet Fall replaces ordinary defeat Supply loss rather than adding it twice. It is not the voluntary Defend action.\n\n", "html": "<p><strong>Phase 0 happens once globally (there is no separate second event phase):<\/strong> snapshot and resolve periodic construction damage; apply surviving eligible repair/regeneration effects; resolve Logistics on Cycles 3, 6, 9…; then make the single event check. Endurance recovery precedes events. No faction gets a second copy on its own turn. Destruction precedes repair, and destroyed assets cannot regenerate.<\/p>\n<p>Logistics grants Supply and Manpower equal to owned holding tiers: Minor 1, Standard 2, Major 3, Capital 4, plus active constructions and traits. Ordinary living fleets normally cost 1 of each resource per Logistics Cycle; apply the trait upkeep exceptions above. Credit income up to the 100 cap first, then deduct upkeep; income above the cap is not banked against upkeep. Mobile Capitals do not pay ordinary fleet upkeep. Existing deficit locks suppress their affected resource&#x27;s income and penalties.<\/p>\n<p>Each Major then completes Phase 2 Fleet actions, one Phase 3 Faction action, one Phase 4 Social action and one Phase 5 Construction action in that order. Resolve each attack before dependent later actions. A player battle pauses the turn for the reported result; do not update GitHub with unresolved projected outcomes. At Cycle end resolve eligible Minor recovery and record the narrative, then advance the Cycle and begin the next Phase 0. Defended expires at the start of the owning faction&#x27;s next turn. Attacked/engaged flags govern the relevant recovery interval and are cleared only after that recovery has been assessed. Narration uses in-world language; mechanical records remain separate.<\/p>\n<p><strong>Voluntary expenditure must leave each resource spent above 0.<\/strong> Involuntary losses may trigger deficits. Automatic defensive commitment is calculated for the battle but the final actual loss is settled once, after the attack on the attacker&#x27;s turn. Planet Fall replaces ordinary defeat Supply loss rather than adding it twice. It is not the voluntary Defend action.<\/p>"}, {"title": "Fleet and Faction actions", "text": "\n- Every fleet has one offensive/movement Fleet Action per Cycle, including consented participation on an ally's turn. Defending is automatic and consumes no action, even after an earlier action.\n- Move to any system in the Subsector: map directions describe location, not adjacency or extra travel distance. Storms prevent ordinary movement. Only an explicit ability such as Scout combines movement and attack.\n- Expand at an available yard: 1 Supply and 1 Manpower for+2 strength, capped at actual maximum, subject to trait exceptions.\n- Create Fleet uses the Faction Action at an available yard: 1 Supply and 1 Manpower, normally 1/5. Yard/trait starting strengths use the best applicable value, not an additive stack. The new fleet takes no Fleet Action that Cycle.\n- Reinforce gives 3 Supply; Muster gives 3 Manpower; Efficient Logistics gives 8. Rationing replaces the relevant action while its resource is locked.\n- Defend a holding or Mobile Capital costs its tier in each resource, restores that much defence, and grants Defended until the next turn. Fortification uses its listed exception. Full-defence hosts can receive Defended without extra restoration.\n- Fleet Transfer/Merge require co-location and Void Superiority; only the initiator spends an action. A Transfer donor retains at least 1; transfer amounts respect actual capacity. A Merge absorbs the other fleet completely without a fleet-destruction penalty. Its constructions transfer, including permanent capacity. Keep the absorbing fleet's base capacity and add the absorbed fleet's permanent construction capacity, not its ordinary base capacity. Excess combined current Strength above that surviving capacity is lost. Mobile Capitals cannot be transferred or merged.\n- Garrison Transfer may distribute defence within a system. Donors normally start full and always retain 1; recipients cannot exceed maximum. An active Landing Zones recipient permits damaged donors. This uses the Faction Action.\n- Scuttle a fleet with Void Superiority, using its Fleet Action, to recover floor(current Strength / 2) Supply. Apply destruction penalties before the refund; it cannot fund an otherwise illegal voluntary action. A Mobile Capital also incurs its Capital penalties and permanently loses its trait. Scuttling cannot cause a resource deficit.\n\n\n", "html": "<p>- Every fleet has one offensive/movement Fleet Action per Cycle, including consented participation on an ally&#x27;s turn. Defending is automatic and consumes no action, even after an earlier action.<\/p>\n<p>- Move to any system in the Subsector: map directions describe location, not adjacency or extra travel distance. Storms prevent ordinary movement. Only an explicit ability such as Scout combines movement and attack.<\/p>\n<p>- Expand at an available yard: 1 Supply and 1 Manpower for+2 strength, capped at actual maximum, subject to trait exceptions.<\/p>\n<p>- Create Fleet uses the Faction Action at an available yard: 1 Supply and 1 Manpower, normally 1/5. Yard/trait starting strengths use the best applicable value, not an additive stack. The new fleet takes no Fleet Action that Cycle.<\/p>\n<p>- Reinforce gives 3 Supply; Muster gives 3 Manpower; Efficient Logistics gives 8. Rationing replaces the relevant action while its resource is locked.<\/p>\n<p>- Defend a holding or Mobile Capital costs its tier in each resource, restores that much defence, and grants Defended until the next turn. Fortification uses its listed exception. Full-defence hosts can receive Defended without extra restoration.<\/p>\n<p>- Fleet Transfer/Merge require co-location and Void Superiority; only the initiator spends an action. A Transfer donor retains at least 1; transfer amounts respect actual capacity. A Merge absorbs the other fleet completely without a fleet-destruction penalty. Its constructions transfer, including permanent capacity. Keep the absorbing fleet&#x27;s base capacity and add the absorbed fleet&#x27;s permanent construction capacity, not its ordinary base capacity. Excess combined current Strength above that surviving capacity is lost. Mobile Capitals cannot be transferred or merged.<\/p>\n<p>- Garrison Transfer may distribute defence within a system. Donors normally start full and always retain 1; recipients cannot exceed maximum. An active Landing Zones recipient permits damaged donors. This uses the Faction Action.<\/p>\n<p>- Scuttle a fleet with Void Superiority, using its Fleet Action, to recover floor(current Strength / 2) Supply. Apply destruction penalties before the refund; it cannot fund an otherwise illegal voluntary action. A Mobile Capital also incurs its Capital penalties and permanently loses its trait. Scuttling cannot cause a resource deficit.<\/p>"}, {"title": "Holdings, Void Superiority and action timing", "text": "\n| Holding tier | Normal defence | Logistics income (each resource) | Ground Assault base Supply | Normal Defend cost (each resource) and restoration |\n|---|---:|---:|---:|---:|\n| Minor | 2 | 1 | 1 | 1 |\n| Standard | 4 | 2 | 2 | 2 |\n| Major | 8 | 3 | 3 | 3 |\n| Capital | 12 | 4 | 4 | 4 |\n\nPlanets and stations use the same tier rules. Void Superiority means the total friendly combat Strength in a system strictly exceeds total hostile combat Strength; a tie is contested. Include allied fleets and Mobile Capitals. This is different from uncontested bombardment, which requires no hostile fleet at all. A full holding may still take Defend to gain Defended. Ordinary Defend restores the tier amount, capped at maximum; Fortification replaces that amount with 4. Active Militia Barracks removes the holding Defend action's Manpower cost, not its normal Supply cost.\n\nA Mobile Capital may spend its Fleet Action and 1 Supply / 1 Manpower to Expand itself by up to 2 defence. This does not grant Defended or repair attached Integrity. Its Faction-action Defend normally costs 4 of each resource and restores up to 4. Its actual defence, not its reduced combat contribution, determines whether its construction host is full.\n\nEstablish New Capital is compulsory when applicable. An established Capital's built-in Orbital Shipyard costs no construction action, Supply or slot. Normal fleets have base capacity 5 unless a rule explicitly changes it. Repair and expansion use actual capacity, including permanent additions.\n\n", "html": "<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Holding tier<\/th><th>Normal defence<\/th><th>Logistics income (each resource)<\/th><th>Ground Assault base Supply<\/th><th>Normal Defend cost (each resource) and restoration<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Holding tier\">Minor<\/td><td data-label=\"Normal defence\">2<\/td><td data-label=\"Logistics income (each resource)\">1<\/td><td data-label=\"Ground Assault base Supply\">1<\/td><td data-label=\"Normal Defend cost (each resource) and restoration\">1<\/td><\/tr><tr><td data-label=\"Holding tier\">Standard<\/td><td data-label=\"Normal defence\">4<\/td><td data-label=\"Logistics income (each resource)\">2<\/td><td data-label=\"Ground Assault base Supply\">2<\/td><td data-label=\"Normal Defend cost (each resource) and restoration\">2<\/td><\/tr><tr><td data-label=\"Holding tier\">Major<\/td><td data-label=\"Normal defence\">8<\/td><td data-label=\"Logistics income (each resource)\">3<\/td><td data-label=\"Ground Assault base Supply\">3<\/td><td data-label=\"Normal Defend cost (each resource) and restoration\">3<\/td><\/tr><tr><td data-label=\"Holding tier\">Capital<\/td><td data-label=\"Normal defence\">12<\/td><td data-label=\"Logistics income (each resource)\">4<\/td><td data-label=\"Ground Assault base Supply\">4<\/td><td data-label=\"Normal Defend cost (each resource) and restoration\">4<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Planets and stations use the same tier rules. Void Superiority means the total friendly combat Strength in a system strictly exceeds total hostile combat Strength; a tie is contested. Include allied fleets and Mobile Capitals. This is different from uncontested bombardment, which requires no hostile fleet at all. A full holding may still take Defend to gain Defended. Ordinary Defend restores the tier amount, capped at maximum; Fortification replaces that amount with 4. Active Militia Barracks removes the holding Defend action&#x27;s Manpower cost, not its normal Supply cost.<\/p>\n<p>A Mobile Capital may spend its Fleet Action and 1 Supply / 1 Manpower to Expand itself by up to 2 defence. This does not grant Defended or repair attached Integrity. Its Faction-action Defend normally costs 4 of each resource and restores up to 4. Its actual defence, not its reduced combat contribution, determines whether its construction host is full.<\/p>\n<p>Establish New Capital is compulsory when applicable. An established Capital&#x27;s built-in Orbital Shipyard costs no construction action, Supply or slot. Normal fleets have base capacity 5 unless a rule explicitly changes it. Repair and expansion use actual capacity, including permanent additions.<\/p>"}, {"title": "Summon Allies", "text": "\nCall a new allied Major Faction into the subsector by granting them an entire system. **Costs -10 Supply and -10 Manpower.** The newly summoned faction starts with 10 Supply and 10 Manpower (inherited mid-campaign Summon Allies exception to the 20/20 opening start) but no fleet — they rely on their summoner for protection. **Requirements:** (1) You must control planets in more than one system. (2) You must control ALL planets in the system being granted. (3) You must have Void Superiority in that system. (4) The new faction must share your alignment and make sense within established 40K lore. **Effect:** Immediately cede all planets in that system to the new faction. The new faction is aligned with you — they will not attack your holdings and will coordinate against mutual enemies. Design the new faction (name, background, trait) when summoned. The new faction activates immediately after your turn in the turn order.\n\n\n**Important:** You cannot grant away your only fully controlled system. You must fully control at least two systems to use Summon Allies — one to keep and one to grant.\n\n**Summon Allies — Alignment Restrictions:**\n\nThe summoned faction must belong to the same broad alignment as the summoning faction. This represents calling in reinforcements, granting territory to allies, or allowing subordinate powers to establish their own domains. The new faction must have a plausible lore reason for arriving in the subsector.\n\n| Alignment | Eligible Faction Types | Examples |\n|-----------|----------------------|----------|\n| Imperium | Astra Militarum, Adeptus Mechanicus, Other Space Marine Chapters, Adepta Sororitas, Rogue Traders, Imperial Navy, Inquisitorial Forces | A cut-off Guard regiment, an Explorator fleet, a Magos establishing a Forge World, a brother Chapter answering a distress call |\n| Chaos | Other Chaos Warbands, Daemon Cults, Dark Mechanicum, Traitor Guard, Other Traitor Legions | A warband sworn to a different god, a cult that rises in the new territory, a splinter fleet of the same Legion |\n| Drukhari | Other Kabals, Wych Cults, Haemonculus Covens | A rival Archon granted hunting grounds, a Coven providing support in exchange for specimens, a Wych Cult seeking new arenas |\n| Craftworld Aeldari | Other Craftworlds, Corsairs, Harlequins, Ynnari | A Corsair fleet, rangers from another Craftworld, a Harlequin masque |\n| Orks | Other Warbosses, Freebooterz | Another Waaagh! drawn by the fighting, Freebooterz smelling loot |\n| Necrons | Other Dynasties, Destroyer Cults | An awakening Tomb World, a vassal Dynasty, a Destroyer Lord claiming territory |\n| Tyranids | Other Hive Fleets, Genestealer Cults | A splinter fleet, a cult uprising on the granted world |\n| T'au | Other Septs, Auxiliaries | An expansion fleet, Kroot kindreds, Vespid contingents |\n\n**Summoned capital — ruling, 16 September 2026:** The new faction chooses an existing planet or station in the ceded system as its provisional capital and performs Establish New Capital normally. Summoning grants no free defence increase or built-in shipyard; the shipyard becomes available only when establishment is complete. The faction still starts with 10 Supply, 10 Manpower and no fleet, and takes its first turn immediately after its summoner.\n\n**Independent summoners:** Record an explicit subordinate pact when an Independent-aligned faction summons an ally. Shared Independent Alignment alone never allies unrelated factions. Sector-level grant and roster consequences remain undefined.\n\n**Multiple Factions:** You may have multiple factions of the same type in play (e.g., two Space Marine Chapters, three Drukhari Archons). Each operates independently but remains aligned with their summoner.\n\n", "html": "<p>Call a new allied Major Faction into the subsector by granting them an entire system. <strong>Costs -10 Supply and -10 Manpower.<\/strong> The newly summoned faction starts with 10 Supply and 10 Manpower (inherited mid-campaign Summon Allies exception to the 20/20 opening start) but no fleet — they rely on their summoner for protection. <strong>Requirements:<\/strong> (1) You must control planets in more than one system. (2) You must control ALL planets in the system being granted. (3) You must have Void Superiority in that system. (4) The new faction must share your alignment and make sense within established 40K lore. <strong>Effect:<\/strong> Immediately cede all planets in that system to the new faction. The new faction is aligned with you — they will not attack your holdings and will coordinate against mutual enemies. Design the new faction (name, background, trait) when summoned. The new faction activates immediately after your turn in the turn order.<\/p>\n<p><strong>Important:<\/strong> You cannot grant away your only fully controlled system. You must fully control at least two systems to use Summon Allies — one to keep and one to grant.<\/p>\n<p><strong>Summon Allies — Alignment Restrictions:<\/strong><\/p>\n<p>The summoned faction must belong to the same broad alignment as the summoning faction. This represents calling in reinforcements, granting territory to allies, or allowing subordinate powers to establish their own domains. The new faction must have a plausible lore reason for arriving in the subsector.<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Alignment<\/th><th>Eligible Faction Types<\/th><th>Examples<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Alignment\">Imperium<\/td><td data-label=\"Eligible Faction Types\">Astra Militarum, Adeptus Mechanicus, Other Space Marine Chapters, Adepta Sororitas, Rogue Traders, Imperial Navy, Inquisitorial Forces<\/td><td data-label=\"Examples\">A cut-off Guard regiment, an Explorator fleet, a Magos establishing a Forge World, a brother Chapter answering a distress call<\/td><\/tr><tr><td data-label=\"Alignment\">Chaos<\/td><td data-label=\"Eligible Faction Types\">Other Chaos Warbands, Daemon Cults, Dark Mechanicum, Traitor Guard, Other Traitor Legions<\/td><td data-label=\"Examples\">A warband sworn to a different god, a cult that rises in the new territory, a splinter fleet of the same Legion<\/td><\/tr><tr><td data-label=\"Alignment\">Drukhari<\/td><td data-label=\"Eligible Faction Types\">Other Kabals, Wych Cults, Haemonculus Covens<\/td><td data-label=\"Examples\">A rival Archon granted hunting grounds, a Coven providing support in exchange for specimens, a Wych Cult seeking new arenas<\/td><\/tr><tr><td data-label=\"Alignment\">Craftworld Aeldari<\/td><td data-label=\"Eligible Faction Types\">Other Craftworlds, Corsairs, Harlequins, Ynnari<\/td><td data-label=\"Examples\">A Corsair fleet, rangers from another Craftworld, a Harlequin masque<\/td><\/tr><tr><td data-label=\"Alignment\">Orks<\/td><td data-label=\"Eligible Faction Types\">Other Warbosses, Freebooterz<\/td><td data-label=\"Examples\">Another Waaagh! drawn by the fighting, Freebooterz smelling loot<\/td><\/tr><tr><td data-label=\"Alignment\">Necrons<\/td><td data-label=\"Eligible Faction Types\">Other Dynasties, Destroyer Cults<\/td><td data-label=\"Examples\">An awakening Tomb World, a vassal Dynasty, a Destroyer Lord claiming territory<\/td><\/tr><tr><td data-label=\"Alignment\">Tyranids<\/td><td data-label=\"Eligible Faction Types\">Other Hive Fleets, Genestealer Cults<\/td><td data-label=\"Examples\">A splinter fleet, a cult uprising on the granted world<\/td><\/tr><tr><td data-label=\"Alignment\">T&#x27;au<\/td><td data-label=\"Eligible Faction Types\">Other Septs, Auxiliaries<\/td><td data-label=\"Examples\">An expansion fleet, Kroot kindreds, Vespid contingents<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Summoned capital — ruling, 16 September 2026:<\/strong> The new faction chooses an existing planet or station in the ceded system as its provisional capital and performs Establish New Capital normally. Summoning grants no free defence increase or built-in shipyard; the shipyard becomes available only when establishment is complete. The faction still starts with 10 Supply, 10 Manpower and no fleet, and takes its first turn immediately after its summoner.<\/p>\n<p><strong>Independent summoners:<\/strong> Record an explicit subordinate pact when an Independent-aligned faction summons an ally. Shared Independent Alignment alone never allies unrelated factions. Sector-level grant and roster consequences remain undefined.<\/p>\n<p><strong>Multiple Factions:<\/strong> You may have multiple factions of the same type in play (e.g., two Space Marine Chapters, three Drukhari Archons). Each operates independently but remains aligned with their summoner.<\/p>"}, {"title": "Phase 4: Social Action", "text": "\nA faction may take ONE Social Action per turn. This represents diplomatic bandwidth.\n\n| Action | Effect |\n|--------|--------|\n| **Communiqué** | Send one message to another Major Faction. They may respond immediately but only once. Requires both Factions to have a presence in the same system (fleet or planet — any combination). Extended conversations require multiple cycles. |\n\n#### Diplomacy between Major Factions\n\n**Diplomacy between Major Factions:** Temporary cease-fires or non-aggression pacts with other Major Factions outside your alignment are possible through the Communiqué action, but these are inherently unstable. Conflicting alignments will inevitably come to blows — such arrangements should be treated as temporary strategic convenience, not true alliance.\n\n", "html": "<p>A faction may take ONE Social Action per turn. This represents diplomatic bandwidth.<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Action<\/th><th>Effect<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Action\"><strong>Communiqué<\/strong><\/td><td data-label=\"Effect\">Send one message to another Major Faction. They may respond immediately but only once. Requires both Factions to have a presence in the same system (fleet or planet — any combination). Extended conversations require multiple cycles.<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>Diplomacy between Major Factions<\/h4>\n<p><strong>Diplomacy between Major Factions:<\/strong> Temporary cease-fires or non-aggression pacts with other Major Factions outside your alignment are possible through the Communiqué action, but these are inherently unstable. Conflicting alignments will inevitably come to blows — such arrangements should be treated as temporary strategic convenience, not true alliance.<\/p>"}, {"title": "Combat and capture", "text": "\n**Ground Assault:** available even with hostile fleets present. Only committed fleets contribute. Apply Orbital Cannons to the largest attacker before strength and Manpower commitment. A legal assault needs at least 5 ground Strength after projected cannon damage. Commit floor(participating ground Strength / 5) Manpower. Pay world-tier Supply, or Siege's reduced cost, plus any Dread surcharge. Check affordability for the whole expenditure, not each component in isolation. Ground Strength includes Carrier/Assault Boats; flat Bay/Platform damage does not increase attacker commitment. There is no naval initiation loss for a Ground Assault.\n\nA Mobile Capital can be targeted by Ground Assault like a Capital, but is destroyed at zero rather than captured. It cannot be uncontested-bombarded while alive. Orbital Cannons also fire against bombardment; Dread is assessed before cannons, while ordinary attack Strength and costs use the surviving group. Attached projects lose Integrity only for actual host damage, capped at the host's remaining defence, not overkill.\n\nIf cannons destroy the entire attacking group on approach, cancel the assault before ordinary Supply and Manpower commitment; spent actions and the earlier Dread charge remain spent. No ground battle or capture occurs. This failed approach is not an exception allowing a surviving group below 5 ground Strength to launch a ground battle.\n\nSuccessful damage = floor(ground strength/5)+1, plus applicable trait/construction damage, after mitigation. Ordinary defeat causes no ground damage; Siege causes 1. Capture at 0 resets the holding to 1 defence. The attacker normally recovers floor(60% committed Manpower) on victory. Best participating Troop Transport adds 2 returned Manpower, 4 upgraded, capped at commitment; transports do not stack. This is the accepted replacement for historical 70%/80% transport wording.\n\nFor the attacking side use committed ground Strength; for the defending side use eligible in-system defending fleets' combat Strength, not the holding's defence and not ground-only Carrier/Assault Boats bonuses. AI ground totals use d20 + the applicable side's strength + floor(Supply/5) + floor(Manpower/5), using post-commitment resources. Defended gives defender+4 unless Siege; Ambush+4 to defender; Intel+4 to attacker; Bunker+4/+8; Isolated Defence−8. Ties favour the defender. AI defenders commit floor(incoming damage/2) Manpower and normal tier Supply limited to available stock; winning defenders recover 60% committed Manpower and 80% committed Supply, rounded down. In a human-resolved engagement, defensive commitment is full incoming potential damage and winning defensive Manpower recovery is 80%. Incoming potential damage includes breakthrough and flat damage bonuses before mitigation, not just points actually removed from the host. Militia removes defensive commitment/isolation. Forced Conscription draws the required defence from other fully defended owned donor holdings, leaving at least 1 each; these need not be in the attacked system. It substitutes for the commitment, not for resources in a deficit pool. Without affordable commitment or adequate conscription, the defence is Isolated. A losing attacker against an Isolated defence retains the inherited exception: floor(60% commitment) plus 1/2 for the best base/upgraded Transport, capped at commitment; no Siege victory bonus and no such recovery if raiders win.\n\n**Uncontested Bombardment:** no hostile fleet presence, 0 ordinary Manpower (Dread still charges both resources), damage max(1, floor(participating combat Strength/5)); Supply cost 2×tier+that damage, plus Dread. Mitigation applies and defence cannot fall below 1. No capture or battle roll. A surviving Mobile Capital is itself defending fleet presence and prevents uncontested bombardment.\n\n**Fleet Battle:** one initiation Strength point from one participating asset with more than 1 Strength. This expenditure does not damage attached constructions. Escort adds 3/6 to its side; defending system Defence Platforms add 5/10. Each side rolls 2d6 plus applicable strength/modifiers; a positive margin inflicts ceil(margin/3) damage on every participating losing fleet, without a damage cap. Ties inflict no combat damage; costs/actions remain spent. Destruction and attached construction damage apply normally. There is one Fleet Battle per initiating faction/system/turn; a guarded Structure Assault uses that allowance.\n\n**Structure Assault:** target one construction. If guarded, use Fleet Battle resolution, but an attacking win damages the construction only; attacker defeat damages participating attackers normally. An unguarded target costs 2 Supply plus Dread, no ordinary Manpower commitment, and suffers max(1, floor(combat Strength/5)) Integrity damage. There is no general Integrity floor. Completed permanent Assault Cruiser/Flagship capacity is the explicit exception: its granted portion remains until the fleet dies; unfinished upgrade progress can still be damaged. Movement/attack/withdrawal require separate actions unless an ability combines them.\n\n**Planet Fall:** captured non-Capital holdings impose 2 Supply/2 Manpower; Capitals 4/4. Replace ordinary defensive Supply loss, and add the applicable defensive Manpower loss. Fleet damage equals the final assault's resolved damage, including overkill beyond the holding's remaining defence. Apply it to the defeated owner's eligible fleets in that system. Allocate it point by point to the currently strongest eligible fleet, logging seeded/random tie choices automatically. Do not stop for a separate player allocation message. Destroy fleets with no remaining planet, station or Mobile Capital fallback. Minor factions do not lose Major resource pools. Destruction of a Major faction's fleet, including a Mobile Capital, also costs 1 Manpower; apply existing deficit locks normally.\n\n", "html": "<p><strong>Ground Assault:<\/strong> available even with hostile fleets present. Only committed fleets contribute. Apply Orbital Cannons to the largest attacker before strength and Manpower commitment. A legal assault needs at least 5 ground Strength after projected cannon damage. Commit floor(participating ground Strength / 5) Manpower. Pay world-tier Supply, or Siege&#x27;s reduced cost, plus any Dread surcharge. Check affordability for the whole expenditure, not each component in isolation. Ground Strength includes Carrier/Assault Boats; flat Bay/Platform damage does not increase attacker commitment. There is no naval initiation loss for a Ground Assault.<\/p>\n<p>A Mobile Capital can be targeted by Ground Assault like a Capital, but is destroyed at zero rather than captured. It cannot be uncontested-bombarded while alive. Orbital Cannons also fire against bombardment; Dread is assessed before cannons, while ordinary attack Strength and costs use the surviving group. Attached projects lose Integrity only for actual host damage, capped at the host&#x27;s remaining defence, not overkill.<\/p>\n<p>If cannons destroy the entire attacking group on approach, cancel the assault before ordinary Supply and Manpower commitment; spent actions and the earlier Dread charge remain spent. No ground battle or capture occurs. This failed approach is not an exception allowing a surviving group below 5 ground Strength to launch a ground battle.<\/p>\n<p>Successful damage = floor(ground strength/5)+1, plus applicable trait/construction damage, after mitigation. Ordinary defeat causes no ground damage; Siege causes 1. Capture at 0 resets the holding to 1 defence. The attacker normally recovers floor(60% committed Manpower) on victory. Best participating Troop Transport adds 2 returned Manpower, 4 upgraded, capped at commitment; transports do not stack. This is the accepted replacement for historical 70%/80% transport wording.<\/p>\n<p>For the attacking side use committed ground Strength; for the defending side use eligible in-system defending fleets&#x27; combat Strength, not the holding&#x27;s defence and not ground-only Carrier/Assault Boats bonuses. AI ground totals use d20 + the applicable side&#x27;s strength + floor(Supply/5) + floor(Manpower/5), using post-commitment resources. Defended gives defender+4 unless Siege; Ambush+4 to defender; Intel+4 to attacker; Bunker+4/+8; Isolated Defence−8. Ties favour the defender. AI defenders commit floor(incoming damage/2) Manpower and normal tier Supply limited to available stock; winning defenders recover 60% committed Manpower and 80% committed Supply, rounded down. In a human-resolved engagement, defensive commitment is full incoming potential damage and winning defensive Manpower recovery is 80%. Incoming potential damage includes breakthrough and flat damage bonuses before mitigation, not just points actually removed from the host. Militia removes defensive commitment/isolation. Forced Conscription draws the required defence from other fully defended owned donor holdings, leaving at least 1 each; these need not be in the attacked system. It substitutes for the commitment, not for resources in a deficit pool. Without affordable commitment or adequate conscription, the defence is Isolated. A losing attacker against an Isolated defence retains the inherited exception: floor(60% commitment) plus 1/2 for the best base/upgraded Transport, capped at commitment; no Siege victory bonus and no such recovery if raiders win.<\/p>\n<p><strong>Uncontested Bombardment:<\/strong> no hostile fleet presence, 0 ordinary Manpower (Dread still charges both resources), damage max(1, floor(participating combat Strength/5)); Supply cost 2×tier+that damage, plus Dread. Mitigation applies and defence cannot fall below 1. No capture or battle roll. A surviving Mobile Capital is itself defending fleet presence and prevents uncontested bombardment.<\/p>\n<p><strong>Fleet Battle:<\/strong> one initiation Strength point from one participating asset with more than 1 Strength. This expenditure does not damage attached constructions. Escort adds 3/6 to its side; defending system Defence Platforms add 5/10. Each side rolls 2d6 plus applicable strength/modifiers; a positive margin inflicts ceil(margin/3) damage on every participating losing fleet, without a damage cap. Ties inflict no combat damage; costs/actions remain spent. Destruction and attached construction damage apply normally. There is one Fleet Battle per initiating faction/system/turn; a guarded Structure Assault uses that allowance.<\/p>\n<p><strong>Structure Assault:<\/strong> target one construction. If guarded, use Fleet Battle resolution, but an attacking win damages the construction only; attacker defeat damages participating attackers normally. An unguarded target costs 2 Supply plus Dread, no ordinary Manpower commitment, and suffers max(1, floor(combat Strength/5)) Integrity damage. There is no general Integrity floor. Completed permanent Assault Cruiser/Flagship capacity is the explicit exception: its granted portion remains until the fleet dies; unfinished upgrade progress can still be damaged. Movement/attack/withdrawal require separate actions unless an ability combines them.<\/p>\n<p><strong>Planet Fall:<\/strong> captured non-Capital holdings impose 2 Supply/2 Manpower; Capitals 4/4. Replace ordinary defensive Supply loss, and add the applicable defensive Manpower loss. Fleet damage equals the final assault&#x27;s resolved damage, including overkill beyond the holding&#x27;s remaining defence. Apply it to the defeated owner&#x27;s eligible fleets in that system. Allocate it point by point to the currently strongest eligible fleet, logging seeded/random tie choices automatically. Do not stop for a separate player allocation message. Destroy fleets with no remaining planet, station or Mobile Capital fallback. Minor factions do not lose Major resource pools. Destruction of a Major faction&#x27;s fleet, including a Mobile Capital, also costs 1 Manpower; apply existing deficit locks normally.<\/p>"}, {"title": "Capital replacement and deficits", "text": "\nEvery owned planet or station can become the replacement Capital when the functioning Capital is lost. Establish New Capital is free, takes priority over rationing and doubles current/maximum defence toward 12. Completion requires actual 12/12; only then grant Capital tier/income and the built-in yard. Being attacked may delay completion. No holding or surviving Mobile Capital means elimination, not an endless Capital-recovery loop. A destroyed Mobile Capital permanently loses its trait and incurs 4 Supply / 4 Manpower loss plus the fleet-destruction 1 Manpower. It does not apply ordinary Planet Fall collateral damage to other fleets. Owned planets or stations still allow replacement Capital establishment. Lock the chosen provisional holding until it is lost; establishment doubles current and maximum defence, each capped at 12, without granting Capital income or the yard early.\n\nEach resource has its own deficit track. Involuntary depletion to 0 locks that resource at 0, ignoring its income and further resource penalties while the other resource behaves normally. Entry removes 1 Strength from each surviving fleet once for that resource: Supply can destroy fleets; Manpower degradation leaves surviving fleets at least 1. Resolve simultaneous Supply first. Direct combat/construction damage remains effective.\n\nEmergency Rationing takes a chosen Faction Action: three actions on a track restore exactly 10 total. Overlapping tracks require separate actions and the faction chooses which to advance; elapsed Cycles do not advance them. Other affordable actions remain available subject to Capital replacement priority, and ordinary Reinforce/Muster cannot bypass the corresponding deficit. Ignore income lost during the lock rather than banking it.\n\n", "html": "<p>Every owned planet or station can become the replacement Capital when the functioning Capital is lost. Establish New Capital is free, takes priority over rationing and doubles current/maximum defence toward 12. Completion requires actual 12/12; only then grant Capital tier/income and the built-in yard. Being attacked may delay completion. No holding or surviving Mobile Capital means elimination, not an endless Capital-recovery loop. A destroyed Mobile Capital permanently loses its trait and incurs 4 Supply / 4 Manpower loss plus the fleet-destruction 1 Manpower. It does not apply ordinary Planet Fall collateral damage to other fleets. Owned planets or stations still allow replacement Capital establishment. Lock the chosen provisional holding until it is lost; establishment doubles current and maximum defence, each capped at 12, without granting Capital income or the yard early.<\/p>\n<p>Each resource has its own deficit track. Involuntary depletion to 0 locks that resource at 0, ignoring its income and further resource penalties while the other resource behaves normally. Entry removes 1 Strength from each surviving fleet once for that resource: Supply can destroy fleets; Manpower degradation leaves surviving fleets at least 1. Resolve simultaneous Supply first. Direct combat/construction damage remains effective.<\/p>\n<p>Emergency Rationing takes a chosen Faction Action: three actions on a track restore exactly 10 total. Overlapping tracks require separate actions and the faction chooses which to advance; elapsed Cycles do not advance them. Other affordable actions remain available subject to Capital replacement priority, and ordinary Reinforce/Muster cannot bypass the corresponding deficit. Ignore income lost during the lock rather than banking it.<\/p>"}, {"title": "Minor factions and systems", "text": "\nOrdinary Minor starting Fleet Strength = ceil(sum of maximum defence of owned holdings in the system/2), distributed into fleets up to 5. Prize factions use the unhalved sum. Maximum defence determines the initial fleet allocation; losing a holding does not rebuild the allocation. Apply normal Planet Fall fleet losses.\n\nEach Minor's Supply and Manpower are separately 5 × sum(owned holding tiers), doubled for prize factions. These are shared derived values, not per-planet pools or persistent Major stockpiles. Defence damage alone does not reduce them. Minors take no turns, cannot build replacements, and lose no Major-style resource penalties. At Cycle end, each unattacked Minor holding recovers 1 defence, capped at maximum. An unengaged Minor faction restores 1 total Strength to an eligible surviving damaged fleet. Major holdings have no free ordinary recovery; they need Defend or an applicable construction.\n\n", "html": "<p>Ordinary Minor starting Fleet Strength = ceil(sum of maximum defence of owned holdings in the system/2), distributed into fleets up to 5. Prize factions use the unhalved sum. Maximum defence determines the initial fleet allocation; losing a holding does not rebuild the allocation. Apply normal Planet Fall fleet losses.<\/p>\n<p>Each Minor&#x27;s Supply and Manpower are separately 5 × sum(owned holding tiers), doubled for prize factions. These are shared derived values, not per-planet pools or persistent Major stockpiles. Defence damage alone does not reduce them. Minors take no turns, cannot build replacements, and lose no Major-style resource penalties. At Cycle end, each unattacked Minor holding recovers 1 defence, capped at maximum. An unengaged Minor faction restores 1 total Strength to an eligible surviving damaged fleet. Major holdings have no free ordinary recovery; they need Defend or an applicable construction.<\/p>"}, {"title": "Construction costs, Integrity and capacity", "text": "\nOne Construction action begins/advances one project or repairs a completed construction. Minor stages normally cost 3 Supply, Major stages 5, with the catalogue exceptions below. Grand Orbital Shipyard is now Minor (3 stages). Troop Transport, Repair Tender, Militia Barracks and Void Shield Generator cost 2 Supply per stage. System Defence Station, System Repair Station, Salvage Wing, Storm Transit, Consolidation Works and Void Station cost 3 per stage. Minor base/upgrade each require 3 stages; Major each 5. Industrial costs and starting Integrity apply as listed. Full host defence/strength is required to Build, Upgrade or Repair; system-based constructions require an owned holding or living fleet providing presence in their system, but have no host defence prerequisite.\n\nRepair restores up to 3 Integrity at 1 Supply each, no Manpower. It cannot finish unfinished construction/upgrades. A separate Faction-action Defend may repair a completed damaged construction at a full host: Minor costs 1 Supply / 1 Manpower and restores 1 Integrity; Major costs 3 of each and restores 3. Fortification Experts does not alter this construction action. Repair never completes unfinishe
