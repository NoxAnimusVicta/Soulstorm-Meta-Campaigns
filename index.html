ded with families of regiments that never returned.<\/td><td data-label=\"Map theme\">Urban barracks or military depot; streets, warehouse cover and open parade grounds.<\/td><\/tr><tr><td data-label=\"Holding\">Prosymna<\/td><td data-label=\"Tier / type\">Minor Planet<\/td><td data-label=\"Controller\">Iron Paladins<\/td><td data-label=\"Defence\">1/2<\/td><td data-label=\"Logistics / infrastructure\">1 Supply + 1 Manpower<\/td><td data-label=\"Description\">Dry uplands are divided into recruiting estates and grain stores. Walled villages overlook dusty roads leading to a central levy camp, where obsolete troop transports serve as permanent accommodation. Cisterns and granaries are the settlements’ most valuable ground.<\/td><td data-label=\"Map theme\">Arid rural settlement; low hills, scattered walls and a fortified central camp.<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Fleet<\/th><th>Owner<\/th><th>Strength / original maximum<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Fleet\">Crusade Fleet Anabasis<\/td><td data-label=\"Owner\">Iron Paladins<\/td><td data-label=\"Strength / original maximum\">5/5<\/td><\/tr><tr><td data-label=\"Fleet\">The Unspent Levy<\/td><td data-label=\"Owner\">Argive Muster Council<\/td><td data-label=\"Strength / original maximum\">1/3<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Map themes describe terrain, not verified map-pack titles. Choose a thematically suitable installed map with the required team capacity; use the existing overflow/raid procedure. Terrain descriptions grant no extra defence, construction or faction bonus.<\/p>\n<h3>Eleusis<\/h3>\n<p><strong>Void Superiority:<\/strong> Order of Saint Erigone 5 vs hostile fleets 0 - Order of Saint Erigone superior; no hostile fleet present.<\/p>\n<p>The Order holds Erigone and has captured Daeira. Triptolemos remains under the independent Eleusinian Synod.<\/p>\n<p>Setup: fixed home/prize profile recorded above.<\/p>\n<p><strong>Eleusinian Synod — Witch Hunters:<\/strong> Prelate Lysandra governs through competing shrine chapters, granary trusts and hospital superiors. These institutions sheltered pilgrims during isolation and refuse to surrender their levies to Althaia’s convent. Their hostility to the Paladins and the Order is a jurisdictional dispute; they remain Emperor-worshipping humans, not a Chaos cult or a second Sisters army. Militia companies defend sacred precincts while household guards provide a more reliable reserve.<\/p>\n<p><strong>Soulstorm selection:<\/strong> Witch Hunters. Shrine guards and religious enforcement troops represented by the Witch Hunters roster; cream cloth, red insignia and worn military equipment. They belong to the independent Synod, not Althaia’s Order.<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Holding<\/th><th>Tier / type<\/th><th>Controller<\/th><th>Defence<\/th><th>Logistics / infrastructure<\/th><th>Description<\/th><th>Map theme<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Holding\">Erigone<\/td><td data-label=\"Tier / type\">Capital Planet<\/td><td data-label=\"Controller\">Order of Saint Erigone<\/td><td data-label=\"Defence\">12/12<\/td><td data-label=\"Logistics / infrastructure\">4 Supply + 4 Manpower; built-in shipyard<\/td><td data-label=\"Description\">A shrine Capital of pale stone basilicas, processional avenues and fortified convent precincts. Hospitals and pilgrims’ dormitories fill the lower city beneath the Order’s blackened bell towers. Broad ceremonial approaches become exposed killing grounds between substantial masonry walls.<\/td><td data-label=\"Map theme\">Cathedral city or shrine fortress; plazas, cloisters and defended avenues.<\/td><\/tr><tr><td data-label=\"Holding\">Triptolemos<\/td><td data-label=\"Tier / type\">Standard Planet<\/td><td data-label=\"Controller\">Eleusinian Synod<\/td><td data-label=\"Defence\">4/4<\/td><td data-label=\"Logistics / infrastructure\">2 Supply + 2 Manpower<\/td><td data-label=\"Description\">Hospitaller estates and cathedral granaries feed a crowded pilgrim population. The Synod’s militia occupies gatehouses between terraced farms and a walled ecclesiastical town. Canal bridges carry both grain carts and penitential processions.<\/td><td data-label=\"Map theme\">Temperate shrine settlement; farmland, waterways and stone bridges.<\/td><\/tr><tr><td data-label=\"Holding\">Daeira<\/td><td data-label=\"Tier / type\">Minor Planet<\/td><td data-label=\"Controller\">Order of Saint Erigone<\/td><td data-label=\"Defence\">1/2<\/td><td data-label=\"Logistics / infrastructure\">1 Supply + 1 Manpower<\/td><td data-label=\"Description\">Funerary settlements cling to a cold limestone plateau. Reliquary chapels mark entrances to ossuary galleries, while militia posts overlook the narrow roads between tomb fields. Most inhabitants live in austere service towns around the great burial gates.<\/td><td data-label=\"Map theme\">Graveyard or ruined shrine; narrow passages, stone cover and bleak open ground.<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Fleet<\/th><th>Owner<\/th><th>Strength / original maximum<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Fleet\">The Third Refusal<\/td><td data-label=\"Owner\">Order of Saint Erigone<\/td><td data-label=\"Strength / original maximum\">5/5<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Map themes describe terrain, not verified map-pack titles. Choose a thematically suitable installed map with the required team capacity; use the existing overflow/raid procedure. Terrain descriptions grant no extra defence, construction or faction bonus.<\/p>\n<h3>Calydon<\/h3>\n<p><strong>Void Superiority:<\/strong> WAAAGH! Bell-Ringa 5 vs hostile fleets 0 - WAAAGH! Bell-Ringa superior; no hostile fleet present.<\/p>\n<p>The Orks hold Da Bellworks and have captured Olenos. Pleuron remains under Calydonian Labour Defence control.<\/p>\n<p>Setup: fixed home/prize profile recorded above.<\/p>\n<p><strong>Calydonian Labour Defence — Renegade Guard:<\/strong> Marshal Oineus was a foundry defence officer before the Capital fell. His committees now bind surviving work gangs, PDF remnants and displaced families into a precarious common command. They refuse outside command, fearing requisitions that strip the remaining evacuation routes of protection. Their soldiers know the factories and maintain a few serviceable armoured vehicles amid much improvised equipment.<\/p>\n<p><strong>Soulstorm selection:<\/strong> Renegade Guard. Industrial rebels, worker levies and salvaged armour; soot-grey fatigues and ochre identification bands. Accept either Vraksian or Tekarn AI branch; this proxy does not establish a Chaos Alignment or dictate every unit’s narrative identity.<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Holding<\/th><th>Tier / type<\/th><th>Controller<\/th><th>Defence<\/th><th>Logistics / infrastructure<\/th><th>Description<\/th><th>Map theme<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Holding\">Da Bellworks<\/td><td data-label=\"Tier / type\">Capital Planet<\/td><td data-label=\"Controller\">WAAAGH! Bell-Ringa<\/td><td data-label=\"Defence\">12/12<\/td><td data-label=\"Logistics / infrastructure\">4 Supply + 4 Manpower; built-in shipyard<\/td><td data-label=\"Description\">Looted cathedral foundries cover a soot-black plain. Bell-Ringa’s mobs have hung bells from gantries and welded checkered armour onto furnace halls; slag heaps and wrecked transporters form rough outer walls. The original human avenues survive beneath scrap barricades and assembly yards.<\/td><td data-label=\"Map theme\">Ork-held industrial city; scrap piles, furnace buildings and broad vehicle approaches.<\/td><\/tr><tr><td data-label=\"Holding\">Pleuron<\/td><td data-label=\"Tier / type\">Standard Planet<\/td><td data-label=\"Controller\">Calydonian Labour Defence<\/td><td data-label=\"Defence\">2/4<\/td><td data-label=\"Logistics / infrastructure\">2 Supply + 2 Manpower<\/td><td data-label=\"Description\">Human factory districts survive behind improvised barricades along an elevated freight railway. Labour companies shift wounded workers between machine shops while the militia holds crossings over drainage cuts. Empty districts nearer the Ork holdings have become belts of burned-out machinery.<\/td><td data-label=\"Map theme\">Industrial ruins; rail embankments, workshops and barricaded intersections.<\/td><\/tr><tr><td data-label=\"Holding\">Olenos<\/td><td data-label=\"Tier / type\">Minor Planet<\/td><td data-label=\"Controller\">WAAAGH! Bell-Ringa<\/td><td data-label=\"Defence\">1/2<\/td><td data-label=\"Logistics / infrastructure\">1 Supply + 1 Manpower<\/td><td data-label=\"Description\">Mining townships shelter beneath slag ridges on a wind-scoured plain. Refugees crowd the pithead compounds, and militia roadblocks cover the surviving routes to the evacuation yards. Conveyor towers and disused quarry terraces interrupt the otherwise open approaches.<\/td><td data-label=\"Map theme\">Quarry or ash wasteland; stepped pits, mining buildings and evacuation pads.<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Fleet<\/th><th>Owner<\/th><th>Strength / original maximum<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Fleet\">Da Gate-Krasha<\/td><td data-label=\"Owner\">WAAAGH! Bell-Ringa<\/td><td data-label=\"Strength / original maximum\">5/5<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Map themes describe terrain, not verified map-pack titles. Choose a thematically suitable installed map with the required team capacity; use the existing overflow/raid procedure. Terrain descriptions grant no extra defence, construction or faction bonus.<\/p>\n<h3>Aulis<\/h3>\n<p><strong>Void Superiority:<\/strong> Aulis Anchorage Command 5 vs hostile fleets 0 - Aulis Anchorage Command superior; no hostile fleet present.<\/p>\n<p>Embarkation yards, troop-marshalling settlements and stranded naval administration.<\/p>\n<p>Setup: d20 <strong>5<\/strong>; ownership authored separately.<\/p>\n<p><strong>Aulis Anchorage Command — Imperial Guard:<\/strong> Commodore Thestor has preserved a fragment of the Imperial Navy’s embarkation administration rather than declaring a personal kingdom. His officers still inspect troop transports for assignments whose destinations may no longer exist. Armsmen, shore regiments and support personnel hold the landing fields; Thestor refuses incoming claims of authority and orders his ships to challenge any force attempting to seize the anchorages.<\/p>\n<p><strong>Soulstorm selection:<\/strong> Imperial Guard. Naval shore troops and armsmen represented by Guard infantry and vehicles; navy blue and bone-white markings.<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Holding<\/th><th>Tier / type<\/th><th>Controller<\/th><th>Defence<\/th><th>Logistics / infrastructure<\/th><th>Description<\/th><th>Map theme<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Holding\">Schoenus<\/td><td data-label=\"Tier / type\">Minor Planet<\/td><td data-label=\"Controller\">Aulis Anchorage Command<\/td><td data-label=\"Defence\">2/2<\/td><td data-label=\"Logistics / infrastructure\">1 Supply + 1 Manpower<\/td><td data-label=\"Description\">A coastal supply world of fuel farms, barracks and disused embarkation beaches. Concrete causeways cross tidal flats to cargo piers; inland storage compounds still carry destination markings for vanished crusades. Naval ground crews defend the pump stations and transport terminals.<\/td><td data-label=\"Map theme\">Coastal military depot; low terrain, causeways and fuel-storage compounds.<\/td><\/tr><tr><td data-label=\"Holding\">Hyria<\/td><td data-label=\"Tier / type\">Major Planet<\/td><td data-label=\"Controller\">Aulis Anchorage Command<\/td><td data-label=\"Defence\">8/8<\/td><td data-label=\"Logistics / infrastructure\">3 Supply + 3 Manpower<\/td><td data-label=\"Description\">A heavily developed naval support world whose largest cities grew around surface landing fields. Repair sheds, training squares and Administratum offices lie beneath rows of grounded bulk lifters. The Command’s headquarters occupies an armoured traffic-control citadel overlooking the primary embarkation field.<\/td><td data-label=\"Map theme\">Spaceport or military-industrial city; hangars, long landing strips and a hardened central complex.<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Fleet<\/th><th>Owner<\/th><th>Strength / original maximum<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Fleet\">The Unanswered Muster<\/td><td data-label=\"Owner\">Aulis Anchorage Command<\/td><td data-label=\"Strength / original maximum\">5/5<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Map themes describe terrain, not verified map-pack titles. Choose a thematically suitable installed map with the required team capacity; use the existing overflow/raid procedure. Terrain descriptions grant no extra defence, construction or faction bonus.<\/p>\n<h3>Mycenae<\/h3>\n<p><strong>Void Superiority:<\/strong> House Atreides 15 vs hostile fleets 0 - House Atreides superior; no hostile fleet present.<\/p>\n<p>The prize dynasty holds a fortified seat, military estates and an orbital anchorage.<\/p>\n<p>Setup: fixed home/prize profile recorded above.<\/p>\n<p><strong>House Atreides — Vostroyan Firstborn:<\/strong> Archon Pleisthenes Atreides is the hereditary Imperial governor of Perseia and master of a household compact binding Dendra’s estates to Lion Gate. The dynasty won loyalty by sheltering refugee crews and honouring old service pensions; it also enforces hereditary labour dues and executes breaches of the tithe oath. Its sea-cliff court maintains sanctioned confessors, Administratum assessors and an exacting household officer corps. Pleisthenes claims an old emergency commission gives him responsibility for Mycenae and refuses the competing authority of both Imperial Majors. His disciplined regiments and substantial flotilla make that claim expensive to challenge. Green livery, a copper hawk clutching an Imperial aquila, maritime ancestry and cultivated public duty provide the deliberate Dune homage; the people, history and conflict are native to this campaign. There is no spice monopoly, prescient heir or imported Dune political system.<\/p>\n<p><strong>Soulstorm selection:<\/strong> Vostroyan Firstborn. Hereditary household regiments with heirloom weapons and heavy infantry; deep green uniforms, charcoal armour and copper heraldry. Vostroyan models represent local troops rather than a visiting Vostroyan regiment.<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Holding<\/th><th>Tier / type<\/th><th>Controller<\/th><th>Defence<\/th><th>Logistics / infrastructure<\/th><th>Description<\/th><th>Map theme<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Holding\">Perseia<\/td><td data-label=\"Tier / type\">Capital Planet<\/td><td data-label=\"Controller\">House Atreides<\/td><td data-label=\"Defence\">12/12<\/td><td data-label=\"Logistics / infrastructure\">4 Supply + 4 Manpower; built-in shipyard<\/td><td data-label=\"Description\">The dynasty’s Capital is a storm-lashed ocean world with inhabited mountain islands. Black coastal bastions guard terraced cities and reservoir tunnels; the ruling household keeps its court above a harbour cut into volcanic rock. Sea approaches, cliff roads and sheltered dock basins determine where an invader can land.<\/td><td data-label=\"Map theme\">Coastal fortress or wet mountain city; cliffs, bridges, stone bastions and harbour approaches.<\/td><\/tr><tr><td data-label=\"Holding\">Dendra<\/td><td data-label=\"Tier / type\">Standard Planet<\/td><td data-label=\"Controller\">House Atreides<\/td><td data-label=\"Defence\">4/4<\/td><td data-label=\"Logistics / infrastructure\">2 Supply + 2 Manpower<\/td><td data-label=\"Description\">A temperate estate world supplying the household regiments with food and recruits. Old orchards surround fortified manor towns, while oath-halls and vehicle barns stand along the military roads. The orderly estates conceal hard distinctions between protected tenants and hereditary labour obligations.<\/td><td data-label=\"Map theme\">Wooded agricultural settlement; hedges, orchards, estate walls and open fields for armour.<\/td><\/tr><tr><td data-label=\"Holding\">Lion Gate<\/td><td data-label=\"Tier / type\">Minor Station<\/td><td data-label=\"Controller\">House Atreides<\/td><td data-label=\"Defence\">2/2<\/td><td data-label=\"Logistics / infrastructure\">1 Supply + 1 Manpower<\/td><td data-label=\"Description\">An orbital customs bastion built around a broad freight spine. Armoured inspection halls open into stacked cargo vaults; household armsmen guard the pressure doors leading to the fleet anchorage. Its carved heraldic beasts are devotional ornament, not xenos technology.<\/td><td data-label=\"Map theme\">Station or ship-interior map; cargo halls, bulkhead chokepoints and docking galleries.<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Fleet<\/th><th>Owner<\/th><th>Strength / original maximum<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Fleet\">Pleisthenes’ Oath<\/td><td data-label=\"Owner\">House Atreides<\/td><td data-label=\"Strength / original maximum\">5/5<\/td><\/tr><tr><td data-label=\"Fleet\">The Copper Hawk<\/td><td data-label=\"Owner\">House Atreides<\/td><td data-label=\"Strength / original maximum\">4/5<\/td><\/tr><tr><td data-label=\"Fleet\">Perseia’s Breakwater<\/td><td data-label=\"Owner\">House Atreides<\/td><td data-label=\"Strength / original maximum\">4/5<\/td><\/tr><tr><td data-label=\"Fleet\">The Dendra Covenant<\/td><td data-label=\"Owner\">House Atreides<\/td><td data-label=\"Strength / original maximum\">2/3<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Map themes describe terrain, not verified map-pack titles. Choose a thematically suitable installed map with the required team capacity; use the existing overflow/raid procedure. Terrain descriptions grant no extra defence, construction or faction bonus.<\/p>\n<h3>Delphi<\/h3>\n<p><strong>Void Superiority:<\/strong> Delphic Custodians 4 vs hostile fleets 0 - Delphic Custodians superior; no hostile fleet present.<\/p>\n<p>Astropathic facilities, signal stations and archives whose messages no longer agree.<\/p>\n<p>Setup: d20 <strong>17<\/strong>; ownership authored separately.<\/p>\n<p><strong>Delphic Custodians — Witch Hunters:<\/strong> Logothete Manto leads hereditary archive wardens and the security staff serving Delphi’s astropathic establishments. Contradictory orders have become dangerous currency: commanders seek whichever sealed transcript favours their claim. Manto keeps the custodial oath above these disputes and defends vaults against the Lotus privateers, while refusing outside claims on her archives. Her soldiers are human guards, not Adeptus Custodes despite their title.<\/p>\n<p><strong>Soulstorm selection:<\/strong> Witch Hunters. Archive wardens and armoured enforcers represented by the Witch Hunters roster; ash-blue cloth, brass seals and ivory unit plates. Their title does not make them Adeptus Custodes.<\/p>\n<p><strong>Lotus Company — Praetorian Guard:<\/strong> Captain Eurylochos commands human deserters, smugglers, hired gun crews and Ork mercenaries from Castalia’s abandoned waterworks. His company presents expired letters of marque when useful and burns the records when they are not. It raids Delphi’s lighter traffic and avoids a decisive engagement with Manto’s stronger patrols. The company has no Alignment and remains hostile, with no established pact or Chaos allegiance.<\/p>\n<p><strong>Soulstorm selection:<\/strong> Praetorian Guard. Human privateers, hired Ork muscle and looted vehicles using the Praetorian roster; mismatched armour and faded violet patches. Its mercenary options fit the company’s mixed crews.<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Holding<\/th><th>Tier / type<\/th><th>Controller<\/th><th>Defence<\/th><th>Logistics / infrastructure<\/th><th>Description<\/th><th>Map theme<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Holding\">Castalia<\/td><td data-label=\"Tier / type\">Minor Planet<\/td><td data-label=\"Controller\">Lotus Company<\/td><td data-label=\"Defence\">2/2<\/td><td data-label=\"Logistics / infrastructure\">1 Supply + 1 Manpower<\/td><td data-label=\"Description\">Privateers occupy a dry basin city around an abandoned water-processing plant. Cargo stolen from three systems is stacked beneath patched landing gantries, while concealed paths thread the surrounding rock gullies. The old civic reservoirs now hide fuel, prisoners and contraband.<\/td><td data-label=\"Map theme\">Arid spaceport or outlaw settlement; gullies, cargo cover and refinery ruins.<\/td><\/tr><tr><td data-label=\"Holding\">Corycia<\/td><td data-label=\"Tier / type\">Minor Planet<\/td><td data-label=\"Controller\">Delphic Custodians<\/td><td data-label=\"Defence\">2/2<\/td><td data-label=\"Logistics / infrastructure\">1 Supply + 1 Manpower<\/td><td data-label=\"Description\">A mountainous archive world with repositories cut into cavern faces. Monastic service towns and cable stations cling to ledges above mist-filled ravines. The Custodians’ rifle companies guard bridgeheads and the lift terminals serving sealed record vaults.<\/td><td data-label=\"Map theme\">Mountain stronghold; ravines, bridges, tunnels or narrow rocky approaches.<\/td><\/tr><tr><td data-label=\"Holding\">Pytho<\/td><td data-label=\"Tier / type\">Standard Planet<\/td><td data-label=\"Controller\">Delphic Custodians<\/td><td data-label=\"Defence\">4/4<\/td><td data-label=\"Logistics / infrastructure\">2 Supply + 2 Manpower<\/td><td data-label=\"Description\">A civilised world of signal towers, scribal districts and crowded transmission courts. Ceremonial streets connect fortified archive buildings to the astropathic precinct; surrounding tenements house generations of clerks and guards. Rooftop antenna forests break the skyline above courtyards suitable for mustering infantry.<\/td><td data-label=\"Map theme\">Dense Imperial city; plazas, administrative blocks and communications installations.<\/td><\/tr><tr><td data-label=\"Holding\">Omphalos Relay<\/td><td data-label=\"Tier / type\">Minor Station<\/td><td data-label=\"Controller\">Delphic Custodians<\/td><td data-label=\"Defence\">2/2<\/td><td data-label=\"Logistics / infrastructure\">1 Supply + 1 Manpower<\/td><td data-label=\"Description\">An orbital relay station whose rotating habitation rings surround a hardened signal core. Maintenance galleries, antenna-control rooms and shielded message vaults connect through closely watched transit hubs. Armoured bulkheads divide the station into compartments, with the main junctions controlling access to the signal core.<\/td><td data-label=\"Map theme\">Station interior; compact junctions, machinery chambers and enclosed service corridors.<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Fleet<\/th><th>Owner<\/th><th>Strength / original maximum<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Fleet\">The Sealed Testimony<\/td><td data-label=\"Owner\">Delphic Custodians<\/td><td data-label=\"Strength / original maximum\">4/4<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Map themes describe terrain, not verified map-pack titles. Choose a thematically suitable installed map with the required team capacity; use the existing overflow/raid procedure. Terrain descriptions grant no extra defence, construction or faction bonus.<\/p>\n<h3>Nemea<\/h3>\n<p><strong>Void Superiority:<\/strong> Nemean Estate Compact 5 vs hostile fleets 0 - Nemean Estate Compact superior; no hostile fleet present.<\/p>\n<p>Agricultural estates and hunting preserves once bound to the crusade provisioning system.<\/p>\n<p>Setup: d20 <strong>13<\/strong>; ownership authored separately.<\/p>\n<p><strong>Nemean Estate Compact — Praetorian Guard:<\/strong> Warden Adrastos chairs a compact of landowners whose privileges depend on keeping crusade provisioning quotas. Isolation has let them retain more of the harvest, but loss of convoy protection has made those stores vulnerable. Estate riflemen, rural PDF and armoured agricultural security protect the processing towns. The Compact refuses outside authority and guards its harvest against requisition by any would-be protector.<\/p>\n<p><strong>Soulstorm selection:<\/strong> Praetorian Guard. Estate riflemen, regular household companies, mortar crews and hired auxiliaries; ochre cloth and dark green plates. The full Praetorian roster is permitted, including its mercenary options.<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Holding<\/th><th>Tier / type<\/th><th>Controller<\/th><th>Defence<\/th><th>Logistics / infrastructure<\/th><th>Description<\/th><th>Map theme<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Holding\">Cleonae<\/td><td data-label=\"Tier / type\">Minor Planet<\/td><td data-label=\"Controller\">Nemean Estate Compact<\/td><td data-label=\"Defence\">2/2<\/td><td data-label=\"Logistics / infrastructure\">1 Supply + 1 Manpower<\/td><td data-label=\"Description\">Grain-producing plains are broken by silo towns and irrigation cuts. Estate militia drill beside threshing sheds, and old redoubts overlook the bridges used by tithe convoys. Harvest stubble leaves little shelter outside the settlements.<\/td><td data-label=\"Map theme\">Open farmland; irrigation channels, scattered villages and grain depots.<\/td><\/tr><tr><td data-label=\"Holding\">Phlius<\/td><td data-label=\"Tier / type\">Minor Planet<\/td><td data-label=\"Controller\">Nemean Estate Compact<\/td><td data-label=\"Defence\">2/2<\/td><td data-label=\"Logistics / infrastructure\">1 Supply + 1 Manpower<\/td><td data-label=\"Description\">Hill country supports vineyards, livestock estates and fortified market towns. Stone retaining walls divide narrow tracks climbing toward hilltop manor compounds. The Compact’s patrols know the gullies through which smugglers bypass its requisition stations.<\/td><td data-label=\"Map theme\">Hilly rural map; stone walls, winding approaches and isolated compounds.<\/td><\/tr><tr><td data-label=\"Holding\">Apesas<\/td><td data-label=\"Tier / type\">Major Planet<\/td><td data-label=\"Controller\">Nemean Estate Compact<\/td><td data-label=\"Defence\">8/8<\/td><td data-label=\"Logistics / infrastructure\">3 Supply + 3 Manpower<\/td><td data-label=\"Description\">A populous agricultural processing world dominated by canneries, grain elevators and immense livestock yards. Its governing estates maintain walled pleasure preserves beside crowded industrial towns. Rail hubs and food warehouses are more strategically valuable than the ceremonial hunting lodges.<\/td><td data-label=\"Map theme\">Agri-industrial city; rail yards, factories and wooded estate margins.<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Fleet<\/th><th>Owner<\/th><th>Strength / original maximum<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Fleet\">The Granary Key<\/td><td data-label=\"Owner\">Nemean Estate Compact<\/td><td data-label=\"Strength / original maximum\">5/5<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Map themes describe terrain, not verified map-pack titles. Choose a thematically suitable installed map with the required team capacity; use the existing overflow/raid procedure. Terrain descriptions grant no extra defence, construction or faction bonus.<\/p>\n<h3>Lerna<\/h3>\n<p><strong>Void Superiority:<\/strong> Lerna Reclamation Directorate 3 vs Rustjaw Mob 2 - Lerna Reclamation Directorate superior; hostile fleet present.<\/p>\n<p>Wet industrial worlds and chemical works separated by contaminated waterways.<\/p>\n<p>Setup: d20 <strong>12<\/strong>; ownership authored separately.<\/p>\n<p><strong>Lerna Reclamation Directorate — Adeptus Mechanicus Explorators:<\/strong> Magister Polydoros administers the pumps, chemical plants and purification crews keeping Pontinos habitable. His civic administration depends on hereditary technical guilds, augmented engineers and machine-tending crews whose survival is tied to the reclamation works. Plant security and PDF survivors contest the system with Rustjaw’s Orks, trying to preserve works they cannot afford to demolish. He rejects outside command and treats approaching forces as a threat to the settled islands.<\/p>\n<p><strong>Soulstorm selection:<\/strong> Adeptus Mechanicus Explorators. Augmented plant guards, engineer cadres and reclamation machines represented by Mechanicus Explorators; slate armour with pale hazard markings. The Directorate remains a locally governed technical power.<\/p>\n<p><strong>Rustjaw Mob — Orks:<\/strong> Boss Skrag Rustjaw earned his name biting through a seized pump-station gate after his breaching charges failed. His mob hoards pipes, tankers and stolen engines, turning Amymone’s chemical yards into ramshackle vehicle shops. Rustjaw regards Bell-Ringa as another rival boss: he has neither surrendered his mob nor promised its ships. Their enemy in Lerna is the human Directorate.<\/p>\n<p><strong>Soulstorm selection:<\/strong> Orks. Boyz, Nobz and ramshackle vehicle mobs; rust-red plates, black checks and trophies made from industrial scrap.<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Holding<\/th><th>Tier / type<\/th><th>Controller<\/th><th>Defence<\/th><th>Logistics / infrastructure<\/th><th>Description<\/th><th>Map theme<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Holding\">Amymone<\/td><td data-label=\"Tier / type\">Standard Planet<\/td><td data-label=\"Controller\">Rustjaw Mob<\/td><td data-label=\"Defence\">4/4<\/td><td data-label=\"Logistics / infrastructure\">2 Supply + 2 Manpower<\/td><td data-label=\"Description\">The Rustjaw Mob has seized a chain of chemical plants amid reed-choked wetlands. Ork workshops occupy corroded tank farms; leaking pipes and welded scrap bridges connect islands of relatively firm ground. Polluted pools and collapsed process towers split the approaches into uneven lanes.<\/td><td data-label=\"Map theme\">Toxic swamp or ruined refinery; water barriers, pipework and raised causeways.<\/td><\/tr><tr><td data-label=\"Holding\">Pontinos<\/td><td data-label=\"Tier / type\">Standard Planet<\/td><td data-label=\"Controller\">Lerna Reclamation Directorate<\/td><td data-label=\"Defence\">4/4<\/td><td data-label=\"Logistics / infrastructure\">2 Supply + 2 Manpower<\/td><td data-label=\"Description\">Habitable islands rise above a poisonous floodplain, each crowded with pump houses and worker settlements. Directorate troops guard levees linking reclamation plants to the principal town. Deliberate drainage keeps the roads usable, but the outer industrial zones are half submerged.<\/td><td data-label=\"Map theme\">Flooded industrial terrain; levees, pumps, narrow crossings and low settlement blocks.<\/td><\/tr><tr><td data-label=\"Holding\">Alcyonian Dock<\/td><td data-label=\"Tier / type\">Minor Station<\/td><td data-label=\"Controller\">Lerna Reclamation Directorate<\/td><td data-label=\"Defence\">2/2<\/td><td data-label=\"Logistics / infrastructure\">1 Supply + 1 Manpower<\/td><td data-label=\"Description\">A compact orbital transfer station handling sealed chemical cargoes. Pressure-separated tank galleries surround a central customs hall and tug-control deck. Security troops favour the short approaches between freight lifts and docking collars.<\/td><td data-label=\"Map theme\">Station cargo terminal; enclosed halls, machinery and short bulkhead chokepoints.<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Fleet<\/th><th>Owner<\/th><th>Strength / original maximum<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Fleet\">The Ninth Sluice<\/td><td data-label=\"Owner\">Lerna Reclamation Directorate<\/td><td data-label=\"Strength / original maximum\">3/3<\/td><\/tr><tr><td data-label=\"Fleet\">Da Pressure Drop<\/td><td data-label=\"Owner\">Rustjaw Mob<\/td><td data-label=\"Strength / original maximum\">2/2<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Map themes describe terrain, not verified map-pack titles. Choose a thematically suitable installed map with the required team capacity; use the existing overflow/raid procedure. Terrain descriptions grant no extra defence, construction or faction bonus.<\/p>\n<h3>Ithaca<\/h3>\n<p><strong>Void Superiority:<\/strong> Ithacan Assembly 5 vs hostile fleets 0 - Ithacan Assembly superior; no hostile fleet present.<\/p>\n<p>Resettlement worlds of displaced families, veterans and descendants of missing crews.<\/p>\n<p>Setup: d20 <strong>17<\/strong>; ownership authored separately.<\/p>\n<p><strong>Ithacan Assembly — Imperial Guard:<\/strong> Speaker Eumaia speaks for settlement councils founded by stranded convoy families and demobilised soldiers. The Assembly’s officers have fought under too many absent patrons to confuse grand titles with reliable relief. Veteran-led militia protects the new towns and their reception station; the Assembly refuses to submit to the Paladins or the Order, despite the population’s continued Emperor worship. Its main fear is becoming another recruiting ground whose protectors never return.<\/p>\n<p><strong>Soulstorm selection:<\/strong> Imperial Guard. Veteran-led colonial PDF and resettlement militia; weathered blue-grey and white settlement badges.<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Holding<\/th><th>Tier / type<\/th><th>Controller<\/th><th>Defence<\/th><th>Logistics / infrastructure<\/th><th>Description<\/th><th>Map theme<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Holding\">Neriton<\/td><td data-label=\"Tier / type\">Minor Planet<\/td><td data-label=\"Controller\">Ithacan Assembly<\/td><td data-label=\"Defence\">2/2<\/td><td data-label=\"Logistics / infrastructure\">1 Supply + 1 Manpower<\/td><td data-label=\"Description\">Wooded highlands shelter settlements founded by retired soldiers and stranded crew families. Timber stockades have gradually acquired ferrocrete bunkers, while narrow roads climb through abandoned extraction sites. The veterans favour prepared village approaches over exposing their homes in open battle.<\/td><td data-label=\"Map theme\">Forested hills; dispersed settlements, tracks and rough defensive works.<\/td><\/tr><tr><td data-label=\"Holding\">Eumaia’s Rest<\/td><td data-label=\"Tier / type\">Minor Planet<\/td><td data-label=\"Controller\">Ithacan Assembly<\/td><td data-label=\"Defence\">2/2<\/td><td data-label=\"Logistics / infrastructure\">1 Supply + 1 Manpower<\/td><td data-label=\"Description\">A quiet resettlement world of low houses, communal workshops and memorial gardens. The oldest transport hulls remain embedded in the original landing field and now serve as clinics and meeting halls. Assembly militia drill beyond irrigated fields rather than among the crowded homes.<\/td><td data-label=\"Map theme\">Rural colony; low buildings, fields and a central landing-ground settlement.<\/td><\/tr><tr><td data-label=\"Holding\">Same<\/td><td data-label=\"Tier / type\">Standard Planet<\/td><td data-label=\"Controller\">Ithacan Assembly<\/td><td data-label=\"Defence\">4/4<\/td><td data-label=\"Logistics / infrastructure\">2 Supply + 2 Manpower<\/td><td data-label=\"Description\">The Assembly’s principal industrial and administrative world is a patchwork of rebuilt cities. Repair yards reuse machinery from scores of refugee vessels; elected delegates meet in a former naval victualling hall. Broad service roads connect workshops to dense residential quarters.<\/td><td data-label=\"Map theme\">Rebuilt urban or industrial colony; workshops, wide roads and inhabited districts.<\/td><\/tr><tr><td data-label=\"Holding\">Return Anchorage<\/td><td data-label=\"Tier / type\">Minor Station<\/td><td data-label=\"Controller\">Ithacan Assembly<\/td><td data-label=\"Defence\">2/2<\/td><td data-label=\"Logistics / infrastructure\">1 Supply + 1 Manpower<\/td><td data-label=\"Description\">An orbital reception station expanded with salvaged habitation modules. Customs lines, quarantine wards and crowded arrival concourses flank the freight spine. Former naval personnel maintain a disciplined watch around the docking control rooms.<\/td><td data-label=\"Map theme\">Orbital terminal or ship interior; concourses, cargo bays and narrow connecting passages.<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Fleet<\/th><th>Owner<\/th><th>Strength / original maximum<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Fleet\">A Place at the Hearth<\/td><td data-label=\"Owner\">Ithacan Assembly<\/td><td data-label=\"Strength / original maximum\">5/5<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Map themes describe terrain, not verified map-pack titles. Choose a thematically suitable installed map with the required team capacity; use the existing overflow/raid procedure. Terrain descriptions grant no extra defence, construction or faction bonus.<\/p>\n<h3>Thessaly<\/h3>\n<p><strong>Void Superiority:<\/strong> Thessalian First Command 3 vs Thessalian Remount Command 2 - Thessalian First Command superior; hostile fleet present.<\/p>\n<p>Military estates, vehicle depots and open-country settlements divided between surviving commands.<\/p>\n<p>Setup: d20 <strong>16<\/strong>; ownership authored separately.<\/p>\n<p><strong>Thessalian First Command — Steel Legion:<\/strong> General Leontes possesses the senior surviving regimental commission and treats Pharsalos’s armoured depots as the centre of a future restored army. He resents Colonel Phereas keeping transport assets under a separate seal, yet neither command has opened hostilities against the other. Their separate fleets count as hostile for Void Superiority; neither command has recognised the other’s authority. First Command favours disciplined infantry supported by well-maintained armour.<\/p>\n<p><strong>Soulstorm selection:<\/strong> Steel Legion. Mechanised infantry and armoured depot reserves; deep red insignia on sand-grey armour. Both Steel Legion branches are valid representations; an AI tank preference is not guaranteed.<\/p>\n<p><strong>Thessalian Remount Command — Vostroyan Firstborn:<\/strong> Colonel Phereas commands the officers, mechanics and rural levies responsible for keeping Thessaly’s scattered forces mobile. He argues that Leontes’s seniority does not cancel his independent transport commission. The rival commissions now reject each other’s authority and treat each other’s armed forces as hostile; no battle has yet been resolved. Remount troops defend the depots and coastal loading grounds that support their small fleet.<\/p>\n<p><strong>Soulstorm selection:<\/strong> Vostroyan Firstborn. Remount-service troops, cavalry traditions and workshop escorts represented by Vostroyans; dun uniforms and dark blue vehicle panels.<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Holding<\/th><th>Tier / type<\/th><th>Controller<\/th><th>Defence<\/th><th>Logistics / infrastructure<\/th><th>Description<\/th><th>Map theme<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Holding\">Pherae<\/td><td data-label=\"Tier / type\">Minor Planet<\/td><td data-label=\"Controller\">Thessalian Remount Command<\/td><td data-label=\"Defence\">2/2<\/td><td data-label=\"Logistics / infrastructure\">1 Supply + 1 Manpower<\/td><td data-label=\"Description\">Open steppe surrounds cavalry breeding estates and vehicle remount compounds. The Remount Command occupies low fortresses beside watering stations, maintaining both draft animals and battered military haulers. Trenches interrupt the roads between otherwise widely separated settlements.<\/td><td data-label=\"Map theme\">Grassland or steppe; open manoeuvre space, low forts and scattered compounds.<\/td><\/tr><tr><td data-label=\"Holding\">Pagasae<\/td><td data-label=\"Tier / type\">Minor Planet<\/td><td data-label=\"Controller\">Thessalian Remount Command<\/td><td data-label=\"Defence\">2/2<\/td><td data-label=\"Logistics / infrastructure\">1 Supply + 1 Manpower<\/td><td data-label=\"Description\">A wind-beaten embarkation world with transport pens and coastal freight towns. Abandoned troop-loading ramps rise over tidal marshes; Colonel Phereas keeps his workshops dispersed to avoid losing them in one raid. Raised roads connect the depots.<\/td><td data-label=\"Map theme\">Coastal depot; marshes, ramps, causeways and dispersed industrial sheds.<\/td><\/tr><tr><td data-label=\"Holding\">Pelion<\/td><td data-label=\"Tier / type\">Minor Planet<\/td><td data-label=\"Controller\">Thessalian First Command<\/td><td data-label=\"Defence\">2/2<\/td><td data-label=\"Logistics / infrastructure\">1 Supply + 1 Manpower<\/td><td data-label=\"Description\">Mountain training estates overlook deep wooded valleys. First Command recruits march between ridge camps, artillery observation posts and enclosed supply yards. Heavy vehicles follow a handful of engineered switchback roads through the passes.<\/td><td data-label=\"Map theme\">Mountain or forest military map; ridges, restricted passes and camp clearings.<\/td><\/tr><tr><td data-label=\"Holding\">Pharsalos<\/td><td data-label=\"Tier / type\">Standard Planet<\/td><td data-label=\"Controller\">Thessalian First Command<\/td><td data-label=\"Defence\">4/4<\/td><td data-label=\"Logistics / infrastructure\">2 Supply + 2 Manpower<\/td><td data-label=\"Description\">A broad continental plain carries the First Command’s principal armoured depots. Regimental towns cluster around repair factories and concrete dispersal yards; earthworks cover the major road junctions. Its officers favour keeping approach fields clear enough for long-range fire.<\/td><td data-label=\"Map theme\">Open military-industrial plain; tank yards, road junctions and long firing lanes.<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Fleet<\/th><th>Owner<\/th><th>Strength / original maximum<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Fleet\">The Senior Warrant<\/td><td data-label=\"Owner\">Thessalian First Command<\/td><td data-label=\"Strength / original maximum\">3/3<\/td><\/tr><tr><td data-label=\"Fleet\">The Unbroken Trace<\/td><td data-label=\"Owner\">Thessalian Remount Command<\/td><td data-label=\"Strength / original maximum\">2/2<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Map themes describe terrain, not verified map-pack titles. Choose a thematically suitable installed map with the required team capacity; use the existing overflow/raid procedure. Terrain descriptions grant no extra defence, construction or faction bonus.<\/p>\n<h2>Minor faction register<\/h2>\n<p>Minor resources below are <strong>derived defence values<\/strong>, not spendable Major stockpiles. Ordinary fleet allocation is ceil(total maximum holding defence / 2); the prize uses the full sum. Partial final fleets keep their original setup maximum. No automatic rebuild follows a lost holding. No Minor has a faction trait.<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Minor<\/th><th>Leader<\/th><th>Holdings<\/th><th>Fleet allocation<\/th><th>Derived Supply / Manpower<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Minor\">Argive Muster Council<\/td><td data-label=\"Leader\">Strategos Damas<\/td><td data-label=\"Holdings\">Heraion<\/td><td data-label=\"Fleet allocation\">1/3 surviving<\/td><td data-label=\"Derived Supply / Manpower\">10 / 10<\/td><\/tr><tr><td data-label=\"Minor\">Eleusinian Synod<\/td><td data-label=\"Leader\">Prelate Lysandra<\/td><td data-label=\"Holdings\">Triptolemos<\/td><td data-label=\"Fleet allocation\">None; fleet destroyed in Cycle 2 Warp Storm<\/td><td data-label=\"Derived Supply / Manpower\">10 / 10<\/td><\/tr><tr><td data-label=\"Minor\">Calydonian Labour Defence<\/td><td data-label=\"Leader\">Marshal Oineus<\/td><td data-label=\"Holdings\">Pleuron<\/td><td data-label=\"Fleet allocation\">None; fleet destroyed in Cycle 2 Warp Storm<\/td><td data-label=\"Derived Supply / Manpower\">10 / 10<\/td><\/tr><tr><td data-label=\"Minor\">Aulis Anchorage Command<\/td><td data-label=\"Leader\">Commodore Thestor<\/td><td data-label=\"Holdings\">Schoenus, Hyria<\/td><td data-label=\"Fleet allocation\">5/5 surviving<\/td><td data-label=\"Derived Supply / Manpower\">20 / 20<\/td><\/tr><tr><td data-label=\"Minor\">House Atreides (prize)<\/td><td data-label=\"Leader\">Archon Pleisthenes Atreides<\/td><td data-label=\"Holdings\">Perseia, Dendra, Lion Gate<\/td><td data-label=\"Fleet allocation\">5/5, 4/5, 4/5, 2/3 surviving<\/td><td data-label=\"Derived Supply / Manpower\">70 / 70<\/td><\/tr><tr><td data-label=\"Minor\">Delphic Custodians<\/td><td data-label=\"Leader\">Logothete Manto<\/td><td data-label=\"Holdings\">Corycia, Pytho, Omphalos Relay<\/td><td data-label=\"Fleet allocation\">4/4 surviving<\/td><td data-label=\"Derived Supply / Manpower\">20 / 20<\/td><\/tr><tr><td data-label=\"Minor\">Lotus Company<\/td><td data-label=\"Leader\">Captain Eurylochos<\/td><td data-label=\"Holdings\">Castalia<\/td><td data-label=\"Fleet allocation\">None; fleet destroyed in Cycle 2 Warp Storm<\/td><td data-label=\"Derived Supply / Manpower\">5 / 5<\/td><\/tr><tr><td data-label=\"Minor\">Nemean Estate Compact<\/td><td data-label=\"Leader\">Warden Adrastos<\/td><td data-label=\"Holdings\">Cleonae, Phlius, Apesas<\/td><td data-label=\"Fleet allocation\">5/5 surviving<\/td><td data-label=\"Derived Supply / Manpower\">25 / 25<\/td><\/tr><tr><td data-label=\"Minor\">Lerna Reclamation Directorate<\/td><td data-label=\"Leader\">Magister Polydoros<\/td><td data-label=\"Holdings\">Pontinos, Alcyonian Dock<\/td><td data-label=\"Fleet allocation\">3/3 surviving<\/td><td data-label=\"Derived Supply / Manpower\">15 / 15<\/td><\/tr><tr><td data-label=\"Minor\">Rustjaw Mob<\/td><td data-label=\"Leader\">Boss Skrag Rustjaw<\/td><td data-label=\"Holdings\">Amymone<\/td><td data-label=\"Fleet allocation\">2/2 surviving<\/td><td data-label=\"Derived Supply / Manpower\">10 / 10<\/td><\/tr><tr><td data-label=\"Minor\">Ithacan Assembly<\/td><td data-label=\"Leader\">Speaker Eumaia<\/td><td data-label=\"Holdings\">Neriton, Eumaia’s Rest, Same, Return Anchorage<\/td><td data-label=\"Fleet allocation\">5/5 surviving<\/td><td data-label=\"Derived Supply / Manpower\">25 / 25<\/td><\/tr><tr><td data-label=\"Minor\">Thessalian First Command<\/td><td data-label=\"Leader\">General Leontes<\/td><td data-label=\"Holdings\">Pelion, Pharsalos<\/td><td data-label=\"Fleet allocation\">3/3 surviving<\/td><td data-label=\"Derived Supply / Manpower\">15 / 15<\/td><\/tr><tr><td data-label=\"Minor\">Thessalian Remount Command<\/td><td data-label=\"Leader\">Colonel Phereas<\/td><td data-label=\"Holdings\">Pherae, Pagasae<\/td><td data-label=\"Fleet allocation\">2/2 surviving<\/td><td data-label=\"Derived Supply / Manpower\">10 / 10<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Argive Muster Council<\/h3>\n<p>Strategos Damas commands hereditary PDF officers whose authority rests on muster warrants issued before the isolation. Their families kept Heraion’s depots intact while promised reinforcements failed to arrive; they regard the Paladins’ requisitions as another attempt to spend Argive lives elsewhere. Loyal to the Emperor, they oppose both Imperial Majors’ claims to local command. Damas fights from prepared barrack lines, with artillery and reserve armour drawn from mothballed stores.<\/p>\n<p><strong>Soulstorm selection:<\/strong> Death Korps of Krieg. Local siege infantry, artillery crews and depot armour represented by Krieg; muted khaki with dark red unit markings. These are Argive troops, not a regiment imported from Dessica.<\/p>\n<h3>Eleusinian Synod<\/h3>\n<p>Prelate Lysandra governs through competing shrine chapters, granary trusts and hospital superiors. These institutions sheltered pilgrims during isolation and refuse to surrender their levies to Althaia’s convent. Their hostility to the Paladins and the Order is a jurisdictional dispute; they remain Emperor-worshipping humans, not a Chaos cult or a second Sisters army. Militia companies defend sacred precincts while household guards provide a more reliable reserve.<\/p>\n<p><strong>Soulstorm selection:<\/strong> Witch Hunters. Shrine guards and religious enforcement troops represented by the Witch Hunters roster; cream cloth, red insignia and worn military equipment. They belong to the independent Synod, not Althaia’s Order.<\/p>\n<h3>Calydonian Labour Defence<\/h3>\n<p>Marshal Oineus was a foundry defence officer before the Capital fell. His committees now bind surviving work gangs, PDF remnants and displaced families into a precarious common command. They refuse outside command, fearing requisitions that strip the remaining evacuation routes of protection. Their soldiers know the factories and maintain a few serviceable armoured vehicles amid much improvised equipment.<\/p>\n<p><strong>Soulstorm selection:<\/strong> Renegade Guard. Industrial rebels, worker levies and salvaged armour; soot-grey fatigues and ochre identification bands. Accept either Vraksian or Tekarn AI branch; this proxy does not establish a Chaos Alignment or dictate every unit’s narrative identity.<\/p>\n<h3>Aulis Anchorage Command<\/h3>\n<p>Commodore Thestor has preserved a fragment of the Imperial Navy’s embarkation administration rather than declaring a personal kingdom. His officers still inspect troop transports for assignments whose destinations may no longer exist. Armsmen, shore regiments and support personnel hold the landing fields; Thestor refuses incoming claims of authority and orders his ships to challenge any force attempting to seize the anchorages.<\/p>\n<p><strong>Soulstorm selection:<\/strong> Imperial Guard. Naval shore troops and armsmen represented by Guard infantry and vehicles; navy blue and bone-white markings.<\/p>\n<h3>House Atreides<\/h3>\n<p>Archon Pleisthenes Atreides is the hereditary Imperial governor of Perseia and master of a household compact binding Dendra’s estates to Lion Gate. The dynasty won loyalty by sheltering refugee crews and honouring old service pensions; it also enforces hereditary labour dues and executes breaches of the tithe oath. Its sea-cliff court maintains sanctioned confessors, Administratum assessors and an exacting household officer corps. Pleisthenes claims an old emergency commission gives him responsibility for Mycenae and refuses the competing authority of both Imperial Majors. His disciplined regiments and substantial flotilla make that claim expensive to challenge. Green livery, a copper hawk clutching an Imperial aquila, maritime ancestry and cultivated public duty provide the deliberate Dune homage; the people, history and conflict are native to this campaign. There is no spice monopoly, prescient heir or imported Dune political system.<\/p>\n<p><strong>Soulstorm selection:<\/strong> Vostroyan Firstborn. Hereditary household regiments with heirloom weapons and heavy infantry; deep green uniforms, charcoal armour and copper heraldry. Vostroyan models represent local troops rather than a visiting Vostroyan regiment.<\/p>\n<h3>Delphic Custodians<\/h3>\n<p>Logothete Manto leads hereditary archive wardens and the security staff serving Delphi’s astropathic establishments. Contradictory orders have become dangerous currency: commanders seek whichever sealed transcript favours their claim. Manto keeps the custodial oath above these disputes and defends vaults against the Lotus privateers, while refusing outside claims on her archives. Her soldiers are human guards, not Adeptus Custodes despite their title.<\/p>\n<p><strong>Soulstorm selection:<\/strong> Witch Hunters. Archive wardens and armoured enforcers represented by the Witch Hunters roster; ash-blue cloth, brass seals and ivory unit plates. Their title does not make them Adeptus Custodes.<\/p>\n<h3>Lotus Company<\/h3>\n<p>Captain Eurylochos commands human deserters, smugglers, hired gun crews and Ork mercenaries from Castalia’s abandoned waterworks. His company presents expired letters of marque when useful and burns the records when they are not. It raids Delphi’s lighter traffic and avoids a decisive engagement with Manto’s stronger patrols. The company has no Alignment and remains hostile, with no established pact or Chaos allegiance.<\/p>\n<p><strong>Soulstorm selection:<\/strong> Praetorian Guard. Human privateers, hired Ork muscle and looted vehicles using the Praetorian roster; mismatched armour and faded violet patches. Its mercenary options fit the company’s mixed crews.<\/p>\n<h3>Nemean Estate Compact<\/h3>\n<p>Warden Adrastos chairs a compact of landowners whose privileges depend on keeping crusade provisioning quotas. Isolation has let them retain more of the harvest, but loss of convoy protection has made those stores vulnerable. Estate riflemen, rural PDF and armoured agricultural security protect the processing towns. The Compact refuses outside authority and guards its harvest against requisition by any would-be protector.<\/p>\n<p><strong>Soulstorm selection:<\/strong> Praetorian Guard. Estate riflemen, regular household companies, mortar crews and hired auxiliaries; ochre cloth and dark green plates. The full Praetorian roster is permitted, including its mercenary options.<\/p>\n<h3>Lerna Reclamation Directorate<\/h3>\n<p>Magister Polydoros administers the pumps, chemical plants and purification crews keeping Pontinos habitable. His civic administration depends on hereditary technical guilds, augmented engineers and machine-tending crews whose survival is tied to the reclamation works. Plant security and PDF survivors contest the system with Rustjaw’s Orks, trying to preserve works they cannot afford to demolish. He rejects outside command and treats approaching forces as a threat to the settled islands.<\/p>\n<p><strong>Soulstorm selection:<\/strong> Adeptus Mechanicus Explorators. Augmented plant guards, engineer cadres and reclamation machines represented by Mechanicus Explorators; slate armour with pale hazard markings. The Directorate remains a locally governed technical power.<\/p>\n<h3>Rustjaw Mob<\/h3>\n<p>Boss Skrag Rustjaw earned his name biting through a seized pump-station gate after his breaching charges failed. His mob hoards pipes, tankers and stolen engines, turning Amymone’s chemical yards into ramshackle vehicle shops. Rustjaw regards Bell-Ringa as another rival boss: he has neither surrendered his mob nor promised its ships. Their enemy in Lerna is the human Directorate.<\/p>\n<p><strong>Soulstorm selection:<\/strong> Orks. Boyz, Nobz and ramshackle vehicle mobs; rust-red plates, black checks and trophies made from industrial scrap.<\/p>\n<h3>Ithacan Assembly<\/h3>\n<p>Speaker Eumaia speaks for settlement councils founded by stranded convoy families and demobilised soldiers. The Assembly’s officers have fought under too many absent patrons to confuse grand titles with reliable relief. Veteran-led militia protects the new towns and their reception station; the Assembly refuses to submit to the Paladins or the Order, despite the population’s continued Emperor worship. Its main fear is becoming another recruiting ground whose protectors never return.<\/p>\n<p><strong>Soulstorm selection:<\/strong> Imperial Guard. Veteran-led colonial PDF and resettlement militia; weathered blue-grey and white settlement badges.<\/p>\n<h3>Thessalian First Command<\/h3>\n<p>General Leontes possesses the senior surviving regimental commission and treats Pharsalos’s armoured depots as the centre of a future restored army. He resents Colonel Phereas keeping transport assets under a separate seal, yet neither command has opened hostilities against the other. Their separate fleets count as hostile for Void Superiority; neither command has recognised the other’s authority. First Command favours disciplined infantry supported by well-maintained armour.<\/p>\n<p><strong>Soulstorm selection:<\/strong> Steel Legion. Mechanised infantry and armoured depot reserves; deep red insignia on sand-grey armour. Both Steel Legion branches are valid representations; an AI tank preference is not guaranteed.<\/p>\n<h3>Thessalian Remount Command<\/h3>\n<p>Colonel Phereas commands the officers, mechanics and rural levies responsible for keeping Thessaly’s scattered forces mobile. He argues that Leontes’s seniority does not cancel his independent transport commission. The rival commissions now reject each other’s authority and treat each other’s armed forces as hostile; no battle has yet been resolved. Remount troops defend the depots and coastal loading grounds that support their small fleet.<\/p>\n<p><strong>Soulstorm selection:<\/strong> Vostroyan Firstborn. Remount-service troops, cavalry traditions and workshop escorts represented by Vostroyans; dun uniforms and dark blue vehicle panels.<\/p>\n<h2>Minor force representation<\/h2>\n<p>Each Minor has an explicit Soulstorm selection in its system dossier and faction register. The thirteen Minors now use nine roster selections, including Krieg, Witch Hunters, Renegade Guard, Vostroyans, Praetorians, Mechanicus Explorators and Steel Legion alongside Guard and Orks. These are full gameplay rosters representing local forces, not just uniform changes. All Minors remain independent hostile powers without Alignment or diplomatic agreements.<\/p>\n<p>Use the full selected roster; narrative preferences do not force an AI branch or prohibit its units. These selections add no meta-campaign traits or construction bonuses. Consult the <a href=\"Unification_Roster_Reference_2026- 8 + 0 Strength + 1 Supply + 1 Manpower. Defender setup 8 Supply / 9 Manpower. Pleuron 4/4 to 2/4, still Calydonian Labour Defence-controlled; no capture or Planet Fall. Da Gate-Krasha remains 5/5, action spent. [Saved roll](Atreus_Cycle_03_Pleuron_Battle.json).\">Resolved after assault.<\/td><td data-label=\"None\">None<\/td><\/tr><tr><td data-label=\"3 / WAAAGH! Bell-Ringa / Fleet\">3 / WAAAGH! Bell-Ringa / Social<\/td><td data-label=\"Da Gate-Krasha assaults Pleuron with 5 Strength.\">No action.<\/td><td data-label=\"2 Supply: 18 to 16; commit 1 Manpower: 26 to 25. Victory recovery rounds down to 0.\">None.<\/td><td data-label=\"AI victory 33 to 20: attacker d20 20 + 5 Strength + 3 Supply + 5 Manpower; defender d20 18 + 0 Strength + 1 Supply + 1 Manpower. Defender setup 8 Supply / 9 Manpower. Pleuron 4/4 to 2/4, still Calydonian Labour Defence-controlled; no capture or Planet Fall. Da Gate-Krasha remains 5/5, action spent. [Saved roll](Atreus_Cycle_03_Pleuron_Battle.json).\">No change.<\/td><td data-label=\"None\">None<\/td><\/tr><tr><td data-label=\"3 / WAAAGH! Bell-Ringa / Fleet\">3 / WAAAGH! Bell-Ringa / Construction<\/td><td data-label=\"Da Gate-Krasha assaults Pleuron with 5 Strength.\">Continue Major Forge Complex on Da Bellworks.<\/td><td data-label=\"2 Supply: 18 to 16; commit 1 Manpower: 26 to 25. Victory recovery rounds down to 0.\">5 Supply: 19 to 14.<\/td><td data-label=\"AI victory 33 to 20: attacker d20 20 + 5 Strength + 3 Supply + 5 Manpower; defender d20 18 + 0 Strength + 1 Supply + 1 Manpower. Defender setup 8 Supply / 9 Manpower. Pleuron 4/4 to 2/4, still Calydonian Labour Defence-controlled; no capture or Planet Fall. Da Gate-Krasha remains 5/5, action spent. [Saved roll](Atreus_Cycle_03_Pleuron_Battle.json).\">Progress and Integrity 2/5 to 3/5; unfinished and inactive. Host remains 12/12. Final resources 14 Supply / 25 Manpower.<\/td><td data-label=\"None\">Order of Saint Erigone orders<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Cycle Records<\/h2>\n<h3>Cycle 1 - Foundries and burial gates<\/h3>\n<p>On Tiryns, the Iron Paladins turned their attention to the means of sustaining the war ahead. Anabasis remained in Argos while military stores were replenished and work began on The Forge of Iron beneath the fortress-monastery&#x27;s industrial skyline. Its workshops were still a promise of future production; the Chapter&#x27;s existing stores carried the undertaking.<\/p>\n<p>In Calydon, Bell-Ringa&#x27;s first assault broke the Calydonian Labour Defence&#x27;s hold on Olenos. The mining settlements and burial-grey slag ridges passed into Ork hands, while The Last Shift emerged from the loss badly diminished. Pleuron remained beyond the Warboss&#x27;s control. At Da Bellworks, replenishment and the beginnings of another forge accompanied the conquest, giving the expanding war host work to return to between battles.<\/p>\n<p>The Order advanced upon Daeira&#x27;s funerary settlements and overcame the Synod&#x27;s defenders. The Locked Reliquary survived the fall of the world with its fighting strength severely reduced, and the Synod retained Triptolemos. Back on Erigone, new musters gathered as work began on The Vigil of the Three Refusals. The Order had gained ground, but the academy&#x27;s promised flow of trained replacements still lay ahead.<\/p>\n<p>No communiques passed between the Major powers. Each had committed to a new construction; two had taken their first hostile holdings. The next Cycle had yet to open.<\/p>\n<h3>Cycle 2 - Repairs beneath closed skies<\/h3>\n<p>The storm battered the fleets of Atreus and closed their passages between systems. Ships already crippled by the fall of Olenos and Daeira were lost, along with two smaller Minor formations. Surviving local squadrons attended to what damage their remaining crews could repair.<\/p>\n<p>At Tiryns, the Iron Paladins restored Anabasis, replenished their military stores and continued work on The Forge of Iron. Bell-Ringa&#x27;s Meks brought Da Gate-Krasha back to fighting condition while the foundries of Da Bellworks supplied the next stage of his forge. At Erigone, The Third Refusal returned to readiness and work continued on The Vigil of the Three Refusals.<\/p>\n<p>No new assault was launched. Olenos and Daeira remained damaged conquests, and the three new construction projects remained unfinished. When the storm passed, the Major fleets were ready again. The next scheduled deliveries reached their holdings, with provisions set aside to sustain the ships before another round of orders.<\/p>\n<h3>Cycle 3 - Iron Paladins: Prosymna taken<\/h3>\n<p>The Iron Paladins carried Prosymna in an overwhelming victory. The Council&#x27;s levy positions fell, and the recruiting estates and grain stores passed into the Warsmith&#x27;s keeping. Damas retains Heraion, but the loss has weakened his remaining fleet. Anabasis holds its strength above the newly claimed world.<\/p>\n<p>On Tiryns, replenishment continued and work advanced on the Forge of Iron. Its halls remain unfinished. The Chapter now has another world to defend.<\/p>\n<p>Battle record: Jake reported an overwhelming victory on 8 October 2026. The engagement was Standard difficulty, one player against one Death Korps of Krieg AI representing the Argive Muster Council. This descriptive result confers no additional damage bonus. Assault costs were already recorded; the remaining approved actions are now complete.<\/p>\n<p>Standing player-battle workflow: provide the Soulstorm setup in chat, await Jake&#x27;s result, then settle the battle and remaining approved actions and publish the completed turn once. Do not publish a pending setup or require a separate result source for faction instances; they read the published ledger at the start of their turn.<\/p>\n<h3>Cycle 3 - Bell-Ringa: the assault on Pleuron<\/h3>\n<p>Bell-Ringa&#x27;s mobs broke into Pleuron&#x27;s industrial districts, forcing the labour defence back through workshops and barricaded crossings. The victory opened ground for the Orks, but Marshal Oineus still held enough of the world to continue the resistance. Pleuron had been battered, not conquered.<\/p>\n<p>Da Gate-Krasha remained ready above Calydon. At Da Bellworks, fresh military stores reached the war host while the Meks pushed the unfinished forge onward.<\/p>\n<h2>Pinned rules appendix<\/h2>\n<p>The following is the complete adopted 6 October edition. The explicit Atreus setup conventions above supply scenario-specific names, ownership, opening fleet strength, diplomacy and victory conditions. This is a frozen copy; later source-library edits require an agreed migration.<\/p>\n<h1>Soulstorm campaign rules — current playtest edition<\/h1>\n<p>6 October 2026. This is the consolidated source for the selected decision/recovery package of 6 October, including its inherited rules and approved campaign conventions. It supersedes conflicting numerical rules in the 15 September baseline, 27 September draft and intermediate proposals. Do not combine their trait values with this edition.<\/p>\n<p>This is a playtest release, not a claim of final balance. The latest 200-game comparison reduced the observed highest-to-lowest trait win-rate spread from 32 to 28 percentage points; it remains above the requested 25-point target. AI campaign results do not predict human Soulstorm win rates. Sector design, the global Soulstorm difficulty problem and the mod project remain deferred. Historical source, frozen studies and suspended Dessica Cycle 21 are unchanged.<\/p>\n<p>For a new campaign, copy the templates, pin this edition and record local exceptions before play. The source is reusable; the campaign ledger alone records current resources, outcomes and characters. The reconciliation record is Source_Reconciliation_2026-10-06.txt.<\/p>\n<h2>Setup, resources and personnel<\/h2>\n<p>New roster-building Subsector Major factions begin with 20 Supply and 20 Manpower, capped at 100 each. Both represent military resources, not the civilian economy. Use one agreed rules version and record exceptions before play. Only Major Factions have Alignments. Minor Factions have none; force species does not confer alliance. Independent remains a Major Alignment, never an automatic alliance. Fleets measure combat effectiveness, not a literal ship count.<\/p>\n<p>Establish the Subsector&#x27;s fixed raiding faction at setup; raiders cannot hold territory. Dessica&#x27;s raiders remain Iron Warriors. Generate ordinary systems from the d20 table below: 2–4 combined planets/stations, averaging 3. Exceptional prize factions can hold Capitals.<\/p>\n<h3>Faction Alignments<\/h3>\n<p><strong>7 October 2026 creator correction:<\/strong> Alignments apply only to Major Factions. Majors sharing a non-Independent Alignment are allied by default unless an explicit hostility exception is recorded, such as the Atreus Sisters and Iron Paladins. Different Major Alignments are hostile without an applicable agreement; two Independent Majors are not automatically allied.<\/p>\n<p>Minor Factions have no Alignment and cannot enter diplomatic agreements or alliances. They are hostile to other factions; species, force representation and narrative worship do not make them allied. A Minor absorbed into a Major is no longer a separate aligned Minor. The Alignment column below applies only when the force is a Major; the manpower and representation guidance applies to both roles.<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Faction<\/th><th>Alignment<\/th><th>Per Manpower<\/th><th>Ratio to Marine<\/th><th>vs Guard<\/th><th>Force Description<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Faction\">Space Marines<\/td><td data-label=\"Alignment\">Imperium<\/td><td data-label=\"Per Manpower\">40<\/td><td data-label=\"Ratio to Marine\">1:1<\/td><td data-label=\"vs Guard\">1:15<\/td><td data-label=\"Force Description\">Battle-brothers only. Chapter Serfs, Servitors, and non-combat personnel not tracked. Vehicle crews included.<\/td><\/tr><tr><td data-label=\"Faction\">Chaos Space Marines<\/td><td data-label=\"Alignment\">Chaos<\/td><td data-label=\"Per Manpower\">40<\/td><td data-label=\"Ratio to Marine\">1:1<\/td><td data-label=\"vs Guard\">1:15<\/td><td data-label=\"Force Description\">Traitor Astartes only. Cultists, mutants, and daemonic auxiliaries supplement forces but not explicitly tracked.<\/td><\/tr><tr><td data-label=\"Faction\">Grey Knights<\/td><td data-label=\"Alignment\">Imperium<\/td><td data-label=\"Per Manpower\">40<\/td><td data-label=\"Ratio to Marine\">1:1<\/td><td data-label=\"vs Guard\">1:15<\/td><td data-label=\"Force Description\">Battle-brothers only. Inquisitorial retinues and support staff not tracked.<\/td><\/tr><tr><td data-label=\"Faction\">Sisters of Battle<\/td><td data-label=\"Alignment\">Imperium<\/td><td data-label=\"Per Manpower\">100<\/td><td data-label=\"Ratio to Marine\">1:2.5<\/td><td data-label=\"vs Guard\">1:6<\/td><td data-label=\"Force Description\">Battle Sisters and vehicle crews. Ecclesiarchy support, Arco-flagellants, Penitent Engines as auxiliary not tracked.<\/td><\/tr><tr><td data-label=\"Faction\">Imperial Guard<\/td><td data-label=\"Alignment\">Imperium<\/td><td data-label=\"Per Manpower\">600<\/td><td data-label=\"Ratio to Marine\">1:15<\/td><td data-label=\"vs Guard\">Baseline<\/td><td data-label=\"Force Description\">Frontline infantry, officers, heavy weapons teams, tank crews. Logistics and rear echelon not tracked.<\/td><\/tr><tr><td data-label=\"Faction\">Traitor Guard<\/td><td data-label=\"Alignment\">Chaos<\/td><td data-label=\"Per Manpower\">600<\/td><td data-label=\"Ratio to Marine\">1:15<\/td><td data-label=\"vs Guard\">Baseline<\/td><td data-label=\"Force Description\">As Imperial Guard. Mutants and Chaos-touched may supplement but not tracked.<\/td><\/tr><tr><td data-label=\"Faction\">Craftworld Eldar<\/td><td data-label=\"Alignment\">Aeldari<\/td><td data-label=\"Per Manpower\">100<\/td><td data-label=\"Ratio to Marine\">1:2.5<\/td><td data-label=\"vs Guard\">1:6<\/td><td data-label=\"Force Description\">Mix of Aspect Warriors and Guardian militia. Seers, vehicle crews included. Wraithbone constructs as heavy support not explicitly tracked.<\/td><\/tr><tr><td data-label=\"Faction\">Harlequins<\/td><td data-label=\"Alignment\">Aeldari<\/td><td data-label=\"Per Manpower\">15<\/td><td data-label=\"Ratio to Marine\">2.67:1<\/td><td data-label=\"vs Guard\">1:40<\/td><td data-label=\"Force Description\">Players only. Troupes, Shadowseers, Death Jesters, Solitaires. No auxiliaries - they operate alone.<\/td><\/tr><tr><td data-label=\"Faction\">Drukhari<\/td><td data-label=\"Alignment\">Drukhari<\/td><td data-label=\"Per Manpower\">160<\/td><td data-label=\"Ratio to Marine\">1:4<\/td><td data-label=\"vs Guard\">1:3.75<\/td><td data-label=\"Force Description\">Kabalite Warriors, Wyches, vehicle crews. Haemonculus creations and slaves may supplement raids but not tracked.<\/td><\/tr><tr><td data-label=\"Faction\">Necrons<\/td><td data-label=\"Alignment\">Necron<\/td><td data-label=\"Per Manpower\">160<\/td><td data-label=\"Ratio to Marine\">1:4<\/td><td data-label=\"vs Guard\">1:3.75<\/td><td data-label=\"Force Description\">Warriors, Immortals, command elements. Canoptek constructs (Scarabs, Wraiths, Spyders) as auxiliary not explicitly tracked.<\/td><\/tr><tr><td data-label=\"Faction\">Tau<\/td><td data-label=\"Alignment\">T&#x27;au<\/td><td data-label=\"Per Manpower\">320<\/td><td data-label=\"Ratio to Marine\">1:8<\/td><td data-label=\"vs Guard\">1:1.9<\/td><td data-label=\"Force Description\">Fire Caste Warriors, Pathfinders, Battlesuit pilots, vehicle crews. Kroot and Vespid auxiliaries handled as separate formations.<\/td><\/tr><tr><td data-label=\"Faction\">Orks<\/td><td data-label=\"Alignment\">Ork<\/td><td data-label=\"Per Manpower\">400<\/td><td data-label=\"Ratio to Marine\">1:10<\/td><td data-label=\"vs Guard\">1:1.5<\/td><td data-label=\"Force Description\">Boyz, Nobz, specialist mobs, vehicle crews. Gretchin serve as support. Squigs not tracked.<\/td><\/tr><tr><td data-label=\"Faction\">Tyranids<\/td><td data-label=\"Alignment\">Tyranid<\/td><td data-label=\"Per Manpower\">800<\/td><td data-label=\"Ratio to Marine\">1:20<\/td><td data-label=\"vs Guard\">1:1.3<\/td><td data-label=\"Force Description\">Weighted average: primarily Gaunts with Warriors and Genestealers as synapse/elite. Larger bioforms (Carnifexes, etc.) as heavy support.<\/td><\/tr><tr><td data-label=\"Faction\">Chaos Daemons<\/td><td data-label=\"Alignment\">Chaos<\/td><td data-label=\"Per Manpower\">100<\/td><td data-label=\"Ratio to Marine\">1:2.5<\/td><td data-label=\"vs Guard\">1:6<\/td><td data-label=\"Force Description\">Full daemonic incursion: lesser daemons as line troops (Bloodletters, Daemonettes, Plaguebearers, Horrors). Greater Daemons and Daemon Princes as command elements.<\/td><\/tr><tr><td data-label=\"Faction\">Adeptus Mechanicus<\/td><td data-label=\"Alignment\">Imperium<\/td><td data-label=\"Per Manpower\">240<\/td><td data-label=\"Ratio to Marine\">1:6<\/td><td data-label=\"vs Guard\">1:2.5<\/td><td data-label=\"Force Description\">Skitarii Rangers/Vanguard, Tech-Priests, Servitors. Battle Automata and heavier war machines as support not explicitly tracked.<\/td><\/tr><tr><td data-label=\"Faction\">Independent (Rogue Traders, Pirates, minor xenos, unaligned forces)<\/td><td data-label=\"Alignment\">Independent<\/td><td data-label=\"Per Manpower\">Varies<\/td><td data-label=\"Ratio to Marine\">Varies<\/td><td data-label=\"vs Guard\">Varies<\/td><td data-label=\"Force Description\">Independents are all-encompassing. Manpower ratios depend on the specific force composition — use the ratio of whichever faction type best represents the force being fought.<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h3>Personnel lifespan reference — 20 September 2026<\/h3>\n<p>Place this reference alongside the Manpower conversion table. These describe personnel, not the age of a faction or its entire Manpower pool. Numeric campaign defaults below are provisional house assumptions, not universal canonical death ages. Track biological age separately from time spent in stasis or distorted Warp time. No Cycle-to-years conversion is introduced here.<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Personnel profile<\/th><th>Lifespan guidance for campaign records<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Personnel profile\">Unaugmented humans: Guard, Sisters, mortal Traitor Guard, human Independents<\/td><td data-label=\"Lifespan guidance for campaign records\">Proposed natural-age reference: 60–100 Terran years where living conditions and medical care permit. This is a house range, not average Imperial life expectancy or a mandatory retirement age.<\/td><\/tr><tr><td data-label=\"Personnel profile\">Humans with sustained rejuvenation<\/td><td data-label=\"Lifespan guidance for campaign records\">Centuries are possible; proposed record range 200–400 years, adjusted for the specific treatment and character. Not automatically available to all human personnel.<\/td><\/tr><tr><td data-label=\"Personnel profile\">Space Marines and Grey Knights<\/td><td data-label=\"Lifespan guidance for campaign records\">Centuries; exceptional individuals exceed a millennium. No established universal natural death age: record individual history rather than imposing a fabricated species expiry.<\/td><\/tr><tr><td data-label=\"Personnel profile\">Chaos Space Marines<\/td><td data-label=\"Lifespan guidance for campaign records\">Astartes baseline, modified by recorded Warp exposure and supernatural effects. Calendar age is not automatically biological age.<\/td><\/tr><tr><td data-label=\"Personnel profile\">Craftworld Aeldari and Harlequins<\/td><td data-label=\"Lifespan guidance for campaign records\">Millennial lifespans; approximately 1,000–2,000+ years as broad reference, not a hard maximum. Individual and psychic exceptions apply.<\/td><\/tr><tr><td data-label=\"Personnel profile\">Drukhari<\/td><td data-label=\"Lifespan guidance for campaign records\">Record Aeldari ancestry plus rejuvenation/reconstruction arrangements; no automatic old-age deadline while sustained by those arrangements.<\/td><\/tr><tr><td data-label=\"Personnel profile\">T&#x27;au<\/td><td data-label=\"Lifespan guidance for campaign records\">Approximately 40 Terran years ordinarily. Record stasis, exceptional medicine or other established life extension separately.<\/td><\/tr><tr><td data-label=\"Personnel profile\">Orks<\/td><td data-label=\"Lifespan guidance for campaign records\">No dependable natural maximum specified here; do not invent an automatic old-age death.<\/td><\/tr><tr><td data-label=\"Personnel profile\">Necrons<\/td><td data-label=\"Lifespan guidance for campaign records\">No ordinary biological ageing; destruction, degradation and personality loss are distinct narrative events.<\/td><\/tr><tr><td data-label=\"Personnel profile\">Tyranids<\/td><td data-label=\"Lifespan guidance for campaign records\">Bioform-specific lifespan and recycling; persistent command identity is not necessarily the same biological body. No species-wide age band.<\/td><\/tr><tr><td data-label=\"Personnel profile\">Chaos Daemons<\/td><td data-label=\"Lifespan guidance for campaign records\">No ordinary biological lifespan; banishment and destruction follow their narrative circumstances.<\/td><\/tr><tr><td data-label=\"Personnel profile\">Adeptus Mechanicus<\/td><td data-label=\"Lifespan guidance for campaign records\">Human baseline modified individually by augmentation and rejuvenation; heavily augmented personnel may endure for centuries or longer.<\/td><\/tr><tr><td data-label=\"Personnel profile\">Independent or mixed-species personnel<\/td><td data-label=\"Lifespan guidance for campaign records\">Use the actual individual&#x27;s species and recorded life extension; Independent is not a species.<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Reference sources for numerical anchors: <a href=\"https://wh40k.lexicanum.com/mediawiki/index.php?title=Rejuvenat\">human rejuvenation<\/a>, <a href=\"https://wh40k.lexicanum.com/mediawiki/index.php?title=T%27au\">T&#x27;au physiology<\/a>, and <a href=\"https://wh40k.lexicanum.com/wiki/Aeldari\">Aeldari<\/a>. These are lore reference summaries; proposed human ranges are campaign conventions. Major factions select narrative succession; the referee manages Minor personnel. Succession retains the faction trait. Agree any finite character death window when establishing that character, rather than retroactively assigning one.<\/p>\n<h2>Faction traits<\/h2>\n<p>Narrative names do not change the following mechanics. Each faction uses one profile. Income and refunds respect the resource cap and deficit locks.<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Trait<\/th><th>Current effect<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Trait\">Mobile Capital<\/td><td data-label=\"Current effect\">Starts with a 12/12 Mobile Capital instead of an ordinary starting fleet. Grants 4 Supply and 4 Manpower each Logistics Cycle, a built-in shipyard and support for planetary constructions. No Mobile Capital upkeep. Its intrinsic hull contributes floor((6 × current hull + 5) / 10) combat Strength: 7 at 12 hull. Added permanent Fleet-construction Strength contributes in full and takes damage before intrinsic hull. Losing the Mobile Capital permanently removes the trait.<\/td><\/tr><tr><td data-label=\"Trait\">War Economy<\/td><td data-label=\"Current effect\">+6 Supply each Logistics Cycle.<\/td><\/tr><tr><td data-label=\"Trait\">Martial Culture<\/td><td data-label=\"Current effect\">+4 Manpower each Logistics Cycle.<\/td><\/tr><tr><td data-label=\"Trait\">Efficient Logistics<\/td><td data-label=\"Current effect\">Reinforce grants 8 Supply; Muster grants 8 Manpower, instead of the normal 3. These are total action yields.<\/td><\/t
