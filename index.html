r><tr><td data-label=\"Trait\">Salvagers<\/td><td data-label=\"Current effect\">+3 Supply on a qualifying victory; +1 on defeat or draw; +1 additional Supply on capture. Ground battles, Fleet Battles and guarded Structure Assaults qualify, once per participating faction per engagement. Uncontested bombardment and unguarded Structure Assaults do not. If raiders win, both main factions receive the defeat reward.<\/td><\/tr><tr><td data-label=\"Trait\">Void Supremacy<\/td><td data-label=\"Current effect\">Ordinary Expand Fleet restores up to 4 Strength for 1 Supply and 1 Manpower, without a shipyard. Ordinary fleet upkeep is 0 Supply and ceil(number of living ordinary fleets / 2) Manpower. Creation still needs a yard; this does not improve Mobile Capital self-repair.<\/td><\/tr><tr><td data-label=\"Trait\">Swift Mobilization<\/td><td data-label=\"Current effect\">Create Fleet produces 6/6 for 1 Supply and 1 Manpower. Its base capacity remains 6; existing starting fleets are not enlarged retroactively. The new fleet cannot act that Cycle. Ordinary fleet upkeep is ceil(number of living ordinary fleets / 2) of each resource. Expand remains the normal +2.<\/td><\/tr><tr><td data-label=\"Trait\">Fleet Endurance<\/td><td data-label=\"Current effect\">Each Cycle, before events, restore up to 2 Strength to every surviving fleet, capped at its actual maximum. Ordinary fleet upkeep is ceil(number of living ordinary fleets / 2) of each resource. No resurrection or Integrity repair.<\/td><\/tr><tr><td data-label=\"Trait\">Siege Doctrine<\/td><td data-label=\"Current effect\">Ground Assault base Supply cost is ceil(holding tier / 2); enemy surcharges are not halved. Ignore Defended. Victory adds 1 damage above the ordinary +1 breakthrough; defeat deals 1 before mitigation. On victory, recover 2 additional committed Manpower, capped at commitment, and refund 1 paid base Supply. No refund funds the attack in advance; no surcharge refund or non-victory refund.<\/td><\/tr><tr><td data-label=\"Trait\">Dread Reputation<\/td><td data-label=\"Current effect\">Each attack against this faction costs the initiator an additional 2 + max(1, ceil(declared participating combat Strength / 5)) of BOTH Supply and Manpower. Calculate before initiation losses or cannons, including ground-only Strength for a Ground Assault. Charge once for the combined group, including allied assets. Applies to ground, naval, bombardment and targeted construction attacks. This Manpower is expenditure, not recoverable commitment. No Soulstorm difficulty modifier.<\/td><\/tr><tr><td data-label=\"Trait\">Fortification Experts<\/td><td data-label=\"Current effect\">The holding/Mobile Capital Defend action costs no resources, restores up to 4 defence, grants Defended and grants 2 Supply. It still uses the Faction Action, including when defending a full holding. No Manpower grant, Integrity repair or construction discount.<\/td><\/tr><tr><td data-label=\"Trait\">Industrial Efficiency<\/td><td data-label=\"Current effect\">Each Build or Upgrade action costs 3 less Supply, minimum 1. A new project begins at 2 Integrity; subsequent Build and Upgrade actions add the normal 1. Repair is unchanged.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Cycle sequence and resources<\/h2>\n<p><strong>Phase 0 happens once globally (there is no separate second event phase):<\/strong> snapshot and resolve periodic construction damage; apply surviving eligible repair/regeneration effects; resolve Logistics on Cycles 3, 6, 9…; then make the single event check. Endurance recovery precedes events. No faction gets a second copy on its own turn. Destruction precedes repair, and destroyed assets cannot regenerate.<\/p>\n<p>Logistics grants Supply and Manpower equal to owned holding tiers: Minor 1, Standard 2, Major 3, Capital 4, plus active constructions and traits. Ordinary living fleets normally cost 1 of each resource per Logistics Cycle; apply the trait upkeep exceptions above. Credit income up to the 100 cap first, then deduct upkeep; income above the cap is not banked against upkeep. Mobile Capitals do not pay ordinary fleet upkeep. Existing deficit locks suppress their affected resource&#x27;s income and penalties.<\/p>\n<p>Each Major then completes Phase 2 Fleet actions, one Phase 3 Faction action, one Phase 4 Social action and one Phase 5 Construction action in that order. Resolve each attack before dependent later actions. A player battle pauses the turn for the reported result; do not update GitHub with unresolved projected outcomes. At Cycle end resolve eligible Minor recovery and record the narrative, then advance the Cycle and begin the next Phase 0. Defended expires at the start of the owning faction&#x27;s next turn. Attacked/engaged flags govern the relevant recovery interval and are cleared only after that recovery has been assessed. Narration uses in-world language; mechanical records remain separate.<\/p>\n<p><strong>Voluntary expenditure must leave each resource spent above 0.<\/strong> Involuntary losses may trigger deficits. Automatic defensive commitment is calculated for the battle but the final actual loss is settled once, after the attack on the attacker&#x27;s turn. Planet Fall replaces ordinary defeat Supply loss rather than adding it twice. It is not the voluntary Defend action.<\/p>\n<h2>Fleet and Faction actions<\/h2>\n<p>- Every fleet has one offensive/movement Fleet Action per Cycle, including consented participation on an ally&#x27;s turn. Defending is automatic and consumes no action, even after an earlier action.<\/p>\n<p>- Move to any system in the Subsector: map directions describe location, not adjacency or extra travel distance. Storms prevent ordinary movement. Only an explicit ability such as Scout combines movement and attack.<\/p>\n<p>- Expand at an available yard: 1 Supply and 1 Manpower for+2 strength, capped at actual maximum, subject to trait exceptions.<\/p>\n<p>- Create Fleet uses the Faction Action at an available yard: 1 Supply and 1 Manpower, normally 1/5. Yard/trait starting strengths use the best applicable value, not an additive stack. The new fleet takes no Fleet Action that Cycle.<\/p>\n<p>- Reinforce gives 3 Supply; Muster gives 3 Manpower; Efficient Logistics gives 8. Rationing replaces the relevant action while its resource is locked.<\/p>\n<p>- Defend a holding or Mobile Capital costs its tier in each resource, restores that much defence, and grants Defended until the next turn. Fortification uses its listed exception. Full-defence hosts can receive Defended without extra restoration.<\/p>\n<p>- Fleet Transfer/Merge require co-location and Void Superiority; only the initiator spends an action. A Transfer donor retains at least 1; transfer amounts respect actual capacity. A Merge absorbs the other fleet completely without a fleet-destruction penalty. Its constructions transfer, including permanent capacity. Keep the absorbing fleet&#x27;s base capacity and add the absorbed fleet&#x27;s permanent construction capacity, not its ordinary base capacity. Excess combined current Strength above that surviving capacity is lost. Mobile Capitals cannot be transferred or merged.<\/p>\n<p>- Garrison Transfer may distribute defence within a system. Donors normally start full and always retain 1; recipients cannot exceed maximum. An active Landing Zones recipient permits damaged donors. This uses the Faction Action.<\/p>\n<p>- Scuttle a fleet with Void Superiority, using its Fleet Action, to recover floor(current Strength / 2) Supply. Apply destruction penalties before the refund; it cannot fund an otherwise illegal voluntary action. A Mobile Capital also incurs its Capital penalties and permanently loses its trait. Scuttling cannot cause a resource deficit.<\/p>\n<h3>Holdings, Void Superiority and action timing<\/h3>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Holding tier<\/th><th>Normal defence<\/th><th>Logistics income (each resource)<\/th><th>Ground Assault base Supply<\/th><th>Normal Defend cost (each resource) and restoration<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Holding tier\">Minor<\/td><td data-label=\"Normal defence\">2<\/td><td data-label=\"Logistics income (each resource)\">1<\/td><td data-label=\"Ground Assault base Supply\">1<\/td><td data-label=\"Normal Defend cost (each resource) and restoration\">1<\/td><\/tr><tr><td data-label=\"Holding tier\">Standard<\/td><td data-label=\"Normal defence\">4<\/td><td data-label=\"Logistics income (each resource)\">2<\/td><td data-label=\"Ground Assault base Supply\">2<\/td><td data-label=\"Normal Defend cost (each resource) and restoration\">2<\/td><\/tr><tr><td data-label=\"Holding tier\">Major<\/td><td data-label=\"Normal defence\">8<\/td><td data-label=\"Logistics income (each resource)\">3<\/td><td data-label=\"Ground Assault base Supply\">3<\/td><td data-label=\"Normal Defend cost (each resource) and restoration\">3<\/td><\/tr><tr><td data-label=\"Holding tier\">Capital<\/td><td data-label=\"Normal defence\">12<\/td><td data-label=\"Logistics income (each resource)\">4<\/td><td data-label=\"Ground Assault base Supply\">4<\/td><td data-label=\"Normal Defend cost (each resource) and restoration\">4<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Planets and stations use the same tier rules. Void Superiority means the total friendly combat Strength in a system strictly exceeds total hostile combat Strength; a tie is contested. Include allied fleets and Mobile Capitals. This is different from uncontested bombardment, which requires no hostile fleet at all. A full holding may still take Defend to gain Defended. Ordinary Defend restores the tier amount, capped at maximum; Fortification replaces that amount with 4. Active Militia Barracks removes the holding Defend action&#x27;s Manpower cost, not its normal Supply cost.<\/p>\n<p>A Mobile Capital may spend its Fleet Action and 1 Supply / 1 Manpower to Expand itself by up to 2 defence. This does not grant Defended or repair attached Integrity. Its Faction-action Defend normally costs 4 of each resource and restores up to 4. Its actual defence, not its reduced combat contribution, determines whether its construction host is full.<\/p>\n<p>Establish New Capital is compulsory when applicable. An established Capital&#x27;s built-in Orbital Shipyard costs no construction action, Supply or slot. Normal fleets have base capacity 5 unless a rule explicitly changes it. Repair and expansion use actual capacity, including permanent additions.<\/p>\n<h3>Summon Allies<\/h3>\n<p>Call a new allied Major Faction into the subsector by granting them an entire system. <strong>Costs -10 Supply and -10 Manpower.<\/strong> The newly summoned faction starts with 10 Supply and 10 Manpower (inherited mid-campaign Summon Allies exception to the 20/20 opening start) but no fleet — they rely on their summoner for protection. <strong>Requirements:<\/strong> (1) You must control planets in more than one system. (2) You must control ALL planets in the system being granted. (3) You must have Void Superiority in that system. (4) The new faction must share your alignment and make sense within established 40K lore. <strong>Effect:<\/strong> Immediately cede all planets in that system to the new faction. The new faction is aligned with you — they will not attack your holdings and will coordinate against mutual enemies. Design the new faction (name, background, trait) when summoned. The new faction activates immediately after your turn in the turn order.<\/p>\n<p><strong>Important:<\/strong> You cannot grant away your only fully controlled system. You must fully control at least two systems to use Summon Allies — one to keep and one to grant.<\/p>\n<p><strong>Summon Allies — Alignment Restrictions:<\/strong><\/p>\n<p>The summoned faction must belong to the same broad alignment as the summoning faction. This represents calling in reinforcements, granting territory to allies, or allowing subordinate powers to establish their own domains. The new faction must have a plausible lore reason for arriving in the subsector.<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Alignment<\/th><th>Eligible Faction Types<\/th><th>Examples<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Alignment\">Imperium<\/td><td data-label=\"Eligible Faction Types\">Astra Militarum, Adeptus Mechanicus, Other Space Marine Chapters, Adepta Sororitas, Rogue Traders, Imperial Navy, Inquisitorial Forces<\/td><td data-label=\"Examples\">A cut-off Guard regiment, an Explorator fleet, a Magos establishing a Forge World, a brother Chapter answering a distress call<\/td><\/tr><tr><td data-label=\"Alignment\">Chaos<\/td><td data-label=\"Eligible Faction Types\">Other Chaos Warbands, Daemon Cults, Dark Mechanicum, Traitor Guard, Other Traitor Legions<\/td><td data-label=\"Examples\">A warband sworn to a different god, a cult that rises in the new territory, a splinter fleet of the same Legion<\/td><\/tr><tr><td data-label=\"Alignment\">Drukhari<\/td><td data-label=\"Eligible Faction Types\">Other Kabals, Wych Cults, Haemonculus Covens<\/td><td data-label=\"Examples\">A rival Archon granted hunting grounds, a Coven providing support in exchange for specimens, a Wych Cult seeking new arenas<\/td><\/tr><tr><td data-label=\"Alignment\">Craftworld Aeldari<\/td><td data-label=\"Eligible Faction Types\">Other Craftworlds, Corsairs, Harlequins, Ynnari<\/td><td data-label=\"Examples\">A Corsair fleet, rangers from another Craftworld, a Harlequin masque<\/td><\/tr><tr><td data-label=\"Alignment\">Orks<\/td><td data-label=\"Eligible Faction Types\">Other Warbosses, Freebooterz<\/td><td data-label=\"Examples\">Another Waaagh! drawn by the fighting, Freebooterz smelling loot<\/td><\/tr><tr><td data-label=\"Alignment\">Necrons<\/td><td data-label=\"Eligible Faction Types\">Other Dynasties, Destroyer Cults<\/td><td data-label=\"Examples\">An awakening Tomb World, a vassal Dynasty, a Destroyer Lord claiming territory<\/td><\/tr><tr><td data-label=\"Alignment\">Tyranids<\/td><td data-label=\"Eligible Faction Types\">Other Hive Fleets, Genestealer Cults<\/td><td data-label=\"Examples\">A splinter fleet, a cult uprising on the granted world<\/td><\/tr><tr><td data-label=\"Alignment\">T&#x27;au<\/td><td data-label=\"Eligible Faction Types\">Other Septs, Auxiliaries<\/td><td data-label=\"Examples\">An expansion fleet, Kroot kindreds, Vespid contingents<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Summoned capital — ruling, 16 September 2026:<\/strong> The new faction chooses an existing planet or station in the ceded system as its provisional capital and performs Establish New Capital normally. Summoning grants no free defence increase or built-in shipyard; the shipyard becomes available only when establishment is complete. The faction still starts with 10 Supply, 10 Manpower and no fleet, and takes its first turn immediately after its summoner.<\/p>\n<p><strong>Independent summoners:<\/strong> Record an explicit subordinate pact when an Independent-aligned faction summons an ally. Shared Independent Alignment alone never allies unrelated factions. Sector-level grant and roster consequences remain undefined.<\/p>\n<p><strong>Multiple Factions:<\/strong> You may have multiple factions of the same type in play (e.g., two Space Marine Chapters, three Drukhari Archons). Each operates independently but remains aligned with their summoner.<\/p>\n<h3>Phase 4: Social Action<\/h3>\n<p>A faction may take ONE Social Action per turn. This represents diplomatic bandwidth.<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Action<\/th><th>Effect<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Action\"><strong>Communiqué<\/strong><\/td><td data-label=\"Effect\">Send one message to another Major Faction. They may respond immediately but only once. Requires both Factions to have a presence in the same system (fleet or planet — any combination). Extended conversations require multiple cycles.<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>Diplomacy between Major Factions<\/h4>\n<p><strong>Diplomacy between Major Factions:<\/strong> Temporary cease-fires or non-aggression pacts with other Major Factions outside your alignment are possible through the Communiqué action, but these are inherently unstable. Conflicting alignments will inevitably come to blows — such arrangements should be treated as temporary strategic convenience, not true alliance.<\/p>\n<h2>Combat and capture<\/h2>\n<p><strong>Ground Assault:<\/strong> available even with hostile fleets present. Only committed fleets contribute. Apply Orbital Cannons to the largest attacker before strength and Manpower commitment. A legal assault needs at least 5 ground Strength after projected cannon damage. Commit floor(participating ground Strength / 5) Manpower. Pay world-tier Supply, or Siege&#x27;s reduced cost, plus any Dread surcharge. Check affordability for the whole expenditure, not each component in isolation. Ground Strength includes Carrier/Assault Boats; flat Bay/Platform damage does not increase attacker commitment. There is no naval initiation loss for a Ground Assault.<\/p>\n<p>A Mobile Capital can be targeted by Ground Assault like a Capital, but is destroyed at zero rather than captured. It cannot be uncontested-bombarded while alive. Orbital Cannons also fire against bombardment; Dread is assessed before cannons, while ordinary attack Strength and costs use the surviving group. Attached projects lose Integrity only for actual host damage, capped at the host&#x27;s remaining defence, not overkill.<\/p>\n<p>If cannons destroy the entire attacking group on approach, cancel the assault before ordinary Supply and Manpower commitment; spent actions and the earlier Dread charge remain spent. No ground battle or capture occurs. This failed approach is not an exception allowing a surviving group below 5 ground Strength to launch a ground battle.<\/p>\n<p>Successful damage = floor(ground strength/5)+1, plus applicable trait/construction damage, after mitigation. Ordinary defeat causes no ground damage; Siege causes 1. Capture at 0 resets the holding to 1 defence. The attacker normally recovers floor(60% committed Manpower) on victory. Best participating Troop Transport adds 2 returned Manpower, 4 upgraded, capped at commitment; transports do not stack. This is the accepted replacement for historical 70%/80% transport wording.<\/p>\n<p>For the attacking side use committed ground Strength; for the defending side use eligible in-system defending fleets&#x27; combat Strength, not the holding&#x27;s defence and not ground-only Carrier/Assault Boats bonuses. AI ground totals use d20 + the applicable side&#x27;s strength + floor(Supply/5) + floor(Manpower/5), using post-commitment resources. Defended gives defender+4 unless Siege; Ambush+4 to defender; Intel+4 to attacker; Bunker+4/+8; Isolated Defence−8. Ties favour the defender. AI defenders commit floor(incoming damage/2) Manpower and normal tier Supply limited to available stock; winning defenders recover 60% committed Manpower and 80% committed Supply, rounded down. In a human-resolved engagement, defensive commitment is full incoming potential damage and winning defensive Manpower recovery is 80%. Incoming potential damage includes breakthrough and flat damage bonuses before mitigation, not just points actually removed from the host. Militia removes defensive commitment/isolation. Forced Conscription draws the required defence from other fully defended owned donor holdings, leaving at least 1 each; these need not be in the attacked system. It substitutes for the commitment, not for resources in a deficit pool. Without affordable commitment or adequate conscription, the defence is Isolated. A losing attacker against an Isolated defence retains the inherited exception: floor(60% commitment) plus 1/2 for the best base/upgraded Transport, capped at commitment; no Siege victory bonus and no such recovery if raiders win.<\/p>\n<p><strong>Uncontested Bombardment:<\/strong> no hostile fleet presence, 0 ordinary Manpower (Dread still charges both resources), damage max(1, floor(participating combat Strength/5)); Supply cost 2×tier+that damage, plus Dread. Mitigation applies and defence cannot fall below 1. No capture or battle roll. A surviving Mobile Capital is itself defending fleet presence and prevents uncontested bombardment.<\/p>\n<p><strong>Fleet Battle:<\/strong> one initiation Strength point from one participating asset with more than 1 Strength. This expenditure does not damage attached constructions. Escort adds 3/6 to its side; defending system Defence Platforms add 5/10. Each side rolls 2d6 plus applicable strength/modifiers; a positive margin inflicts ceil(margin/3) damage on every participating losing fleet, without a damage cap. Ties inflict no combat damage; costs/actions remain spent. Destruction and attached construction damage apply normally. There is one Fleet Battle per initiating faction/system/turn; a guarded Structure Assault uses that allowance.<\/p>\n<p><strong>Structure Assault:<\/strong> target one construction. If guarded, use Fleet Battle resolution, but an attacking win damages the construction only; attacker defeat damages participating attackers normally. An unguarded target costs 2 Supply plus Dread, no ordinary Manpower commitment, and suffers max(1, floor(combat Strength/5)) Integrity damage. There is no general Integrity floor. Completed permanent Assault Cruiser/Flagship capacity is the explicit exception: its granted portion remains until the fleet dies; unfinished upgrade progress can still be damaged. Movement/attack/withdrawal require separate actions unless an ability combines them.<\/p>\n<p><strong>Planet Fall:<\/strong> captured non-Capital holdings impose 2 Supply/2 Manpower; Capitals 4/4. Replace ordinary defensive Supply loss, and add the applicable defensive Manpower loss. Fleet damage equals the final assault&#x27;s resolved damage, including overkill beyond the holding&#x27;s remaining defence. Apply it to the defeated owner&#x27;s eligible fleets in that system. Allocate it point by point to the currently strongest eligible fleet, logging seeded/random tie choices automatically. Do not stop for a separate player allocation message. Destroy fleets with no remaining planet, station or Mobile Capital fallback. Minor factions do not lose Major resource pools. Destruction of a Major faction&#x27;s fleet, including a Mobile Capital, also costs 1 Manpower; apply existing deficit locks normally.<\/p>\n<h2>Capital replacement and deficits<\/h2>\n<p>Every owned planet or station can become the replacement Capital when the functioning Capital is lost. Establish New Capital is free, takes priority over rationing and doubles current/maximum defence toward 12. Completion requires actual 12/12; only then grant Capital tier/income and the built-in yard. Being attacked may delay completion. No holding or surviving Mobile Capital means elimination, not an endless Capital-recovery loop. A destroyed Mobile Capital permanently loses its trait and incurs 4 Supply / 4 Manpower loss plus the fleet-destruction 1 Manpower. It does not apply ordinary Planet Fall collateral damage to other fleets. Owned planets or stations still allow replacement Capital establishment. Lock the chosen provisional holding until it is lost; establishment doubles current and maximum defence, each capped at 12, without granting Capital income or the yard early.<\/p>\n<p>Each resource has its own deficit track. Involuntary depletion to 0 locks that resource at 0, ignoring its income and further resource penalties while the other resource behaves normally. Entry removes 1 Strength from each surviving fleet once for that resource: Supply can destroy fleets; Manpower degradation leaves surviving fleets at least 1. Resolve simultaneous Supply first. Direct combat/construction damage remains effective.<\/p>\n<p>Emergency Rationing takes a chosen Faction Action: three actions on a track restore exactly 10 total. Overlapping tracks require separate actions and the faction chooses which to advance; elapsed Cycles do not advance them. Other affordable actions remain available subject to Capital replacement priority, and ordinary Reinforce/Muster cannot bypass the corresponding deficit. Ignore income lost during the lock rather than banking it.<\/p>\n<h2>Minor factions and systems<\/h2>\n<p>Ordinary Minor starting Fleet Strength = ceil(sum of maximum defence of owned holdings in the system/2), distributed into fleets up to 5. Prize factions use the unhalved sum. Maximum defence determines the initial fleet allocation; losing a holding does not rebuild the allocation. Apply normal Planet Fall fleet losses.<\/p>\n<p>Each Minor&#x27;s Supply and Manpower are separately 5 × sum(owned holding tiers), doubled for prize factions. These are shared derived values, not per-planet pools or persistent Major stockpiles. Defence damage alone does not reduce them. Minors take no turns, cannot build replacements, and lose no Major-style resource penalties. At Cycle end, each unattacked Minor holding recovers 1 defence, capped at maximum. An unengaged Minor faction restores 1 total Strength to an eligible surviving damaged fleet. Major holdings have no free ordinary recovery; they need Defend or an applicable construction.<\/p>\n<h2>Construction costs, Integrity and capacity<\/h2>\n<p>One Construction action begins/advances one project or repairs a completed construction. Minor stages normally cost 3 Supply, Major stages 5, with the catalogue exceptions below. Grand Orbital Shipyard is now Minor (3 stages). Troop Transport, Repair Tender, Militia Barracks and Void Shield Generator cost 2 Supply per stage. System Defence Station, System Repair Station, Salvage Wing, Storm Transit, Consolidation Works and Void Station cost 3 per stage. Minor base/upgrade each require 3 stages; Major each 5. Industrial costs and starting Integrity apply as listed. Full host defence/strength is required to Build, Upgrade or Repair; system-based constructions require an owned holding or living fleet providing presence in their system, but have no host defence prerequisite.<\/p>\n<p>Repair restores up to 3 Integrity at 1 Supply each, no Manpower. It cannot finish unfinished construction/upgrades. A separate Faction-action Defend may repair a completed damaged construction at a full host: Minor costs 1 Supply / 1 Manpower and restores 1 Integrity; Major costs 3 of each and restores 3. Fortification Experts does not alter this construction action. Repair never completes unfinished Build/Upgrade work.<\/p>\n<p>Every point of actual host damage removes 1 Integrity from every attached project. Initiation/resource expenditure is not damage. At 0, construction is destroyed regardless of source. Minor 3/Major 5, upgraded 6/10 maximum Integrity. Ordinary planetary/system constructions operate at full applicable Integrity; an upgrade retains its completed base effect while Integrity remains at least the base maximum. Newly unfinished projects give no effect.<\/p>\n<p><strong>Persistent planetary exceptions:<\/strong> once completed, Automated Defences, Regenerative Fortifications, Landing Zones, Militia Barracks, Void Shield Generator and Fortification Network retain their base effect at positive Integrity. Full upgraded Integrity is required for improved effects, except already granted Fortification Network capacity persists until destruction. Its completion adds 2 current and maximum defence, or 4 total after upgrade; repair never grants that capacity again. At destruction remove the granted maximum and cap current defence accordingly.<\/p>\n<p>Completed <strong>Fleet-category<\/strong> constructions retain base effects at any positive Integrity; upgraded effects require full upgraded Integrity. Their base remains during upgrading. This category exception does not turn a planetary Forge aboard a Mobile Capital into a Fleet construction, or protect an unfinished Void Station as one. Completed Assault Cruiser/Flagship capacity remains until the fleet is destroyed. Repair never grants unrelated lost Fleet Strength.<\/p>\n<p>One ordinary construction slot per holding, with its established Capital&#x27;s built-in yard free and outside the slot. Consolidation is a holding development, not a permanent occupied building slot. Apply the existing shipyard/Grand Yard prerequisite chain. No new fleet/system construction cap; normal unique-profile rules and transferred fleet constructions remain. Multiple projects may exist but only one Construction action is available.<\/p>\n<p>Capture applies host/construction damage first. Surviving planetary constructions transfer with remaining Integrity/progress. System constructions transfer only when one faction controls all planets and has Void Superiority: Minor transfers, Major destroyed. Completed Void Stations are holdings and use ordinary capture; an unfinished station remains attached to its construction fleet.<\/p>\n<h3>Construction catalogue<\/h3>\n<p>Costs below are per action, not total project prices. Action counts assume undamaged progress and normal starting Integrity; Industrial starts new projects at 2. An upgrade adds another base-sized block to maximum Integrity and normally takes the same number of Build actions as the base. “No upgrade” means no separate upgraded profile. A destroyed project must be rebuilt.<\/p>\n<p><strong>Planetary/Orbital Constructions<\/strong> — Built on a specific planet, station or eligible Mobile Capital. Affects that planet or system.<\/p>\n<p>*Minor (3 actions base, 3 actions upgrade, capturable)*<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Construction<\/th><th>Supply per Build/Upgrade action: normal / Industrial<\/th><th>Base Effect<\/th><th>Upgraded Effect<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Construction\">[Orbital Shipyard]<\/td><td data-label=\"Supply per Build/Upgrade action: normal / Industrial\">3 / 1<\/td><td data-label=\"Base Effect\">Allows fleet creation and ordinary expansion here; Create normally starts 1/5<\/td><td data-label=\"Upgraded Effect\">No upgrade; prerequisite for Grand Orbital Shipyard<\/td><\/tr><tr><td data-label=\"Construction\">[Grand Orbital Shipyard]<\/td><td data-label=\"Supply per Build/Upgrade action: normal / Industrial\">3 / 1<\/td><td data-label=\"Base Effect\">Minor, 3 stages: Create at 3/5; requires a shipyard, including a built-in Capital yard<\/td><td data-label=\"Upgraded Effect\">Create at 5/5; best starting-Strength effect applies, not an additive stack<\/td><\/tr><tr><td data-label=\"Construction\">[Supply Depot]<\/td><td data-label=\"Supply per Build/Upgrade action: normal / Industrial\">3 / 1<\/td><td data-label=\"Base Effect\">+3 Supply per Logistics Cycle<\/td><td data-label=\"Upgraded Effect\">+6 Supply per Logistics Cycle<\/td><\/tr><tr><td data-label=\"Construction\">[Training Grounds]<\/td><td data-label=\"Supply per Build/Upgrade action: normal / Industrial\">3 / 1<\/td><td data-label=\"Base Effect\">+3 Manpower per Logistics Cycle<\/td><td data-label=\"Upgraded Effect\">+6 Manpower per Logistics Cycle<\/td><\/tr><tr><td data-label=\"Construction\">[Automated Defences]<\/td><td data-label=\"Supply per Build/Upgrade action: normal / Industrial\">3 / 1<\/td><td data-label=\"Base Effect\">+1 defence regen/cycle if not attacked<\/td><td data-label=\"Upgraded Effect\">+2 defence regen/cycle if not attacked<\/td><\/tr><tr><td data-label=\"Construction\">[Bunker Network]<\/td><td data-label=\"Supply per Build/Upgrade action: normal / Industrial\">3 / 1<\/td><td data-label=\"Base Effect\">+4 defender roll (AI) / -1 Difficulty (Player)<\/td><td data-label=\"Upgraded Effect\">+8 defender roll (AI) / -2 Difficulty (Player)<\/td><\/tr><tr><td data-label=\"Construction\">[Landing Zones]<\/td><td data-label=\"Supply per Build/Upgrade action: normal / Industrial\">3 / 1<\/td><td data-label=\"Base Effect\">Minor: Garrison Transfers to this holding may use damaged donors; donors retain 1.<\/td><td data-label=\"Upgraded Effect\">No upgrade<\/td><\/tr><tr><td data-label=\"Construction\">[Orbital Cannons]<\/td><td data-label=\"Supply per Build/Upgrade action: normal / Industrial\">3 / 1<\/td><td data-label=\"Base Effect\">-1 Fleet Strength to largest hostile fleet when attacked<\/td><td data-label=\"Upgraded Effect\">-2 Fleet Strength to largest hostile fleet when attacked<\/td><\/tr><\/tbody><\/table><\/div>\n<p>*Major (5 actions base, 5 actions upgrade; surviving planetary constructions transfer on capture)*<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Construction<\/th><th>Supply per Build/Upgrade action: normal / Industrial<\/th><th>Base Effect<\/th><th>Upgraded Effect<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Construction\">[Forge Complex]<\/td><td data-label=\"Supply per Build/Upgrade action: normal / Industrial\">5 / 2<\/td><td data-label=\"Base Effect\">+7 Supply per Logistics Cycle<\/td><td data-label=\"Upgraded Effect\">+14 Supply per Logistics Cycle<\/td><\/tr><tr><td data-label=\"Construction\">[Military Academy]<\/td><td data-label=\"Supply per Build/Upgrade action: normal / Industrial\">5 / 2<\/td><td data-label=\"Base Effect\">+7 Manpower per Logistics Cycle<\/td><td data-label=\"Upgraded Effect\">+14 Manpower per Logistics Cycle<\/td><\/tr><tr><td data-label=\"Construction\">[Regenerative Fortifications]<\/td><td data-label=\"Supply per Build/Upgrade action: normal / Industrial\">5 / 2<\/td><td data-label=\"Base Effect\">+3 defence regen/cycle if not attacked<\/td><td data-label=\"Upgraded Effect\">+6 defence regen/cycle if not attacked<\/td><\/tr><tr><td data-label=\"Construction\">[Void Shield Generator]<\/td><td data-label=\"Supply per Build/Upgrade action: normal / Industrial\">2 / 1<\/td><td data-label=\"Base Effect\">-1 incoming attack damage (can reduce to 0)<\/td><td data-label=\"Upgraded Effect\">-2 incoming attack damage (can reduce to 0)<\/td><\/tr><tr><td data-label=\"Construction\">[Fortification Network]<\/td><td data-label=\"Supply per Build/Upgrade action: normal / Industrial\">5 / 2<\/td><td data-label=\"Base Effect\">+2 to planet&#x27;s maximum defence<\/td><td data-label=\"Upgraded Effect\">+4 to planet&#x27;s maximum defence<\/td><\/tr><tr><td data-label=\"Construction\">[Militia Barracks]<\/td><td data-label=\"Supply per Build/Upgrade action: normal / Industrial\">2 / 1<\/td><td data-label=\"Base Effect\">No defensive Manpower commitment or isolation; holding Defend costs no Manpower<\/td><td data-label=\"Upgraded Effect\">No upgrade<\/td><\/tr><tr><td data-label=\"Construction\">[Planetary Shield Network]<\/td><td data-label=\"Supply per Build/Upgrade action: normal / Industrial\">5 / 2<\/td><td data-label=\"Base Effect\">Invulnerable with Void Superiority / Defended status without<\/td><td data-label=\"Upgraded Effect\">No upgrade<\/td><\/tr><tr><td data-label=\"Construction\">[Consolidation Works]<\/td><td data-label=\"Supply per Build/Upgrade action: normal / Industrial\">3 / 1<\/td><td data-label=\"Base Effect\">Upgrade planet type by one tier: Minor (2/2) → Standard (4/4) → Major (8/8). Current and maximum defence double. <strong>Repeatable<\/strong> until Major. Cannot upgrade to Capital — only one Capital per faction.<\/td><td data-label=\"Upgraded Effect\">N/A (repeatable construction, not upgradeable)<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>Void Constructions (Fleet-Attached)<\/h4>\n<p><strong>Void Constructions (Fleet-Attached)<\/strong> — Mobile, destroyed if fleet is destroyed.<\/p>\n<p>*Minor (3 actions base, 3 actions upgrade)*<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Construction<\/th><th>Supply per Build/Upgrade action: normal / Industrial<\/th><th>Base Effect<\/th><th>Upgraded Effect<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Construction\">[Troop Transport]<\/td><td data-label=\"Supply per Build/Upgrade action: normal / Industrial\">2 / 1<\/td><td data-label=\"Base Effect\">Victory return +2 committed Manpower<\/td><td data-label=\"Upgraded Effect\">Victory return +4 committed Manpower; best transport only, cap at commitment<\/td><\/tr><tr><td data-label=\"Construction\">[Repair Tender]<\/td><td data-label=\"Supply per Build/Upgrade action: normal / Industrial\">2 / 1<\/td><td data-label=\"Base Effect\">+1 to its surviving host fleet each Cycle, even after combat<\/td><td data-label=\"Upgraded Effect\">+2 to its surviving host fleet each Cycle<\/td><\/tr><tr><td data-label=\"Construction\">[Escort Squadron]<\/td><td data-label=\"Supply per Build/Upgrade action: normal / Industrial\">3 / 1<\/td><td data-label=\"Base Effect\">+3 to Fleet Battle roll<\/td><td data-label=\"Upgraded Effect\">+6 to Fleet Battle roll<\/td><\/tr><tr><td data-label=\"Construction\">[Assault Boats]<\/td><td data-label=\"Supply per Build/Upgrade action: normal / Industrial\">3 / 1<\/td><td data-label=\"Base Effect\">+2 fleet strength for ground assaults<\/td><td data-label=\"Upgraded Effect\">+4 fleet strength for ground assaults<\/td><\/tr><tr><td data-label=\"Construction\">[Bombardment Bay]<\/td><td data-label=\"Supply per Build/Upgrade action: normal / Industrial\">3 / 1<\/td><td data-label=\"Base Effect\">+1 ground assault damage<\/td><td data-label=\"Upgraded Effect\">+2 ground assault damage<\/td><\/tr><tr><td data-label=\"Construction\">[Assault Cruiser]<\/td><td data-label=\"Supply per Build/Upgrade action: normal / Industrial\">3 / 1<\/td><td data-label=\"Base Effect\">+2/2 fleet strength (tracked separately)<\/td><td data-label=\"Upgraded Effect\">+4/4 fleet strength (tracked separately)<\/td><\/tr><\/tbody><\/table><\/div>\n<p>*Major (5 actions base, 5 actions upgrade)*<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Construction<\/th><th>Supply per Build/Upgrade action: normal / Industrial<\/th><th>Base Effect<\/th><th>Upgraded Effect<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Construction\">[Flagship]<\/td><td data-label=\"Supply per Build/Upgrade action: normal / Industrial\">5 / 2<\/td><td data-label=\"Base Effect\">+5 permanent strength/capacity<\/td><td data-label=\"Upgraded Effect\">+10 total permanent strength/capacity; add to existing capacity<\/td><\/tr><tr><td data-label=\"Construction\">[Carrier]<\/td><td data-label=\"Supply per Build/Upgrade action: normal / Industrial\">5 / 2<\/td><td data-label=\"Base Effect\">+10 strength for ground assaults<\/td><td data-label=\"Upgraded Effect\">+20 strength for ground assaults<\/td><\/tr><tr><td data-label=\"Construction\">[Siege Platform]<\/td><td data-label=\"Supply per Build/Upgrade action: normal / Industrial\">5 / 2<\/td><td data-label=\"Base Effect\">+3 ground assault damage<\/td><td data-label=\"Upgraded Effect\">+6 ground assault damage<\/td><\/tr><tr><td data-label=\"Construction\">[Salvage Wing]<\/td><td data-label=\"Supply per Build/Upgrade action: normal / Industrial\">3 / 1<\/td><td data-label=\"Base Effect\">+3 Supply per equipped victorious fleet in a Fleet Battle or attacking Ground Assault<\/td><td data-label=\"Upgraded Effect\">+6; not a bombardment or Structure Assault reward<\/td><\/tr><tr><td data-label=\"Construction\">[Scout Squadron]<\/td><td data-label=\"Supply per Build/Upgrade action: normal / Industrial\">5 / 2<\/td><td data-label=\"Base Effect\">This fleet may Move and Ground Assault or Uncontested Bombardment with the same Fleet Action. Resolve movement first; eligible allies already at the destination may join, spending their own actions.<\/td><td data-label=\"Upgraded Effect\">No upgrade<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>Void Constructions (System-Based)<\/h4>\n<p><strong>Void Constructions (System-Based)<\/strong> — Stationary. Use the distinct system-control capture rule above.<\/p>\n<p>*Minor (3 actions base, 3 actions upgrade)*<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Construction<\/th><th>Supply per Build/Upgrade action: normal / Industrial<\/th><th>Base Effect<\/th><th>Upgraded Effect<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Construction\">[Defence Platform]<\/td><td data-label=\"Supply per Build/Upgrade action: normal / Industrial\">3 / 1<\/td><td data-label=\"Base Effect\">+5 to defender roll in Fleet Battles<\/td><td data-label=\"Upgraded Effect\">+10 to defender roll in Fleet Battles<\/td><\/tr><\/tbody><\/table><\/div>\n<p>*Major (5 actions base, 5 actions upgrade)*<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Construction<\/th><th>Supply per Build/Upgrade action: normal / Industrial<\/th><th>Base Effect<\/th><th>Upgraded Effect<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Construction\">[System Defence Station]<\/td><td data-label=\"Supply per Build/Upgrade action: normal / Industrial\">3 / 1<\/td><td data-label=\"Base Effect\">-1 strength to every hostile fleet in system each Cycle<\/td><td data-label=\"Upgraded Effect\">-2 to every hostile fleet<\/td><\/tr><tr><td data-label=\"Construction\">[System Repair Station]<\/td><td data-label=\"Supply per Build/Upgrade action: normal / Industrial\">3 / 1<\/td><td data-label=\"Base Effect\">+1 strength to every eligible allied fleet in system each Cycle<\/td><td data-label=\"Upgraded Effect\">+2 to every eligible allied fleet<\/td><\/tr><tr><td data-label=\"Construction\">[Logistics Anchorage]<\/td><td data-label=\"Supply per Build/Upgrade action: normal / Industrial\">5 / 2<\/td><td data-label=\"Base Effect\">+1 defence regen to unattacked planets/cycle<\/td><td data-label=\"Upgraded Effect\">+2 defence regen to unattacked planets/cycle<\/td><\/tr><tr><td data-label=\"Construction\">[Void Station]<\/td><td data-label=\"Supply per Build/Upgrade action: normal / Industrial\">3 / 1<\/td><td data-label=\"Base Effect\">2/2 station, functions as Minor planet<\/td><td data-label=\"Upgraded Effect\">Upgrade via Consolidation Works: Minor (2/2) → Standard (4/4) → Major (8/8). Eligible for Establish New Capital when the faction has no functioning Capital.<\/td><\/tr><tr><td data-label=\"Construction\">[Storm Transit]<\/td><td data-label=\"Supply per Build/Upgrade action: normal / Industrial\">3 / 1<\/td><td data-label=\"Base Effect\">Major, 5 stages, no upgrade: protect eligible allied fleets in this system from storm damage and permit their departure during a Warp Storm.<\/td><td data-label=\"Upgraded Effect\">No upgrade<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Player battle setup and overflow<\/h2>\n<p>Use the existing Supply difficulty brackets below; the global difficulty effect on allied AI is explicitly deferred. Formation pools use the current Manpower bands and participating ground strength. Do not compress a large battle by deleting formations.<\/p>\n<h3>Difficulty (Based on YOUR Supply)<\/h3>\n<p>Supply represents logistics capacity: materiel, munitions, fuel, food, replacement parts, and everything needed to sustain military operations. <strong>In human Soulstorm setup, Supply determines difficulty — how well-equipped your forces are.<\/strong><\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Supply<\/th><th>Base Difficulty<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Supply\">0-20 Critical<\/td><td data-label=\"Base Difficulty\">Insane 5/5<\/td><\/tr><tr><td data-label=\"Supply\">21-40 Rationed<\/td><td data-label=\"Base Difficulty\">Harder 4/5<\/td><\/tr><tr><td data-label=\"Supply\">41-60 Sustainable<\/td><td data-label=\"Base Difficulty\">Hard 3/5<\/td><\/tr><tr><td data-label=\"Supply\">61-80 Surplus<\/td><td data-label=\"Base Difficulty\">Standard 2/5<\/td><\/tr><tr><td data-label=\"Supply\">81-100 Abundant<\/td><td data-label=\"Base Difficulty\">Easy 1/5<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Difficulty (Based on ENEMY Supply)<\/h3>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Enemy Supply<\/th><th>Modifier<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Enemy Supply\">0-20 Critical<\/td><td data-label=\"Modifier\">-2 Difficulty<\/td><\/tr><tr><td data-label=\"Enemy Supply\">21-40 Rationed<\/td><td data-label=\"Modifier\">-1 Difficulty<\/td><\/tr><tr><td data-label=\"Enemy Supply\">41-60 Sustainable<\/td><td data-label=\"Modifier\">—<\/td><\/tr><tr><td data-label=\"Enemy Supply\">61-80 Surplus<\/td><td data-label=\"Modifier\">+1 Difficulty<\/td><\/tr><tr><td data-label=\"Enemy Supply\">81-100 Abundant<\/td><td data-label=\"Modifier\">+2 Difficulty<\/td><\/tr><\/tbody><\/table><\/div>\n<p>For either side: formations = max(1, 1+floor(participating ground strength/5)+Manpower-band index−2), where band indices 0–4 correspond to 0–20, 21–40, 41–60, 61–80, 81+. Use attacking ground Strength, but ordinary defending combat Strength on the defending side; use post-commitment Manpower. Use committed assets only; distinct allies need actual participating fleets and consent. Otherwise duplicate the controlling faction.<\/p>\n<p>Deploy up to 4 per side. With a live raider, deploy at most 3 per main side plus the single raider. Keep overflow in reserve. After each reported round, remove defeated formations and destroyed winning formations; surviving winners may fight again and refill from reserves. There is no free replacement principal team. Once defeated the raider never returns; limits revert to 4 per side. Campaign costs/actions and outcome resolve once for the engagement, not per round.<\/p>\n<p>Manpower bands are Critical, Rationed, Sustainable, Surplus and Abundant in the same 0–20 / 21–40 / 41–60 / 61–80 / 81–100 intervals.<\/p>\n<p>Map capacity is at least twice the largest deployed side and at least total deployed participants, up to 8. Choose a larger available thematic map where needed; leave spare slots closed, not filled with unearned formations. Report winning survivors, not just a win. AI campaign rolls do not simulate these human outcomes.<\/p>\n<h2>Events and alignment transit<\/h2>\n<p>At the event step of Phase 0, roll d6; on 1 or 6 roll once on the event table. Other opening checks mean no event. Effects last the current Cycle. Keep the established single raider identity.<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>d6<\/th><th>Event<\/th><th>Effect<\/th><\/tr><\/thead><tbody><tr><td data-label=\"d6\">1<\/td><td data-label=\"Event\"><strong>Warp Storm<\/strong><\/td><td data-label=\"Effect\">All living fleets, including Mobile Capitals, lose 1 Strength and ordinary movement is blocked this Cycle. Active Storm Transit protects eligible allied fleets in its system and permits departure. Storm damage also damages attached Integrity.<\/td><\/tr><tr><td data-label=\"d6\">2<\/td><td data-label=\"Event\"><strong>Ambush!<\/strong><\/td><td data-label=\"Effect\">Attackers this Cycle get +1 difficulty. Defenders get -1 difficulty. AI vs AI: Defender +4 to roll.<\/td><\/tr><tr><td data-label=\"d6\">3<\/td><td data-label=\"Event\"><strong>Supply Crisis<\/strong><\/td><td data-label=\"Effect\">All Factions: -5 Supply and -5 Manpower.<\/td><\/tr><tr><td data-label=\"d6\">4<\/td><td data-label=\"Event\"><strong>War Fervor<\/strong><\/td><td data-label=\"Effect\">All Factions: +5 Supply and +5 Manpower.<\/td><\/tr><tr><td data-label=\"d6\">5<\/td><td data-label=\"Event\"><strong>Third Party Raid<\/strong><\/td><td data-label=\"Effect\">If a ground battle occurs, add the fixed campaign raiding faction. Raiders are an additional hostile team and cannot capture territory or establish holdings, regardless of world tier or battle result. Survivors withdraw after the raid. If raiders win on a Major/Capital, retain the existing defence-halving effect (rounded down), but no territorial transfer to raiders. On Minor/Standard worlds, remove the former capture effect; normal applicable battle effects and traits still resolve. Do not invent additional loot or resource penalties.<\/td><\/tr><tr><td data-label=\"d6\">6<\/td><td data-label=\"Event\"><strong>Intel Breakthrough<\/strong><\/td><td data-label=\"Effect\">You choose: -1 difficulty this battle OR +1 damage dealt on a successful attack. AI vs AI: Attacker +4 to roll.<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<p>The provisional AI raider total is d20 + 13 (the fixed reference of 5 Strength, 20 Supply and 20 Manpower); these are resolution constants, not a spendable faction economy. The highest unique total wins; a tie favours the defender. Raiders cannot capture. On their Major/Capital victory, provisional damage is the larger of applicable Siege defeat damage and current defence minus floor(current defence / 2). Cap this at current defence minus 1, then apply shields and other mitigation. Thus an unshielded holding at 7 defence falls to 3, not to 4; shields can reduce that loss. Minor/Standard holdings receive only applicable defeat damage, also unable to fall below 1 when raiders win. Player raiders follow the reported formation-series result.<\/p>\n<p>Human difficulty modifiers: apply enemy Supply band index minus 2; Defended shifts one step in favour of the defender unless Siege ignores it; Bunker shifts 1/2 steps; Ambush shifts one in favour of the defender; Intel gives the attacker a choice of one easier step or +1 successful damage. An Isolated human defender suffers +2 difficulty. Clamp the final result to 1–5. Changing global difficulty also affects allied AI; that unresolved Soulstorm limitation has not been removed by these campaign rules.<\/p>\n<p>Transit names are faction-themed implementations of equal mechanics; speculative engineering is campaign lore, not a claim of canon.<\/p>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>Alignment<\/th><th>Implementation<\/th><th>Rationale<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Alignment\">Imperium<\/td><td data-label=\"Implementation\"><strong>Noctilith Transit Array:<\/strong> a Mechanicus-supported installation suppresses the local disruption and maintains a narrow departure corridor.<\/td><td data-label=\"Rationale\">Based on Cawl&#x27;s work modulating Warp energies with blackstone. The corridor application is our campaign extrapolation, not an ordinary Geller field upgrade or a claim every Imperial fleet already has it.<\/td><\/tr><tr><td data-label=\"Alignment\">Chaos<\/td><td data-label=\"Implementation\"><strong>Bound Passage Gate:<\/strong> a ritual complex and bound guides force a prepared channel through the local storm.<\/td><td data-label=\"Rationale\">Sorcerer-guided travel provides the precedent. Chaos affiliation alone grants no immunity. Khorne-aligned forces can use a daemon-engine/forged portal maintained by allied Dark Mechanicum rather than requiring their own sorcerer commander.<\/td><\/tr><tr><td data-label=\"Alignment\">Aeldari<\/td><td data-label=\"Implementation\"><strong>Webway Anchorage:<\/strong> a fleet-capable webway entrance with shelter and charted exits serving this Subsector.<\/td><td data-label=\"Rationale\">Spacecraft require a sufficiently large arterial route; an infantry webway portal is not enough. This does not declare the entire damaged webway universally safe.<\/td><\/tr><tr><td data-label=\"Alignment\">Drukhari<\/td><td data-label=\"Implementation\"><strong>Webway Breach Anchorage:<\/strong> a maintained fleet-scale passage and secured staging pocket.<\/td><td data-label=\"Rationale\">The same transit medium, with Drukhari engineering and control; not a personal portal magically transporting a fleet.<\/td><\/tr><tr><td data-label=\"Alignment\">Necron<\/td><td data-label=\"Implementation\"><strong>Dolmen Transit Complex:<\/strong> a maintained fleet-access gate and local noctilith shielding.<\/td><td data-label=\"Rationale\">Dolmen Gates provide fleet transit access; blackstone supplies a plausible local protection mechanism.<\/td><\/tr><tr><td data-label=\"Alignment\">Ork<\/td><td data-label=\"Implementation\"><strong>Mega-Tellyporta Array:<\/strong> a Mek-built staging array flings the flotilla through a prepared passage.<\/td><td data-label=\"Rationale\">Official fleet-scale mega-tellyshokka precedent exists. Reliable operation against this campaign event is the house-rule abstraction, not a claim all tellyportas are safe.<\/td><\/tr><tr><td data-label=\"Alignment\">T&#x27;au<\/td><td data-label=\"Implementation\"><strong>Earth Caste Nexus Anchorage:<\/strong> containment, survey drones and fleet staging around a recovered dimensional conduit.<\/td><td data-label=\"Rationale\">Use an existing local anomaly/relic route, as T&#x27;au exploitation of the Startide Nexus demonstrates. Do not claim the T&#x27;au can mass-produce new Startide Nexuses. Discovering/reactivating this local asset is part of the paid project, not an extra random prerequisite unavailable to them.<\/td><\/tr><tr><td data-label=\"Alignment\">Tyranid<\/td><td data-label=\"Implementation\"><strong>Narvhal Brood Anchorage:<\/strong> dedicated gravitic guide organisms with a concentrated synaptic shelter maintain a compressed-space departure route.<\/td><td data-label=\"Rationale\">Narvhals already supply non-Warp interstellar travel. The enhanced shelter and reliable local-storm operation are the constructed benefit; do not describe Tyranids as lacking Narvhals until they build this.<\/td><\/tr><tr><td data-label=\"Alignment\">Independent<\/td><td data-label=\"Implementation\"><strong>Recovered Transit Anchorage:<\/strong> select a mechanism appropriate to that faction&#x27;s species and technology at setup; human pirates can use recovered noctilith/relic machinery.<\/td><td data-label=\"Rationale\">Independent is not a species. It grants one mechanically identical installation, not access to cumulative benefits from every alignment.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>d20 system profiles<\/h2>\n<div class=\"table-scroll\" tabindex=\"0\"><table><thead><tr><th>d20<\/th><th>Minor planets<\/th><th>Standard planets<\/th><th>Major planets<\/th><th>Station tiers<\/th><\/tr><\/thead><tbody><tr><td data-label=\"d20\">1<\/td><td data-label=\"Minor planets\">2<\/td><td data-label=\"Standard planets\">0<\/td><td data-label=\"Major planets\">0<\/td><td data-label=\"Station tiers\">None<\/td><\/tr><tr><td data-label=\"d20\">2<\/td><td data-label=\"Minor planets\">1<\/td><td data-label=\"Standard planets\">0<\/td><td data-label=\"Major planets\">0<\/td><td data-label=\"Station tiers\">1<\/td><\/tr><tr><td data-label=\"d20\">3<\/td><td data-label=\"Minor planets\">1<\/td><td data-label=\"Standard planets\">1<\/td><td data-label=\"Major planets\">0<\/td><td data-label=\"Station tiers\">None<\/td><\/tr><tr><td data-label=\"d20\">4<\/td><td data-label=\"Minor planets\">0<\/td><td data-label=\"Standard planets\">1<\/td><td data-label=\"Major planets\">0<\/td><td data-label=\"Station tiers\">1<\/td><\/tr><tr><td data-label=\"d20\">5<\/td><td data-label=\"Minor planets\">1<\/td><td data-label=\"Standard planets\">0<\/td><td data-label=\"Major planets\">1<\/td><td data-label=\"Station tiers\">None<\/td><\/tr><tr><td data-label=\"d20\">6<\/td><td data-label=\"Minor planets\">3<\/td><td data-label=\"Standard planets\">0<\/td><td data-label=\"Major planets\">0<\/td><td data-label=\"Station tiers\">None<\/td><\/tr><tr><td data-label=\"d20\">7<\/td><td data-label=\"Minor planets\">2<\/td><td data-label=\"Standard planets\">0<\/td><td data-label=\"Major planets\">0<\/td><td data-label=\"Station tiers\">1<\/td><\/tr><tr><td data-label=\"d20\">8<\/td><td data-label=\"Minor planets\">2<\/td><td data-label=\"Standard planets\">1<\/td><td data-label=\"Major planets\">0<\/td><td data-label=\"Station tiers\">None<\/td><\/tr><tr><td data-label=\"d20\">9<\/td><td data-label=\"Minor planets\">1<\/td><td data-label=\"Standard planets\">1<\/td><td data-label=\"Major planets\">0<\/td><td data-label=\"Station tiers\">1<\/td><\/tr><tr><td data-label=\"d20\">10<\/td><td data-label=\"Minor planets\">0<\/td><td data-label=\"Standard planets\">1<\/td><td data-label=\"Major planets\">0<\/td><td data-label=\"Station tiers\">1, 1<\/td><\/tr><tr><td data-label=\"d20\">11<\/td><td data-label=\"Minor planets\">1<\/td><td data-label=\"Standard planets\">2<\/td><td data-label=\"Major planets\">0<\/td><td data-label=\"Station tiers\">None<\/td><\/tr><tr><td data-label=\"d20\">12<\/td><td data-label=\"Minor planets\">0<\/td><td data-label=\"Standard planets\">2<\/td><td data-label=\"Major planets\">0<\/td><td data-label=\"Station tiers\">1<\/td><\/tr><tr><td data-label=\"d20\">13<\/td><td data-label=\"Minor planets\">2<\/td><td data-label=\"Standard planets\">0<\/td><td data-label=\"Major planets\">1<\/td><td data-label=\"Station tiers\">None<\/td><\/tr><tr><td data-label=\"d20\">14<\/td><td data-label=\"Minor planets\">1<\/td><td data-label=\"Standard planets\">0<\/td><td data-label=\"Major planets\">1<\/td><td data-label=\"Station tiers\">1<\/td><\/tr><tr><td data-label=\"d20\">15<\/td><td data-label=\"Minor planets\">1<\/td><td data-label=\"Standard planets\">1<\/td><td data-label=\"Major planets\">1<\/td><td data-label=\"Station tiers\">None<\/td><\/tr><tr><td data-label=\"d20\">16<\/td><td data-label=\"Minor planets\">3<\/td><td data-label=\"Standard planets\">1<\/td><td data-label=\"Major planets\">0<\/td><td data-label=\"Station tiers\">None<\/td><\/tr><tr><td data-label=\"d20\">17<\/td><td data-label=\"Minor planets\">2<\/td><td data-label=\"Standard planets\">1<\/td><td data-label=\"Major planets\">0<\/td><td data-label=\"Station tiers\">1<\/td><\/tr><tr><td data-label=\"d20\">18<\/td><td data-label=\"Minor planets\">2<\/td><td data-label=\"Standard planets\">2<\/td><td data-label=\"Major planets\">0<\/td><td data-label=\"Station tiers\">None<\/td><\/tr><tr><td data-label=\"d20\">19<\/td><td data-label=\"Minor planets\">1<\/td><td data-label=\"Standard planets\">1<\/td><td data-label=\"Major planets\">1<\/td><td data-label=\"Station tiers\">1<\/td><\/tr><tr><td data-label=\"d20\">20<\/td><td data-label=\"Minor planets\">1<\/td><td data-label=\"Standard planets\">1<\/td><td data-label=\"Major planets\">1<\/td><td data-label=\"Station tiers\">2<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Prize designation is a separate setup choice, not an extra ordinary-system holding.<\/p>", "revision": "5f9e49251d67"}</script><script>'use strict';
let data=JSON.parse(document.getElementById('campaign-data').textContent);
let view='overview', query='', selectedSystem=null, systemScroll=0;
const tabState={};
const main=document.getElementById('main');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function heading(k,title,sub=''){return `<p class="eyebrow">${k}</p><h1>${title}</h1>${sub?`<p class="subtitle">${sub}</p>`:''}`;}
function registerTable(title,columns,rows,empty){
 return `<section class="asset-register"><h4>${esc(title)} <span>${rows.length}</span></h4>${rows.length?`<table class="asset-table"><caption class="sr-only">${esc(title)}</caption><thead><tr>${columns.map(c=>`<th scope="col">${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map((cell,i)=>`<${i?'td':'th scope="row"'} data-label="${esc(columns[i])}">${esc(cell)}</${i?'td':'th'}>`).join('')}</tr>`).join('')}</tbody></table>`:`<p class="asset-empty">${esc(empty)}</p>`}</section>`;
}
function factionRegisters(f){
 const r=f.registers;
 if(!r)return '<p>Refresh to load the latest faction registers.</p>';
 return registerTable('Fleets',['Fleet','System','Strength'],r.fleets,'No conventional fleets.')+
 registerTable('Holdings',['Holding','System','Type','Defence','Income / facilities'],r.holdings,'No holdings.')+
 (r.holdings.some(h=>h[2].includes('Mobile Capital'))?'<p class="asset-note">Mobile Capital: built-in Orbital Shipyard · +4 Supply / +4 Manpower per Logistics · no fleet maintenance. See the system dossier for temporary effects.</p>':'')+
 registerTable('Constructions',['Project','Type / location','Progress','Effect / status'],r.constructions,'No construction projects.');
}
function render(){
 document.getElementById('header-cycle').textContent=String(data.cycle).padStart(2,'0');
 document.querySelectorAll('[data-view]').forEach(b=>{if(b.dataset.view===view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
 document.getElementById('revision').textContent=`Cycle ${data.cycle} · ${data.status.updated}`;
 if(view==='overview'){
 const nextLog=data.cycle+(3-data.cycle%3);
 main.innerHTML=heading('THE ATREUS CAMPAIGN','Command overview')+`<section class="cycle-banner" aria-label="Current cycle"><div class="cycle-number">${String(data.cycle).padStart(2,'0')}<small>CYCLE</small></div><div><p class="kicker">CAMPAIGN STATUS</p><h2>${esc(data.status.phase)}</h2><p>Next: ${esc(data.status.nextFaction)}</p></div><span class="pill">${data.cycle%3===0?'Logistics Cycle':'Next logistics · Cycle '+nextLog}</span></section><div class="section-head"><h2>Major factions</h2><span>Turn order · I → II → III</span></div><div class="factions">${data.factions.map((f,i)=>{
 const v=f.values,s=Number(v['Supplies (1-100)']),m=Number(v['Manpower (1-100)']);
 return `<article class="faction" style="--accent:var(${['--steel','--green','--red'][i]||'--gold'})"><div class="faction-overview">${f.portrait?`<a class="commander-art" href="${esc(f.portrait.full)}" aria-haspopup="dialog" aria-label="Expand artwork of ${esc(f.commander)}"><img src="${esc(f.portrait.src)}" alt="${esc(f.portrait.alt)}" width="480" height="600" loading="lazy" decoding="async"></a>`:''}<div class="faction-copy"><div class="faction-identity"><p class="kicker">${['I','II','III'][i]} / ${esc(f.alignment)}</p><h3>${esc(f.name)}</h3><p class="commander-name">${esc(f.commander)}</p></div><div class="faction-readiness"><p class="muted">${esc(f.trait)}<br>${esc(f.effect)}</p><div class="metrics">${[[s,'Supply'],[m,'Manpower']].map(([n,label])=>`<div class="metric"><strong>${esc(n)}</strong><span>${label} / 100</span><div class="meter"><i style="width:${Math.max(0,Math.min(100,n))}%"></i></div></div>`).join('')}</div></div></div></div><details class="faction-details"><summary>Fleets, holdings & constructions</summary>${factionRegisters(f)}</details></article>`;
 }).join('')}</div><div class="section-head"><h2>Cycle dispatch</h2><span>Official campaign record</span></div><div class="brief-grid"><section class="panel"><p class="kicker">EVENT REPORT</p><h2>${esc(data.status.event || 'Opening event not rolled')}</h2><p class="muted">${esc(data.status.notes)}</p></section><section class="panel"><p class="kicker">LOGISTICS SCHEDULE</p><p>Income and fleet maintenance every third Cycle.</p><div class="timeline">${Array.from({length:6},(_,i)=>{let n=data.cycle+i;return `<span class="${i===0?'current':n%3===0?'logistics':''}" title="Cycle ${n}${n%3===0?' · Logistics':''}">${n}</span>`;}).join('')}</div></section></div>`;
 }else if(view==='systems'){
 if(selectedSystem!==null){const s=data.systems[selectedSystem];main.innerHTML=`<button class="back" id="back">← All systems</button>`+heading('SYSTEM DOSSIER',esc(s.title.split(' System')[0]))+`<div class="article">${s.html}</div>`;document.getElementById('back').onclick=()=>{selectedSystem=null;render();window.scrollTo(0,systemScroll);};}
 else{main.innerHTML=heading('SUBSECTOR REGISTER','Systems & holdings',`${data.systems.length} systems · ${data.systems.reduce((n,s)=>n+s.worlds.length,0)} planetary and station holdings`)+`<div class="search-tools"><label for="search" class="sr-only">Search systems, worlds or controllers</label><input class="search" id="search" type="search" placeholder="Search systems, worlds, factions…" value="${esc(query)}" enterkeyhint="search" autocapitalize="none" spellcheck="false"></div><div id="results"></div>`;renderSystems();bindSearch(renderSystems);}
 }else if(view==='rules'){
 main.innerHTML=heading('FIELD MANUAL','Campaign rules','The campaign’s rules, preserved as written.')+`<div class="search-tools"><label for="search" class="sr-only">Search campaign rules</label><input id="search" class="search" type="search" placeholder="Search fleet actions, costs, events…" value="${esc(query)}" enterkeyhint="search" autocapitalize="none" spellcheck="false"></div><div id="results"></div>`;renderRules();bindSearch(renderRules);
 }else if(view==='cycles'){
 main.innerHTML=heading('ATREUS CHRONICLE','Cycle Records')+`<article class="article cycle-narratives">${data.narratives||'<p>No Cycle narratives recorded yet.</p>'}</article>`;
 }else{
 main.innerHTML=heading('CAMPAIGN ARCHIVE','Campaign record',`Cycle ${data.cycle} · ${esc(data.status.updated)}`)+`<div class="record-actions"><a href="./Atreus_Campaign.md" download>Download Markdown ↗</a><button id="full">Read complete document</button></div><div class="record-actions"><a href="./atreus.html">Briefings & campaign reference ↗</a></div><div class="panel"><p class="kicker">CURRENT POSITION</p><h2>${esc(data.status.phase)}</h2><p>${esc(data.status.notes)}</p></div><div class="section-head"><h2>Battle log</h2></div><div class="article">${data.log}</div>`;
 document.getElementById('full').onclick=()=>{main.innerHTML='<button class="back" id="back">← Campaign record</button><div class="article">'+data.document+'</div>';document.getElementById('back').onclick=render;};
 }
}
function bindSearch(fn){const input=document.getElementById('search');input.oninput=e=>{query=e.target.value;fn();};input.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();input.blur();}};}
function renderSystems(){
 const matches=data.systems.map((s,i)=>({...s,index:i})).filter(s=>(s.title+' '+s.text).toLowerCase().includes(query.toLowerCase()));
 document.getElementById('results').innerHTML=`<p class="count">${matches.length} systems</p><div class="system-grid">${matches.map(s=>`<article class="system-card"><p class="kicker">SYSTEM / ${String(s.index+1).padStart(2,'0')}</p><h2>${esc(s.title.split(' System')[0])}</h2><p class="muted">Void superiority: ${esc((s.void || s.text.match(/\*\*Void Superiority:\*\*\s*([^\r\n]+)/)?.[1]||'Calculate for acting faction'))}</p><div class="worlds">${s.worlds.map(w=>`<div class="world-row"><div><strong>${esc(w.Planet)}</strong><small>${esc(w.Controller)}</small></div><div><strong>${esc(w.Defense)}</strong><small>${esc(w.Type)}</small></div><p class="world-description">${esc(w.Notes)}<br><span>Map: ${esc(w.Map)}</span></p></div>`).join('')}</div><section class="system-fleets"><h3>Fleets in system</h3>${(s.fleets||[]).map(f=>`<div class="world-row"><div><strong>${esc(f[0])}</strong><small>${esc(f[1])}</small></div><div><strong>${esc(f[2])}</strong><small>Strength</small></div></div>`).join('')||'<p class="muted">No fleets present.</p>'}</section><button data-system="${s.index}">Open dossier ↗</button></article>`).join('')}</div>${matches.length?'':'<p class="empty">No matching systems. Try a planet or faction name.</p>'}`;
 document.querySelectorAll('[data-system]').forEach(b=>b.onclick=()=>{systemScroll=window.scrollY;selectedSystem=Number(b.dataset.system);render();window.scrollTo(0,0);});
}
function renderRules(){
 const matches=data.rules.filter(r=>(r.title+' '+r.text).toLowerCase().includes(query.toLowerCase()));
 document.getElementById('results').innerHTML=`<p class="count">${matches.length} rule entries${query?' match your search':''}</p>`+matches.map(r=>`<details class="rule"><summary>${esc(r.title)}</summary><div class="article">${r.html}</div></details>`).join('')+(matches.length?'':'<p class="empty">No matching rules. Try “Manpower”, “Defend” or “Fleet”.</p>');
}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{const target=b.dataset.view;if(target===view){window.scrollTo(0,0);return;}tabState[view]={query,selectedSystem,scroll:window.scrollY};view=target;const state=tabState[view]||{};query=state.query||'';selectedSystem=state.selectedSystem??null;render();window.scrollTo(0,state.scroll||0);});
let checking=false;
async function refresh(){
 if(checking||location.protocol==='file:')return;
 checking=true;const status=document.getElementById('connection');status.textContent='Checking campaign…';
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),8000);
 try{
  const res=await fetch('./campaign.json',{cache:'no-store',signal:controller.signal});if(!res.ok)throw Error('Unavailable');const next=await res.json();
  if(next.campaign!==data.campaign||!next.revision||!Array.isArray(next.systems)||!next.status)throw Error('Invalid campaign');
  if(next.revision!==data.revision){data=next;render();}
  status.textContent=res.headers.get('X-Campaign-Cache')==='offline'?'Connection unavailable · saved campaign':'Latest published campaign';
 }catch(e){status.textContent='Offline or unavailable · showing saved campaign';}
 finally{clearTimeout(timer);checking=false;}
}
document.getElementById('refresh').onclick=async()=>{await refresh();if('serviceWorker'in navigator){const reg=await navigator.serviceWorker.getRegistration();if(reg)await reg.update();}};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refresh();});
window.addEventListener('online',refresh);window.addEventListener('offline',()=>{document.getElementById('connection').textContent='Offline · showing saved campaign';});
if('serviceWorker'in navigator&&location.protocol!=='file:'){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
render();refresh();setInterval(()=>{if(document.visibilityState==='visible')refresh();},60000);

// Native modal keeps keyboard focus inside the viewer and returns it to the portrait.
const artViewer=document.createElement('dialog');
artViewer.className='art-viewer';
artViewer.setAttribute('aria-labelledby','art-viewer-title');
artViewer.innerHTML='<div class="art-viewer-bar"><h2 id="art-viewer-title"></h2><button type="button" autofocus aria-label="Close artwork">Close ×</button></div><div class="art-viewer-stage"><img alt=""></div>';
document.body.append(artViewer);
let artTrigger=null,artScroll=0;
main.addEventListener('click',event=>{
 const link=event.target.closest('.commander-art');
 if(!link)return;
 event.preventDefault();
 artTrigger=link;artScroll=window.scrollY;
 const img=artViewer.querySelector('img');
 img.src=link.href;img.alt=link.querySelector('img').alt;
 artViewer.querySelector('h2').textContent=link.closest('.faction').querySelector('.commander-name').textContent;
 document.body.style.top=`-${artScroll}px`;
 document.body.classList.add('art-viewer-open');
 artViewer.showModal();
});
artViewer.querySelector('button').onclick=()=>artViewer.close();
artViewer.addEventListener('click',event=>{if(event.target===artViewer||event.target.classList.contains('art-viewer-stage'))artViewer.close();});
artViewer.addEventListener('close',()=>{
 document.body.classList.remove('art-viewer-open');document.body.style.top='';
 window.scrollTo(0,artScroll);
 if(artTrigger?.isConnected)artTrigger.focus({preventScroll:true});
 artViewer.querySelector('img').removeAttribute('src');
});
</script></body></html>
